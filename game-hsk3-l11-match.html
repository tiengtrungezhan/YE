<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 3 Bài 11</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk3.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 11</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "图书馆", "pinyin": "túshūguǎn", "meaning": "thư viện", "lesson": "11", "type": "Danh từ", "ex_cn": "我在图书馆看书。", "ex_py": "Wǒ zài túshūguǎn kàn shū.", "ex_vn": "Tôi đang đọc sách ở thư viện."}, {"hanzi": "借", "pinyin": "jiè", "meaning": "mượn", "lesson": "11", "type": "Động từ", "ex_cn": "我想借一本书。", "ex_py": "Wǒ xiǎng jiè yì běn shū.", "ex_vn": "Tôi muốn mượn một cuốn sách."}, {"hanzi": "词典", "pinyin": "cídiǎn", "meaning": "từ điển", "lesson": "11", "type": "Danh từ", "ex_cn": "这是我的词典。", "ex_py": "Zhè shì wǒ de cídiǎn.", "ex_vn": "Đây là từ điển của tôi."}, {"hanzi": "还", "pinyin": "huán", "meaning": "trả lại", "lesson": "11", "type": "Động từ", "ex_cn": "别忘了还书。", "ex_py": "Bié wàngle huán shū.", "ex_vn": "Đừng quên trả sách nhé."}, {"hanzi": "灯", "pinyin": "dēng", "meaning": "đèn", "lesson": "11", "type": "Danh từ", "ex_cn": "请关灯。", "ex_py": "Qǐng guān dēng.", "ex_vn": "Vui lòng tắt đèn."}, {"hanzi": "会议", "pinyin": "huìyì", "meaning": "cuộc họp, hội nghị", "lesson": "11", "type": "Danh từ", "ex_cn": "我们正在开会议。", "ex_py": "Wǒmen zhèngzài kāi huìyì.", "ex_vn": "Chúng tôi đang họp."}, {"hanzi": "结束", "pinyin": "jiéshù", "meaning": "kết thúc", "lesson": "11", "type": "Động từ", "ex_cn": "会议结束了。", "ex_py": "Huìyì jiéshù le.", "ex_vn": "Cuộc họp kết thúc rồi."}, {"hanzi": "忘记", "pinyin": "wàngjì", "meaning": "quên", "lesson": "11", "type": "Động từ", "ex_cn": "我忘记带钥匙了。", "ex_py": "Wǒ wàngjì dài yàoshi le.", "ex_vn": "Tôi quên mang chìa khóa rồi."}, {"hanzi": "空调", "pinyin": "kōngtiáo", "meaning": "máy điều hòa", "lesson": "11", "type": "Danh từ", "ex_cn": "请把空调打开。", "ex_py": "Qǐng bǎ kōngtiáo dǎkāi.", "ex_vn": "Vui lòng bật điều hòa lên."}, {"hanzi": "关", "pinyin": "guān", "meaning": "đóng, tắt", "lesson": "11", "type": "Động từ", "ex_cn": "请关门。", "ex_py": "Qǐng guān mén.", "ex_vn": "Vui lòng đóng cửa."}, {"hanzi": "地铁", "pinyin": "dìtiě", "meaning": "tàu điện ngầm", "lesson": "11", "type": "Danh từ", "ex_cn": "我坐地铁去公司。", "ex_py": "Wǒ zuò dìtiě qù gōngsī.", "ex_vn": "Tôi đi tàu điện ngầm đến công ty."}, {"hanzi": "双", "pinyin": "shuāng", "meaning": "đôi (lượng từ)", "lesson": "11", "type": "Lượng từ", "ex_cn": "我买了一双鞋。", "ex_py": "Wǒ mǎi le yì shuāng xié.", "ex_vn": "Tôi đã mua một đôi giày."}, {"hanzi": "筷子", "pinyin": "kuàizi", "meaning": "đũa", "lesson": "11", "type": "Danh từ", "ex_cn": "你会用筷子吗？", "ex_py": "Nǐ huì yòng kuàizi ma?", "ex_vn": "Bạn biết dùng đũa không?"}, {"hanzi": "啤酒", "pinyin": "píjiǔ", "meaning": "bia", "lesson": "11", "type": "Danh từ", "ex_cn": "他喜欢喝啤酒。", "ex_py": "Tā xǐhuan hē píjiǔ.", "ex_vn": "Anh ấy thích uống bia."}, {"hanzi": "口", "pinyin": "kǒu", "meaning": "miệng, ngụm (lượng từ)", "lesson": "11", "type": "Lượng từ/Danh từ", "ex_cn": "喝一口水。", "ex_py": "Hē yì kǒu shuǐ.", "ex_vn": "Uống một ngụm nước."}, {"hanzi": "瓶子", "pinyin": "píngzi", "meaning": "chai, lọ", "lesson": "11", "type": "Danh từ", "ex_cn": "桌子上有一个瓶子。", "ex_py": "Zhuōzi shang yǒu yí ge píngzi.", "ex_vn": "Trên bàn có một cái chai."}, {"hanzi": "笔记本", "pinyin": "bǐjìběn", "meaning": "vở, máy tính xách tay", "lesson": "11", "type": "Danh từ", "ex_cn": "这是我的笔记本。", "ex_py": "Zhè shì wǒ de bǐjìběn.", "ex_vn": "Đây là vở ghi chép của tôi."}, {"hanzi": "电子邮件", "pinyin": "diànzǐ yóujiàn", "meaning": "thư điện tử (email)", "lesson": "11", "type": "Danh từ", "ex_cn": "我给你发电子邮件。", "ex_py": "Wǒ gěi nǐ fā diànzǐ yóujiàn.", "ex_vn": "Tôi gửi email cho bạn."}, {"hanzi": "习惯", "pinyin": "xíguàn", "meaning": "thói quen, quen với", "lesson": "11", "type": "Danh từ/Động từ", "ex_cn": "我习惯了这里的生活。", "ex_py": "Wǒ xíguàn le zhèlǐ de shēnghuó.", "ex_vn": "Tôi đã quen với cuộc sống ở đây."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
