<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 1 3.0 Bài 6</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk1.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 6</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "想", "pinyin": "xiǎng", "meaning": "muốn", "lesson": "6", "type": "Động từ", "ex_cn": "我想去学校。", "ex_py": "Wǒ xiǎng qù xuéxiào.", "ex_vn": "Tôi muốn đến trường."}, {"hanzi": "做", "pinyin": "zuò", "meaning": "làm", "lesson": "6", "type": "Động từ", "ex_cn": "你做工作吗？", "ex_py": "Nǐ zuò gōngzuò ma?", "ex_vn": "Bạn có làm việc không?"}, {"hanzi": "包子", "pinyin": "bāozi", "meaning": "bánh bao", "lesson": "6", "type": "Bổ sung 3.0", "ex_cn": "我喜欢吃包子。", "ex_py": "Wǒ xǐhuan chī bāozi.", "ex_vn": "Tôi thích ăn bánh bao."}, {"hanzi": "超市", "pinyin": "chāoshì", "meaning": "siêu thị", "lesson": "6", "type": "Danh từ", "ex_cn": "我去超市买东西。", "ex_py": "Wǒ qù chāoshì mǎi dōngxi.", "ex_vn": "Tôi đi siêu thị mua đồ."}, {"hanzi": "吃", "pinyin": "chī", "meaning": "ăn", "lesson": "6", "type": "Động từ", "ex_cn": "我今天中午不吃米饭。", "ex_py": "Wǒ jīntiān zhōngwǔ bù chī mǐfàn.", "ex_vn": "Hôm nay buổi trưa tôi không ăn cơm."}, {"hanzi": "东西", "pinyin": "dōngxi", "meaning": "đồ, đồ đạc", "lesson": "6", "type": "Danh từ", "ex_cn": "我去买东西。", "ex_py": "Wǒ qù mǎi dōngxi.", "ex_vn": "Tôi đi mua đồ."}, {"hanzi": "非常", "pinyin": "fēicháng", "meaning": "rất, vô cùng", "lesson": "6", "type": "Phó từ", "ex_cn": "非常好。", "ex_py": "Fēicháng hǎo.", "ex_vn": "Rất tốt."}, {"hanzi": "明天", "pinyin": "míngtiān", "meaning": "ngày mai", "lesson": "6", "type": "Danh từ", "ex_cn": "明天去学校。", "ex_py": "Míngtiān qù xuéxiào.", "ex_vn": "Ngày mai đi đến trường."}, {"hanzi": "些", "pinyin": "xiē", "meaning": "một ít, một vài", "lesson": "6", "type": "Số từ", "ex_cn": "这些是我的。", "ex_py": "Zhèxiē shì wǒ de.", "ex_vn": "Những cái này là của tôi."}, {"hanzi": "怎么", "pinyin": "zěnme", "meaning": "thế nào, làm sao", "lesson": "6", "type": "Đại từ", "ex_cn": "怎么称呼您？", "ex_py": "Zěnme chēnghu nín?", "ex_vn": "Xưng hô với ngài thế nào?"}, {"hanzi": "出租车", "pinyin": "chūzūchē", "meaning": "taxi", "lesson": "6", "type": "Danh từ", "ex_cn": "我们坐出租车。", "ex_py": "Wǒmen zuò chūzūchē.", "ex_vn": "Chúng tôi đi taxi."}, {"hanzi": "手机", "pinyin": "shǒujī", "meaning": "điện thoại di động", "lesson": "6", "type": "Danh từ", "ex_cn": "我的手机。", "ex_py": "Wǒ de shǒujī.", "ex_vn": "Điện thoại của tôi."}, {"hanzi": "电话", "pinyin": "diànhuà", "meaning": "điện thoại", "lesson": "6", "type": "Danh từ", "ex_cn": "这是你的电话吗？", "ex_py": "Zhè shì nǐ de diànhuà ma?", "ex_vn": "Đây là điện thoại của bạn phải không?"}, {"hanzi": "号码", "pinyin": "hàomǎ", "meaning": "số điện thoại, số", "lesson": "6", "type": "Danh từ", "ex_cn": "请告诉我你的电话号码。", "ex_py": "Qǐng gàosu wǒ nǐ de diànhuà hàomǎ.", "ex_vn": "Xin hãy cho tôi biết số điện thoại của bạn."}, {"hanzi": "去", "pinyin": "qù", "meaning": "đi", "lesson": "6", "type": "Động từ", "ex_cn": "你去哪儿？", "ex_py": "Nǐ qù nǎr?", "ex_vn": "Bạn đi đâu thế?"}, {"hanzi": "哪儿", "pinyin": "nǎr", "meaning": "ở đâu, chỗ nào", "lesson": "6", "type": "Đại từ", "ex_cn": "超市在哪儿？", "ex_py": "Chāoshì zài nǎr?", "ex_vn": "Siêu thị ở đâu?"}, {"hanzi": "买", "pinyin": "mǎi", "meaning": "mua", "lesson": "6", "type": "Động từ", "ex_cn": "你想买什么？", "ex_py": "Nǐ xiǎng mǎi shénme?", "ex_vn": "Bạn muốn mua gì?"}, {"hanzi": "牛奶", "pinyin": "niúnǎi", "meaning": "sữa bò", "lesson": "6", "type": "Danh từ", "ex_cn": "他喝牛奶。", "ex_py": "Tā hē niúnǎi.", "ex_vn": "Anh ấy uống sữa."}, {"hanzi": "晚饭", "pinyin": "wǎnfàn", "meaning": "bữa tối, cơm tối", "lesson": "6", "type": "Danh từ", "ex_cn": "我们去吃晚饭吧。", "ex_py": "Wǒmen qù chī wǎnfàn ba.", "ex_vn": "Chúng ta đi ăn tối đi."}, {"hanzi": "那边", "pinyin": "nàbiān", "meaning": "phía bên kia, đằng kia", "lesson": "6", "type": "Danh từ", "ex_cn": "超市在那边。", "ex_py": "Chāoshì zài nàbiān.", "ex_vn": "Siêu thị ở đằng kia."}, {"hanzi": "好吃", "pinyin": "hǎochī", "meaning": "ngon", "lesson": "6", "type": "Danh từ", "ex_cn": "很好吃。", "ex_py": "Hěn hǎochī.", "ex_vn": "Rất ngon."}, {"hanzi": "米饭", "pinyin": "mǐfàn", "meaning": "cơm", "lesson": "6", "type": "Danh từ", "ex_cn": "我想吃米饭。", "ex_py": "Wǒ xiǎng chī mǐfàn.", "ex_vn": "Tôi muốn ăn cơm."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
