<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 1 3.0 Bài 6</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk1.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 6</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "电话", "pinyin": "diànhuà", "meaning": "điện thoại", "lesson": "6", "type": "danh từ", "ex_cn": "爸爸，你有个电话。", "ex_py": "Bàba, nǐ yǒu gè diànhuà.", "ex_vn": "Bố ơi, bố có điện thoại này."}, {"hanzi": "在", "pinyin": "zài", "meaning": "ở, tại", "lesson": "6", "type": "phó từ", "ex_cn": "我在越南。", "ex_py": "Wǒ zài Yuènán.", "ex_vn": "Tôi đang ở Việt Nam."}, {"hanzi": "去", "pinyin": "qù", "meaning": "đi", "lesson": "6", "type": "động từ", "ex_cn": "你去哪儿？", "ex_py": "Nǐ qù nǎr?", "ex_vn": "Bạn đi đâu đấy?"}, {"hanzi": "里", "pinyin": "lǐ", "meaning": "trong", "lesson": "6", "type": "Danh từ", "ex_cn": "家里有人吗？", "ex_py": "Jiālǐ yǒu rén ma?", "ex_vn": "Trong nhà có ai không?"}, {"hanzi": "哪儿 / 哪里", "pinyin": "nǎr / nǎlǐ", "meaning": "chỗ nào", "lesson": "6", "type": "danh từ", "ex_cn": "你在哪儿？", "ex_py": "Nǐ zài nǎr?", "ex_vn": "Bạn đang ở đâu?"}, {"hanzi": "这儿 / 这里", "pinyin": "zhèr / zhèlǐ", "meaning": "chỗ này", "lesson": "6", "type": "danh từ", "ex_cn": "这里的菜不好吃。", "ex_py": "Zhèlǐ de cài bù hǎochī.", "ex_vn": "Đồ ăn ở đây không ngon."}, {"hanzi": "那儿 / 那里", "pinyin": "nàr / nàlǐ", "meaning": "chỗ kia", "lesson": "6", "type": "danh từ", "ex_cn": "我们去那里买东西吧。", "ex_py": "Wǒmen qù nàlǐ mǎi dōngxi ba.", "ex_vn": "Chúng ta đến đó mua đồ đi."}, {"hanzi": "超市", "pinyin": "chāoshì", "meaning": "siêu thị", "lesson": "6", "type": "danh từ", "ex_cn": "我想去超市。", "ex_py": "Wǒ xiǎng qù chāoshì.", "ex_vn": "Tôi muốn đi siêu thị."}, {"hanzi": "买", "pinyin": "mǎi", "meaning": "mua", "lesson": "6", "type": "động từ", "ex_cn": "我想买水果。", "ex_py": "Wǒ xiǎng mǎi shuǐguǒ.", "ex_vn": "Tôi muốn mua hoa quả."}, {"hanzi": "卖", "pinyin": "mài", "meaning": "bán", "lesson": "6", "type": "động từ", "ex_cn": "这里卖水果吗？", "ex_py": "Zhèlǐ mài shuǐguǒ ma?", "ex_vn": "Ở đây có bán hoa quả không?"}, {"hanzi": "东西", "pinyin": "dōngxi", "meaning": "đồ, đồ đạc", "lesson": "6", "type": "danh từ", "ex_cn": "这是什么东西？", "ex_py": "Zhè shì shénme dōngxi?", "ex_vn": "Đây là cái gì thế?"}, {"hanzi": "牛奶", "pinyin": "niúnǎi", "meaning": "sữa bò", "lesson": "6", "type": "danh từ", "ex_cn": "我想喝牛奶。", "ex_py": "Wǒ xiǎng hē niúnǎi.", "ex_vn": "Tôi muốn uống sữa tươi."}, {"hanzi": "吃", "pinyin": "chī", "meaning": "ăn", "lesson": "6", "type": "động từ", "ex_cn": "你想吃什么？", "ex_py": "Nǐ xiǎng chī shénme?", "ex_vn": "Bạn muốn ăn gì?"}, {"hanzi": "好吃", "pinyin": "hǎochī", "meaning": "ngon", "lesson": "6", "type": "tính từ", "ex_cn": "这个菜很好吃。", "ex_py": "Zhège cài hěn hǎochī.", "ex_vn": "Món này rất ngon."}, {"hanzi": "早", "pinyin": "zǎo", "meaning": "sớm", "lesson": "6", "type": "tính từ", "ex_cn": "", "ex_py": "", "ex_vn": ""}, {"hanzi": "晚", "pinyin": "wǎn", "meaning": "muộn, trễ", "lesson": "6", "type": "tính từ", "ex_cn": "", "ex_py": "", "ex_vn": ""}, {"hanzi": "早上", "pinyin": "zǎoshang", "meaning": "buổi sáng", "lesson": "6", "type": "danh từ", "ex_cn": "今天早上你吃什么？", "ex_py": "Jīntiān zǎoshang nǐ chī shénme?", "ex_vn": "Sáng nay bạn ăn gì?"}, {"hanzi": "晚上", "pinyin": "wǎnshang", "meaning": "buổi tối", "lesson": "6", "type": "danh từ", "ex_cn": "昨天晚上你去玩吗？", "ex_py": "Zuótiān wǎnshang nǐ qù wán ma?", "ex_vn": "Tối qua bạn có đi chơi không?"}, {"hanzi": "中午", "pinyin": "zhōngwǔ", "meaning": "buổi trưa", "lesson": "6", "type": "danh từ", "ex_cn": "今天中午我吃面条。", "ex_py": "Jīntiān zhōngwǔ wǒ chī miàntiáo.", "ex_vn": "Trưa nay tôi ăn mì."}, {"hanzi": "早饭", "pinyin": "zǎofàn", "meaning": "bữa sáng", "lesson": "6", "type": "danh từ", "ex_cn": "我还没吃早饭。", "ex_py": "Wǒ hái méi chī zǎofàn.", "ex_vn": "Tôi vẫn chưa ăn sáng."}, {"hanzi": "午饭", "pinyin": "wǔfàn", "meaning": "bữa trưa", "lesson": "6", "type": "danh từ", "ex_cn": "你吃午饭了吗？", "ex_py": "Nǐ chī wǔfàn le ma?", "ex_vn": "Bạn ăn trưa chưa?"}, {"hanzi": "晚饭", "pinyin": "wǎnfàn", "meaning": "bữa tối", "lesson": "6", "type": "danh từ", "ex_cn": "我还没吃晚饭。", "ex_py": "Wǒ hái méi chī wǎnfàn.", "ex_vn": "Tôi vẫn chưa ăn tối."}, {"hanzi": "那边", "pinyin": "nàbiān", "meaning": "phía bên kia", "lesson": "6", "type": "danh từ", "ex_cn": "我们去那边看看吧。", "ex_py": "Wǒmen qù nàbiān kànkan ba.", "ex_vn": "Chúng ta qua bên kia xem thử đi."}, {"hanzi": "包子", "pinyin": "bāozi", "meaning": "bánh bao", "lesson": "6", "type": "danh từ", "ex_cn": "我想吃包子。", "ex_py": "Wǒ xiǎng chī bāozi.", "ex_vn": "Tôi muốn ăn bánh bao."}, {"hanzi": "非常", "pinyin": "fēicháng", "meaning": "rất, vô cùng", "lesson": "6", "type": "phó từ", "ex_cn": "这里的菜非常好吃。", "ex_py": "Zhèlǐ de cài fēicháng hǎochī.", "ex_vn": "Đồ ăn ở đây cực kỳ ngon."}, {"hanzi": "米饭", "pinyin": "mǐfàn", "meaning": "cơm trắng", "lesson": "6", "type": "danh từ", "ex_cn": "今天中午我吃米饭。", "ex_py": "Jīntiān zhōngwǔ wǒ chī mǐfàn.", "ex_vn": "Trưa nay tôi ăn cơm."}, {"hanzi": "坐", "pinyin": "zuò", "meaning": "ngồi, đi (xe)", "lesson": "6", "type": "động từ", "ex_cn": "你坐在这里吧。", "ex_py": "Nǐ zuò zài zhèlǐ ba.", "ex_vn": "Bạn ngồi ở đây đi."}, {"hanzi": "车", "pinyin": "chē", "meaning": "xe, xe cộ", "lesson": "6", "type": "danh từ", "ex_cn": "我们坐车去吧。", "ex_py": "Wǒmen zuò chē qù ba.", "ex_vn": "Chúng ta đi xe máy/ô tô đi."}, {"hanzi": "出租车", "pinyin": "chūzūchē", "meaning": "xe taxi", "lesson": "6", "type": "danh từ", "ex_cn": "我们做出租车去超市吧。", "ex_py": "Wǒmen zuò chūzūchē qù chāoshì ba.", "ex_vn": "Chúng ta đi taxi đến siêu thị đi."}, {"hanzi": "怎么", "pinyin": "zěnme", "meaning": "thế nào, sao", "lesson": "6", "type": "phó từ", "ex_cn": "这个汉字怎么写的？", "ex_py": "Zhège Hànzì zěnme xiě de?", "ex_vn": "Chữ Hán này viết như thế nào?"}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
