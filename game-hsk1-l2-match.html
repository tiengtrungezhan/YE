<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 1 3.0 Bài 2</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk1.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 2</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "请", "pinyin": "qǐng", "meaning": "xin, mời...", "lesson": "2", "type": "động từ", "ex_cn": "我请你去吃饭。", "ex_py": "wǒ qǐng nǐ qù chīfàn.", "ex_vn": "Tôi mời bạn đi ăn cơm"}, {"hanzi": "问", "pinyin": "wèn", "meaning": "hỏi", "lesson": "2", "type": "động từ", "ex_cn": "我问你。", "ex_py": "wǒ wèn nǐ.", "ex_vn": "Tôi hỏi bạn"}, {"hanzi": "请问", "pinyin": "qǐngwèn", "meaning": "xin hỏi", "lesson": "2", "type": "Cụm từ", "ex_cn": "请问，你是中国人吗？", "ex_py": "qǐngwèn, nǐ shì Zhōngguó rén ma?", "ex_vn": "Xin hỏi, bạn là người Trung Quốc à?"}, {"hanzi": "叫", "pinyin": "jiào", "meaning": "gọi, gọi là, tên là", "lesson": "2", "type": "động từ", "ex_cn": "这个叫什么？", "ex_py": "zhège jiào shénme?", "ex_vn": "Cái này gọi là gì?"}, {"hanzi": "什么", "pinyin": "shénme", "meaning": "gì, cái gì", "lesson": "2", "type": "đại từ nghi vấn", "ex_cn": "你叫什么名字？", "ex_py": "nǐ jiào shénme míngzi?", "ex_vn": "Bạn tên là gì?"}, {"hanzi": "名字", "pinyin": "míngzì", "meaning": "tên", "lesson": "2", "type": "danh từ", "ex_cn": "你的名字是什么？", "ex_py": "nǐ de míngzi shì shénme?", "ex_vn": "Tên của bạn là gì?"}, {"hanzi": "是", "pinyin": "shì", "meaning": "là", "lesson": "2", "type": "động từ", "ex_cn": "这是我朋友。", "ex_py": "zhè shì wǒ péngyou.", "ex_vn": "Đây là bạn của tôi"}, {"hanzi": "是不是", "pinyin": "shì bùshì", "meaning": "có phải là ... không?", "lesson": "2", "type": "Cụm từ", "ex_cn": "她是不是你同学？", "ex_py": "tā shì bú shì nǐ tóngxué?", "ex_vn": "Cô ấy có phải là bạn học của bạn không?"}, {"hanzi": "对", "pinyin": "duì", "meaning": "đúng, chính xác", "lesson": "2", "type": "tính từ", "ex_cn": "对，我是中国人。", "ex_py": "duì, wǒ shì Zhōngguó rén.", "ex_vn": "Đúng, tôi là người Trung Quốc"}, {"hanzi": "对不起", "pinyin": "duìbùqǐ", "meaning": "xin lỗi", "lesson": "2", "type": "Cụm từ", "ex_cn": "对不起你。", "ex_py": "duìbuqǐ nǐ.", "ex_vn": "Xin lỗi bạn"}, {"hanzi": "没关系", "pinyin": "méiguānxì", "meaning": "không vấn đề gì, không sao", "lesson": "2", "type": "Cụm từ", "ex_cn": "", "ex_py": "", "ex_vn": ""}, {"hanzi": "事", "pinyin": "shì", "meaning": "chuyện, việc", "lesson": "2", "type": "danh từ", "ex_cn": "什么事？", "ex_py": "shénme shì?", "ex_vn": "Chuyện gì?"}, {"hanzi": "没事", "pinyin": "méishì", "meaning": "không vấn đề gì, không sao", "lesson": "2", "type": "Cụm từ", "ex_cn": "", "ex_py": "", "ex_vn": ""}, {"hanzi": "很", "pinyin": "hěn", "meaning": "rất", "lesson": "2", "type": "phó từ", "ex_cn": "我很好。", "ex_py": "wǒ hěn hǎo.", "ex_vn": "Tôi rất khỏe"}, {"hanzi": "高", "pinyin": "gāo", "meaning": "cao", "lesson": "2", "type": "tính từ", "ex_cn": "他很高。", "ex_py": "tā hěn gāo.", "ex_vn": "Anh ấy rất cao"}, {"hanzi": "高兴", "pinyin": "gāoxìng", "meaning": "vui vẻ", "lesson": "2", "type": "tính từ", "ex_cn": "我很高兴。", "ex_py": "wǒ hěn gāoxìng.", "ex_vn": "Tôi rất vui"}, {"hanzi": "认识", "pinyin": "rènshí", "meaning": "quen biết, làm quen", "lesson": "2", "type": "động từ", "ex_cn": "你认识他吗？", "ex_py": "nǐ rènshi tā ma?", "ex_vn": "Bạn có biết anh ấy không?"}, {"hanzi": "也", "pinyin": "yě", "meaning": "cũng", "lesson": "2", "type": "phó từ", "ex_cn": "我也很高兴。", "ex_py": "wǒ yě hěn gāoxìng.", "ex_vn": "Tôi cũng rất vui"}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
