<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 2 3.0 Bài 1</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk2.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 1</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "就", "pinyin": "jiù", "meaning": "thì, liền, chính", "lesson": "1", "type": "Phó từ", "ex_cn": "好的，那我给你打电话。", "ex_py": "Hǎo de, nà wǒ gěi nǐ dǎ diànhuà.", "ex_vn": "Được, vậy tôi sẽ gọi điện cho bạn."}, {"hanzi": "给", "pinyin": "gěi", "meaning": "cho, đưa cho", "lesson": "1", "type": "Giới từ", "ex_cn": "她还给我们介绍了很多东西。", "ex_py": "Tā hái gěi wǒmen jièshào le hěn duō dōngxi.", "ex_vn": "Cô ấy còn giới thiệu cho chúng tôi rất nhiều thứ."}, {"hanzi": "让", "pinyin": "ràng", "meaning": "bảo, để, nhường, cho phép", "lesson": "1", "type": "Động từ", "ex_cn": "她让我来接你们。", "ex_py": "Tā ràng wǒ lái jiē nǐmen.", "ex_vn": "Cô ấy bảo tôi đến đón các bạn."}, {"hanzi": "接", "pinyin": "jiē", "meaning": "đón, nhận, nghe (điện thoại)", "lesson": "1", "type": "Động từ", "ex_cn": "不好意思，我接个电话。", "ex_py": "Bù hǎoyìsi, wǒ jiē gè diànhuà.", "ex_vn": "Ngại quá, tôi nghe một cuộc điện thoại."}, {"hanzi": "次", "pinyin": "cì", "meaning": "lần", "lesson": "1", "type": "Lượng từ", "ex_cn": "你们是第一次来北京吗？", "ex_py": "Nǐmen shì dì yī cì lái Běijīng ma?", "ex_vn": "Các bạn là lần đầu tiên đến Bắc Kinh à?"}, {"hanzi": "旅游", "pinyin": "lǚyóu", "meaning": "du lịch", "lesson": "1", "type": "Động từ", "ex_cn": "我们是来旅游的。", "ex_py": "Wǒmen shì lái lǚyóu de.", "ex_vn": "Chúng tôi đến để đi du lịch."}, {"hanzi": "帮忙", "pinyin": "bāngmáng", "meaning": "giúp đỡ, giúp một tay", "lesson": "1", "type": "Động từ", "ex_cn": "我想请你帮个忙。", "ex_py": "Wǒ xiǎng qǐng nǐ bāng gè máng.", "ex_vn": "Tôi muốn nhờ bạn giúp một việc."}, {"hanzi": "不好意思", "pinyin": "bù hǎoyìsi", "meaning": "ngại quá, xin lỗi", "lesson": "1", "type": "Cụm từ", "ex_cn": "不好意思，我接个电话。", "ex_py": "Bù hǎoyìsi, wǒ jiē gè diànhuà.", "ex_vn": "Ngại quá, tôi nghe một cuộc điện thoại."}, {"hanzi": "已经", "pinyin": "yǐjīng", "meaning": "đã... rồi", "lesson": "1", "type": "Phó từ", "ex_cn": "我已经到北京了。", "ex_py": "Wǒ yǐjīng dào Běijīng le.", "ex_vn": "Tôi đã đến Bắc Kinh rồi."}, {"hanzi": "那", "pinyin": "nà", "meaning": "thế thì, vậy thì", "lesson": "1", "type": "Liên từ", "ex_cn": "好的，那我给你打电话。", "ex_py": "Hǎo de, nà wǒ gěi nǐ dǎ diànhuà.", "ex_vn": "Được, vậy tôi sẽ gọi điện cho bạn."}, {"hanzi": "介绍", "pinyin": "jièshào", "meaning": "giới thiệu", "lesson": "1", "type": "Động từ", "ex_cn": "她还给我们介绍了很多东西。", "ex_py": "Tā hái gěi wǒmen jièshào le hěn duō dōngxi.", "ex_vn": "Cô ấy còn giới thiệu cho chúng tôi rất nhiều thứ."}, {"hanzi": "有时", "pinyin": "yǒushí", "meaning": "thỉnh thoảng, có lúc", "lesson": "1", "type": "Phó từ", "ex_cn": "我有时不太懂她的意思。", "ex_py": "Wǒ yǒushí bú tài dǒng tā de yìsi.", "ex_vn": "Thỉnh thoảng tôi không hiểu lắm ý của cô ấy."}, {"hanzi": "懂", "pinyin": "dǒng", "meaning": "hiểu", "lesson": "1", "type": "Động từ", "ex_cn": "我有时不太懂她的意思。", "ex_py": "Wǒ yǒushí bú tài dǒng tā de yìsi.", "ex_vn": "Thỉnh thoảng tôi không hiểu lắm ý của cô ấy."}, {"hanzi": "意思", "pinyin": "yìsi", "meaning": "ý nghĩa, ý", "lesson": "1", "type": "Danh từ", "ex_cn": "我有时不太懂她的意思。", "ex_py": "Wǒ yǒushí bú tài dǒng tā de yìsi.", "ex_vn": "Thỉnh thoảng tôi không hiểu lắm ý của cô ấy."}, {"hanzi": "北京烤鸭", "pinyin": "Běijīng kǎoyā", "meaning": "vịt quay Bắc Kinh", "lesson": "1", "type": "Danh từ", "ex_cn": "她请我们吃了北京烤鸭。", "ex_py": "Tā qǐng wǒmen chī le Běijīng kǎoyā.", "ex_vn": "Cô ấy mời chúng tôi ăn vịt quay Bắc Kinh."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
