<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game HSK 2 3.0 - EZHAN</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .lesson-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.2rem;
            margin-top: 2rem;
        }
        .lesson-card {
            background: #fff;
            border: 1px solid var(--primary-light);
            border-radius: 20px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 120px;
        }
        .lesson-card:hover {
            border-color: var(--primary-color);
            transform: translateY(-5px);
            box-shadow: var(--shadow);
            background: #f0f7f9;
        }
        .lesson-number { font-size: 0.8rem; opacity: 0.6; text-transform: uppercase; letter-spacing: 1px; }
        .lesson-title { font-weight: 800; font-size: 1.15rem; line-height: 1.4; color: var(--primary-dark); margin-top: 0.5rem; }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(45, 62, 66, 0.5);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--white);
            padding: 2.5rem;
            border-radius: 30px;
            width: 90%;
            max-width: 520px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            animation: popUp 0.3s ease-out;
            position: relative;
        }
        @keyframes popUp {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-close {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            font-size: 1.5rem;
            cursor: pointer;
            opacity: 0.5;
        }
        .modal-title { font-size: 1.35rem; font-weight: 800; margin-bottom: 1.8rem; color: var(--text-color); line-height: 1.4; }
        .game-select-buttons { display: flex; flex-direction: column; gap: 0.9rem; }
        .game-select-btn {
            padding: 1.1rem 1.5rem;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.05rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 1rem;
        }
        .btn-flip { background: #e3f2fd; color: #1976d2; border: 1.5px solid #bbdefb; }
        .btn-hanzi { background: #e0f2f1; color: #00796b; border: 1.5px solid #b2dfdb; }
        .btn-arrange { background: #f3e5f5; color: #7b1fa2; border: 1.5px solid #e1bee7; }
        .btn-translate { background: #fff3e0; color: #e65100; border: 1.5px solid #ffe0b2; }
        .game-select-btn:hover { transform: translateY(-3px); filter: brightness(0.96); box-shadow: 0 6px 15px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game.html" class="back-btn">← Quay lại cấp độ HSK</a>
        
        <div class="content-box">
            <h1 style="margin-bottom: 1.5rem; color: var(--primary-dark); display: flex; align-items: center; gap: 0.5rem;">
                <div class="hsk-badge" style="width: 40px; height: 40px; font-size: 1rem;">2</div>
                HSK 2 3.0: Chọn Bài Học
            </h1>
            <p>Nhấn vào một bài học để chọn chế độ chơi (4 phần):</p>

            <div class="lesson-grid">
                <script>
                    const LESSON_TITLES = [
                        "她请我们吃了北京烤鸭<br><span style='font-size:0.85rem; font-weight:normal; opacity:0.8;'>Cô ấy mời chúng tôi ăn vịt quay Bắc Kinh</span>",
                        "还是打车去北京吧<br><span style='font-size:0.85rem; font-weight:normal; opacity:0.8;'>Hay là đi taxi đến Bắc Kinh đi</span>",
                        "我想去西安旅游<br><span style='font-size:0.85rem; font-weight:normal; opacity:0.8;'>Tôi muốn đi Tây An du lịch</span>",
                        "你穿红色的很好看<br><span style='font-size:0.85rem; font-weight:normal; opacity:0.8;'>Bạn mặc màu đỏ rất đẹp</span>",
                        "Bài 5",
                        "Bài 6", "Bài 7", "Bài 8", "Bài 9", "Bài 10",
                        "Bài 11", "Bài 12", "Bài 13", "Bài 14", "Bài 15"
                    ];

                    for (let i = 1; i <= 15; i++) {
                        document.write(`
                            <div class="lesson-card" onclick="openGameSelect(${i})">
                                <div class="lesson-number">Bài học ${i}</div>
                                <div class="lesson-title">${LESSON_TITLES[i-1]}</div>
                            </div>
                        `);
                    }
                </script>
            </div>
        </div>
    </div>

    <!-- Game Selection Modal -->
    <div id="gameModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <div class="modal-title" id="modalTitle">Bài học 1</div>
            <div class="game-select-buttons">
                <a href="#" id="flipLink" class="game-select-btn btn-flip">
                    <span style="font-size: 1.4rem;">🎴</span>
                    <span>Phần 1: Lật thẻ bài</span>
                </a>
                <a href="#" id="hanziLink" class="game-select-btn btn-hanzi">
                    <span style="font-size: 1.4rem;">✍️</span>
                    <span>Phần 2: Luyện chữ Hán</span>
                </a>
                <a href="#" id="arrangeLink" class="game-select-btn btn-arrange">
                    <span style="font-size: 1.4rem;">🧩</span>
                    <span>Phần 3: Câu sắp xếp</span>
                </a>
                <a href="#" id="translateLink" class="game-select-btn btn-translate">
                    <span style="font-size: 1.4rem;">🌐</span>
                    <span>Phần 4: Câu dịch Việt Trung</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById('gameModal');
        const modalTitle = document.getElementById('modalTitle');
        const flipLink = document.getElementById('flipLink');
        const hanziLink = document.getElementById('hanziLink');
        const arrangeLink = document.getElementById('arrangeLink');
        const translateLink = document.getElementById('translateLink');

        const PLAIN_TITLES = [
            "她请我们吃了北京烤鸭",
            "还是打车去北京吧",
            "我想去西安旅游",
            "你穿红色的很好看",
            "Bài 5",
            "Bài 6", "Bài 7", "Bài 8", "Bài 9", "Bài 10",
            "Bài 11", "Bài 12", "Bài 13", "Bài 14", "Bài 15"
        ];

        function openGameSelect(lessonId) {
            modalTitle.innerHTML = `Bài ${lessonId}: ${PLAIN_TITLES[lessonId-1]}`;
            
            flipLink.href = `game-hsk2-l${lessonId}-flip.html`;
            hanziLink.href = `game-hsk2-l${lessonId}-hanzi.html`;
            arrangeLink.href = `game-hsk2-l${lessonId}-arrange.html`;
            translateLink.href = `game-hsk2-l${lessonId}-translate.html`;
            
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
    <script src="main.js"></script>
</body>
</html>
