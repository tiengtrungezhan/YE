<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 3 Bài 10</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk3.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 10</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "个子", "pinyin": "gèzi", "meaning": "vóc dáng, chiều cao", "lesson": "10", "type": "Danh từ", "ex_cn": "他的个子很高。", "ex_py": "Tā de gèzi hěn gāo.", "ex_vn": "Vóc dáng của anh ấy rất cao."}, {"hanzi": "矮", "pinyin": "ǎi", "meaning": "thấp, lùn", "lesson": "10", "type": "Tính từ", "ex_cn": "他比我矮。", "ex_py": "Tā bǐ wǒ ǎi.", "ex_vn": "Anh ấy thấp hơn tôi."}, {"hanzi": "历史", "pinyin": "lìshǐ", "meaning": "lịch sử", "lesson": "10", "type": "Danh từ", "ex_cn": "我喜欢历史。", "ex_py": "Wǒ xǐhuan lìshǐ.", "ex_vn": "Tôi thích lịch sử."}, {"hanzi": "体育", "pinyin": "tǐyù", "meaning": "thể dục", "lesson": "10", "type": "Danh từ", "ex_cn": "他体育很好。", "ex_py": "Tā tǐyù hěn hǎo.", "ex_vn": "Môn thể dục của anh ấy rất tốt."}, {"hanzi": "数学", "pinyin": "shùxué", "meaning": "toán học", "lesson": "10", "type": "Danh từ", "ex_cn": "数学课很有意思。", "ex_py": "Shùxué kè hěn yǒu yìsi.", "ex_vn": "Giờ toán rất thú vị."}, {"hanzi": "方便", "pinyin": "fāngbiàn", "meaning": "thuận tiện", "lesson": "10", "type": "Tính từ", "ex_cn": "坐地铁很方便。", "ex_py": "Zuò dìtiě hěn fāngbiàn.", "ex_vn": "Đi tàu điện ngầm rất thuận tiện."}, {"hanzi": "骑", "pinyin": "qí", "meaning": "cưỡi, đi (xe đạp, ngựa)", "lesson": "10", "type": "Động từ", "ex_cn": "他骑自行车去学校。", "ex_py": "Tā qí zìxíngchē qù xuéxiào.", "ex_vn": "Anh ấy đi xe đạp đến trường."}, {"hanzi": "旧", "pinyin": "jiù", "meaning": "cũ", "lesson": "10", "type": "Tính từ", "ex_cn": "这是旧衣服。", "ex_py": "Zhè shì jiù yīfu.", "ex_vn": "Đây là quần áo cũ."}, {"hanzi": "换", "pinyin": "huàn", "meaning": "đổi, thay", "lesson": "10", "type": "Động từ", "ex_cn": "我想换钱。", "ex_py": "Wǒ xiǎng huàn qián.", "ex_vn": "Tôi muốn đổi tiền."}, {"hanzi": "地方", "pinyin": "dìfang", "meaning": "địa phương, nơi chốn", "lesson": "10", "type": "Danh từ", "ex_cn": "这是什么地方？", "ex_py": "Zhè shì shénme dìfang?", "ex_vn": "Đây là nơi nào vậy?"}, {"hanzi": "中介", "pinyin": "zhōngjiè", "meaning": "môi giới", "lesson": "10", "type": "Danh từ", "ex_cn": "我去中介公司看房子。", "ex_py": "Wǒ qù zhōngjiè gōngsī kàn fángzi.", "ex_vn": "Tôi đến công ty môi giới để xem nhà."}, {"hanzi": "主要", "pinyin": "zhǔyào", "meaning": "chủ yếu", "lesson": "10", "type": "Tính từ/Phó từ", "ex_cn": "他是主要老师。", "ex_py": "Tā shì zhǔyào lǎoshī.", "ex_vn": "Anh ấy là giáo viên chính."}, {"hanzi": "环境", "pinyin": "huánjìng", "meaning": "môi trường", "lesson": "10", "type": "Danh từ", "ex_cn": "这里的环境很好。", "ex_py": "Zhèlǐ de huánjìng hěn hǎo.", "ex_vn": "Môi trường ở đây rất tốt."}, {"hanzi": "附近", "pinyin": "fùjìn", "meaning": "gần đây, lân cận", "lesson": "10", "type": "Danh từ", "ex_cn": "学校附近有个商店。", "ex_py": "Xuéxiào fùjìn yǒu ge shāngdiàn.", "ex_vn": "Gần trường học có một cửa hàng."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
