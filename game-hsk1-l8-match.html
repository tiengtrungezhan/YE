<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 1 3.0 Bài 8</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk1.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 8</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "杯子", "pinyin": "bēizi", "meaning": "ly, tách", "lesson": "8", "type": "Danh từ", "ex_cn": "这是我的杯子。", "ex_py": "Zhè shì wǒ de bēizi.", "ex_vn": "Đây là cái cốc của tôi."}, {"hanzi": "茶", "pinyin": "chá", "meaning": "trà", "lesson": "8", "type": "Danh từ", "ex_cn": "你喝茶还是喝咖啡？", "ex_py": "Nǐ hē chá háishi hē kāfēi?", "ex_vn": "Bạn uống trà hay uống cà phê?"}, {"hanzi": "吃", "pinyin": "chī", "meaning": "ăn", "lesson": "8", "type": "Động từ", "ex_cn": "我今天中午不吃米饭。", "ex_py": "Wǒ jīntiān zhōngwǔ bù chī mǐfàn.", "ex_vn": "Hôm nay buổi trưa tôi không ăn cơm."}, {"hanzi": "多少", "pinyin": "duōshao", "meaning": "bao nhiêu", "lesson": "8", "type": "Danh từ", "ex_cn": "这件衣服多少钱？", "ex_py": "Zhè jiàn yīfu duōshao qián?", "ex_vn": "Chiếc áo này bao nhiêu tiền?"}, {"hanzi": "喝", "pinyin": "hē", "meaning": "uống", "lesson": "8", "type": "Động từ", "ex_cn": "你想喝什么？", "ex_py": "Nǐ xiǎng hē shénme?", "ex_vn": "Bạn muốn uống gì?"}, {"hanzi": "块", "pinyin": "kuài", "meaning": "đồng (đơn vị tiền tệ)", "lesson": "8", "type": "Lượng từ", "ex_cn": "这本书只要三块钱。", "ex_py": "Zhè běn shū zhǐ yào sān kuài qián.", "ex_vn": "Cuốn sách này chỉ ba đồng thôi."}, {"hanzi": "买", "pinyin": "mǎi", "meaning": "mua", "lesson": "8", "type": "Động từ", "ex_cn": "我想去超市买东西。", "ex_py": "Wǒ xiǎng qù chāoshì mǎi dōngxi.", "ex_vn": "Tôi muốn đi siêu thị mua đồ."}, {"hanzi": "米饭", "pinyin": "mǐfàn", "meaning": "cơm", "lesson": "8", "type": "Danh từ", "ex_cn": "我每天中午都吃米饭，不吃面包。", "ex_py": "Wǒ měitiān zhōngwǔ dōu chī mǐfàn, bù chī miànbāo.", "ex_vn": "Mỗi buổi trưa tôi đều ăn cơm, không ăn bánh mì."}, {"hanzi": "钱", "pinyin": "qián", "meaning": "tiền", "lesson": "8", "type": "Danh từ", "ex_cn": "我身上没有带钱。", "ex_py": "Wǒ shēnshang méiyǒu dài qián.", "ex_vn": "Tôi không mang tiền theo người."}, {"hanzi": "下午", "pinyin": "xiàwǔ", "meaning": "buổi chiều", "lesson": "8", "type": "Danh từ", "ex_cn": "今天下午我要去医院。", "ex_py": "Jīntiān xiàwǔ wǒ yào qù yīyuàn.", "ex_vn": "Chiều nay tôi phải đi bệnh viện."}, {"hanzi": "想", "pinyin": "xiǎng", "meaning": "muốn", "lesson": "8", "type": "Động từ", "ex_cn": "我想去学校。", "ex_py": "Wǒ xiǎng qù xuéxiào.", "ex_vn": "Tôi muốn đến trường."}, {"hanzi": "这", "pinyin": "zhè", "meaning": "đây, này", "lesson": "8", "type": "Đại từ", "ex_cn": "这是我的书。", "ex_py": "Zhè shì wǒ de shū.", "ex_vn": "Đây là cuốn sách của tôi."}, {"hanzi": "超市", "pinyin": "chāoshì", "meaning": "siêu thị", "lesson": "8", "type": "Bổ sung 3.0", "ex_cn": "我去超市买东西。", "ex_py": "Wǒ qù chāoshì mǎi dōngxi.", "ex_vn": "Tôi đi siêu thị mua đồ."}, {"hanzi": "包子", "pinyin": "bāozi", "meaning": "bánh bao", "lesson": "8", "type": "Bổ sung 3.0", "ex_cn": "我喜欢吃包子。", "ex_py": "Wǒ xǐhuan chī bāozi.", "ex_vn": "Tôi thích ăn bánh bao."}, {"hanzi": "饺子", "pinyin": "jiǎozi", "meaning": "sủi cảo", "lesson": "8", "type": "Bổ sung 3.0", "ex_cn": "中国饺子很好吃。", "ex_py": "Zhōngguó jiǎozi hěn hǎochī.", "ex_vn": "Sủi cảo Trung Quốc rất ngon."}, {"hanzi": "面包", "pinyin": "miànbāo", "meaning": "bánh mì", "lesson": "8", "type": "Bổ sung 3.0", "ex_cn": "我每天早上吃面包。", "ex_py": "Wǒ měitiān zǎoshang chī miànbāo.", "ex_vn": "Tôi ăn bánh mì mỗi buổi sáng."}, {"hanzi": "饭", "pinyin": "fàn", "meaning": "cơm, bữa ăn", "lesson": "8", "type": "Bổ sung 3.0", "ex_cn": "我们在家吃饭。", "ex_py": "Wǒmen zài jiā chī fàn.", "ex_vn": "Chúng tôi ăn cơm ở nhà."}, {"hanzi": "那个", "pinyin": "nàge", "meaning": "cái kia", "lesson": "8", "type": "Bổ sung 3.0", "ex_cn": "那个杯子是我的。", "ex_py": "Nà ge bēizi shì wǒ de.", "ex_vn": "Cái cốc kia là của tôi."}, {"hanzi": "那些", "pinyin": "nàxiē", "meaning": "những cái kia", "lesson": "8", "type": "Bổ sung 3.0", "ex_cn": "那些衣服在那儿。", "ex_py": "Nàxiē yīfu zài nàr.", "ex_vn": "Những bộ quần áo kia ở đằng kia."}, {"hanzi": "这个", "pinyin": "zhège", "meaning": "cái này", "lesson": "8", "type": "Bổ sung 3.0", "ex_cn": "这个东西多少钱？", "ex_py": "Zhège dōngxi duōshao qián?", "ex_vn": "Cái này bao nhiêu tiền?"}, {"hanzi": "元", "pinyin": "yuán", "meaning": "đồng (tệ)", "lesson": "8", "type": "Bổ sung 3.0", "ex_cn": "这个苹果要十元钱。", "ex_py": "Zhège píngguǒ yào shí yuán qián.", "ex_vn": "Quả táo này giá mười tệ."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
