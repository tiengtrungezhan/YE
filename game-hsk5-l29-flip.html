<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LẬT THẺ BÀI - HSK 5 Bài 29</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #f0f9ff; }
        .placeholder-container {
            max-width: 800px;
            margin: 100px auto;
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
        }
        .mode-badge {
            display: inline-block;
            padding: 0.5rem 1.5rem;
            background: #e3f2fd;
            color: #1976d2;
            border-radius: 100px;
            font-weight: 800;
            font-size: 0.8rem;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
        }
        h1 { color: var(--primary-dark); font-size: 2.5rem; margin-bottom: 1rem; }
        .mascot-box { font-size: 5rem; margin: 2rem 0; }
        p { color: #666; font-size: 1.2rem; }
        .back-btn-alt {
            display: inline-block;
            margin-top: 3rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 15px;
            font-weight: 700;
            transition: 0.3s;
        }
        .back-btn-alt:hover { transform: scale(1.05); box-shadow: 0 10px 20px rgba(165,207,218,0.4); }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <div class="placeholder-container">
            <div class="mode-badge">LẬT THẺ BÀI</div>
            <h1>HSK 5 - Bài 29</h1>

            <p>Nội dung bài tập đang được biên soạn.<br>Vui lòng quay lại sau!</p>
            <a href="game-hsk5.html" class="back-btn-alt">Quay lại danh sách bài</a>

    </div>
</body>
</html>
