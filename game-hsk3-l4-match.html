<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 3 Bài 4</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk3.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 4</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "比赛", "pinyin": "bǐsài", "meaning": "cuộc thi, trận đấu", "lesson": "4", "type": "Danh từ", "ex_cn": "昨天的足球比赛很好看。", "ex_py": "Zuótiān de zúqiú bǐsài hěn hǎokàn.", "ex_vn": "Trận bóng đá hôm qua rất hay."}, {"hanzi": "照片", "pinyin": "zhàopiàn", "meaning": "bức ảnh", "lesson": "4", "type": "Danh từ", "ex_cn": "这是我家的照片。", "ex_py": "Zhè shì wǒ jiā de zhàopiàn.", "ex_vn": "Đây là bức ảnh gia đình tôi."}, {"hanzi": "年级", "pinyin": "niánjí", "meaning": "lớp, khối (năm thứ...)", "lesson": "4", "type": "Danh từ", "ex_cn": "他是三年级的学生。", "ex_py": "Tā shì sān niánjí de xuésheng.", "ex_vn": "Anh ấy là học sinh lớp 3."}, {"hanzi": "又", "pinyin": "yòu", "meaning": "lại (biểu thị sự lặp lại)", "lesson": "4", "type": "Phó từ", "ex_cn": "你怎么又迟到了？", "ex_py": "Nǐ zěnme yòu chídào le?", "ex_vn": "Sao bạn lại đến muộn nữa rồi?"}, {"hanzi": "聪明", "pinyin": "cōngming", "meaning": "thông minh", "lesson": "4", "type": "Tính từ", "ex_cn": "那个孩子很聪明。", "ex_py": "Nàge háizi hěn cōngming.", "ex_vn": "Đứa trẻ đó rất thông minh."}, {"hanzi": "热情", "pinyin": "rèqíng", "meaning": "nhiệt tình", "lesson": "4", "type": "Tính từ", "ex_cn": "服务员很热情。", "ex_py": "Fúwùyuán hěn rèqíng.", "ex_vn": "Người phục vụ rất nhiệt tình."}, {"hanzi": "努力", "pinyin": "nǔlì", "meaning": "nỗ lực, cố gắng", "lesson": "4", "type": "Tính từ", "ex_cn": "我们要努力学习。", "ex_py": "Wǒmen yào nǔlì xuéxí.", "ex_vn": "Chúng ta phải cố gắng học tập."}, {"hanzi": "总是", "pinyin": "zǒngshì", "meaning": "luôn luôn", "lesson": "4", "type": "Phó từ", "ex_cn": "他总是笑。", "ex_py": "Tā zǒngshì xiào.", "ex_vn": "Anh ấy luôn cười."}, {"hanzi": "回答", "pinyin": "huídá", "meaning": "trả lời", "lesson": "4", "type": "Động từ", "ex_cn": "请回答我的问题。", "ex_py": "Qǐng huídá wǒ de wèntí.", "ex_vn": "Hãy trả lời câu hỏi của tôi."}, {"hanzi": "站", "pinyin": "zhàn", "meaning": "đứng", "lesson": "4", "type": "Động từ", "ex_cn": "请站在我后面。", "ex_py": "Qǐng zhàn zài wǒ hòumiàn.", "ex_vn": "Hãy đứng ở phía sau tôi."}, {"hanzi": "饿", "pinyin": "è", "meaning": "đói", "lesson": "4", "type": "Tính từ", "ex_cn": "我饿了，想吃饭。", "ex_py": "Wǒ è le, xiǎng chī fàn.", "ex_vn": "Tôi đói rồi, muốn ăn cơm."}, {"hanzi": "超市", "pinyin": "chāoshì", "meaning": "siêu thị", "lesson": "4", "type": "Danh từ", "ex_cn": "我去超市买东西。", "ex_py": "Wǒ qù chāoshì mǎi dōngxi.", "ex_vn": "Tôi đi siêu thị mua đồ."}, {"hanzi": "蛋糕", "pinyin": "dàngāo", "meaning": "bánh kem, bánh ngọt", "lesson": "4", "type": "Danh từ", "ex_cn": "这个蛋糕很好吃。", "ex_py": "Zhège dàngāo hěn hǎochī.", "ex_vn": "Chiếc bánh kem này rất ngon."}, {"hanzi": "年轻", "pinyin": "niánqīng", "meaning": "trẻ tuổi", "lesson": "4", "type": "Tính từ", "ex_cn": "李太太很年轻。", "ex_py": "Lǐ tàitai hěn niánqīng.", "ex_vn": "Bà Lý rất trẻ."}, {"hanzi": "认真", "pinyin": "rènzhēn", "meaning": "nghiêm túc, chăm chỉ", "lesson": "4", "type": "Tính từ", "ex_cn": "他学习很认真。", "ex_py": "Tā xuéxí hěn rènzhēn.", "ex_vn": "Anh ấy học tập rất chăm chỉ."}, {"hanzi": "客人", "pinyin": "kèrén", "meaning": "khách, khách hàng", "lesson": "4", "type": "Danh từ", "ex_cn": "家里来了很多客人。", "ex_py": "Jiā lǐ lái le hěn duō kèrén.", "ex_vn": "Trong nhà có rất nhiều khách đến."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
