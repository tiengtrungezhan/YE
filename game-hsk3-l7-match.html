<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 3 Bài 7</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk3.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 7</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "同事", "pinyin": "tóngshì", "meaning": "đồng nghiệp", "lesson": "7", "type": "Danh từ", "ex_cn": "他是我的同事。", "ex_py": "Tā shì wǒ de tóngshì.", "ex_vn": "Anh ấy là đồng nghiệp của tôi."}, {"hanzi": "以前", "pinyin": "yǐqián", "meaning": "trước đây", "lesson": "7", "type": "Danh từ", "ex_cn": "以前我住在那儿。", "ex_py": "Yǐqián wǒ zhù zài nàr.", "ex_vn": "Trước đây tôi sống ở đằng kia."}, {"hanzi": "银行", "pinyin": "yínháng", "meaning": "ngân hàng", "lesson": "7", "type": "Danh từ", "ex_cn": "我去银行取钱。", "ex_py": "Wǒ qù yínháng qǔ qián.", "ex_vn": "Tôi đến ngân hàng rút tiền."}, {"hanzi": "久", "pinyin": "jiǔ", "meaning": "lâu", "lesson": "7", "type": "Tính từ", "ex_cn": "好久不见！", "ex_py": "Hǎo jiǔ bú jiàn!", "ex_vn": "Đã lâu không gặp!"}, {"hanzi": "感兴趣", "pinyin": "gǎn xìngqù", "meaning": "cảm thấy hứng thú", "lesson": "7", "type": "Động từ", "ex_cn": "我对学习汉语感兴趣。", "ex_py": "Wǒ duì xuéxí Hànyǔ gǎn xìngqù.", "ex_vn": "Tôi cảm thấy hứng thú với việc học tiếng Trung."}, {"hanzi": "结婚", "pinyin": "jiéhūn", "meaning": "kết hôn", "lesson": "7", "type": "Động từ", "ex_cn": "他们下个月结婚。", "ex_py": "Tāmen xià ge yuè jiéhūn.", "ex_vn": "Họ sẽ kết hôn vào tháng sau."}, {"hanzi": "欢迎", "pinyin": "huānyíng", "meaning": "hoan nghênh", "lesson": "7", "type": "Động từ", "ex_cn": "欢迎你来我家。", "ex_py": "Huānyíng nǐ lái wǒ jiā.", "ex_vn": "Chào mừng bạn đến nhà tôi."}, {"hanzi": "迟到", "pinyin": "chídào", "meaning": "đến muộn", "lesson": "7", "type": "Động từ", "ex_cn": "别迟到了。", "ex_py": "Bié chídào le.", "ex_vn": "Đừng đến muộn nhé."}, {"hanzi": "半", "pinyin": "bàn", "meaning": "một nửa", "lesson": "7", "type": "Số từ", "ex_cn": "现在七点半。", "ex_py": "Xiànzài qī diǎn bàn.", "ex_vn": "Bây giờ là bảy giờ rưỡi."}, {"hanzi": "接", "pinyin": "jiē", "meaning": "đón, nhận", "lesson": "7", "type": "Động từ", "ex_cn": "我去机场接朋友。", "ex_py": "Wǒ qù jīchǎng jiē péngyou.", "ex_vn": "Tôi đi sân bay đón bạn."}, {"hanzi": "刻", "pinyin": "kè", "meaning": "khắc (15 phút)", "lesson": "7", "type": "Lượng từ", "ex_cn": "一点一刻。", "ex_py": "Yī diǎn yí kè.", "ex_vn": "Một giờ mười lăm phút."}, {"hanzi": "差", "pinyin": "chà", "meaning": "kém, thiếu", "lesson": "7", "type": "Động từ/Tính từ", "ex_cn": "差一刻十点。", "ex_py": "Chà yí kè shí diǎn.", "ex_vn": "Mười giờ kém mười lăm."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
