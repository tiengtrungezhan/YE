<head>

    <title>Lật Thẻ Thông Minh - HSK 5 Bài 17: 在最美好的时刻离开</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #f0f9ff; }
        .game-header { text-align: center; margin-bottom: 2rem; position: relative; }
        .mascot-container { 
            position: absolute; right: 0; top: -20px; width: 100px; 
            animation: bounce 2s infinite ease-in-out; 
        }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .mascot-bubble {
            background: white; padding: 10px 15px; border-radius: 20px; box-shadow: var(--shadow);
            font-size: 0.85rem; position: absolute; right: 110px; top: 10px; width: 150px;
            color: var(--primary-dark); font-weight: 700; z-index: 10;
        }
        .game-container { max-width: 1100px; margin: 0 auto; padding: 2rem; }
        .single-card-container { display: flex; justify-content: center; align-items: center; margin-top: 2rem; position: relative; }
        .flip-card { background-color: transparent; width: 100%; max-width: 500px; height: 500px; perspective: 1000px; cursor: pointer; }
        .flip-card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back { 
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden; 
            display: flex; flex-direction: column; border-radius: 30px; padding: 1.2rem; 
            border: 2px solid var(--primary-light); background: white;
            box-shadow: 0 10px 30px rgba(165, 207, 218, 0.2);
        }
        .flip-card-front { justify-content: center; align-items: center; }
        .flip-card-front .hanzi { font-family: "KaiTi", "楷体", "STKaiti", serif; font-size: 8rem; font-weight: 800; color: var(--primary-dark); transition: transform 0.3s; }
        .flip-card:hover .hanzi { transform: scale(1.1); }
        .flip-card-back { transform: rotateY(180deg); text-align: left; background: #fff; border-color: var(--primary-color); }
        .flip-card.mastered .flip-card-front, .flip-card.mastered .flip-card-back { border-color: #ffd700; background: #fffdf0; }
        .master-badge { position: absolute; top: 15px; right: 15px; font-size: 1.5rem; display: none; z-index: 5; }
        .flip-card.mastered .master-badge { display: block; animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
        .back-header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid #eee; padding-bottom: 0.5rem; }
        .back-hanzi { font-family: "KaiTi", "楷体", "STKaiti", serif; font-size: 3rem; font-weight: 800; color: var(--primary-dark); }
        .back-pinyin { font-size: 1.8rem; color: #e67e22; font-weight: 700; }
        .btn-speak { background: var(--primary-light); border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; transition: 0.3s; }
        .btn-speak:hover { background: var(--primary-color); transform: scale(1.1); }
        .back-meaning { font-size: 1.6rem; font-weight: 700; color: #444; }
        .back-example { font-size: 1.2rem; background: #f9f9f9; padding: 1rem; border-radius: 12px; margin-top: 1rem; line-height: 1.5; }
        .back-example strong { font-size: 1.2rem; color: var(--primary-dark); }
        .master-btn { margin-top: auto; width: 100%; padding: 0.6rem; border-radius: 12px; border: 2px solid var(--primary-color); background: white; color: var(--primary-dark); font-weight: 800; cursor: pointer; transition: 0.3s; font-size: 0.85rem; }
        .master-btn.active { background: var(--primary-color); color: white; }
        .progress-container { background: white; padding: 1.5rem; border-radius: 20px; box-shadow: var(--shadow); margin: 2rem 0; }
        .progress-text { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-weight: 700; color: #555; }
        .progress-bar { width: 100%; height: 12px; background: #eee; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary-color), var(--primary-dark)); width: 0%; transition: width 0.5s ease-out; }
        .controls { display: flex; justify-content: center; gap: 1rem; margin-top: 1rem; }
        .btn-control { padding: 0.5rem 1rem; border-radius: 10px; border: 1px solid var(--primary-color); background: white; color: var(--primary-dark); font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 0.9rem; }
        .celebration-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; animation: fadeIn 0.5s; }
        .trophy { font-size: 5rem; animation: trophyPop 1s infinite alternate; }
        @keyframes trophyPop { from { transform: scale(1); } to { transform: scale(1.2) rotate(5deg); } }
    </style>
</head>

    <script>
        let vocabData = [{"hanzi": "事物", "pinyin": "shìwù", "meaning": "sự vật, mọi thứ", "lesson": "17", "type": "Danh từ", "ex_cn": "世界上的事物都在不断变化。", "ex_py": "Shìjiè shàng de shìwù dōu zài bùduàn biànhuà.", "ex_vn": "Mọi sự vật trên thế giới đều không ngừng thay đổi."}, {"hanzi": "高峰", "pinyin": "gāofēng", "meaning": "đỉnh cao, cao điểm", "lesson": "17", "type": "Danh từ", "ex_cn": "他的演艺事业在三十岁时达到了高峰。", "ex_py": "Tā de yǎnyì shìyè zài sānshí suì shí dádào le gāofēng.", "ex_vn": "Sự nghiệp biểu diễn của anh ấy đạt đỉnh cao lúc 30 tuổi."}, {"hanzi": "终点", "pinyin": "zhōngdiǎn", "meaning": "điểm cuối, đích đến", "lesson": "17", "type": "Danh từ", "ex_cn": "运动员冲过了终点线，赢得了比赛。", "ex_py": "Yùndòngyuán chōngguò le zhōngdiǎn xiàn, yíngdé le bǐsài.", "ex_vn": "Vận động viên vượt qua vạch đích và giành chiến thắng."}, {"hanzi": "迅速", "pinyin": "xùnsù", "meaning": "nhanh chóng, mau lẹ", "lesson": "17", "type": "Tính từ", "ex_cn": "他迅速地做出了决定。", "ex_py": "Tā xùnsù de zuòchū le juédìng.", "ex_vn": "Anh ấy nhanh chóng đưa ra quyết định."}, {"hanzi": "深刻", "pinyin": "shēnkè", "meaning": "sâu sắc", "lesson": "17", "type": "Tính từ", "ex_cn": "这部电影给我留下了深刻的印象。", "ex_py": "Zhè bù diànyǐng gěi wǒ liúxià le shēnkè de yìnxiàng.", "ex_vn": "Bộ phim này để lại ấn tượng sâu sắc trong tôi."}, {"hanzi": "戏剧", "pinyin": "xìjù", "meaning": "kịch, sân khấu", "lesson": "17", "type": "Danh từ", "ex_cn": "他从小就喜欢看戏剧表演。", "ex_py": "Tā cóngxiǎo jiù xǐhuan kàn xìjù biǎoyǎn.", "ex_vn": "Anh ấy từ nhỏ đã thích xem biểu diễn kịch."}, {"hanzi": "投入", "pinyin": "tóurù", "meaning": "đầu tư, dốc tâm vào", "lesson": "17", "type": "Động từ", "ex_cn": "她把全部精力都投入到工作中。", "ex_py": "Tā bǎ quánbù jīnglì dōu tóurù dào gōngzuò zhōng.", "ex_vn": "Cô ấy dồn toàn bộ sức lực vào công việc."}, {"hanzi": "服装", "pinyin": "fúzhuāng", "meaning": "trang phục, trang phục biểu diễn", "lesson": "17", "type": "Danh từ", "ex_cn": "演员们的服装非常华丽。", "ex_py": "Yǎnyuánmen de fúzhuāng fēicháng huálì.", "ex_vn": "Trang phục của các diễn viên rất lộng lẫy."}, {"hanzi": "化妆", "pinyin": "huàzhuāng", "meaning": "trang điểm", "lesson": "17", "type": "Động từ", "ex_cn": "演出前，演员们需要花两个小时化妆。", "ex_py": "Yǎnchū qián, yǎnyuánmen xūyào huā liǎng gè xiǎoshí huàzhuāng.", "ex_vn": "Trước khi biểu diễn, các diễn viên cần hai tiếng để trang điểm."}, {"hanzi": "道具", "pinyin": "dàojù", "meaning": "đạo cụ", "lesson": "17", "type": "Danh từ", "ex_cn": "舞台上的道具都是专门定制的。", "ex_py": "Wǔtái shàng de dàojù dōu shì zhuānmén dìngzhì de.", "ex_vn": "Đạo cụ trên sân khấu đều được đặt làm riêng."}, {"hanzi": "美术", "pinyin": "měishù", "meaning": "mỹ thuật", "lesson": "17", "type": "Danh từ", "ex_cn": "他从小喜欢画画，长大后学了美术。", "ex_py": "Tā cóngxiǎo xǐhuan huàhuà, zhǎngdà hòu xué le měishù.", "ex_vn": "Từ nhỏ anh ấy đã thích vẽ, lớn lên theo học mỹ thuật."}, {"hanzi": "以", "pinyin": "yǐ", "meaning": "bằng, dùng, để (giới từ)", "lesson": "17", "type": "Giới từ", "ex_cn": "他以微笑回应了所有的批评。", "ex_py": "Tā yǐ wēixiào huíyìng le suǒyǒu de pīpíng.", "ex_vn": "Anh ấy dùng nụ cười đáp lại tất cả những lời chỉ trích."}, {"hanzi": "良好", "pinyin": "liánghǎo", "meaning": "tốt đẹp, tốt lành", "lesson": "17", "type": "Tính từ", "ex_cn": "他在工作上有良好的表现。", "ex_py": "Tā zài gōngzuò shàng yǒu liánghǎo de biǎoxiàn.", "ex_vn": "Anh ấy có thành tích tốt đẹp trong công việc."}, {"hanzi": "争取", "pinyin": "zhēngqǔ", "meaning": "tranh thủ, phấn đấu giành được", "lesson": "17", "type": "Động từ", "ex_cn": "我们要争取在明年完成这个项目。", "ex_py": "Wǒmen yào zhēngqǔ zài míngnián wánchéng zhège xiàngmù.", "ex_vn": "Chúng ta phải phấn đấu hoàn thành dự án này vào năm sau."}, {"hanzi": "忽视", "pinyin": "hūshì", "meaning": "xem nhẹ, bỏ qua", "lesson": "17", "type": "Động từ", "ex_cn": "不能忽视学生的心理健康问题。", "ex_py": "Bù néng hūshì xuéshēng de xīnlǐ jiànkāng wèntí.", "ex_vn": "Không thể bỏ qua vấn đề sức khỏe tâm lý của học sinh."}, {"hanzi": "魅力", "pinyin": "mèilì", "meaning": "sức hút, sức quyến rũ", "lesson": "17", "type": "Danh từ", "ex_cn": "这位演员的魅力吸引了无数观众。", "ex_py": "Zhè wèi yǎnyuán de mèilì xīyǐn le wúshù guānzhòng.", "ex_vn": "Sức hút của diễn viên này thu hút vô số khán giả."}, {"hanzi": "糟糕", "pinyin": "zāogāo", "meaning": "tệ hại, tồi tệ", "lesson": "17", "type": "Tính từ", "ex_cn": "今天的天气真糟糕，一直在下雨。", "ex_py": "Jīntiān de tiānqì zhēn zāogāo, yīzhí zài xià yǔ.", "ex_vn": "Thời tiết hôm nay thật tệ, trời cứ mưa mãi."}, {"hanzi": "婚礼", "pinyin": "hūnlǐ", "meaning": "đám cưới, lễ cưới", "lesson": "17", "type": "Danh từ", "ex_cn": "他们的婚礼举办得非常隆重。", "ex_py": "Tāmen de hūnlǐ jǔbàn de fēicháng lóngzhòng.", "ex_vn": "Đám cưới của họ được tổ chức rất long trọng."}, {"hanzi": "等于", "pinyin": "děngyú", "meaning": "bằng, tương đương với", "lesson": "17", "type": "Động từ", "ex_cn": "不努力学习等于浪费时间。", "ex_py": "Bù nǔlì xuéxí děngyú làngfèi shíjiān.", "ex_vn": "Không chịu học hành chăm chỉ là lãng phí thời gian."}, {"hanzi": "度过", "pinyin": "dùguò", "meaning": "trải qua, sống qua (thời gian)", "lesson": "17", "type": "Động từ", "ex_cn": "我们在农村度过了一个快乐的假期。", "ex_py": "Wǒmen zài nóngcūn dùguò le yí gè kuàilè de jiàqī.", "ex_vn": "Chúng tôi trải qua một kỳ nghỉ vui vẻ ở nông thôn."}, {"hanzi": "告别", "pinyin": "gàobié", "meaning": "tạm biệt, từ biệt", "lesson": "17", "type": "Động từ", "ex_cn": "他在车站和家人依依不舍地告别。", "ex_py": "Tā zài chēzhàn hé jiārén yīyī bùshě de gàobié.", "ex_vn": "Anh ấy lưu luyến chia tay với gia đình ở nhà ga."}, {"hanzi": "平常", "pinyin": "píngcháng", "meaning": "bình thường, thường ngày", "lesson": "17", "type": "Tính từ", "ex_cn": "她平常很安静，今天却十分兴奋。", "ex_py": "Tā píngcháng hěn ānjìng, jīntiān què shífēn xīngfèn.", "ex_vn": "Bình thường cô ấy rất điềm tĩnh, nhưng hôm nay lại rất phấn khích."}, {"hanzi": "依然", "pinyin": "yīrán", "meaning": "vẫn còn, vẫn như xưa", "lesson": "17", "type": "Phó từ", "ex_cn": "多年过去了，他依然记得那段美好的时光。", "ex_py": "Duō nián guòqù le, tā yīrán jìde nà duàn měihǎo de shíguāng.", "ex_vn": "Nhiều năm trôi qua, anh ấy vẫn nhớ khoảng thời gian tươi đẹp đó."}, {"hanzi": "推荐", "pinyin": "tuījiàn", "meaning": "giới thiệu, đề xuất", "lesson": " anh từ", "ex_cn": "奥运会开幕式令全世界观众叹为观止。", "ex_py": "Àoyùnhuì kāimùshì lìng quán shìjiè guānzhòng tàn wéi guānzhǐ.", "ex_vn": "Lễ khai mạc Thế vận hội khiến khán giả toàn thế giới trầm trồ thán phục."}, {"hanzi": "闭幕式", "pinyin": "bìmùshì", "meaning": "lễ bế mạc", "lesson": "17", "type": "Danh từ", "ex_cn": "闭幕式上的烟火表演精彩绝伦。", "ex_py": "Bìmùshì shàng de yānhuǒ biǎoyǎn jīngcǎi juélún.", "ex_vn": "Màn pháo hoa tại lễ bế mạc vô cùng rực rỡ."}, {"hanzi": "精力", "pinyin": "jīnglì", "meaning": "sức lực, năng lượng", "lesson": "17", "type": "Danh từ", "ex_cn": "他把所有的精力都投入到这个项目中。", "ex_py": "Tā bǎ suǒyǒu de jīnglì dōu tóurù dào zhège xiàngmù zhōng.", "ex_vn": "Anh ấy dồn hết sức lực vào dự án này."}];
        const grid = document.getElementById('cardGrid');
        const progressFill = document.getElementById('progress');
        const progressPercent = document.getElementById('progressPercent');
        const masteredCountEl = document.getElementById('masteredCount');
        const totalCountEl = document.getElementById('totalCount');
        const mascotSpeech = document.getElementById('mascotSpeech');
        const celebration = document.getElementById('celebration');

        let masteredSet = new Set();
        let currentCardIndex = 0;
        const cardCounterEl = document.getElementById('cardCounter');
        totalCountEl.innerText = vocabData.length;

        function renderCards() {
            grid.innerHTML = '';
            if(vocabData.length === 0) return;
            const index = currentCardIndex;
            const word = vocabData[index];
            const card = document.createElement('div');
            card.className = 'flip-card' + (masteredSet.has(index) ? ' mastered' : '');
            card.innerHTML = `
                <div class="flip-card-inner">
                    <div class="flip-card-front">
                        <div class="master-badge">⭐</div>
                        <div class="hanzi">${word.hanzi}</div>
                    </div>
                    <div class="flip-card-back">
                        <div class="back-header">
                            <span class="back-hanzi">${word.hanzi}</span>
                            <span class="back-pinyin">${word.pinyin}</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 0.5rem;">
                            <button class="btn-speak" onclick="event.stopPropagation(); speak('${word.hanzi}')">🔊</button>
                            <div class="back-meaning">${word.meaning}</div>
                        </div>
                        <div style="font-size: 1.1rem; color: #555; margin-bottom: 1rem; padding-left: 5px;">
                            <strong>Từ loại:</strong> ${word.type || 'Đang cập nhật'}
                        </div>
                        <div class="back-example">
                            <strong>Ví dụ:</strong>
                            <div style="font-family: 'KaiTi', '楷体', 'STKaiti', serif; margin-top:5px; font-size: 1.5rem;">${word.ex_cn || word.hanzi}</div>
                            <div style="color: #e67e22; font-style: italic; font-size: 1.2rem;">${word.ex_py || word.pinyin}</div>
                            <div style="color: #666; font-size: 1.1rem; border-top: 1px dashed #ccc; margin-top:5px; padding-top:5px;">${word.ex_vn || word.meaning}</div>
                        </div>
                        <button class="master-btn ${masteredSet.has(index) ? 'active' : ''}" onclick="event.stopPropagation(); toggleMaster(${index}, this)">
                            ${masteredSet.has(index) ? 'Bỏ thuộc' : 'Đã thuộc'}
                        </button>
                    </div>
                </div>`;
            card.addEventListener('click', () => card.classList.toggle('flipped'));
            grid.appendChild(card);
            cardCounterEl.innerText = (currentCardIndex + 1) + " / " + vocabData.length;
        }

        window.prevCard = function() {
            if(currentCardIndex > 0) { currentCardIndex--; renderCards(); }
        };

        window.nextCard = function() {
            if(currentCardIndex < vocabData.length - 1) { currentCardIndex++; renderCards(); }
        };

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
        }

        function updateProgress() {
            const count = masteredSet.size;
            const percent = Math.round((count / vocabData.length) * 100);
            progressFill.style.width = percent + '%';
            progressPercent.innerText = percent + '%';
            masteredCountEl.innerText = count;
            if (percent === 100) { mascotSpeech.innerText = "Tuyệt vời! Bạn đã thuộc hết rồi! 🏆"; celebration.style.display = 'flex'; }
            else if (percent >= 50) mascotSpeech.innerText = "Sắp xong rồi, bạn học nhanh quá! 🚀";
            else if (percent > 0) mascotSpeech.innerText = "Giỏi lắm! Cố gắng lên nhé! 💪";
        }

        window.toggleMaster = function(index, btn) {
            if (masteredSet.has(index)) { masteredSet.delete(index); } else { masteredSet.add(index); }
            renderCards();
            updateProgress();
        };

        window.shuffleCards = function() {
            vocabData.sort(() => Math.random() - 0.5);
            masteredSet.clear();
            currentCardIndex = 0;
            renderCards();
            updateProgress();
        };

        window.resetProgress = function() {
            masteredSet.clear();
            currentCardIndex = 0;
            renderCards();
            updateProgress();
        };

        renderCards();
    </script>
</body>
</html>
