<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên Hệ - EZHAN</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .contact-wrapper {
            display: flex;
            justify-content: center;
            max-width: 600px;
            margin: 2rem auto 0;
            gap: 3rem;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .social-links {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-top: 1rem;
        }

        .social-card {
            background: var(--white);
            padding: 1.5rem;
            border-radius: 20px;
            text-align: center;
            text-decoration: none;
            color: var(--text-color);
            box-shadow: var(--shadow);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            border: 1px solid var(--glass-border);
        }

        .social-card:hover {
            transform: translateY(-5px);
            background: var(--primary-light);
            border-color: var(--primary-color);
        }

        .social-card i {
            font-size: 2rem;
            color: var(--primary-dark);
        }

        .social-card.facebook i { color: #1877F2; }
        .social-card.tiktok i { color: #000000; }
        .social-card.zalo i { color: #0068FF; }
        .social-card.youtube i { color: #FF0000; }

        .contact-form-container {
            background: var(--white);
            padding: 2.5rem;
            border-radius: 32px;
            box-shadow: var(--shadow);
            border: 1px solid var(--glass-border);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 1.2rem;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--primary-dark);
        }

        input, select, textarea {
            padding: 0.9rem 1.2rem;
            border: 2px solid #edf2f7;
            border-radius: 14px;
            font-size: 1rem;
            background: #f8fafc;
            transition: var(--transition);
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(165, 207, 218, 0.15);
        }

        .submit-btn {
            width: 100%;
            padding: 1.1rem;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            margin-top: 1rem;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(138, 184, 197, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn.loading {
            opacity: 0.7;
            pointer-events: none;
        }

        @media (max-width: 992px) {
            .contact-wrapper {
                flex-direction: column;
            }
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
            .social-links {
                grid-template-columns: 1fr 1fr;
            }
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 2rem;
        }

        .success-message i {
            font-size: 4rem;
            color: #48BB78;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Quay lại trang chủ</a>
        
        <div class="contact-header" style="margin-bottom: 3rem; text-align: center;">
            <h1 style="color: var(--primary-dark); font-size: 2.5rem; margin-bottom: 1rem;">Liên Hệ Với EZHAN</h1>
            <p style="font-size: 1.1rem; opacity: 0.8;">Kết nối với chúng tôi để được tư vấn lộ trình học tiếng Trung hiệu quả nhất.</p>
        </div>

        <div class="contact-wrapper">
            <!-- Left Side: Social Info -->
            <div class="contact-info">
                
                <div class="social-links">
                    <a href="https://www.facebook.com/tiengtrungezhan.edu.vn" target="_blank" class="social-card facebook">
                        <i class="fab fa-facebook"></i>
                        <span>Facebook</span>
                    </a>
                    <a href="https://www.tiktok.com/@chang.chang334" target="_blank" class="social-card tiktok">
                        <i class="fab fa-tiktok"></i>
                        <span>Tiktok</span>
                    </a>
                    <a href="https://zalo.me/0818004397" target="_blank" class="social-card zalo">
                        <i class="fas fa-comment-sms"></i>
                        <span>Zalo</span>
                    </a>
                    <a href="https://www.youtube.com/@EZHANTIẾNGTRUNG" target="_blank" class="social-card youtube">
                        <i class="fab fa-youtube"></i>
                        <span>YouTube</span>
                    </a>
                </div>

                <div style="margin-top: 2rem; background: var(--primary-light); padding: 1.5rem; border-radius: 20px; border-left: 5px solid var(--primary-dark);">
                    <p style="font-weight: 600; color: var(--primary-dark);"><i class="fas fa-phone-alt"></i> Hotline/Zalo:</p>
                    <p style="font-size: 1.2rem; font-weight: 700;">081 800 4397</p>
                </div>

                <div style="margin-top: 1rem; background: var(--primary-light); padding: 1.5rem; border-radius: 20px; border-left: 5px solid var(--primary-dark);">
                    <p style="font-weight: 600; color: var(--primary-dark);"><i class="fas fa-envelope"></i> Email:</p>
                    <p style="font-size: 1.2rem; font-weight: 700;"><a href="mailto:tiengtrungezhan@gmail.com" style="color: var(--text-color); text-decoration: none;">tiengtrungezhan@gmail.com</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
