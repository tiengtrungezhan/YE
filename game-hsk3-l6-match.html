<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 3 Bài 6</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk3.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 6</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "眼镜", "pinyin": "yǎnjìng", "meaning": "kính mắt", "lesson": "6", "type": "Danh từ", "ex_cn": "我需要买新眼镜。", "ex_py": "Wǒ xūyào mǎi xīn yǎnjìng.", "ex_vn": "Tôi cần mua kính mới."}, {"hanzi": "突然", "pinyin": "tūrán", "meaning": "đột nhiên", "lesson": "6", "type": "Phó từ/Tính từ", "ex_cn": "他突然走了。", "ex_py": "Tā tūrán zǒu le.", "ex_vn": "Anh ấy đột nhiên đi rồi."}, {"hanzi": "离开", "pinyin": "líkāi", "meaning": "rời khỏi", "lesson": "6", "type": "Động từ", "ex_cn": "他不希望离开家。", "ex_py": "Tā bù xīwàng líkāi jiā.", "ex_vn": "Anh ấy không muốn rời xa nhà."}, {"hanzi": "清楚", "pinyin": "qīngchu", "meaning": "rõ ràng", "lesson": "6", "type": "Tính từ", "ex_cn": "我看得很清楚。", "ex_py": "Wǒ kàn de hěn qīngchu.", "ex_vn": "Tôi nhìn rất rõ."}, {"hanzi": "刚才", "pinyin": "gāngcái", "meaning": "vừa nãy", "lesson": "6", "type": "Danh từ", "ex_cn": "刚才谁来了？", "ex_py": "Gāngcái shéi lái le?", "ex_vn": "Vừa nãy ai đến vậy?"}, {"hanzi": "帮忙", "pinyin": "bāngmáng", "meaning": "giúp đỡ", "lesson": "6", "type": "Động từ", "ex_cn": "你可以帮我忙吗？", "ex_py": "Nǐ kěyǐ bāng wǒ máng ma?", "ex_vn": "Bạn có thể giúp tôi một tay không?"}, {"hanzi": "特别", "pinyin": "tèbié", "meaning": "đặc biệt", "lesson": "6", "type": "Phó từ/Tính từ", "ex_cn": "今天特别冷。", "ex_py": "Jīntiān tèbié lěng.", "ex_vn": "Hôm nay đặc biệt lạnh."}, {"hanzi": "讲", "pinyin": "jiǎng", "meaning": "nói, giảng", "lesson": "6", "type": "Động từ", "ex_cn": "老师在讲课。", "ex_py": "Lǎoshī zài jiǎng kè.", "ex_vn": "Thầy giáo đang giảng bài."}, {"hanzi": "明白", "pinyin": "míngbai", "meaning": "hiểu rõ", "lesson": "6", "type": "Động từ/Tính từ", "ex_cn": "你明白我的意思吗？", "ex_py": "Nǐ míngbai wǒ de yìsi ma?", "ex_vn": "Bạn hiểu ý tôi không?"}, {"hanzi": "锻炼", "pinyin": "duànliàn", "meaning": "rèn luyện", "lesson": "6", "type": "Động từ", "ex_cn": "他每天锻炼身体。", "ex_py": "Tā měitiān duànliàn shēntǐ.", "ex_vn": "Anh ấy rèn luyện thân thể mỗi ngày."}, {"hanzi": "音乐", "pinyin": "yīnyuè", "meaning": "âm nhạc", "lesson": "6", "type": "Danh từ", "ex_cn": "我喜欢听音乐。", "ex_py": "Wǒ xǐhuan tīng yīnyuè.", "ex_vn": "Tôi thích nghe nhạc."}, {"hanzi": "公园", "pinyin": "gōngyuán", "meaning": "công viên", "lesson": "6", "type": "Danh từ", "ex_cn": "我们在公园运动。", "ex_py": "Wǒmen zài gōngyuán yùndòng.", "ex_vn": "Chúng tôi vận động ở công viên."}, {"hanzi": "聊天", "pinyin": "liáotiān", "meaning": "tán gẫu, nói chuyện", "lesson": "6", "type": "Động từ", "ex_cn": "他们在跟朋友聊天。", "ex_py": "Tāmen zài gēn péngyou liáotiān.", "ex_vn": "Họ đang tán gẫu với bạn bè."}, {"hanzi": "睡着", "pinyin": "shuìzháo", "meaning": "ngủ thiếp đi", "lesson": "6", "type": "Động từ", "ex_cn": "孩子睡着了。", "ex_py": "Háizi shuìzháo le.", "ex_vn": "Đứa trẻ ngủ thiếp đi rồi."}, {"hanzi": "更", "pinyin": "gèng", "meaning": "hơn nữa", "lesson": "6", "type": "Phó từ", "ex_cn": "这个更好。", "ex_py": "Zhège gèng hǎo.", "ex_vn": "Cái này tốt hơn."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
