<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 1 3.0 Bài 4</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk1.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 4</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "有", "pinyin": "yǒu", "meaning": "có", "lesson": "4", "type": "động từ", "ex_cn": "我有很多朋友。", "ex_py": "Wǒ yǒu hěn duō péngyou.", "ex_vn": "Tôi có rất nhiều bạn bè."}, {"hanzi": "没有", "pinyin": "méiyǒu", "meaning": "không có", "lesson": "4", "type": "Động từ", "ex_cn": "我没有中国朋友。", "ex_py": "Wǒ méiyǒu Zhōngguó péngyou.", "ex_vn": "Tôi không có bạn bè người Trung Quốc."}, {"hanzi": "多少", "pinyin": "duōshao", "meaning": "bao nhiêu", "lesson": "4", "type": "Đại từ", "ex_cn": "王老师有多少学生？", "ex_py": "Wáng lǎoshī yǒu duōshao xuésheng?", "ex_vn": "Thầy/Cô Vương có bao nhiêu học sinh?"}, {"hanzi": "个", "pinyin": "gè", "meaning": "cái, chiếc...", "lesson": "4", "type": "lượng từ", "ex_cn": "你家有几个人？", "ex_py": "Nǐ jiā yǒu jǐ gè rén?", "ex_vn": "Nhà bạn có mấy người?"}, {"hanzi": "几", "pinyin": "jǐ", "meaning": "mấy", "lesson": "4", "type": "Đại từ", "ex_cn": "你几岁？", "ex_py": "Nǐ jǐ suì?", "ex_vn": "Bạn mấy tuổi?"}, {"hanzi": "哥哥", "pinyin": "gēge", "meaning": "anh trai", "lesson": "4", "type": "danh từ", "ex_cn": "这是我哥哥。", "ex_py": "Zhè shì wǒ gēge.", "ex_vn": "Đây là anh trai tôi."}, {"hanzi": "弟弟", "pinyin": "dìdi", "meaning": "em trai", "lesson": "4", "type": "danh từ", "ex_cn": "这是我弟弟。", "ex_py": "Zhè shì wǒ dìdi.", "ex_vn": "Đây là em trai tôi."}, {"hanzi": "妹妹", "pinyin": "mèimei", "meaning": "em gái", "lesson": "4", "type": "danh từ", "ex_cn": "这是我妹妹。", "ex_py": "Zhè shì wǒ mèimei.", "ex_vn": "Đây là em gái tôi."}, {"hanzi": "兄弟姐妹", "pinyin": "xiōngdì jiěmèi", "meaning": "anh chị em", "lesson": "4", "type": "danh từ", "ex_cn": "我没有兄弟姐妹。", "ex_py": "Wǒ méiyǒu xiōngdì jiěmèi.", "ex_vn": "Tôi không có anh chị em."}, {"hanzi": "爸爸", "pinyin": "bàba", "meaning": "bố", "lesson": "4", "type": "danh từ", "ex_cn": "这是我爸爸。", "ex_py": "Zhè shì wǒ bàba.", "ex_vn": "Đây là bố tôi."}, {"hanzi": "妈妈", "pinyin": "māma", "meaning": "mẹ", "lesson": "4", "type": "đại từ chỉ thị", "ex_cn": "我妈妈是老师。", "ex_py": "Wǒ māma shì lǎoshī.", "ex_vn": "Mẹ tôi là giáo viên."}, {"hanzi": "呢", "pinyin": "ne", "meaning": "còn... thì sao", "lesson": "4", "type": "trợ từ ngữ khí", "ex_cn": "你呢？", "ex_py": "Nǐ ne?", "ex_vn": "Còn bạn thì sao?"}, {"hanzi": "口", "pinyin": "kǒu", "meaning": "lượng từ thành viên trong gia đình", "lesson": "4", "type": "lượng từ", "ex_cn": "我家有四口人。", "ex_py": "Wǒ jiā yǒu sì kǒu rén.", "ex_vn": "Nhà tôi có bốn người."}, {"hanzi": "和", "pinyin": "hé", "meaning": "và", "lesson": "4", "type": "liên từ", "ex_cn": "这是我儿子和女儿。", "ex_py": "Zhè shì wǒ érzi hé nǚ'ér.", "ex_vn": "Đây là con trai và con gái của tôi."}, {"hanzi": "儿子", "pinyin": "érzi", "meaning": "con trai", "lesson": "4", "type": "danh từ", "ex_cn": "我儿子今年九岁。", "ex_py": "Wǒ érzi jīnnián jiǔ suì.", "ex_vn": "Con trai tôi năm nay chín tuổi."}, {"hanzi": "女儿", "pinyin": "nǚ'ér", "meaning": "con gái", "lesson": "4", "type": "danh từ", "ex_cn": "我女儿今年八岁。", "ex_py": "Wǒ nǚ'ér jīnnián bā suì.", "ex_vn": "Con gái tôi năm nay tám tuổi."}, {"hanzi": "孩子", "pinyin": "háizi", "meaning": "con, con cái", "lesson": "4", "type": "danh từ", "ex_cn": "这是我们的孩子。", "ex_py": "Zhè shì wǒmen de háizi.", "ex_vn": "Đây là con của chúng tôi."}, {"hanzi": "今年", "pinyin": "jīnnián", "meaning": "năm nay", "lesson": "4", "type": "danh từ", "ex_cn": "你今年多大？", "ex_py": "Nǐ jīnnián duō dà?", "ex_vn": "Năm nay bạn bao nhiêu tuổi?"}, {"hanzi": "两", "pinyin": "liǎng", "meaning": "2 (số lượng)", "lesson": "4", "type": "số từ", "ex_cn": "我有两个哥哥。", "ex_py": "Wǒ yǒu liǎng gè gēge.", "ex_vn": "Tôi có hai người anh trai."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
