<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 1 3.0 Bài 4</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk1.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 4</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "这", "pinyin": "zhè", "meaning": "đây, này", "lesson": "4", "type": "Đại từ", "ex_cn": "这是我的书。", "ex_py": "Zhè shì wǒ de shū.", "ex_vn": "Đây là cuốn sách của tôi."}, {"hanzi": "爸爸", "pinyin": "bàba", "meaning": "bố, cha", "lesson": "4", "type": "Danh từ", "ex_cn": "他是我爸爸。", "ex_py": "Tā shì wǒ bàba.", "ex_vn": "Anh ấy là bố tôi."}, {"hanzi": "八", "pinyin": "bā", "meaning": "số 8", "lesson": "4", "type": "Số từ", "ex_cn": "他今年八岁，很聪明。", "ex_py": "Tā jīnnián bā suì, hěn cōngming.", "ex_vn": "Năm nay anh ấy tám tuổi, rất thông minh."}, {"hanzi": "百", "pinyin": "bǎi", "meaning": "trăm", "lesson": "4", "type": "Số từ", "ex_cn": "一百块。", "ex_py": "Yìbǎi kuài.", "ex_vn": "Một trăm đồng."}, {"hanzi": "个", "pinyin": "gè", "meaning": "cái", "lesson": "4", "type": "Lượng từ", "ex_cn": "我们班有三十个学生。", "ex_py": "Wǒmen bān yǒu sānshí gè xuésheng.", "ex_vn": "Lớp chúng tôi có ba mươi học sinh."}, {"hanzi": "哥哥", "pinyin": "gēge", "meaning": "anh trai", "lesson": "4", "type": "Danh từ", "ex_cn": "他是我哥哥。", "ex_py": "Tā shì wǒ gēge.", "ex_vn": "Anh ấy là anh trai tôi."}, {"hanzi": "家人", "pinyin": "jiārén", "meaning": "người nhà, gia đình", "type": "Danh từ", "ex_cn": "这是 my 家人。", "ex_py": "Zhè shì wǒ de jiārén.", "ex_vn": "Đây là người nhà của tôi.", "lesson": "4"}, {"hanzi": "千", "pinyin": "qiān", "meaning": "nghìn", "lesson": "4", "type": "Số từ", "ex_cn": "一千块。", "ex_py": "Yìqiān kuài.", "ex_vn": "Một nghìn đồng."}, {"hanzi": "七", "pinyin": "qī", "meaning": "số 7", "lesson": "4", "type": "Số từ", "ex_cn": "他们家有七口人。", "ex_py": "Tāmen jiā yǒu qī kǒu rén.", "ex_vn": "Gia đình họ có bảy người."}, {"hanzi": "十", "pinyin": "shí", "meaning": "số 10", "lesson": "4", "type": "Số từ", "ex_cn": "弟弟今年十岁了。", "ex_py": "Dìdi jīnnián shí suì le.", "ex_vn": "Em trai năm nay mười tuổi rồi."}, {"hanzi": "三", "pinyin": "sān", "meaning": "ba", "lesson": "4", "type": "Số từ", "ex_cn": "一、二、三。", "ex_py": "Yī, èr, sān.", "ex_vn": "Một, hai, ba."}, {"hanzi": "五", "pinyin": "wǔ", "meaning": "năm", "lesson": "4", "type": "Số từ", "ex_cn": "他每天五点起床跑步。", "ex_py": "Tā měitiān wǔ diǎn qǐchuáng pǎobù.", "ex_vn": "Mỗi ngày anh ấy thức dậy lúc 5 giờ để chạy bộ."}, {"hanzi": "有", "pinyin": "yǒu", "meaning": "có", "lesson": "4", "type": "Động từ", "ex_cn": "我有三个哥哥。", "ex_py": "Wǒ yǒu sān ge gēge.", "ex_vn": "Tôi có ba người anh trai."}, {"hanzi": "儿子", "pinyin": "érzi", "meaning": "con trai", "lesson": "4", "type": "Danh từ", "ex_cn": "他是我儿子。", "ex_py": "Tā shì wǒ érzi.", "ex_vn": "Nó là con trai tôi."}, {"hanzi": "多少", "pinyin": "duōshao", "meaning": "bao nhiêu", "lesson": "4", "type": "Đại từ", "ex_cn": "这件衣服多少钱？", "ex_py": "Zhè jiàn yīfu duōshao qián?", "ex_vn": "Chiếc áo này bao nhiêu tiền?"}, {"hanzi": "呢", "pinyin": "ne", "meaning": "được dùng ở cuối câu hỏi", "lesson": "4", "type": "Trợ từ", "ex_cn": "我很好，你呢？", "ex_py": "Wǒ hěn hǎo, nǐ ne?", "ex_vn": "Tôi rất khỏe, còn bạn?"}, {"hanzi": "她", "pinyin": "tā", "meaning": "cô ấy, bà ấy", "lesson": "4", "type": "Đại từ", "ex_cn": "她是我的老师。", "ex_py": "Tā shì wǒ de lǎoshī.", "ex_vn": "Cô ấy là giáo viên của tôi."}, {"hanzi": "零", "pinyin": "líng", "meaning": "số không", "lesson": "4", "type": "Số từ", "ex_cn": "今天零度。", "ex_py": "Jīntiān líng dù.", "ex_vn": "Hôm nay không độ."}, {"hanzi": "一", "pinyin": "yī", "meaning": "số 1", "lesson": "4", "type": "Số từ", "ex_cn": "一、二、三。", "ex_py": "Yī, èr, sān.", "ex_vn": "Một, hai, ba."}, {"hanzi": "二", "pinyin": "èr", "meaning": "số 2", "lesson": "4", "type": "Số từ", "ex_cn": "一、二、三。", "ex_py": "Yī, èr, sān.", "ex_vn": "Một, hai, ba."}, {"hanzi": "四", "pinyin": "sì", "meaning": "bốn", "lesson": "4", "type": "Số từ", "ex_cn": "我们家有四口人。", "ex_py": "Wǒmen jiā yǒu sì kǒu rén.", "ex_vn": "Nhà chúng tôi có bốn người."}, {"hanzi": "六", "pinyin": "liù", "meaning": "sáu", "lesson": "4", "type": "Số từ", "ex_cn": "他今年六岁了。", "ex_py": "Tā jīnnián liù suì le.", "ex_vn": "Năm nay nó sáu tuổi rồi."}, {"hanzi": "九", "pinyin": "jiǔ", "meaning": "chín", "lesson": "4", "type": "Số từ", "ex_cn": "九月十号是教师节。", "ex_py": "Jiǔyuè shí hào shì Jiàoshījié.", "ex_vn": "Ngày 10 tháng 9 là ngày Nhà giáo."}, {"hanzi": "两", "pinyin": "liǎng", "meaning": "hai (dùng trước lượng từ)", "lesson": "4", "type": "Số từ", "ex_cn": "我有两个哥哥。", "ex_py": "Wǒ yǒu liǎng gè gēge.", "ex_vn": "Tôi có hai người anh trai."}, {"hanzi": "口", "pinyin": "kǒu", "meaning": "người (lượng từ chỉ thành viên gia đình)", "lesson": "4", "type": "Lượng từ", "ex_cn": "你家有几口人？", "ex_py": "Nǐ jiā yǒu jǐ kǒu rén?", "ex_vn": "Nhà bạn có mấy người."}, {"hanzi": "没", "pinyin": "méi", "meaning": "không, chưa", "lesson": "4", "type": "Phó từ", "ex_cn": "我没有弟弟。", "ex_py": "Wǒ méiyǒu dìdi.", "ex_vn": "Tôi không có em trai."}, {"hanzi": "几", "pinyin": "jǐ", "meaning": "mấy, vài", "lesson": "4", "type": "Đại từ", "ex_cn": "你有几个孩子？", "ex_py": "Nǐ yǒu jǐ gè háizi?", "ex_vn": "Bạn có mấy đứa con?"}, {"hanzi": "妈妈", "pinyin": "māma", "meaning": "mẹ, má", "lesson": "4", "type": "Danh từ", "ex_cn": "我妈妈是老师。", "ex_py": "Wǒ māma shì lǎoshī.", "ex_vn": "Mẹ tôi là giáo viên."}, {"hanzi": "弟弟", "pinyin": "dìdi", "meaning": "em trai", "lesson": "4", "type": "Danh từ", "ex_cn": "他是我弟弟。", "ex_py": "Tā shì wǒ dìdi.", "ex_vn": "Cậu ấy là em trai tôi."}, {"hanzi": "妹妹", "pinyin": "mèimei", "meaning": "em gái", "lesson": "4", "type": "Danh từ", "ex_cn": "我有两个妹妹。", "ex_py": "Wǒ yǒu liǎng gè mèimei.", "ex_vn": "Tôi có hai người em gái."}, {"hanzi": "和", "pinyin": "hé", "meaning": "và, với", "lesson": "4", "type": "Liên từ", "ex_cn": "爸爸和妈妈都在家。", "ex_py": "Bàba hé māma dōu zài jiā.", "ex_vn": "Bố và mẹ đều ở nhà."}, {"hanzi": "女儿", "pinyin": "nǚ'ér", "meaning": "con gái", "lesson": "4", "type": "Danh từ", "ex_cn": "她是我女儿。", "ex_py": "Tā shì wǒ nǚ'ér.", "ex_vn": "Con bé là con gái tôi."}, {"hanzi": "多大", "pinyin": "duō dà", "meaning": "bao nhiêu tuổi", "lesson": "4", "type": "Cụm từ", "ex_cn": "你女儿今年多大？", "ex_py": "Nǐ nǚ'ér jīnnián duō dà?", "ex_vn": "Con gái bạn năm nay bao nhiêu tuổi?"}, {"hanzi": "岁", "pinyin": "suì", "meaning": "tuổi", "lesson": "4", "type": "Lượng từ", "ex_cn": "女儿今年五岁了。", "ex_py": "Nǚ'ér jīnnián wǔ suì le.", "ex_vn": "Con gái năm nay năm tuổi rồi."}, {"hanzi": "是的", "pinyin": "shìde", "meaning": "vâng, phải, đúng vậy", "lesson": "4", "type": "Cụm từ", "ex_cn": "是的，他是我儿子。", "ex_py": "Shìde, tā shì wǒ érzi.", "ex_vn": "Vâng, nó là con trai tôi."}, {"hanzi": "他", "pinyin": "tā", "meaning": "anh ấy, cậu ấy", "lesson": "4", "type": "Đại từ", "ex_cn": "他是我的好朋友。", "ex_py": "Tā shì wǒ de hǎo péngyou.", "ex_vn": "Cậu ấy là bạn tốt của tôi."}, {"hanzi": "今天", "pinyin": "jīntiān", "meaning": "hôm nay", "lesson": "4", "type": "Danh từ", "ex_cn": "今天星期二。", "ex_py": "Jīntiān Xīngqī'èr.", "ex_vn": "Hôm nay là thứ Ba."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
