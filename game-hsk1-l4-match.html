<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 1 3.0 Bài 4</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk1.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 4</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "爸爸", "pinyin": "bàba", "meaning": "bố, cha", "lesson": "4", "type": "Danh từ", "ex_cn": "他是我爸爸。", "ex_py": "Tā shì wǒ bàba.", "ex_vn": "Anh ấy là bố tôi."}, {"hanzi": "八", "pinyin": "bā", "meaning": "số 8", "lesson": "4", "type": "Số từ", "ex_cn": "他今年八岁，很聪明。", "ex_py": "Tā jīnnián bā suì, hěn cōngming.", "ex_vn": "Năm nay anh ấy tám tuổi, rất thông minh."}, {"hanzi": "百", "pinyin": "bǎi", "meaning": "trăm", "lesson": "4", "type": "Số từ", "ex_cn": "一百块。", "ex_py": "Yìbǎi kuài.", "ex_vn": "Một trăm đồng."}, {"hanzi": "多", "pinyin": "duō", "meaning": "nhiều", "lesson": "4", "type": "Tính từ", "ex_cn": "他朋友很多。", "ex_py": "Tā péngyou hěn duō.", "ex_vn": "Bạn của anh ấy rất nhiều."}, {"hanzi": "多少", "pinyin": "duōshao", "meaning": "bao nhiêu", "lesson": "4", "type": "Danh từ", "ex_cn": "这件衣服多少钱？", "ex_py": "Zhè jiàn yīfu duōshao qián?", "ex_vn": "Chiếc áo này bao nhiêu tiền?"}, {"hanzi": "大", "pinyin": "dà", "meaning": "lớn", "lesson": "4", "type": "Tính từ", "ex_cn": "中国是一个很大的国家。", "ex_py": "Zhōngguó shì yí gè hěn dà de guójiā.", "ex_vn": "Trung Quốc là một đất nước rất rộng lớn."}, {"hanzi": "个", "pinyin": "gè", "meaning": "cái", "lesson": "4", "type": "Lượng từ", "ex_cn": "我们班有三十个学生。", "ex_py": "Wǒmen bān yǒu sānshí gè xuésheng.", "ex_vn": "Lớp chúng tôi có ba mươi học sinh."}, {"hanzi": "哥哥", "pinyin": "gēge", "meaning": "anh trai", "lesson": "4", "type": "Danh từ", "ex_cn": "他是我哥哥。", "ex_py": "Tā shì wǒ gēge.", "ex_vn": "Anh ấy là anh trai tôi."}, {"hanzi": "呢", "pinyin": "ne", "meaning": "được dùng ở cuối câu hỏi", "lesson": "4", "type": "Trợ từ", "ex_cn": "我很好，你呢？", "ex_py": "Wǒ hěn hǎo, nǐ ne?", "ex_vn": "Tôi rất tốt, còn bạn thì sao?"}, {"hanzi": "千", "pinyin": "qiān", "meaning": "nghìn", "lesson": "4", "type": "Số từ", "ex_cn": "一千块。", "ex_py": "Yìqiān kuài.", "ex_vn": "Một nghìn đồng."}, {"hanzi": "七", "pinyin": "qī", "meaning": "số 7", "lesson": "4", "type": "Số từ", "ex_cn": "他们家有七口人。", "ex_py": "Tāmen jiā yǒu qī kǒu rén.", "ex_vn": "Gia đình họ có bảy người."}, {"hanzi": "十", "pinyin": "shí", "meaning": "số 10", "lesson": "4", "type": "Số từ", "ex_cn": "弟弟今年十岁了。", "ex_py": "Dìdi jīnnián shí suì le.", "ex_vn": "Em trai năm nay mười tuổi rồi."}, {"hanzi": "三", "pinyin": "sān", "meaning": "ba", "lesson": "4", "type": "Số từ", "ex_cn": "我数一，二，三。", "ex_py": "Wǒ shǔ yī, èr, sān.", "ex_vn": "Tôi đếm một, hai, ba."}, {"hanzi": "五", "pinyin": "wǔ", "meaning": "năm", "lesson": "4", "type": "Số từ", "ex_cn": "他每天五点起床跑步。", "ex_py": "Tā měitiān wǔ diǎn qǐchuáng pǎobù.", "ex_vn": "Mỗi ngày anh ấy thức dậy lúc 5 giờ để chạy bộ."}, {"hanzi": "有", "pinyin": "yǒu", "meaning": "có", "lesson": "4", "type": "Động từ", "ex_cn": "我有三个哥哥。", "ex_py": "Wǒ yǒu sān ge gēge.", "ex_vn": "Tôi có ba người anh trai."}, {"hanzi": "儿子", "pinyin": "érzi", "meaning": "con trai", "lesson": "4", "type": "Danh từ", "ex_cn": "他是我儿子。", "ex_py": "Tā shì wǒ érzi.", "ex_vn": "Nó là con trai tôi."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
