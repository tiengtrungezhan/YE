<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 1 3.0 Bài 3</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk1.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 3</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "们", "pinyin": "men", "meaning": "các (số nhiều)", "lesson": "3", "type": "Bổ sung 3.0", "ex_cn": "我们都是学生。", "ex_py": "Wǒmen dōu shì xuésheng.", "ex_vn": "Chúng tôi đều là học sinh."}, {"hanzi": "不", "pinyin": "bù", "meaning": "không cần, không, đừng", "lesson": "3", "ex_cn": "我今天不去学校。", "ex_py": "Wǒ jīntiān bù qù xuéxiào.", "ex_vn": "Hôm nay tôi không đi học.", "type": "Phó từ"}, {"hanzi": "也", "pinyin": "yě", "meaning": "cũng", "lesson": "3", "ex_cn": "我也是学生。", "ex_py": "Wǒ yěshì xuésheng.", "ex_vn": "Tôi cũng là học sinh.", "type": "Phó từ"}, {"hanzi": "法国", "pinyin": "Fǎguó", "meaning": "Pháp", "lesson": "3", "type": "Danh từ", "ex_cn": "我们是法国人。", "ex_py": "Wǒmen shì Fǎguó rén.", "ex_vn": "Chúng tôi là người Pháp."}, {"hanzi": "泰国", "pinyin": "Tàiguó", "meaning": "Thái Lan", "lesson": "3", "type": "Danh từ", "ex_cn": "她是泰国人。", "ex_py": "Tā shì Tàiguó rén.", "ex_vn": "Cô ấy là người Thái Lan."}, {"hanzi": "中国", "pinyin": "Zhōngguó", "meaning": "Trung Quốc", "lesson": "3", "type": "Danh từ", "ex_cn": "他是中国人。", "ex_py": "Tā shì Zhōngguó rén.", "ex_vn": "Anh ấy là người Trung Quốc."}, {"hanzi": "中文", "pinyin": "Zhōngwén", "meaning": "tiếng Trung", "lesson": "3", "type": "Danh từ", "ex_cn": "他的中文说得很好。", "ex_py": "Tā de Zhōngwén shuō de hěn hǎo.", "ex_vn": "Tiếng Trung của anh ấy nói rất tốt."}, {"hanzi": "对", "pinyin": "duì", "meaning": "đúng, đối với", "lesson": "3", "type": "Tính từ", "ex_cn": "你说对了。", "ex_py": "Nǐ shuō duì le.", "ex_vn": "Bạn nói đúng rồi."}, {"hanzi": "国", "pinyin": "guó", "meaning": "nước, quốc gia", "lesson": "3", "type": "Bổ sung 3.0", "ex_cn": "你是哪国人？", "ex_py": "Nǐ shì nǎ guó rén?", "ex_vn": "Bạn là người nước nào?"}, {"hanzi": "喂", "pinyin": "wèi", "meaning": "alo", "lesson": "3", "type": "Danh từ", "ex_cn": "喂，你好。", "ex_py": "Wèi, nǐ hǎo.", "ex_vn": "A lô, chào bạn."}, {"hanzi": "我们", "pinyin": "wǒmen", "meaning": "chúng tôi, chúng ta", "lesson": "3", "type": "Đại từ", "ex_cn": "我们都是学生。", "ex_py": "Wǒmen dōu shì xuésheng.", "ex_vn": "Chúng tôi đều là học sinh."}, {"hanzi": "的", "pinyin": "de", "meaning": "của, thuộc về", "lesson": "3", "type": "Trợ từ", "ex_cn": "我是老师的学生。", "ex_py": "Wǒ shì lǎoshī de xuésheng.", "ex_vn": "Tôi là học sinh của thầy giáo."}, {"hanzi": "那", "pinyin": "nà", "meaning": "kia, đó", "lesson": "3", "type": "Đại từ", "ex_cn": "那是我的老师，他很好。", "ex_py": "Nà shì wǒ de lǎoshī, tā hěn hǎo.", "ex_vn": "Đó là giáo viên của tôi, thầy ấy rất tốt."}, {"hanzi": "工作", "pinyin": "gōngzuò", "meaning": "làm việc; công việc", "lesson": "3", "type": "Động từ", "ex_cn": "他在一家公司工作。", "ex_py": "Tā zài yì jiā gōngsī gōngzuò.", "ex_vn": "Anh ấy làm việc ở một công ty."}, {"hanzi": "朋友", "pinyin": "péngyou", "meaning": "bạn", "lesson": "3", "type": "Đại từ", "ex_cn": "他是我的朋友。", "ex_py": "Tā shì wǒ de péngyou.", "ex_vn": "Anh ấy là bạn của tôi."}, {"hanzi": "谁", "pinyin": "shéi", "meaning": "ai", "lesson": "3", "type": "Đại từ", "ex_cn": "那个人是谁，你认识他吗？", "ex_py": "Nàge rén shì shéi, nǐ rènshi tā ma?", "ex_vn": "Người đó là ai, bạn có quen không?"}, {"hanzi": "人", "pinyin": "rén", "meaning": "người", "lesson": "3", "type": "Danh từ", "ex_cn": "他是中国人。", "ex_py": "Tā shì Zhōngguó rén.", "ex_vn": "Anh ấy là người Trung Quốc."}, {"hanzi": "汉语", "pinyin": "Hànyǔ", "meaning": "tiếng Trung Quốc", "lesson": "3", "type": "Danh từ", "ex_cn": "他是汉语老师。", "ex_py": "Tā shì Hànyǔ lǎoshī.", "ex_vn": "Anh ấy là giáo viên tiếng Trung."}, {"hanzi": "是", "pinyin": "shì", "meaning": "là", "lesson": "3", "ex_cn": "我是学生。", "ex_py": "Wǒ shì xuésheng.", "ex_vn": "Tôi là học sinh.", "type": "Động từ"}, {"hanzi": "越南", "pinyin": "Yuènán", "meaning": "Việt Nam", "lesson": "3", "type": "Danh từ", "ex_cn": "我是越南人。", "ex_py": "Wǒ shì Yuènán rén.", "ex_vn": "Tôi là người Việt Nam."}, {"hanzi": "英国", "pinyin": "Yīngguó", "meaning": "Anh (quốc)", "lesson": "3", "type": "Danh từ", "ex_cn": "他是英国人。", "ex_py": "Tā shì Yīngguó rén.", "ex_vn": "Anh ấy là người Anh."}, {"hanzi": "美国", "pinyin": "Měiguó", "meaning": "Mỹ", "lesson": "3", "type": "Danh từ", "ex_cn": "她来自美国。", "ex_py": "Tā láizì Měiguó.", "ex_vn": "Cô ấy đến từ Mỹ."}, {"hanzi": "日本", "pinyin": "Rìběn", "meaning": "Nhật Bản", "lesson": "3", "type": "Danh từ", "ex_cn": "日本在中国旁边。", "ex_py": "Rìběn zài Zhōngguó pángbiān.", "ex_vn": "Nhật Bản ở cạnh Trung Quốc."}, {"hanzi": "女朋友", "pinyin": "nǚpéngyou", "meaning": "bạn gái", "lesson": "3", "type": "Danh từ", "ex_cn": "她是我的女朋友。", "ex_py": "Tā shì wǒ de nǚpéngyou.", "ex_vn": "Cô ấy là bạn gái của tôi."}, {"hanzi": "男朋友", "pinyin": "nánpéngyou", "meaning": "bạn trai", "lesson": "3", "type": "Danh từ", "ex_cn": "他是我的男朋友。", "ex_py": "Tā shì wǒ de nánpéngyou.", "ex_vn": "Anh ấy là bạn trai của tôi."}, {"hanzi": "哪", "pinyin": "nǎ", "meaning": "nào, đâu", "lesson": "3", "type": "Đại từ", "ex_cn": "你是哪国人？", "ex_py": "Nǐ shì nǎ guó rén?", "ex_vn": "Bạn là người nước nào?"}, {"hanzi": "吗", "pinyin": "ma", "meaning": "không? (trợ từ câu hỏi)", "lesson": "3", "type": "Trợ từ", "ex_cn": "你是学生吗？", "ex_py": "Nǐ shì xuésheng ma?", "ex_vn": "Bạn có phải là học sinh không?"}, {"hanzi": "姐姐", "pinyin": "jiějie", "meaning": "chị gái", "lesson": "3", "type": "Danh từ", "ex_cn": "我有一个姐姐。", "ex_py": "Wǒ yǒu yí gè jiějie.", "ex_vn": "Tôi có một người chị gái."}, {"hanzi": "忙", "pinyin": "máng", "meaning": "bận", "lesson": "3", "type": "Tính từ", "ex_cn": "你今天忙吗？", "ex_py": "Nǐ jīntiān máng ma?", "ex_vn": "Hôm nay bạn có bận không?"}, {"hanzi": "还", "pinyin": "hái", "meaning": "vẫn còn, cũng", "lesson": "3", "type": "Phó từ", "ex_cn": "她还在工作。", "ex_py": "Tā hái zài gōngzuò.", "ex_vn": "Cô ấy vẫn còn đang làm việc."}, {"hanzi": "太", "pinyin": "tài", "meaning": "quá, rất", "lesson": "3", "type": "Phó từ", "ex_cn": "你太忙了。", "ex_py": "Nǐ tài máng le.", "ex_vn": "Bạn bận quá."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
