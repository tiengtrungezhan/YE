<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 1 Bài 3</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk1.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 3</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "叫", "pinyin": "jiào", "meaning": "tên (là)", "lesson": "3", "type": "Danh từ", "ex_cn": "你叫什么？", "ex_py": "Nǐ jiào shénme?", "ex_vn": "Bạn tên là gì?"}, {"hanzi": "吗", "pinyin": "ma", "meaning": "được dùng ở cuối câu hỏi", "lesson": "3", "type": "Trợ từ", "ex_cn": "你是老师吗？", "ex_py": "Nǐ shì lǎoshī ma?", "ex_vn": "Bạn là giáo viên phải không?"}, {"hanzi": "名字", "pinyin": "míngzi", "meaning": "tên", "lesson": "3", "type": "Danh từ", "ex_cn": "你叫什么名字？", "ex_py": "Nǐ jiào shénme míngzi?", "ex_vn": "Bạn tên là gì?"}, {"hanzi": "呢", "pinyin": "ne", "meaning": "được dùng ở cuối câu hỏi", "lesson": "3", "type": "Trợ từ", "ex_cn": "你呢？", "ex_py": "Nǐ ne?", "ex_vn": "Còn bạn?"}, {"hanzi": "人", "pinyin": "rén", "meaning": "người", "lesson": "3", "type": "Danh từ", "ex_cn": "他是中国人。", "ex_py": "Tā shì Zhōngguó rén.", "ex_vn": "Anh ấy là người Trung Quốc."}, {"hanzi": "什么", "pinyin": "shénme", "meaning": "cái gì", "lesson": "3", "type": "Đại từ", "ex_cn": "你叫什么？", "ex_py": "Nǐ jiào shénme?", "ex_vn": "Bạn tên là gì?"}, {"hanzi": "是", "pinyin": "shì", "meaning": "là", "lesson": "3", "type": "Động từ", "ex_cn": "他是学生。", "ex_py": "Tā shì xuésheng.", "ex_vn": "Anh ấy là học sinh."}, {"hanzi": "学生", "pinyin": "xuésheng", "meaning": "học sinh", "lesson": "3", "type": "Động từ", "ex_cn": "他是学生吗？", "ex_py": "Tā shì xuésheng ma?", "ex_vn": "Anh ấy là học sinh phải không?"}, {"hanzi": "中国", "pinyin": "Zhōngguó", "meaning": "Trung Quốc", "lesson": "3", "type": "Danh từ", "ex_cn": "他是中国人。", "ex_py": "Tā shì Zhōngguó rén.", "ex_vn": "Anh ấy là người Trung Quốc."}, {"hanzi": "美国", "pinyin": "Měiguó", "meaning": "Mỹ", "lesson": "3", "type": "Danh từ", "ex_cn": "她是美国人。", "ex_py": "Tā shì Měiguó rén.", "ex_vn": "Cô ấy là người Mỹ."}, {"hanzi": "越南", "pinyin": "Yuènán", "meaning": "Việt Nam", "lesson": "3", "type": "Danh từ", "ex_cn": "我是越南人。", "ex_py": "Wǒ shì Yuènán rén.", "ex_vn": "Tôi là người Việt Nam."}, {"hanzi": "高兴", "pinyin": "gāoxìng", "meaning": "vui vẻ", "lesson": "3", "type": "Tính từ", "ex_cn": "很高兴。", "ex_py": "Hěn gāoxìng.", "ex_vn": "Rất vui."}, {"hanzi": "很", "pinyin": "hěn", "meaning": "rất", "lesson": "3", "type": "Phó từ", "ex_cn": "他很好。", "ex_py": "Tā hěn hǎo.", "ex_vn": "Anh ấy rất tốt."}, {"hanzi": "也", "pinyin": "yě", "meaning": "cũng", "lesson": "3", "type": "Phó từ", "ex_cn": "我也是学生。", "ex_py": "Wǒ yěshì xuésheng.", "ex_vn": "Tôi cũng là học sinh."}, {"hanzi": "认识", "pinyin": "rènshi", "meaning": "quen biết", "lesson": "3", "type": "Động từ", "ex_cn": "认识你，很高兴。", "ex_py": "Rènshi nǐ, hěn gāoxìng.", "ex_vn": "Quen biết bạn, rất vui."}, {"hanzi": "韩国", "pinyin": "Hánguó", "meaning": "Hàn Quốc", "lesson": "3", "type": "Danh từ", "ex_cn": "你是韩国人吗？", "ex_py": "Nǐ shì Hánguó rén ma?", "ex_vn": "Bạn là người Hàn Quốc phải không?"}, {"hanzi": "日本", "pinyin": "Rìběn", "meaning": "Nhật Bản", "lesson": "3", "type": "Danh từ", "ex_cn": "他是日本人。", "ex_py": "Tā shì Rìběn rén.", "ex_vn": "Anh ấy là người Nhật Bản."}, {"hanzi": "英国", "pinyin": "Yīngguó", "meaning": "Anh", "lesson": "3", "type": "Danh từ", "ex_cn": "他们是英国人。", "ex_py": "Tāmen shì Yīngguó rén.", "ex_vn": "Họ là người Anh."}, {"hanzi": "泰国", "pinyin": "Tàiguó", "meaning": "Thái Lan", "lesson": "3", "type": "Danh từ", "ex_cn": "她是泰国人。", "ex_py": "Tā shì Tàiguó rén.", "ex_vn": "Cô ấy là người Thái Lan."}, {"hanzi": "法国", "pinyin": "Fǎguó", "meaning": "Pháp", "lesson": "3", "type": "Danh từ", "ex_cn": "我们是法国人。", "ex_py": "Wǒmen shì Fǎguó rén.", "ex_vn": "Chúng tôi là người Pháp."}, {"hanzi": "医生", "pinyin": "yīshēng", "meaning": "bác sĩ", "lesson": "3", "type": "Danh từ", "ex_cn": "他是医生。", "ex_py": "Tā shì yīshēng.", "ex_vn": "Anh ấy là bác sĩ."}, {"hanzi": "职员", "pinyin": "zhíyuán", "meaning": "nhân viên", "lesson": "3", "type": "Danh từ", "ex_cn": "他是职员。", "ex_py": "Tā shì zhíyuán.", "ex_vn": "Anh ấy là nhân viên."}, {"hanzi": "大学生", "pinyin": "dàxuésheng", "meaning": "sinh viên đại học", "lesson": "3", "type": "Danh từ", "ex_cn": "我们是大学生。", "ex_py": "Wǒmen shì dàxuésheng.", "ex_vn": "Chúng tôi là sinh viên."}, {"hanzi": "做", "pinyin": "zuò", "meaning": "làm", "lesson": "3", "type": "Động từ", "ex_cn": "你做工作吗？", "ex_py": "Nǐ zuò gōngzuò ma?", "ex_vn": "Bạn có làm việc không?"}, {"hanzi": "工作", "pinyin": "gōngzuò", "meaning": "công việc / làm việc", "lesson": "3", "type": "Danh từ/Động từ", "ex_cn": "老师工作。", "ex_py": "Lǎoshī gōngzuò.", "ex_vn": "Thầy giáo làm việc."}, {"hanzi": "请问", "pinyin": "qǐngwèn", "meaning": "xin hỏi", "lesson": "3", "type": "Động từ", "ex_cn": "请问，你是老师吗？", "ex_py": "Qǐngwèn, nǐ shì lǎoshī ma?", "ex_vn": "Xin hỏi, bạn là giáo viên phải không?"}, {"hanzi": "怎么", "pinyin": "zěnme", "meaning": "thế nào, sao", "lesson": "3", "type": "Đại từ", "ex_cn": "怎么称呼您？", "ex_py": "Zěnme chēnghu nín?", "ex_vn": "Xưng hô với ngài thế nào?"}, {"hanzi": "称呼", "pinyin": "chēnghu", "meaning": "xưng hô, gọi là", "lesson": "3", "type": "Động từ", "ex_cn": "我该怎么称呼您？", "ex_py": "Wǒ gāi zěnme chēnghu nín?", "ex_vn": "Tôi nên xưng hô với ông như thế nào?"}, {"hanzi": "姓", "pinyin": "xìng", "meaning": "họ, họ là", "lesson": "3", "type": "Danh từ", "ex_cn": "他姓什么？", "ex_py": "Tā xìng shénme?", "ex_vn": "Anh ấy họ gì?"}, {"hanzi": "贵姓", "pinyin": "guìxìng", "meaning": "quý tính (họ của ngài)", "lesson": "3", "type": "Danh từ", "ex_cn": "您贵姓？", "ex_py": "Nín guìxìng?", "ex_vn": "Ngài họ gì?"}, {"hanzi": "哪", "pinyin": "nǎ", "meaning": "nào", "lesson": "3", "type": "Đại từ", "ex_cn": "你是哪人？", "ex_py": "Nǐ shì nǎ rén?", "ex_vn": "Bạn là người ở đâu?"}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
