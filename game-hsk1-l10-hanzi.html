<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện Chữ Hán - HSK 1 3.0 Bài 10</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <style>
        body { background: #f0f7f9; }
        .game-wrapper {
            display: flex;
            gap: 2rem;
            max-width: 1000px;
            margin: 2rem auto;
            align-items: flex-start;
        }
        .char-sidebar {
            flex: 0 0 180px;
            background: var(--white);
            border-radius: 25px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            max-height: 550px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .sidebar-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--primary-dark);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            text-align: center;
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 0.5rem;
        }
        .char-btn {
            padding: 0.8rem;
            background: #f8fbfe;
            border: 2px solid #eef2f5;
            border-radius: 15px;
            font-size: 1.6rem;
            font-family: "KaiTi", "楷体", "STKaiti", serif;
            font-weight: bold;
            color: var(--text-color);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
        }
        .char-btn span {
            font-size: 0.9rem;
            font-family: Arial, sans-serif;
            font-weight: normal;
            color: #666;
        }
        .char-btn:hover {
            border-color: var(--primary-color);
            background: #f0f7f9;
            transform: translateY(-2px);
        }
        .char-btn.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }
        .char-btn.active span {
            color: #fff;
        }
        
        .char-panel {
            flex: 1;
            background: var(--white);
            border-radius: 30px;
            padding: 3rem;
            box-shadow: var(--shadow);
            display: flex;
            gap: 3rem;
            min-height: 550px;
        }
        .writer-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            flex: 0 0 250px;
        }
        .hanzi-writer-container {
            width: 250px;
            height: 250px;
            background: #fff;
            border: 3px solid var(--primary-light);
            border-radius: 20px;
            position: relative;
            box-shadow: 0 10px 25px rgba(165,207,218,0.15);
            background-image: 
                linear-gradient(to right, #f5f5f5 1px, transparent 1px),
                linear-gradient(to bottom, #f5f5f5 1px, transparent 1px),
                linear-gradient(to right, transparent 50%, #ffe3e3 1px, transparent 50%),
                linear-gradient(to bottom, transparent 50%, #ffe3e3 1px, transparent 50%);
            background-size: 25px 25px, 25px 25px, 100% 100%, 100% 100%;
        }
        
        .control-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            width: 100%;
        }
        .btn-control {
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            border: 2px solid var(--primary-color);
            background: white;
            color: var(--primary-dark);
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-control:hover {
            background: var(--primary-color);
            color: white;
            transform: translateY(-2px);
        }
        .btn-speak-big {
            background: #f0f7f9;
            border-color: var(--primary-color);
        }
        
        .details-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .char-header {
            border-bottom: 2px dashed var(--primary-light);
            padding-bottom: 1rem;
        }
        .char-pinyin-display {
            font-size: 2rem;
            font-weight: bold;
            color: #e67e22;
        }
        .char-meaning-display {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--text-color);
            margin-top: 0.3rem;
        }
        
        .pills-container {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .info-pill {
            background: #f0f9ff;
            color: var(--text-color);
            padding: 0.6rem 1.2rem;
            border-radius: 100px;
            font-size: 0.95rem;
            border: 1px solid var(--primary-light);
            display: flex;
            gap: 0.5rem;
        }
        .info-pill strong {
            color: var(--primary-dark);
        }
        
        .mnemonic-box {
            background: #fffdf0;
            border: 1px solid #ffeeba;
            border-radius: 20px;
            padding: 1.5rem;
            margin-top: auto;
            position: relative;
        }
        .mnemonic-title {
            font-weight: bold;
            color: #d48806;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .mnemonic-content {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #555;
        }
        
        .evolution-step-card {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 90px;
        }
        .evolution-step-card img {
            width: 100%;
            height: 75px;
            object-fit: contain;
        }
        .evolution-arrow {
            font-size: 1.5rem;
            color: var(--primary-dark);
            font-weight: bold;
            user-select: none;
        }
        
        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #28a745;
            color: white;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(40,167,69,0.3);
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
            opacity: 0;
            pointer-events: none;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 768px) {
            .game-wrapper {
                flex-direction: column;
                padding: 1rem;
            }
            .char-sidebar {
                flex: 1;
                width: 100%;
                max-height: 120px;
                flex-direction: row;
                overflow-x: auto;
                padding: 1rem;
            }
            .sidebar-title {
                display: none;
            }
            .char-btn {
                flex-shrink: 0;
                min-width: 80px;
            }
            .char-panel {
                flex-direction: column;
                padding: 2rem;
                width: 100%;
                gap: 2rem;
            }
            .writer-section {
                width: 100%;
                flex: none;
            }
        }
    </style>
</head>

        const characters = Object.keys(hanziData);
        let selectedChar = characters[0];
        let writer = null;
        
        function initSidebar() {
            const sidebar = document.getElementById('charSidebar');
            characters.forEach((char, idx) => {
                const btn = document.createElement('button');
                btn.className = 'char-btn' + (char === selectedChar ? ' active' : '');
                btn.innerHTML = char + " <span>(" + hanziData[char].pinyin + ")</span>";
                btn.onclick = () => selectCharacter(char, btn);
                sidebar.appendChild(btn);
            });
        }
        
        function selectCharacter(char, btnElement) {
            selectedChar = char;
            document.querySelectorAll('.char-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) {
                btnElement.classList.add('active');
            }
            loadCharacter(char);
        }
        
        function loadCharacter(char) {
            document.getElementById('character-target-div').innerHTML = '';
            
            const detail = hanziData[char];
            document.getElementById('char-pinyin').innerText = detail.pinyin;
            document.getElementById('char-meaning').innerText = detail.meaning;
            const rawRadical = detail.radical;
            const radicalTranslation = RADICAL_DICT[rawRadical] || "";
            document.getElementById('char-radical').innerText = radicalTranslation ? rawRadical + " - " + radicalTranslation : rawRadical;
            document.getElementById('char-strokes').innerText = detail.strokes;
            document.getElementById('char-mnemonic').innerText = detail.mnemonic;
            
            const illustrationContainer = document.getElementById('char-illustration-container');
            const singleBox = document.getElementById('char-illustration-single-box');
            const stepsBox = document.getElementById('char-illustration-steps-box');
            const timestamp = new Date().getTime();
            
            if (detail.illustration_steps && detail.illustration_steps.length > 0) {
                singleBox.style.display = 'none';
                stepsBox.style.display = 'flex';
                stepsBox.innerHTML = '';
                
                const labels = ["Hình vẽ", "Giáp cốt", "Tiểu triện", "Chữ Lệ", "Khải (Hiện đại)"];
                
                detail.illustration_steps.forEach((src, idx) => {
                    const card = document.createElement('div');
                    card.className = 'evolution-step-card';
                    card.innerHTML = '<img src="' + src + '?t=' + timestamp + '" alt="Step ' + (idx+1) + '">';
                    stepsBox.appendChild(card);
                    
                    if (idx < detail.illustration_steps.length - 1) {
                        const arrow = document.createElement('div');
                        arrow.className = 'evolution-arrow';
                        arrow.innerText = '→';
                        stepsBox.appendChild(arrow);
                    }
                });
                illustrationContainer.style.display = 'block';
            } else if (detail.illustration) {
                stepsBox.style.display = 'none';
                singleBox.style.display = 'block';
                document.getElementById('char-illustration').src = detail.illustration + "?t=" + timestamp;
                illustrationContainer.style.display = 'block';
            } else {
                illustrationContainer.style.display = 'none';
            }
            
            writer = HanziWriter.create('character-target-div', char, {
                width: 250,
                height: 250,
                padding: 15,
                showOutline: true,
                strokeColor: '#8AB8C5',
                outlineColor: '#f3f3f3',
                drawingColor: '#e65100',
                drawingWidth: 6,
                strokeAnimationSpeed: 1,
                delayBetweenStrokes: 300
            });
            
            // Auto play animation
            setTimeout(() => {
                writer.animateCharacter();
            }, 300);
        }
        
        function animateChar() {
            if (writer) {
                writer.animateCharacter();
            }
        }
        
        function startPractice() {
            if (writer) {
                writer.quiz({
                    onComplete: function(summaryData) {
                        showToast("Tuyệt vời! Bạn viết rất chính xác chữ " + selectedChar + "! 🎉");
                    }
                });
            }
        }
        
        function speakChar() {
            const utterance = new SpeechSynthesisUtterance(selectedChar);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.8;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }
        
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
        
        window.addEventListener('pagehide', () => {
            window.speechSynthesis.cancel();
        });
        
        if (characters.length > 0) {
            initSidebar();
            loadCharacter(selectedChar);
        }
    </script>
