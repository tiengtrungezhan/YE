<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 1 3.0 Bài 14</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk1.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 14</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "上", "pinyin": "shàng", "meaning": "lên, bước lên (xe, tàu)", "lesson": "14", "type": "động từ", "ex_cn": "你上车了吗？", "ex_py": "Nǐ shàng chē le ma?", "ex_vn": "Bạn lên xe chưa?"}, {"hanzi": "火车", "pinyin": "huǒchē", "meaning": "tàu hỏa", "lesson": "14", "type": "danh từ", "ex_cn": "我上火车了。", "ex_py": "Wǒ shàng huǒchē le.", "ex_vn": "Tôi lên tàu hỏa rồi."}, {"hanzi": "中午", "pinyin": "zhōngwǔ", "meaning": "buổi trưa", "lesson": "14", "type": "danh từ", "ex_cn": "中午你吃什么？", "ex_py": "Zhōngwǔ nǐ chī shénme?", "ex_vn": "Trưa nay bạn ăn gì?"}, {"hanzi": "开", "pinyin": "kāi", "meaning": "chạy, xuất phát (xe), mở", "lesson": "14", "type": "động từ", "ex_cn": "车开了吗？", "ex_py": "Chē kāi le ma?", "ex_vn": "Xe xuất phát chưa?"}, {"hanzi": "有些", "pinyin": "yǒuxiē", "meaning": "có một số, có những", "lesson": "14", "type": "đại từ", "ex_cn": "有些人喜欢中文，有些人喜欢英文。", "ex_py": "Yǒuxiē rén xǐhuan Zhōngwén, yǒuxiē rén xǐhuan Yīngwén.", "ex_vn": "Có người thích tiếng Trung, có người thích tiếng Anh."}, {"hanzi": "有的", "pinyin": "yǒude", "meaning": "có người, có cái, một số", "lesson": "14", "type": "đại từ", "ex_cn": "我们班有的是越南人，有的是中国人。", "ex_py": "Wǒmen bān yǒude shì Yuènánrén, yǒude shì Zhōngguórén.", "ex_vn": "Lớp chúng tôi có người là người Việt Nam, có người là người Trung Quốc."}, {"hanzi": "写", "pinyin": "xiě", "meaning": "viết", "lesson": "14", "type": "động từ", "ex_cn": "你会写汉字吗？", "ex_py": "Nǐ huì xiě hànzì ma?", "ex_vn": "Bạn có biết viết chữ Hán không?"}, {"hanzi": "都", "pinyin": "dōu", "meaning": "đều, cũng", "lesson": "14", "type": "phó từ", "ex_cn": "我们都是越南人。", "ex_py": "Wǒmen dōu shì Yuènánrén.", "ex_vn": "Chúng tôi đều là người Việt Nam."}, {"hanzi": "听", "pinyin": "tīng", "meaning": "nghe", "lesson": "14", "type": "động từ", "ex_cn": "你在听什么？", "ex_py": "Nǐ zài tīng shénme?", "ex_vn": "Bạn đang nghe gì thế?"}, {"hanzi": "听见", "pinyin": "tīngjiàn", "meaning": "nghe thấy", "lesson": "14", "type": "động từ", "ex_cn": "你听见他在说什么吗？", "ex_py": "Nǐ tīngjiàn tā zài shuō shénme ma?", "ex_vn": "Bạn có nghe thấy anh ấy đang nói gì không?"}, {"hanzi": "不要", "pinyin": "búyào", "meaning": "đừng, không được", "lesson": "14", "type": "phó từ", "ex_cn": "不要说话。", "ex_py": "Búyào shuōhuà.", "ex_vn": "Đừng nói chuyện."}, {"hanzi": "哪些", "pinyin": "nǎxiē", "meaning": "những nào, những cái nào", "lesson": "14", "type": "đại từ nghi vấn", "ex_cn": "你会写哪些字？", "ex_py": "Nǐ huì xiě nǎxiē zì?", "ex_vn": "Bạn biết viết những chữ nào?"}, {"hanzi": "汉语", "pinyin": "Hànyǔ", "meaning": "tiếng Hán, tiếng Trung", "lesson": "14", "type": "danh từ", "ex_cn": "我喜欢学汉语。", "ex_py": "Wǒ xǐhuan xué Hànyǔ.", "ex_vn": "Tôi thích học tiếng Trung."}, {"hanzi": "明年", "pinyin": "míngnián", "meaning": "năm sau, sang năm", "lesson": "14", "type": "danh từ", "ex_cn": "明年我去中国玩儿。", "ex_py": "Míngnián wǒ qù Zhōngguó wánr.", "ex_vn": "Năm sau tôi đi Trung Quốc chơi."}, {"hanzi": "中学", "pinyin": "zhōngxué", "meaning": "trường trung học, cấp hai", "lesson": "14", "type": "danh từ", "ex_cn": "弟弟在读中学。", "ex_py": "Dìdi zài dú zhōngxué.", "ex_vn": "Em trai đang học trung học."}, {"hanzi": "说话", "pinyin": "shuōhuà", "meaning": "nói chuyện, trò chuyện", "lesson": "14", "type": "động từ", "ex_cn": "他们在说话。", "ex_py": "Tāmen zài shuōhuà.", "ex_vn": "Bọn họ đang nói chuyện."}, {"hanzi": "字", "pinyin": "zì", "meaning": "chữ, từ", "lesson": "14", "type": "danh từ", "ex_cn": "我喜欢写汉字。", "ex_py": "Wǒ xǐhuan xiě hànzì.", "ex_vn": "Tôi thích viết chữ Hán."}, {"hanzi": "汉字", "pinyin": "hànzì", "meaning": "chữ Hán", "lesson": "14", "type": "danh từ", "ex_cn": "你会写这个汉字吗？", "ex_py": "Nǐ huì xiě zhè ge hànzì ma?", "ex_vn": "Bạn có biết viết chữ Hán này không?"}, {"hanzi": "小学", "pinyin": "xiǎoxué", "meaning": "trường tiểu học, cấp một", "lesson": "14", "type": "danh từ", "ex_cn": "妹妹在读小学。", "ex_py": "Mèimei zài dú xiǎoxué.", "ex_vn": "Em gái đang học tiểu học."}, {"hanzi": "晚", "pinyin": "wǎn", "meaning": "muộn, trễ", "lesson": "14", "type": "tính từ", "ex_cn": "现在太晚了。", "ex_py": "Xiànzài tài wǎn le.", "ex_vn": "Bây giờ muộn quá rồi."}, {"hanzi": "小学生", "pinyin": "xiǎoxuéshēng", "meaning": "học sinh tiểu học", "lesson": "14", "type": "danh từ", "ex_cn": "弟弟是小学生。", "ex_py": "Dìdi shì xiǎoxuéshēng.", "ex_vn": "Em trai là học sinh tiểu học."}, {"hanzi": "中学生", "pinyin": "zhōngxuéshēng", "meaning": "học sinh trung học", "lesson": "14", "type": "danh từ", "ex_cn": "妹妹是中学生。", "ex_py": "Mèimei shì zhōngxuéshēng.", "ex_vn": "Em gái là học sinh trung học."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
