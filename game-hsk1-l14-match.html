<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 1 3.0 Bài 14</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk1.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 14</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "不要", "pinyin": "bùyào", "meaning": "đừng, không muốn", "lesson": "14", "type": "Bổ sung 3.0", "ex_cn": "不要去那里。", "ex_py": "Búyào qù nàr.", "ex_vn": "Đừng đi đến đó."}, {"hanzi": "电影", "pinyin": "diànyǐng", "meaning": "phim", "lesson": "14", "type": "Danh từ", "ex_cn": "明天我会跟姐姐去电影院看电影。", "ex_py": "Míngtiān wǒ huì gēn jiějie qù diànyǐngyuàn kàn diànyǐng.", "ex_vn": "Ngày mai tôi sẽ đi rạp chiếu phim xem phim cùng chị gái."}, {"hanzi": "都", "pinyin": "dōu", "meaning": "đều", "lesson": "14", "type": "Phó từ", "ex_cn": "我们班的同学都很努力学习。", "ex_py": "Wǒmen bān de tóngxué dōu hěn nǔlì xuéxí.", "ex_vn": "Các bạn trong lớp chúng tôi đều học tập rất chăm chỉ."}, {"hanzi": "汉字", "pinyin": "hànzì", "meaning": "chữ Hán, Hán tự", "type": "Danh từ", "ex_cn": "我会写汉字。", "ex_py": "Wǒ huì xiě hànzì.", "ex_vn": "Tôi biết viết chữ Hán.", "lesson": "14"}, {"hanzi": "看", "pinyin": "kàn", "meaning": "nhìn, xem", "lesson": "14", "type": "Động từ", "ex_cn": "他喜欢看中文书。", "ex_py": "Tā xǐhuan kàn Zhōngwén shū.", "ex_vn": "Anh ấy thích đọc sách tiếng Trung."}, {"hanzi": "开", "pinyin": "kāi", "meaning": "lái", "lesson": "14", "type": "Danh từ", "ex_cn": "他开出租车。", "ex_py": "Tā kāi chūzūchē.", "ex_vn": "Anh ấy lái xe taxi."}, {"hanzi": "上学", "pinyin": "shàngxué", "meaning": "đi học", "lesson": "14", "type": "Bổ sung 3.0", "ex_cn": "他每天骑自行车上学。", "ex_py": "Tā měitiān qí zìxíngchē shàngxué.", "ex_vn": "Mỗi ngày anh ấy đạp xe đi học."}, {"hanzi": "写", "pinyin": "xiě", "meaning": "viết", "lesson": "14", "type": "Động từ", "ex_cn": "他每天练习写汉字。", "ex_py": "Tā měitiān liànxí xiě Hànzì.", "ex_vn": "Mỗi ngày anh ấy luyện tập viết chữ Hán."}, {"hanzi": "小学", "pinyin": "xiǎoxué", "meaning": "trường tiểu học", "lesson": "14", "type": "Bổ sung 3.0", "ex_cn": "他在小学读书。", "ex_py": "Tā zài xiǎoxué dúshū.", "ex_vn": "Nó đang học ở trường tiểu học."}, {"hanzi": "小学生", "pinyin": "xiǎoxuéshēng", "meaning": "học sinh tiểu học", "lesson": "14", "type": "Bổ sung 3.0", "ex_cn": "我是小学生。", "ex_py": "Wǒ shì xiǎoxuéshēng.", "ex_vn": "Em là học sinh tiểu học."}, {"hanzi": "有的", "pinyin": "yǒude", "meaning": "có cái, có người", "lesson": "14", "type": "Bổ sung 3.0", "ex_cn": "有的人喜欢喝茶，有的人喜欢喝咖啡。", "ex_py": "Yǒude rén xǐhuan hē chá, yǒude rén xǐhuan hē kāfēi.", "ex_vn": "Có người thích uống trà, có người thích uống cà phê."}, {"hanzi": "有些", "pinyin": "yǒuxiē", "meaning": "có một số", "lesson": "14", "type": "Bổ sung 3.0", "ex_cn": "桌子上有些书和本子。", "ex_py": "Zhuōzi shàng yǒu xiē shū hé běnzi.", "ex_vn": "Trên bàn có một số sách và vở."}, {"hanzi": "中午", "pinyin": "zhōngwǔ", "meaning": "buổi trưa", "lesson": "14", "type": "Danh từ", "ex_cn": "我中午十二点吃午饭。", "ex_py": "Wǒ zhōngwǔ shí'èr diǎn chī wǔfàn.", "ex_vn": "Tôi ăn cơm trưa lúc 12 giờ."}, {"hanzi": "中学", "pinyin": "zhōngxué", "meaning": "trường trung học", "lesson": "14", "type": "Bổ sung 3.0", "ex_cn": "他在一所中学教书。", "ex_py": "Tā zài yì suǒ zhōngxué jiāoshū.", "ex_vn": "Anh ấy dạy học ở một trường trung học."}, {"hanzi": "中学生", "pinyin": "zhōngxuéshēng", "meaning": "học sinh trung học", "lesson": "14", "type": "Bổ sung 3.0", "ex_cn": "中学生都喜欢玩儿手机。", "ex_py": "Zhōngxuéshēng dōu xǐhuan wánr shǒujī.", "ex_vn": "Học sinh trung học đều thích chơi điện thoại."}, {"hanzi": "字", "pinyin": "zì", "meaning": "chữ", "lesson": "14", "type": "Danh từ", "ex_cn": "你会写字吗？", "ex_py": "Nǐ huì xiě zì ma?", "ex_vn": "Bạn biết viết chữ không?"}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
