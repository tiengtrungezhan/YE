<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 2 3.0 Bài 5</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk2.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 5</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "快", "pinyin": "kuài", "meaning": "nhanh, mau", "lesson": "5", "type": "Tính từ / Phó từ", "ex_cn": "你快来看，这个电影很有意思。", "ex_py": "Nǐ kuài lái kàn, zhè ge diànyǐng hěn yǒu yìsi.", "ex_vn": "Bạn mau đến xem này, bộ phim này rất hay."}, {"hanzi": "下来", "pinyin": "xiàlái", "meaning": "đi xuống, xuống đây", "lesson": "5", "type": "Động từ", "ex_cn": "你快下来，我们在下面等你。", "ex_py": "Nǐ kuài xiàlái, wǒmen zài xiàmiàn děng nǐ.", "ex_vn": "Bạn mau xuống đây đi, chúng tôi ở dưới chờ bạn."}, {"hanzi": "上来", "pinyin": "shànglái", "meaning": "đi lên, lên đây", "lesson": "5", "type": "Động từ", "ex_cn": "老师在上面，你快上来吧。", "ex_py": "Lǎoshī zài shàngmiàn, nǐ kuài shànglái ba.", "ex_vn": "Thầy giáo ở bên trên, bạn mau lên đây đi."}, {"hanzi": "上去", "pinyin": "shàngqù", "meaning": "đi lên, lên trên", "lesson": "5", "type": "Động từ", "ex_cn": "我不上去了，在教室门口等你。", "ex_py": "Wǒ bú shàngqù le, zài jiàoshì ménkǒu děng nǐ.", "ex_vn": "Tôi không đi lên nữa, ở cổng phòng học chờ bạn."}, {"hanzi": "下面", "pinyin": "xiàmiàn", "meaning": "bên dưới, dưới", "lesson": "5", "type": "Danh từ", "ex_cn": "桌子下面有一个黑色的书包。", "ex_py": "Zhuōzi xiàmiàn yǒu yí gè hēisè de shūbāo.", "ex_vn": "Dưới cái bàn có một chiếc cặp sách màu đen."}, {"hanzi": "等", "pinyin": "děng", "meaning": "đợi, chờ", "lesson": "5", "type": "Động từ", "ex_cn": "请等一下，我去买两杯水。", "ex_py": "Qǐng děng yíxià, wǒ qù mǎi liǎng bēi shuǐ.", "ex_vn": "Xin đợi một chút, tôi đi mua hai ly nước."}, {"hanzi": "一会儿", "pinyin": "yíhuìr", "meaning": "một lúc, một lát", "lesson": "5", "type": "Danh từ / Phó từ", "ex_cn": "工作太累了，你休息一会儿吧。", "ex_py": "Gōngzuò tài lèi le, nǐ xiūxi yíhuìr ba.", "ex_vn": "Công việc mệt quá rồi, bạn nghỉ ngơi một lúc đi."}, {"hanzi": "下去", "pinyin": "xiàqù", "meaning": "đi xuống", "lesson": "5", "type": "Động từ", "ex_cn": "我一会儿就下去找你。", "ex_py": "Wǒ yíhuìr jiù xiàqù zhǎo nǐ.", "ex_vn": "Một lát nữa tôi sẽ đi xuống tìm bạn."}, {"hanzi": "进来", "pinyin": "jìnlái", "meaning": "đi vào, vào đây", "lesson": "5", "type": "Động từ", "ex_cn": "外面很冷，快进来喝杯热茶吧。", "ex_py": "Wàimiàn hěn lěng, kuài jìnlái hē bēi rè chá ba.", "ex_vn": "Bên ngoài rất lạnh, mau vào đây uống ly trà nóng đi."}, {"hanzi": "爷爷", "pinyin": "yéye", "meaning": "ông nội", "lesson": "5", "type": "Danh từ", "ex_cn": "我爷爷今年七十岁了。", "ex_py": "Wǒ yéye jīnián qīshí suì le.", "ex_vn": "Ông nội tôi năm nay 70 tuổi rồi."}, {"hanzi": "奶奶", "pinyin": "nǎinai", "meaning": "bà nội", "lesson": "5", "type": "Danh từ", "ex_cn": "我奶奶喜欢喝中国茶。", "ex_py": "Wǒ nǎinai xǐhuan hē Zhōngguó chá.", "ex_vn": "Bà nội tôi thích uống trà Trung Quốc."}, {"hanzi": "礼物", "pinyin": "lǐwù", "meaning": "món quà, quà", "lesson": "5", "type": "Danh từ", "ex_cn": "这个书包是我送你的生日礼物。", "ex_py": "Zhè ge shūbāo shì wǒ sòng nǐ de shēngrì lǐwù.", "ex_vn": "Chiếc cặp sách này là món quà sinh nhật tôi tặng bạn."}, {"hanzi": "准备", "pinyin": "zhǔnbèi", "meaning": "chuẩn bị", "lesson": "5", "type": "Động từ", "ex_cn": "这是给孩子们准备的礼物。", "ex_py": "Zhè shì gěi háizimen zhǔnbèi de lǐwù.", "ex_vn": "Đây là món quà chuẩn bị cho bọn trẻ."}, {"hanzi": "奶茶", "pinyin": "nǎichá", "meaning": "trà sữa", "lesson": "5", "type": "Danh từ", "ex_cn": "我想去买一杯奶茶。", "ex_py": "Wǒ xiǎng qù mǎi yì bēi nǎichá.", "ex_vn": "Tôi muốn đi mua một ly trà sữa."}, {"hanzi": "跟", "pinyin": "gēn", "meaning": "cùng, với, theo", "lesson": "5", "type": "Giới từ / Động từ", "ex_cn": "我想跟你一起去北京旅游。", "ex_py": "Wǒ xiǎng gēn nǐ yìqǐ qù Běijīng lǚyóu.", "ex_vn": "Tôi muốn cùng bạn đi Bắc Kinh du lịch."}, {"hanzi": "走", "pinyin": "zǒu", "meaning": "đi, đi bộ", "lesson": "5", "type": "Động từ", "ex_cn": "我们吃完饭是走回酒店的。", "ex_py": "Wǒmen chī wán fàn shì zǒu huí jiǔdiàn de.", "ex_vn": "Chúng tôi ăn cơm xong là đi bộ về khách sạn."}, {"hanzi": "酒店", "pinyin": "jiǔdiàn", "meaning": "khách sạn", "lesson": "5", "type": "Danh từ", "ex_cn": "这家酒店离车站很近。", "ex_py": "Zhè jiā jiǔdiàn lí chēzhàn hěn jìn.", "ex_vn": "Khách sạn này cách bến xe rất gần."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
