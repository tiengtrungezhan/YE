<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Truy Tìm Cặp Đôi - HSK 1 3.0 Bài 16</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>

ng": "Chủ nhật", "type": "Danh từ", "ex_cn": "星期天去超市。", "ex_py": "Xīngqītiān qù chāoshì.", "ex_vn": "Chủ nhật đi siêu thị.", "lesson": "16"}, {"hanzi": "好看", "pinyin": "hǎokàn", "meaning": "đẹp (nhìn)", "type": "Tính từ", "ex_cn": "那本书很好看。", "ex_py": "Nà běn shū hěn hǎokàn.", "ex_vn": "Cuốn sách đó rất hay.", "lesson": "16"}, {"hanzi": "好听", "pinyin": "hǎotīng", "meaning": "hay (nghe)", "type": "Tính từ", "ex_cn": "这首歌很好听。", "ex_py": "Zhè shǒu gē hěn hǎotīng.", "ex_vn": "Bài hát này rất hay.", "lesson": "16"}, {"hanzi": "好玩儿", "pinyin": "hǎowánr", "meaning": "vui, hay (chơi)", "type": "Tính từ", "ex_cn": "这里很好玩儿。", "ex_py": "Zhèlǐ hěn hǎowánr.", "ex_vn": "Chỗ này rất vui.", "lesson": "16"}, {"hanzi": "雨", "pinyin": "yǔ", "meaning": "mưa", "type": "Danh từ", "ex_cn": "外边在下雨。", "ex_py": "Wàibian zài xià yǔ.", "ex_vn": "Bên ngoài đang mưa.", "lesson": "16"}, {"hanzi": "电话", "pinyin": "diànhuà", "meaning": "điện thoại", "type": "Danh từ", "ex_cn": "那是我的电话。", "ex_py": "Nà shì wǒ de diànhuà.", "ex_vn": "Đó là điện thoại của tôi.", "lesson": "16"}, {"hanzi": "睡", "pinyin": "shuì", "meaning": "ngủ", "type": "Động từ", "ex_cn": "我要去睡觉了。", "ex_py": "Wǒ yào qù shuìjiào le.", "ex_vn": "Tôi đi ngủ đây.", "lesson": "16"}, {"hanzi": "做饭", "pinyin": "zuò fàn", "meaning": "nấu cơm", "type": "Động từ", "ex_cn": "妈妈在做饭。", "ex_py": "Māma zài zuò fàn.", "ex_vn": "Mẹ đang nấu cơm.", "lesson": "16"}, {"hanzi": "见", "pinyin": "jiàn", "meaning": "gặp", "type": "Động từ", "ex_cn": "明天见。", "ex_py": "Míngtiān jiàn.", "ex_vn": "Hẹn gặp lại vào ngày mai.", "lesson": "16"}, {"hanzi": "有的", "pinyin": "yǒude", "meaning": "có cái, có người", "type": "Đại từ", "ex_cn": "有的人喜欢喝茶。", "ex_py": "Yǒude rén xǐhuan hē chá.", "ex_vn": "Có người thích uống trà.", "lesson": "16"}, {"hanzi": "有些", "pinyin": "yǒuxiē", "meaning": "có một số", "type": "Số từ", "ex_cn": "有些东西在那儿。", "ex_py": "Yǒuxiē dōngxi zài nàr.", "ex_vn": "Có một số đồ ở đằng kia.", "lesson": "16"}, {"hanzi": "有点儿", "pinyin": "yǒudiǎnr", "meaning": "có chút", "type": "Phó từ", "ex_cn": "这件衣服有点儿大。", "ex_py": "Zhè jiàn yīfu yǒudiǎnr dà.", "ex_vn": "Chiếc áo này hơi rộng một chút.", "lesson": "16"}, {"hanzi": "病", "pinyin": "bìng", "meaning": "bệnh, ốm", "type": "Danh từ/Động từ", "ex_cn": "他生病了。", "ex_py": "Tā shēngbìng le.", "ex_vn": "Anh ấy bị ốm rồi.", "lesson": "16"}, {"hanzi": "车", "pinyin": "chē", "meaning": "xe", "type": "Danh từ", "ex_cn": "那是他的车。", "ex_py": "Nà shì tā de chē.", "ex_vn": "Đó là xe của anh ấy.", "lesson": "16"}, {"hanzi": "火车", "pinyin": "huǒchē", "meaning": "tàu hỏa", "type": "Danh từ", "ex_cn": "坐火车去上海。", "ex_py": "坐火车去上海。", "ex_vn": "Đi tàu hỏa đến Thượng Hải.", "lesson": "16"}, {"hanzi": "开车", "pinyin": "kāi chē", "meaning": "lái xe", "type": "Động từ", "ex_cn": "你会开车吗？", "ex_py": "Nǐ huì kāi chē ma?", "ex_vn": "Bạn biết lái xe không?", "lesson": "16"}, {"hanzi": "看病", "pinyin": "kànbìng", "meaning": "khám bệnh", "type": "Động từ", "ex_cn": "他去医院看病了。", "ex_py": "Tā qù yīyuàn kànbìng le.", "ex_vn": "Anh ấy đi bệnh viện khám bệnh rồi.", "lesson": "16"}, {"hanzi": "上課", "pinyin": "shàngkè", "meaning": "lên lớp", "type": "Động từ", "ex_cn": "我们八点上课。", "ex_py": "Wǒmen bā diǎn shàngkè.", "ex_vn": "Chúng tôi lên lớp lúc 8 giờ.", "lesson": "16"}, {"hanzi": "上学", "pinyin": "shàngxué", "meaning": "đi học", "type": "Động từ", "ex_cn": "他每天都上学。", "ex_py": "Tā měitiān dōu shàngxué.", "ex_vn": "Nó đi học mỗi ngày.", "lesson": "16"}, {"hanzi": "下班", "pinyin": "xiàbān", "meaning": "tan làm", "type": "Động từ", "ex_cn": "我五点下班。", "ex_py": "Wǒ wǔ diǎn xiàbān.", "ex_vn": "Tôi tan làm lúc 5 giờ.", "lesson": "16"}, {"hanzi": "下课", "pinyin": "xiàkè", "meaning": "tan học", "type": "Động từ", "ex_cn": "下课后去吃饭。", "ex_py": "Xiàkè hòu qù chī fàn.", "ex_vn": "Sau khi tan học thì đi ăn.", "lesson": "16"}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
