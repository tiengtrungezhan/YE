<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 2 3.0 Bài 8</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk2.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 8</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "再", "pinyin": "zài", "meaning": "lại, tiếp tục", "lesson": "8", "type": "Danh từ", "ex_cn": "再见。", "ex_py": "Zàijiàn.", "ex_vn": "Tạm biệt."}, {"hanzi": "让", "pinyin": "ràng", "meaning": "để, cho phép", "lesson": "8", "type": "Động từ", "ex_cn": "让他去。", "ex_py": "Ràng tā qù.", "ex_vn": "Để anh ấy đi."}, {"hanzi": "告诉", "pinyin": "gàosu", "meaning": "nói cho biết", "lesson": "8", "type": "Động từ", "ex_cn": "告诉我。", "ex_py": "Gàosu wǒ.", "ex_vn": "Nói cho tôi biết."}, {"hanzi": "等", "pinyin": "děng", "meaning": "đợi", "lesson": "8", "type": "Động từ", "ex_cn": "等我一下。", "ex_py": "Děng wǒ yíxià.", "ex_vn": "Đợi tôi một chút."}, {"hanzi": "找", "pinyin": "zhǎo", "meaning": "tìm", "lesson": "8", "type": "Động từ", "ex_cn": "我找你。", "ex_py": "Wǒ zhǎo nǐ.", "ex_vn": "Tôi tìm bạn."}, {"hanzi": "事情", "pinyin": "shìqing", "meaning": "sự việc", "lesson": "8", "type": "Danh từ", "ex_cn": "什么事情？", "ex_py": "Shénme shìqing?", "ex_vn": "Chuyện gì vậy?"}, {"hanzi": "服务员", "pinyin": "fúwùyuán", "meaning": "nhân viên phục vụ", "lesson": "8", "type": "Danh từ", "ex_cn": "他是服务员。", "ex_py": "Tā shì fúwùyuán.", "ex_vn": "Anh ấy là phục vụ viên."}, {"hanzi": "白", "pinyin": "bái", "meaning": "trắng", "lesson": "8", "type": "Tính từ", "ex_cn": "它是白色的。", "ex_py": "Tā shì báisè de.", "ex_vn": "Nó màu trắng."}, {"hanzi": "黑", "pinyin": "hēi", "meaning": "đen", "lesson": "8", "type": "Tính từ", "ex_cn": "它是黑色的。", "ex_py": "Tā shì hēisè de.", "ex_vn": "Nó màu đen."}, {"hanzi": "贵", "pinyin": "guì", "meaning": "đắt", "lesson": "8", "type": "Tính từ", "ex_cn": "这个东西很贵。", "ex_py": "Zhè ge dōngxi hěn guì.", "ex_vn": "Món đồ này rất đắt."}, {"hanzi": "打开", "pinyin": "dǎkāi", "meaning": "mở ra", "lesson": "8", "type": "Bổ sung 3.0", "ex_cn": "请把书打开。", "ex_py": "Qǐng bǎ shū dǎkāi.", "ex_vn": "Mời mở sách ra."}, {"hanzi": "飞", "pinyin": "fēi", "meaning": "bay", "lesson": "8", "type": "Bổ sung 3.0", "ex_cn": "小鸟在飞。", "ex_py": "Xiǎoniǎo zài fēi.", "ex_vn": "Con chim đang bay."}, {"hanzi": "白色", "pinyin": "báisè", "meaning": "màu trắng", "lesson": "8", "type": "Bổ sung 3.0", "ex_cn": "他喜欢白色的衣服。", "ex_py": "Tā xǐhuan báisè de yīfu.", "ex_vn": "Anh ấy thích quần áo màu trắng."}, {"hanzi": "黑色", "pinyin": "hēisè", "meaning": "màu đen", "lesson": "8", "type": "Bổ sung 3.0", "ex_cn": "那是黑色的车。", "ex_py": "Nà shì hēisè de chē.", "ex_vn": "Đó là chiếc xe màu đen."}, {"hanzi": "快要", "pinyin": "kuàiyào", "meaning": "sắp sửa", "lesson": "8", "type": "Bổ sung 3.0", "ex_cn": "快要下雨了。", "ex_py": "Kuàiyào xià yǔ le.", "ex_vn": "Sắp mưa rồi."}, {"hanzi": "上去", "pinyin": "shàngqù", "meaning": "lên trên", "lesson": "8", "type": "Bổ sung 3.0", "ex_cn": "我们在楼下等你，你快上去吧。", "ex_py": "Wǒmen zài lóuxià děng nǐ, nǐ kuài shàngqù ba.", "ex_vn": "Chúng tôi đợi bạn ở dưới lầu, bạn mau lên đi."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
