<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 1 3.0 Bài 11</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk1.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 11</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "电影", "pinyin": "diànyǐng", "meaning": "phim", "lesson": "11", "type": "Danh từ", "ex_cn": "明天我会跟姐姐去电影院看电影。", "ex_py": "Míngtiān wǒ huì gēn jiějie qù diànyǐngyuàn kàn diànyǐng.", "ex_vn": "Ngày mai tôi sẽ đi rạp chiếu phim xem phim cùng chị gái."}, {"hanzi": "点", "pinyin": "diǎn", "meaning": "giờ", "lesson": "11", "type": "Danh từ", "ex_cn": "现在下午三点。", "ex_py": "Xiànzài xiàwǔ sān diǎn.", "ex_vn": "Bây giờ là 3 giờ chiều."}, {"hanzi": "回", "pinyin": "huí", "meaning": "về", "lesson": "11", "type": "Danh từ", "ex_cn": "太晚了，我要回家了。", "ex_py": "Tài wǎn le, wǒ yào huí jiā le.", "ex_vn": "Muộn quá rồi, tôi phải về nhà thôi."}, {"hanzi": "明天", "pinyin": "míngtiān", "meaning": "ngày mai", "lesson": "11", "type": "Danh từ", "ex_cn": "明天去学校。", "ex_py": "Míngtiān qù xuéxiào.", "ex_vn": "Ngày mai đi đến trường."}, {"hanzi": "年", "pinyin": "nián", "meaning": "năm", "lesson": "11", "type": "Danh từ", "ex_cn": "二零二零年。", "ex_py": "Èr líng èr líng nián.", "ex_vn": "Năm 2020."}, {"hanzi": "上午", "pinyin": "shàngwǔ", "meaning": "buổi sáng", "lesson": "11", "type": "Danh từ", "ex_cn": "我每天上午九点上班。", "ex_py": "Wǒ měitiān shàngwǔ jiǔ diǎn shàngbān.", "ex_vn": "Tôi đi làm lúc 9 giờ sáng mỗi ngày."}, {"hanzi": "时候", "pinyin": "shíhou", "meaning": "lúc, khi", "lesson": "11", "type": "Danh từ", "ex_cn": "你什么时候去中国？", "ex_py": "Nǐ shénme shíhou qù Zhōngguó?", "ex_vn": "Bạn sẽ đi Trung Quốc vào lúc nào?"}, {"hanzi": "现在", "pinyin": "xiànzài", "meaning": "bây giờ, hiện tại", "lesson": "11", "type": "Giới từ", "ex_cn": "现在是下午两点，我们开始上课。", "ex_py": "Xiànzài shì xiàwǔ liǎng diǎn, wǒmen kāishǐ shàngkè.", "ex_vn": "Bây giờ là hai giờ chiều, chúng ta bắt đầu học."}, {"hanzi": "住", "pinyin": "zhù", "meaning": "ở, cư trú", "lesson": "11", "type": "Động từ", "ex_cn": "你在哪儿住？", "ex_py": "Nǐ zài nǎr zhù?", "ex_vn": "Bạn sống ở đâu?"}, {"hanzi": "中午", "pinyin": "zhōngwǔ", "meaning": "buổi trưa", "lesson": "11", "type": "Danh từ", "ex_cn": "我中午十二点吃午饭。", "ex_py": "Wǒ zhōngwǔ shí'èr diǎn chī wǔfàn.", "ex_vn": "Tôi ăn cơm trưa lúc 12 giờ."}, {"hanzi": "昨天", "pinyin": "zuótiān", "meaning": "hôm qua", "lesson": "11", "type": "Danh từ", "ex_cn": "昨天星期三。", "ex_py": "Zuótiān xīngqīsān.", "ex_vn": "Hôm qua là thứ Tư."}, {"hanzi": "分", "pinyin": "fēn", "meaning": "phút", "lesson": "11", "type": "Bổ sung 3.0", "ex_cn": "现在下午三点五分。", "ex_py": "Xiànzài xiàwǔ sān diǎn wǔ fēn.", "ex_vn": "Bây giờ là 3 giờ 5 phút chiều."}, {"hanzi": "早上", "pinyin": "zǎo", "meaning": "sớm, buổi sáng", "lesson": "11", "type": "Bổ sung 3.0", "ex_cn": "我每天早上六点起床。", "ex_py": "Wǒ měitiān zǎoshang liù diǎn qǐchuáng.", "ex_vn": "Mỗi ngày tôi thức dậy lúc 6 giờ sáng."}, {"hanzi": "早饭", "pinyin": "zǎofàn", "meaning": "bữa sáng", "lesson": "11", "type": "Bổ sung 3.0", "ex_cn": "你吃早饭了吗？", "ex_py": "Nǐ chī zǎofàn le ma?", "ex_vn": "Bạn đã ăn sáng chưa?"}, {"hanzi": "午饭", "pinyin": "wǔfàn", "meaning": "bữa trưa", "lesson": "11", "type": "Bổ sung 3.0", "ex_cn": "我想回家吃午饭。", "ex_py": "Wǒ xiǎng huíjiā chī wǔfàn.", "ex_vn": "Tôi muốn về nhà ăn trưa."}, {"hanzi": "晚上", "pinyin": "wǎn", "meaning": "muộn, buổi tối", "lesson": "11", "type": "Bổ sung 3.0", "ex_cn": "我昨天晚上十一点睡觉。", "ex_py": "Wǒ zuótiān wǎnshang shíyī diǎn shuìjiào.", "ex_vn": "Hôm qua tôi ngủ lúc 11 giờ đêm."}, {"hanzi": "晚饭", "pinyin": "wǎnfàn", "meaning": "bữa tối", "lesson": "11", "type": "Bổ sung 3.0", "ex_cn": "他今天不想吃晚饭。", "ex_py": "Tā jīntiān bù xiǎng chī wǎnfàn.", "ex_vn": "Hôm nay anh ấy không muốn ăn tối."}, {"hanzi": "星期日", "pinyin": "xīngqīrì", "meaning": "Chủ nhật", "lesson": "11", "type": "Bổ sung 3.0", "ex_cn": "星期日我不工作。", "ex_py": "Xīngqīrì wǒ bù gōngzuò.", "ex_vn": "Chủ nhật tôi không đi làm."}, {"hanzi": "星期天", "pinyin": "xīngqītiān", "meaning": "Chủ nhật", "lesson": "11", "type": "Bổ sung 3.0", "ex_cn": "我每星期天都去超市。", "ex_py": "Wǒ měi xīngqītiān dōu qù chāoshì.", "ex_vn": "Mỗi chủ nhật tôi đều đi siêu thị."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
