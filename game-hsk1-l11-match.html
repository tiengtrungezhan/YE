<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 1 3.0 Bài 11</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk1.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 11</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "时候", "pinyin": "shíhou", "meaning": "lúc, khi (thời gian)", "lesson": "11", "type": "danh từ", "ex_cn": "弟弟吃饭的时候喜欢玩手机。", "ex_py": "Dìdi chī fàn de shíhou xǐhuan wán shǒujī.", "ex_vn": "Em trai vừa ăn cơm vừa thích nghịch điện thoại."}, {"hanzi": "饭店", "pinyin": "fàndiàn", "meaning": "nhà hàng, quán ăn, khách sạn", "lesson": "11", "type": "danh từ", "ex_cn": "这个饭店的菜很好吃。", "ex_py": "Zhè ge fàndiàn de cài hěn hǎochī.", "ex_vn": "Món ăn của nhà hàng này rất ngon."}, {"hanzi": "知道", "pinyin": "zhīdào", "meaning": "biết", "lesson": "11", "type": "động từ", "ex_cn": "你知道他的名字吗？", "ex_py": "Nǐ zhīdào tā de míngzi ma?", "ex_vn": "Bạn có biết tên của anh ấy không?"}, {"hanzi": "正在", "pinyin": "zhèngzài", "meaning": "đang (chỉ hành động đang diễn ra)", "lesson": "11", "type": "phó từ", "ex_cn": "我正在看书。", "ex_py": "Wǒ zhèngzài kàn shū.", "ex_vn": "Tôi đang đọc sách."}, {"hanzi": "那里", "pinyin": "nàli", "meaning": "chỗ đó, nơi đó, đằng kia", "lesson": "11", "type": "đại từ chỉ nơi chốn", "ex_cn": "我们去那里吧。", "ex_py": "Wǒmen qù nàli ba.", "ex_vn": "Chúng ta đến đó đi nhé."}, {"hanzi": "找", "pinyin": "zhǎo", "meaning": "tìm, kiếm", "lesson": "11", "type": "động từ", "ex_cn": "我在找我的手机呢。", "ex_py": "Wǒ zài zhǎo wǒ de shǒujī ne.", "ex_vn": "Tôi đang tìm điện thoại của mình đây."}, {"hanzi": "开车", "pinyin": "kāichē", "meaning": "lái xe", "lesson": "11", "type": "động từ", "ex_cn": "你会开车吗？", "ex_py": "Nǐ huì kāichē ma?", "ex_vn": "Bạn biết lái xe không?"}, {"hanzi": "读", "pinyin": "dú", "meaning": "học, theo học (đại học)", "lesson": "11", "type": "động từ", "ex_cn": "我在读大学。", "ex_py": "Wǒ zài dú dàxué.", "ex_vn": "Tôi đang học đại học."}, {"hanzi": "大学", "pinyin": "dàxué", "meaning": "trường đại học", "lesson": "11", "type": "danh từ", "ex_cn": "你在什么大学学习？", "ex_py": "Nǐ zài shénme dàxué xuéxí?", "ex_vn": "Bạn đang học ở trường đại học nào?"}, {"hanzi": "医", "pinyin": "yī", "meaning": "y học, ngành y", "lesson": "11", "type": "danh từ", "ex_cn": "我在学医。", "ex_py": "Wǒ zài xué yī.", "ex_vn": "Tôi đang học y."}, {"hanzi": "哪里", "pinyin": "nǎli", "meaning": "đâu, ở đâu", "lesson": "11", "type": "đại từ nghi vấn", "ex_cn": "你在哪里？", "ex_py": "Nǐ zài nǎli?", "ex_vn": "Bạn ở đâu vậy?"}, {"hanzi": "说", "pinyin": "shuō", "meaning": "nói", "lesson": "11", "type": "động từ", "ex_cn": "你说什么？", "ex_py": "Nǐ shuō shénme?", "ex_vn": "Bạn nói gì cơ?"}, {"hanzi": "对", "pinyin": "duì", "meaning": "với, đối với", "lesson": "11", "type": "giới từ", "ex_cn": "医生对你说什么？", "ex_py": "Yīshēng duì nǐ shuō shénme?", "ex_vn": "Bác sĩ đã nói gì với bạn?"}, {"hanzi": "要", "pinyin": "yào", "meaning": "muốn, cần, phải", "lesson": "11", "type": "động từ năng nguyện", "ex_cn": "我要和小朋友玩儿。", "ex_py": "Wǒ yào hé xiǎopéngyou wánr.", "ex_vn": "Tôi muốn chơi với các bé nhỏ."}, {"hanzi": "大学生", "pinyin": "dàxuéshēng", "meaning": "sinh viên đại học", "lesson": "11", "type": "danh từ", "ex_cn": "我们都是大学生。", "ex_py": "Wǒmen dōu shì dàxuéshēng.", "ex_vn": "Chúng tôi đều là sinh viên đại học."}, {"hanzi": "起床", "pinyin": "qǐchuáng", "meaning": "thức dậy, rời giường", "lesson": "11", "type": "động từ", "ex_cn": "弟弟还没起床。", "ex_py": "Dìdi hái méi qǐchuáng.", "ex_vn": "Em trai vẫn chưa dậy."}, {"hanzi": "睡觉", "pinyin": "shuìjiào", "meaning": "ngủ, đi ngủ", "lesson": "11", "type": "động từ", "ex_cn": "他还在睡觉呢。", "ex_py": "Tā hái zài shuìjiào ne.", "ex_vn": "Cậu ấy vẫn đang ngủ đấy."}, {"hanzi": "睡", "pinyin": "shuì", "meaning": "ngủ", "lesson": "11", "type": "động từ", "ex_cn": "你睡了吗？", "ex_py": "Nǐ shuì le ma?", "ex_vn": "Bạn đã ngủ chưa?"}, {"hanzi": "小朋友", "pinyin": "xiǎopéngyou", "meaning": "em nhỏ, bé nhỏ, bạn nhỏ", "lesson": "11", "type": "danh từ", "ex_cn": "我喜欢和小朋友玩儿。", "ex_py": "Wǒ xǐhuan hé xiǎopéngyou wánr.", "ex_vn": "Tôi thích chơi với các bé nhỏ."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
