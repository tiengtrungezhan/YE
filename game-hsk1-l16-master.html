    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-wrapper { max-width: 600px; margin: 0 auto; padding: 2rem; text-align: center; }
        .quiz-card { background: var(--white); border-radius: 30px; padding: 3rem 2rem; box-shadow: var(--shadow); margin-top: 2rem; min-height: 450px; display: flex; flex-direction: column; justify-content: center; position: relative; }
        .progress-container { width: 100%; height: 8px; background: #eee; border-radius: 4px; margin-bottom: 2rem; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary-color); width: 0%; transition: width 0.3s; }
        .question-text { font-size: 1.5rem; font-weight: 700; color: var(--text-color); margin-bottom: 1rem; }
        .sub-text { font-size: 1.1rem; color: #666; margin-bottom: 2rem; line-height: 1.6; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
        .option-btn { padding: 1.2rem; background: #f8fbfe; border: 2px solid #eef2f5; border-radius: 15px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .option-btn:hover:not(:disabled) { border-color: var(--primary-color); background: #f0f7f9; }
        .option-btn.correct { background: #d4edda !important; border-color: #28a745 !important; color: #155724 !important; }
        .option-btn.wrong { background: #f8d7da !important; border-color: #dc3545 !important; color: #721c24 !important; }
        .typing-input { width: 100%; padding: 1.2rem; border: 2px solid #ddd; border-radius: 15px; font-size: 1.4rem; text-align: center; margin-bottom: 1.5rem; transition: 0.3s; }
        .typing-input:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 10px rgba(255,107,107,0.1); }
        .submit-btn { padding: 1.2rem; background: var(--primary-color); color: white; border: none; border-radius: 15px; font-weight: 700; font-size: 1.1rem; cursor: pointer; width: 100%; transition: 0.3s; }
        .submit-btn:hover { background: var(--primary-dark); transform: translateY(-2px); }
        .phrase-box { display: flex; flex-wrap: wrap; gap: 0.8rem; justify-content: center; margin: 1.5rem 0; min-height: 80px; padding: 1rem; border: 2px dashed #ffe4e6; border-radius: 20px; background: #fffafb; }
        .phrase-item { padding: 0.8rem 1.2rem; background: white; border: 2px solid #ffccd5; border-radius: 12px; cursor: pointer; font-size: 1.2rem; font-weight: 600; color: #e91e63; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .phrase-item:hover { background: #fff0f3; transform: scale(1.05); }
        .blank-text { font-size: 1.8rem; letter-spacing: 2px; color: var(--text-color); margin-bottom: 2rem; font-weight: bold; }
        .blank-fill { color: var(--primary-color); border-bottom: 3px solid var(--primary-color); padding: 0 10px; min-width: 60px; display: inline-block; }
        .result-screen { display: none; }
        .score-circle { width: 150px; height: 150px; border-radius: 50%; border: 10px solid var(--primary-light); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 800; margin: 2rem auto; color: var(--primary-dark); }
    </style>

    <script>
        const vocabulary = [{"hanzi": "白天", "pinyin": "báitiān", "meaning": "ban ngày", "type": "Danh từ", "ex_cn": "白天我去学校。", "ex_py": "Báitiān wǒ qù xuéxiào.", "ex_vn": "Ban ngày tôi đến trường.", "lesson": "16"}, {"hanzi": "你好", "pinyin": "nǐ hǎo", "meaning": "chào bạn", "type": "Cụm từ", "ex_cn": "你好！很高兴认识你。", "ex_py": "Nǐ hǎo! Hěn gāoxìng rènshi nǐ.", "ex_vn": "Chào bạn! Rất vui được quen biết bạn.", "lesson": "16"}, {"hanzi": "不要", "pinyin": "búyào", "meaning": "đừng, không muốn", "type": "Phó từ", "ex_cn": "不要去那里。", "ex_py": "Búyào qù nàr.", "ex_vn": "Đừng đi đến đó.", "lesson": "16"}, {"hanzi": "事", "pinyin": "shì", "meaning": "việc, chuyện", "type": "Danh từ", "ex_cn": "你有什么事？", "ex_py": "Nǐ yǒu shénme shì?", "ex_vn": "Bạn có việc gì không?", "lesson": "16"}, {"hanzi": "们", "pinyin": "men", "meaning": "các (số nhiều)", "type": "Trợ từ", "ex_cn": "我们都是学生。", "ex_py": "Wǒmen dōu shì xuésheng.", "ex_vn": "Chúng tôi đều là học sinh.", "lesson": "16"}, {"hanzi": "国", "pinyin": "guó", "meaning": "nước, quốc gia", "type": "Danh từ", "ex_cn": "你是哪国人？", "ex_py": "Nǐ shì nǎ guó rén?", "ex_vn": "Bạn là người nước nào?", "lesson": "16"}, {"hanzi": "它们", "pinyin": "tāmen", "meaning": "chúng nó (vật)", "type": "Đại từ", "ex_cn": "它们在那儿。", "ex_py": "Tāmen zài nàr.", "ex_vn": "Chúng nó ở đằng kia.", "lesson": "16"}, {"hanzi": "中文", "pinyin": "Zhōngwén", "meaning": "tiếng Trung", "type": "Danh từ", "ex_cn": "我会说中文。", "ex_py": "Wǒ huì shuō Zhōngwén.", "ex_vn": "Tôi biết nói tiếng Trung.", "lesson": "16"}, {"hanzi": "家人", "pinyin": "jiārén", "meaning": "người nhà", "type": "Danh từ", "ex_cn": "我的家人都在越南。", "ex_py": "Wǒ de jiārén dōu zài Yuènán.", "ex_vn": "Người nhà của tôi đều ở Việt Nam.", "lesson": "16"}, {"hanzi": "哪个", "pinyin": "nǎ ge", "meaning": "cái nào", "type": "Đại từ", "ex_cn": "你要哪个？", "ex_py": "Nǐ yào nǎ ge?", "ex_vn": "Bạn muốn cái nào?", "lesson": "16"}, {"hanzi": "哪些", "pinyin": "nǎxiē", "meaning": "những cái nào", "type": "Đại từ", "ex_cn": "哪些是你的？", "ex_py": "Nǎxiē shì nǐ de?", "ex_vn": "Những cái nào là của bạn?", "lesson": "16"}, {"hanzi": "女士", "pinyin": "nǚshì", "meaning": "nữ sĩ, quý bà", "type": "Danh từ", "ex_cn": "王女士在哪儿？", "ex_py": "Wáng nǚshì zài nǎr?", "ex_vn": "Bà Vương ở đâu?", "lesson": "16"}, {"hanzi": "一半", "pinyin": "yíbàn", "meaning": "một nửa", "type": "Số từ", "ex_cn": "我吃了一半。", "ex_py": "Wǒ chī le yíbàn.", "ex_vn": "Tôi đã ăn một nửa.", "lesson": "16"}, {"hanzi": "一些", "pinyin": "yìxiē", "meaning": "một số, một vài", "type": "Số từ", "ex_cn": "买一些水果。", "ex_py": "Mǎi yìxiē shuǐguǒ.", "ex_vn": "Mua một ít hoa quả.", "lesson": "16"}, {"hanzi": "唱", "pinyin": "chàng", "meaning": "hát", "type": "Động từ", "ex_cn": "她喜欢唱歌。", "ex_py": "Tā xǐhuan chànggē.", "ex_vn": "Cô ấy thích hát.", "lesson": "16"}, {"hanzi": "歌", "pinyin": "gē", "meaning": "bài hát", "type": "Danh từ", "ex_cn": "这首歌很好听。", "ex_py": "Zhè shǒu gē hěn hǎotīng.", "ex_vn": "Bài hát này rất hay.", "lesson": "16"}, {"hanzi": "读书", "pinyin": "dúshū", "meaning": "đọc sách, đi học", "type": "Động từ", "ex_cn": "他在读书。", "ex_py": "Tā zài dúshū.", "ex_vn": "Anh ấy đang đọc sách.", "lesson": "16"}, {"hanzi": "听见", "pinyin": "tīngjiàn", "meaning": "nghe thấy", "type": "Động từ", "ex_cn": "我听见了。", "ex_py": "Wǒ tīngjiàn le.", "ex_vn": "Tôi nghe thấy rồi.", "lesson": "16"}, {"hanzi": "第", "pinyin": "dì", "meaning": "thứ (thứ tự)", "type": "Trợ từ", "ex_cn": "这是第一。", "ex_py": "Zhè shì dì yī.", "ex_vn": "Đây là thứ nhất.", "lesson": "16"}, {"hanzi": "电影院", "pinyin": "diànyǐngyuàn", "meaning": "rạp chiếu phim", "type": "Danh từ", "ex_cn": "我们在电影院看电影。", "ex_py": "Wǒmen zài diànyǐngyuàn kàn diànyǐng.", "ex_vn": "Chúng tôi xem phim ở rạp.", "lesson": "16"}, {"hanzi": "书店", "pinyin": "shūdiàn", "meaning": "hiệu sách", "type": "Danh từ", "ex_cn": "我去书店买书。", "ex_py": "Wǒ qù shūdiàn mǎi shū.", "ex_vn": "Tôi đi hiệu sách mua sách.", "lesson": "16"}, {"hanzi": "天", "pinyin": "tiān", "meaning": "ngày, trời", "type": "Danh từ", "ex_cn": "那儿的天很好。", "ex_py": "Nàr de tiā ", "meaning": "bạn nhỏ", "type": "Danh từ", "ex_cn": "小朋友们好！", "ex_py": "Xiǎopéngyoumen hǎo!", "ex_vn": "Chào các bạn nhỏ!", "lesson": "16"}, {"hanzi": "小学", "pinyin": "xiǎoxué", "meaning": "trường tiểu học", "type": "Danh từ", "ex_cn": "他在小学读书。", "ex_py": "Tā zài xiǎoxué dúshū.", "ex_vn": "Nó đang học ở trường tiểu học.", "lesson": "16"}, {"hanzi": "小学生", "pinyin": "xiǎoxuéshēng", "meaning": "học sinh tiểu học", "type": "Danh từ", "ex_cn": "我是小学生。", "ex_py": "Wǒ shì xiǎoxuéshēng.", "ex_vn": "Em là học sinh tiểu học.", "lesson": "16"}, {"hanzi": "中学", "pinyin": "zhōngxué", "meaning": "trường trung học", "type": "Danh từ", "ex_cn": "我们学校是中学。", "ex_py": "Wǒmen xuéxiào shì zhōngxué.", "ex_vn": "Trường chúng tôi là trường trung học.", "lesson": "16"}, {"hanzi": "中学生", "pinyin": "zhōngxuésheng", "meaning": "học sinh trung học", "type": "Danh từ", "ex_cn": "中学生都爱看书。", "ex_py": "Zhōngxuésheng dōu ài kàn shū.", "ex_vn": "Học sinh trung học đều thích đọc sách.", "lesson": "16"}, {"hanzi": "大学", "pinyin": "dàxué", "meaning": "trường đại học", "type": "Danh từ", "ex_cn": "她在河内大学。", "ex_py": "Tā zài Hénèi dàxué.", "ex_vn": "Cô ấy học ở trường Đại học Hà Nội.", "lesson": "16"}, {"hanzi": "前", "pinyin": "qián", "meaning": "trước, phía trước", "type": "Danh từ", "ex_cn": "他在我前边。", "ex_py": "Tā zài wǒ qiánbiān.", "ex_vn": "Anh ấy ở phía trước tôi.", "lesson": "16"}, {"hanzi": "后", "pinyin": "hòu", "meaning": "sau, phía sau", "type": "Danh từ", "ex_cn": "学校后边有一家饭店。", "ex_py": "Xuéxiào hòubiān yǒu yì jiā fàndiàn.", "ex_vn": "Phía sau trường học có một nhà hàng.", "lesson": "16"}, {"hanzi": "边", "pinyin": "biān", "meaning": "phía, bên", "type": "Danh từ", "ex_cn": "哪边是东？", "ex_py": "Nǎbiān shì dōng?", "ex_vn": "Phía nào là phía đông?", "lesson": "16"}, {"hanzi": "那边", "pinyin": "nàbiān", "meaning": "phía bên kia", "type": "Danh từ", "ex_cn": "他在那边。", "ex_py": "Tā zài nàbiān.", "ex_vn": "Anh ấy ở phía bên kia.", "lesson": "16"}, {"hanzi": "那里", "pinyin": "nàli", "meaning": "chỗ kia, đằng kia", "type": "Đại từ", "ex_cn": "他在那里买书。", "ex_py": "Tā zài nàli mǎi shū.", "ex_vn": "Anh ấy mua sách ở đằng kia.", "lesson": "16"}, {"hanzi": "这边", "pinyin": "zhèbiān", "meaning": "phía bên này", "type": "Danh từ", "ex_cn": "请走这边。", "ex_py": "Qǐng zǒu zhèbiān.", "ex_vn": "Xin mời đi bên này.", "lesson": "16"}, {"hanzi": "这里", "pinyin": "zhèlǐ", "meaning": "ở đây, chỗ này", "type": "Đại từ", "ex_cn": "这里很好。", "ex_py": "Zhèlǐ hěn hǎo.", "ex_vn": "Ở đây rất tốt.", "lesson": "16"}, {"hanzi": "外边", "pinyin": "wàibian", "meaning": "bên ngoài", "type": "Danh từ", "ex_cn": "外边在下雨。", "ex_py": "Wàibian zài xià yǔ.", "ex_vn": "Bên ngoài trời đang mưa.", "lesson": "16"}, {"hanzi": "分", "pinyin": "fēn", "meaning": "phút", "type": "Lượng từ", "ex_cn": "现在五点十分。", "ex_py": "Xiànzài wǔ diǎn shí fēn.", "ex_vn": "Bây giờ là 5 giờ 10 phút.", "lesson": "16"}, {"hanzi": "早", "pinyin": "zǎo", "meaning": "sớm, buổi sáng", "type": "Tính từ", "ex_cn": "你来得真早。", "ex_py": "Nǐ láide zhēn zǎo.", "ex_vn": "Bạn đến thật sớm.", "lesson": "16"}, {"hanzi": "早饭", "pinyin": "zǎofàn", "meaning": "bữa sáng", "type": "Danh từ", "ex_cn": "你吃早饭了吗？", "ex_py": "Nǐ chī zǎofàn le ma?", "ex_vn": "Bạn đã ăn sáng chưa?", "lesson": "16"}, {"hanzi": "午饭", "pinyin": "wǔfàn", "meaning": "bữa trưa", "type": "Danh từ", "ex_cn": "我想回家吃午饭。", "ex_py": "Wǒ xiǎng huíjiā chī wǔfàn.", "ex_vn": "Tôi muốn về nhà ăn trưa.", "lesson": "16"}, {"hanzi": "晚", "pinyin": "wǎn", "meaning": "muộn, buổi tối", "type": "Tính từ", "ex_cn": "现在不晚。", "ex_py": "Xiànzài bù wǎn.", "ex_vn": "Bây giờ không muộn.", "lesson": "16"}, {"hanzi": "晚饭", "pinyin": "wǎnfàn", "meaning": "bữa tối", "type": "Danh từ", "ex_cn": "晚饭很好吃。", "ex_py": "Wǎnfàn hěn hǎochī.", "ex_vn": "Bữa tối rất ngon.", "lesson": "16"}, {"hanzi": "星期日", "pinyin": "xīngqīrì", "meaning": "Chủ nhật", "type": "Danh từ", "ex_cn": "星期日我不工作。", "ex_py": "Xīngqīrì wǒ bù gōngzuò.", "ex_vn": "Chủ nhật tôi không làm việc.", "lesson": "16"}, {"hanzi": "星期天", "pinyin": "xīngqītiān", "meaning": "Chủ nhật", "type": "Danh từ", "ex_cn": "星期天去超市。", "ex_py": "Xīngqītiān qù chāoshì.", "ex_vn": "Chủ nhật đi siêu thị.", "lesson": "16"}, {"hanzi": "好看", "pinyin": "hǎokàn", "meaning": "đẹp (nhìn)", "type": "Tính từ", "ex_cn": "那本书很好看。", "ex_py": "Nà běn shū hěn hǎokàn.", "ex_vn": "Cuốn sách đó rất hay.", "lesson": "16"}, {"hanzi": "好听", "pinyin": "hǎotīng", "meaning": "hay (nghe)", "type": "Tính từ", "ex_cn": "这首歌很好听。", "ex_py": "Zhè shǒu gē hěn hǎotīng.", "ex_vn": "Bài hát này rất hay.", "lesson": "16"}, {"hanzi": "好玩儿", "pinyin": "hǎowánr", "meaning": "vui, hay (chơi)", "type": "Tính từ", "ex_cn": "这里很好玩儿。", "ex_py": "Zhèlǐ hěn hǎowánr.", "ex_vn": "Chỗ này rất vui.", "lesson": "16"}, {"hanzi": "雨", "pinyin": "yǔ", "meaning": "mưa", "type": "Danh từ", "ex_cn": "外边在下雨。", "ex_py": "Wàibian zài xià yǔ.", "ex_vn": "Bên ngoài đang mưa.", "lesson": "16"}, {"hanzi": "电话", "pinyin": "diànhuà", "meaning": "điện thoại", "type": "Danh từ", "ex_cn": "那是我的电话。", "ex_py": "Nà shì wǒ de diànhuà.", "ex_vn": "Đó là điện thoại của tôi.", "lesson": "16"}, {"hanzi": "睡", "pinyin": "shuì", "meaning": "ngủ", "type": "Động từ", "ex_cn": "我要去睡觉了。", "ex_py": "Wǒ yào qù shuìjiào le.", "ex_vn": "Tôi đi ngủ đây.", "lesson": "16"}, {"hanzi": "做饭", "pinyin": "zuò fàn", "meaning": "nấu cơm", "type": "Động từ", "ex_cn": "妈妈在做饭。", "ex_py": "Māma zài zuò fàn.", "ex_vn": "Mẹ đang nấu cơm.", "lesson": "16"}, {"hanzi": "见", "pinyin": "jiàn", "meaning": "gặp", "type": "Động từ", "ex_cn": "明天见。", "ex_py": "Míngtiān jiàn.", "ex_vn": "Hẹn gặp lại vào ngày mai.", "lesson": "16"}, {"hanzi": "有的", "pinyin": "yǒude", "meaning": "có cái, có người", "type": "Đại từ", "ex_cn": "有的人喜欢喝茶。", "ex_py": "Yǒude rén xǐhuan hē chá.", "ex_vn": "Có người thích uống trà.", "lesson": "16"}, {"hanzi": "有些", "pinyin": "yǒuxiē", "meaning": "có một số", "type": "Số từ", "ex_cn": "有些东西在那儿。", "ex_py": "Yǒuxiē dōngxi zài nàr.", "ex_vn": "Có một số đồ ở đằng kia.", "lesson": "16"}, {"hanzi": "有点儿", "pinyin": "yǒudiǎnr", "meaning": "có chút", "type": "Phó từ", "ex_cn": "这件衣服有点儿大。", "ex_py": "Zhè jiàn yīfu yǒudiǎnr dà.", "ex_vn": "Chiếc áo này hơi rộng một chút.", "lesson": "16"}, {"hanzi": "病", "pinyin": "bìng", "meaning": "bệnh, ốm", "type": "Danh từ/Động từ", "ex_cn": "他生病了。", "ex_py": "Tā shēngbìng le.", "ex_vn": "Anh ấy bị ốm rồi.", "lesson": "16"}, {"hanzi": "车", "pinyin": "chē", "meaning": "xe", "type": "Danh từ", "ex_cn": "那是他的车。", "ex_py": "Nà shì tā de chē.", "ex_vn": "Đó là xe của anh ấy.", "lesson": "16"}, {"hanzi": "火车", "pinyin": "huǒchē", "meaning": "tàu hỏa", "type": "Danh từ", "ex_cn": "坐火车去上海。", "ex_py": "坐火车去上海。", "ex_vn": "Đi tàu hỏa đến Thượng Hải.", "lesson": "16"}, {"hanzi": "开车", "pinyin": "kāi chē", "meaning": "lái xe", "type": "Động từ", "ex_cn": "你会开车吗？", "ex_py": "Nǐ huì kāi chē ma?", "ex_vn": "Bạn biết lái xe không?", "lesson": "16"}, {"hanzi": "看病", "pinyin": "kànbìng", "meaning": "khám bệnh", "type": "Động từ", "ex_cn": "他去医院看病了。", "ex_py": "Tā qù yīyuàn kànbìng le.", "ex_vn": "Anh ấy đi bệnh viện khám bệnh rồi.", "lesson": "16"}, {"hanzi": "上課", "pinyin": "shàngkè", "meaning": "lên lớp", "type": "Động từ", "ex_cn": "我们八点上课。", "ex_py": "Wǒmen bā diǎn shàngkè.", "ex_vn": "Chúng tôi lên lớp lúc 8 giờ.", "lesson": "16"}, {"hanzi": "上学", "pinyin": "shàngxué", "meaning": "đi học", "type": "Động từ", "ex_cn": "他每天都上学。", "ex_py": "Tā měitiān dōu shàngxué.", "ex_vn": "Nó đi học mỗi ngày.", "lesson": "16"}, {"hanzi": "下班", "pinyin": "xiàbān", "meaning": "tan làm", "type": "Động từ", "ex_cn": "我五点下班。", "ex_py": "Wǒ wǔ diǎn xiàbān.", "ex_vn": "Tôi tan làm lúc 5 giờ.", "lesson": "16"}, {"hanzi": "下课", "pinyin": "xiàkè", "meaning": "tan học", "type": "Động từ", "ex_cn": "下课后去吃饭。", "ex_py": "Xiàkè hòu qù chī fàn.", "ex_vn": "Sau khi tan học thì đi ăn.", "lesson": "16"}];
        let currentQuestion = 0, score = 0, questions = [], totalQuestions = 0;

        function initGame() { 
            totalQuestions = Math.min(20, vocabulary.length); 
            questions = generateQuestions(); 
            renderQuestion(); 
        }

        function splitIntoPhrases(sentence, targetWord) {
            // Simple logic to split sentence into meaningful chunks including the target word
            let phrases = [];
            if (sentence.includes(targetWord)) {
                let parts = sentence.split(targetWord);
                if (parts[0]) phrases.push(...splitLogical(parts[0]));
                phrases.push(targetWord);
                if (parts[1]) phrases.push(...splitLogical(parts[1]));
            } else {
                phrases = splitLogical(sentence);
            }
            return phrases.filter(p => p.length > 0 && !/[，。？！、]/.test(p));
        }

        function splitLogical(text) {
            // Split long text into 2-3 char chunks
            let res = [];
            for (let i = 0; i < text.length; i += 3) {
                res.push(text.substr(i, 3));
            }
            return res;
        }

        function generateQuestions() {
            let qs = [], shuffled = [...vocabulary].sort(() => Math.random() - 0.5);
            for (let i = 0; i < totalQuestions; i++) {
                const word = shuffled[i];
                let type;
                
                if (1 === 3) {
                    // For HSK3, use the 3 specific types requested
                    const types = [10, 11, 12]; // 10: Scramble, 11: Translation, 12: Blank
                    type = types[Math.floor(Math.random() * types.length)];
                } else {
                    type = Math.floor(Math.random() * 4); // Old types for HSK1, 2
                }

                let q = { type, word };
                
                if (type <= 2) q.options = generateOptions(word, type);
                if (type === 10) {
                    let sentence = word.ex_cn.replace(/[，。？！、\s]/g, '');
                    let target = word.hanzi;
                    q.phrases = splitIntoPhrases(word.ex_cn, target).sort(() => Math.random() - 0.5);
                    q.correctSentence = sentence;
                }
                if (type === 12) {
                    q.displaySentence = word.ex_cn.replace(word.hanzi, "______");
                    q.options = generateOptions(word, 0); // Hanzi options
                }
                
                qs.push(q);
            }
            return qs;
        }

        function generateOptions(correctWord, type) {
            let options = [correctWord];
            while (options.length < 4 && vocabulary.length >= 4) {
                const rand = vocabulary[Math.floor(Math.random() * vocabulary.length)];
                if (!options.includes(rand)) options.push(rand);
            }
            return options.sort(() => Math.random() - 0.5);
        }

        function renderQuestion() {
            const q = questions[currentQuestion], card = document.getElementById('quiz-card'), progress = document.getElementById('progress');
            progress.style.width = (currentQuestion / totalQuestions) * 100 + '%';
            document.getElementById('progress-text').innerText = (currentQuestion + 1) + '/' + totalQuestions;
            
            let html = '';
            if (q.type === 0) {
                html = `<div class="question-text">Nghe và chọn từ đúng:</div><button class="audio-btn" style="background: #fdf2f8; border: none; font-size: 3rem; cursor: pointer;" onclick="speak('${q.word.hanzi}')">🔊</button><div class="options-grid">${q.options.map(opt => `<button class="option-btn" onclick="checkAnswer('${opt.hanzi}', '${q.word.hanzi}', this)">${opt.hanzi}</button>`).join('')}</div>`;
                setTimeout(() => speak(q.word.hanzi), 500);
            } else if (q.type === 1) {
                html = `<div class="question-text">Từ "${q.word.hanzi}" có nghĩa là gì?</div><div class="options-grid">${q.options.map(opt => `<button class="option-btn" onclick="checkAnswer('${opt.meaning}', '${q.word.meaning}', this)">${opt.meaning}</button>`).join('')}</div>`;
            } else if (q.type === 2) {
                html = `<div class="question-text">Từ "${q.word.hanzi}" có phiên âm là gì?</div><div class="options-grid">${q.options.map(opt => `<button class="option-btn" onclick="checkAnswer('${opt.pinyin}', '${q.word.pinyin}', this)">${opt.pinyin}</button>`).join('')}</div>`;
            } else if (q.type === 3) {
                html = `<div class="question-text">"${q.word.meaning}" trong tiếng Trung là gì?</div><input type="text" class="typing-input" id="typing-ans" placeholder="Nhập Hán tự..."><button class="submit-btn" onclick="checkTyping('${q.word.hanzi}')">Kiểm tra</button>`;
            } 
            // New Types for HSK3
            else if (q.type === 10) {
                html = `<div class="question-text">Sắp xếp câu chính xác:</div><div class="sub-text">Nghĩa: ${q.word.ex_vn}</div><div id="drop-zone" class="phrase-box"></div><div id="drag-zone" class="phrase-box" style="border: none; background: transparent;">${q.phrases.map(p => `<div class="phrase-item" onclick="movePhrase(this, '${q.correctSentence}')">${p}</div>`).join('')}</div>`;
            } else if (q.type === 11) {
                html = `<div class="question-text">Dịch câu sau sang tiếng Trung:</div><div class="sub-text" style="font-size: 1.4rem; color: var(--primary-dark);">${q.word.ex_vn}</div><input type="text" class="typing-input" id="typing-ans" placeholder="Nhập câu tiếng Trung..."><button class="submit-btn" onclick="checkTyping('${q.word.ex_cn.replace(/[，。？！、\s]/g, '')}')">Gửi đáp án</button>`;
            } else if (q.type === 12) {
                html = `<div class="question-text">Điền từ vào ô trống:</div><div class="blank-text">${q.displaySentence.replace("______", "<span class="blank-fill" id="blank-target">?</span>")}</div><div class="sub-text">Nghĩa: ${q.word.ex_vn}</div><div class="options-grid">${q.options.map(opt => `<button class="option-btn" onclick="checkBlank('${opt.hanzi}', '${q.word.hanzi}', this)">${opt.hanzi}</button>`).join('')}</div>`;
            }

            card.innerHTML = html;
        }

        function speak(t) { const m = new SpeechSynthesisUtterance(); m.text = t; m.lang = 'zh-CN'; window.speechSynthesis.speak(m); }
        
        function checkAnswer(s, c, b) {
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach(x => x.disabled = true);
            if (s === c) { b.classList.add('correct'); score++; } 
            else { b.classList.add('wrong'); btns.forEach(x => { if(x.innerText === c) x.classList.add('correct'); }); }
            showNext();
        }

        function checkBlank(s, c, b) {
            const target = document.getElementById('blank-target');
            target.innerText = c;
            checkAnswer(s, c, b);
        }

        function checkTyping(correct) {
            const input = document.getElementById('typing-ans');
            const val = input.value.trim().replace(/[，。？！、\s]/g, '');
            if (val === correct) {
                input.style.borderColor = "#28a745";
                input.style.background = "#d4edda";
                score++;
            } else {
                input.style.borderColor = "#dc3545";
                input.style.background = "#f8d7da";
                const err = document.createElement('div');
                err.style = "color: #dc3545; margin-top: 10px; font-weight: bold;";
                err.innerText = "Đáp án đúng: " + correct;
                input.parentNode.appendChild(err);
            }
            document.querySelector('.submit-btn').disabled = true;
            showNext();
        }

        function movePhrase(el, correct) {
            const dropZone = document.getElementById('drop-zone');
            const dragZone = document.getElementById('drag-zone');
            if (el.parentNode === dragZone) dropZone.appendChild(el);
            else dragZone.appendChild(el);

            const current = Array.from(dropZone.children).map(x => x.innerText).join('');
            if (dragZone.children.length === 0) {
                if (current === correct) {
                    dropZone.style.background = "#d4edda";
                    score++;
                } else {
                    dropZone.style.background = "#f8d7da";
                    const err = document.createElement('div');
                    err.style = "color: #dc3545; margin-top: 10px; font-weight: bold;";
                    err.innerText = "Sai rồi! Câu đúng: " + correct;
                    document.getElementById('quiz-card').appendChild(err);
                }
                showNext();
            }
        }

        function showNext() {
            const btn = document.createElement('button');
            btn.className = "submit-btn";
            btn.style = "margin-top: 1.5rem; background: #4dabf7;";
            btn.innerText = "Tiếp theo ➔";
            btn.onclick = () => {
                currentQuestion++;
                if (currentQuestion < totalQuestions) renderQuestion();
                else showResults();
            };
            document.getElementById('quiz-card').appendChild(btn);
        }

        function showResults() {
            document.getElementById('game-ui').style.display = 'none';
            document.getElementById('result-ui').style.display = 'block';
            document.getElementById('final-score').innerText = Math.round((score/totalQuestions)*100)+'%';
            document.getElementById('score-text').innerText = `Bạn đã hoàn thành ${score}/${totalQuestions} câu hỏi.`;
        }

        initGame();
    </script>
</body>
