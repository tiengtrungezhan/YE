<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 3 Bài 14</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk3.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 14</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "打扫", "pinyin": "dǎsǎo", "meaning": "quét dọn", "lesson": "14", "type": "Động từ", "ex_cn": "请打扫一下房间。", "ex_py": "Qǐng dǎsǎo yíxià fángjiān.", "ex_vn": "Vui lòng quét dọn phòng một chút."}, {"hanzi": "干净", "pinyin": "gānjìng", "meaning": "sạch sẽ", "lesson": "14", "type": "Tính từ", "ex_cn": "房间很干净。", "ex_py": "Fángjiān hěn gānjìng.", "ex_vn": "Phòng rất sạch sẽ."}, {"hanzi": "然后", "pinyin": "ránhòu", "meaning": "sau đó", "lesson": "14", "type": "Liên từ", "ex_cn": "先吃饭，然后看电影。", "ex_py": "Xiān chīfàn, ránhòu kàn diànyǐng.", "ex_vn": "Ăn cơm trước, sau đó xem phim."}, {"hanzi": "冰箱", "pinyin": "bīngxiāng", "meaning": "tủ lạnh", "lesson": "14", "type": "Danh từ", "ex_cn": "冰箱里有西瓜。", "ex_py": "Bīngxiāng lǐ yǒu xīguā.", "ex_vn": "Trong tủ lạnh có dưa hấu."}, {"hanzi": "洗澡", "pinyin": "xǐzǎo", "meaning": "tắm", "lesson": "14", "type": "Động từ", "ex_cn": "他在洗澡。", "ex_py": "Tā zài xǐzǎo.", "ex_vn": "Anh ấy đang tắm."}, {"hanzi": "节目", "pinyin": "jiémù", "meaning": "chương trình", "lesson": "14", "type": "Danh từ", "ex_cn": "昨天的节目很好看。", "ex_py": "Zuótiān de jiémù hěn hǎokàn.", "ex_vn": "Chương trình hôm qua rất hay."}, {"hanzi": "月亮", "pinyin": "yuèliang", "meaning": "mặt trăng", "lesson": "14", "type": "Danh từ", "ex_cn": "今天的月亮很圆。", "ex_py": "Jīntiān de yuèliang hěn yuán.", "ex_vn": "Trăng hôm nay rất tròn."}, {"hanzi": "像", "pinyin": "xiàng", "meaning": "giống", "lesson": "14", "type": "Động từ/Tính từ", "ex_cn": "他长得像他爸爸。", "ex_py": "Tā zhǎng de xiàng tā bàba.", "ex_vn": "Anh ấy trông giống bố mình."}, {"hanzi": "盘子", "pinyin": "pánzi", "meaning": "cái đĩa", "lesson": "14", "type": "Danh từ", "ex_cn": "盘子里有水果。", "ex_py": "Pánzi lǐ yǒu shuǐguǒ.", "ex_vn": "Trong đĩa có hoa quả."}, {"hanzi": "刮风", "pinyin": "guāfēng", "meaning": "nổi gió", "lesson": "14", "type": "Động từ", "ex_cn": "外面在刮风。", "ex_py": "Wàimiàn zài guāfēng.", "ex_vn": "Bên ngoài đang có gió."}, {"hanzi": "叔叔", "pinyin": "shūshu", "meaning": "chú", "lesson": "14", "type": "Danh từ", "ex_cn": "我叔叔在北京工作。", "ex_py": "Wǒ shūshu zài Běijīng gōngzuò.", "ex_vn": "Chú tôi làm việc ở Bắc Kinh."}, {"hanzi": "阿姨", "pinyin": "āyí", "meaning": "dì, cô", "lesson": "14", "type": "Danh từ", "ex_cn": "阿姨好！", "ex_py": "Āyí hǎo!", "ex_vn": "Chào cô ạ!"}, {"hanzi": "故事", "pinyin": "gùshi", "meaning": "câu chuyện", "lesson": "14", "type": "Danh từ", "ex_cn": "我喜欢听故事。", "ex_py": "Wǒ xǐhuan tīng gùshi.", "ex_vn": "Tôi thích nghe kể chuyện."}, {"hanzi": "声音", "pinyin": "shēngyīn", "meaning": "âm thanh, giọng nói", "lesson": "14", "type": "Danh từ", "ex_cn": "他的声音很好听。", "ex_py": "Tā de shēngyīn hěn hǎotīng.", "ex_vn": "Giọng nói của anh ấy rất hay."}, {"hanzi": "菜单", "pinyin": "càidān", "meaning": "thực đơn", "lesson": "14", "type": "Danh từ", "ex_cn": "请给我菜单。", "ex_py": "Qǐng gěi wǒ càidān.", "ex_vn": "Vui lòng cho tôi xem thực đơn."}, {"hanzi": "简单", "pinyin": "jiǎndān", "meaning": "đơn giản", "lesson": "14", "type": "Tính từ", "ex_cn": "这个题很简单。", "ex_py": "Zhège tí hěn jiǎndān.", "ex_vn": "Câu hỏi này rất đơn giản."}, {"hanzi": "香蕉", "pinyin": "xiāngjiāo", "meaning": "chuối", "lesson": "14", "type": "Danh từ", "ex_cn": "我想吃香蕉。", "ex_py": "Wǒ xiǎng chī xiāngjiāo.", "ex_vn": "Tôi muốn ăn chuối."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
