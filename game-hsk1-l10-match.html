<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 1 3.0 Bài 10</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk1.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 10</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "杯子", "pinyin": "bēizi", "meaning": "ly, tách", "lesson": "10", "type": "Danh từ", "ex_cn": "这是我的杯子。", "ex_py": "Zhè shì wǒ de bēizi.", "ex_vn": "Đây là cái cốc của tôi."}, {"hanzi": "穿", "pinyin": "chuān", "meaning": "mặc", "lesson": "10", "type": "Động từ", "ex_cn": "他在穿衣服。", "ex_py": "Tā zài chuān yīfu.", "ex_vn": "Anh ấy đang mặc quần áo."}, {"hanzi": "贵", "pinyin": "guì", "meaning": "đắt", "lesson": "10", "type": "Tính từ", "ex_cn": "这个东西很贵。", "ex_py": "Zhè ge dōngxi hěn guì.", "ex_vn": "Món đồ này rất đắt."}, {"hanzi": "男", "pinyin": "nán", "meaning": "nam, đàn ông", "lesson": "10", "type": "Danh từ", "ex_cn": "那是男老师。", "ex_py": "Nà shì nán lǎoshī.", "ex_vn": "Đó là thầy giáo (nam)."}, {"hanzi": "女", "pinyin": "nǚ", "meaning": "nữ, phụ nữ", "lesson": "10", "type": "Danh từ", "ex_cn": "那是女老师。", "ex_py": "Nà shì nǚ lǎoshī.", "ex_vn": "Đó là cô giáo (nữ)."}, {"hanzi": "便宜", "pinyin": "piányi", "meaning": "rẻ", "lesson": "10", "type": "Tính từ", "ex_cn": "很便宜。", "ex_py": "Hěn piányi.", "ex_vn": "Rất rẻ."}, {"hanzi": "苹果", "pinyin": "píngguǒ", "meaning": "táo", "lesson": "10", "type": "Danh từ", "ex_cn": "我有一个苹果。", "ex_py": "Wǒ yǒu yí ge píngguǒ.", "ex_vn": "Tôi có một quả táo."}, {"hanzi": "谁", "pinyin": "shéi", "meaning": "ai", "lesson": "10", "type": "Đại từ", "ex_cn": "那个人是谁，你认识他吗？", "ex_py": "Nàge rén shì shéi, nǐ rènshi tā ma?", "ex_vn": "Người đó là ai, bạn có quen không?"}, {"hanzi": "商店", "pinyin": "shāngdiàn", "meaning": "cửa hàng", "lesson": "10", "type": "Danh từ", "ex_cn": "我去商店买了一双鞋。", "ex_py": "Wǒ qù shāngdiàn mǎi le yì shuāng xié.", "ex_vn": "Tôi đi cửa hàng mua một đôi giày."}, {"hanzi": "少", "pinyin": "shǎo", "meaning": "ít", "lesson": "10", "type": "Tính từ", "ex_cn": "我的钱不少，够用了。", "ex_py": "Wǒ de qián bù shǎo, gòu yòng le.", "ex_vn": "Tiền của tôi không ít, đủ dùng rồi."}, {"hanzi": "元", "pinyin": "yuán", "meaning": "đồng", "lesson": "10", "type": "Lượng từ", "ex_cn": "这件衣服一百元。", "ex_py": "Zhè jiàn yīfu yìbǎi yuán.", "ex_vn": "Chiếc áo này 100 đồng."}, {"hanzi": "衣服", "pinyin": "yīfu", "meaning": "quần áo", "lesson": "10", "type": "Danh từ", "ex_cn": "她去买衣服。", "ex_py": "Tā qù mǎi yīfu.", "ex_vn": "Cô ấy đi mua quần áo."}, {"hanzi": "这边", "pinyin": "zhèbiān", "meaning": "phía bên này", "lesson": "10", "type": "Bổ sung 3.0", "ex_cn": "请从这边走，那边不通。", "ex_py": "Qǐng cóng zhèbian zǒu, nàbian bù tōng.", "ex_vn": "Xin hãy đi phía này, phía kia không thông."}, {"hanzi": "这儿", "pinyin": "zhèr", "meaning": "ở đây, chỗ này", "lesson": "10", "type": "Đại từ", "ex_cn": "你就在这儿等我，我马上回来。", "ex_py": "Nǐ jiù zài zhèr děng wǒ, wǒ mǎshàng huílái.", "ex_vn": "Bạn đợi tôi ở đây, tôi sẽ quay lại ngay."}, {"hanzi": "这些", "pinyin": "zhèxiē", "meaning": "những cái này", "type": "Đại từ", "ex_cn": "these apples are really cheap.", "ex_py": "Zhèxiē píngguǒ zhēn piányi.", "ex_vn": "Những quả táo này rẻ thật.", "lesson": "10"}, {"hanzi": "怎么样", "pinyin": "zěnmeyàng", "meaning": "thế nào", "lesson": "10", "type": "Đại từ", "ex_cn": "今天天气怎么样？", "ex_py": "Jīntiān tiānqì zěnmeyàng?", "ex_vn": "Thời tiết hôm nay thế nào?"}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
