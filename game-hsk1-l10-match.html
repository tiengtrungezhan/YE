<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 1 3.0 Bài 10</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk1.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 10</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "本", "pinyin": "běn", "meaning": "quyển, cuốn", "lesson": "10", "type": "Lượng từ", "ex_cn": "我有一本新的中文书。", "ex_py": "Wǒ yǒu yì běn xīn de Zhōngwén shū.", "ex_vn": "Tôi có một cuốn sách tiếng Trung mới."}, {"hanzi": "电脑", "pinyin": "diànnǎo", "meaning": "máy tính", "lesson": "10", "type": "Danh từ", "ex_cn": "这是我的电脑。", "ex_py": "Zhè shì wǒ de diànnǎo.", "ex_vn": "Đây là máy tính của tôi."}, {"hanzi": "和", "pinyin": "hé", "meaning": "và", "lesson": "10", "type": "Liên từ", "ex_cn": "我和朋友一起去看电影。", "ex_py": "Wǒ hé péngyou yìqǐ qù kàn diànyǐng.", "ex_vn": "Tôi và bạn bè cùng nhau đi xem phim."}, {"hanzi": "后面", "pinyin": "hòumiàn", "meaning": "phía sau", "lesson": "10", "type": "Danh từ", "ex_cn": "他在我后面。", "ex_py": "Tā zài wǒ hòumiàn.", "ex_vn": "Anh ấy ở phía sau tôi."}, {"hanzi": "里", "pinyin": "lǐ", "meaning": "trong, bên trong", "lesson": "10", "type": "Danh từ", "ex_cn": "他在商店里。", "ex_py": "Tā zài shāngdiàn lǐ.", "ex_vn": "Anh ấy ở trong cửa hàng."}, {"hanzi": "没有", "pinyin": "méiyǒu", "meaning": "không có", "lesson": "10", "type": "Phó từ", "ex_cn": "我今天没有带手机。", "ex_py": "Wǒ jīntiān méiyǒu dài shǒujī.", "ex_vn": "Hôm nay tôi không mang điện thoại theo."}, {"hanzi": "前面", "pinyin": "qiánmiàn", "meaning": "phía trước", "lesson": "10", "type": "Danh từ", "ex_cn": "他在我前面。", "ex_py": "Tā zài wǒ qiánmiàn.", "ex_vn": "Anh ấy ở phía trước tôi."}, {"hanzi": "喜欢", "pinyin": "xǐhuan", "meaning": "thích", "lesson": "10", "type": "Danh từ", "ex_cn": "我很喜欢吃中国菜。", "ex_py": "Wǒ hěn xǐhuan chī Zhōngguó cài.", "ex_vn": "Tôi rất thích ăn món ăn Trung Quốc."}, {"hanzi": "前", "pinyin": "qián", "meaning": "trước, phía trước", "lesson": "10", "type": "Bổ sung 3.0", "ex_cn": "他在我前边。", "ex_py": "Tā zài wǒ qiánbiān.", "ex_vn": "Anh ấy ở phía trước tôi."}, {"hanzi": "后", "pinyin": "hòu", "meaning": "sau, phía sau", "lesson": "10", "type": "Bổ sung 3.0", "ex_cn": "学校后边有一家餐厅。", "ex_py": "Xuéxiào hòubian yǒu yì jiā cāntīng.", "ex_vn": "Phía sau trường có một nhà hàng."}, {"hanzi": "边", "pinyin": "biān", "meaning": "phía, bên", "lesson": "10", "type": "Bổ sung 3.0", "ex_cn": "请问，邮局在哪边？", "ex_py": "Qǐngwèn, yóujú zài nǎbian?", "ex_vn": "Xin hỏi, bưu điện ở phía nào?"}, {"hanzi": "那边", "pinyin": "nàbiān", "meaning": "phía bên kia", "lesson": "10", "type": "Bổ sung 3.0", "ex_cn": "他在那边等你呢。", "ex_py": "Tā zài nàbian děng nǐ ne.", "ex_vn": "Anh ấy đang đợi bạn ở đằng kia."}, {"hanzi": "那里", "pinyin": "nàlǐ", "meaning": "chỗ kia", "lesson": "10", "type": "Bổ sung 3.0", "ex_cn": "他在那里买书。", "ex_py": "Tā zài nàli mǎi shū.", "ex_vn": "Anh ấy mua sách ở đằng kia."}, {"hanzi": "这边", "pinyin": "zhèbiān", "meaning": "phía bên này", "lesson": "10", "type": "Bổ sung 3.0", "ex_cn": "请从这边走，那边不通。", "ex_py": "Qǐng cóng zhèbian zǒu, nàbian bù tōng.", "ex_vn": "Xin hãy đi phía này, phía kia không thông."}, {"hanzi": "这里", "pinyin": "zhèlǐ", "meaning": "ở đây, chỗ này", "lesson": "10", "type": "Bổ sung 3.0", "ex_cn": "这里的风景很好，我很喜欢。", "ex_py": "Zhèlǐ de fēngjǐng hěn hǎo, wǒ hěn xǐhuan.", "ex_vn": "Phong cảnh ở đây rất đẹp, tôi rất thích."}, {"hanzi": "外边", "pinyin": "wàibian", "meaning": "bên ngoài", "lesson": "10", "type": "Bổ sung 3.0", "ex_cn": "外边正在下雨，别出去。", "ex_py": "Wàibian zhèngzài xià yǔ, bié chūqù.", "ex_vn": "Bên ngoài đang mưa, đừng ra ngoài."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
