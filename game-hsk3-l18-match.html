<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 3 Bài 18</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk3.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 18</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "向", "pinyin": "xiàng", "meaning": "hướng về", "lesson": "18", "type": "Giới từ", "ex_cn": "向右走。", "ex_py": "Xiàng yòu zǒu.", "ex_vn": "Đi về phía bên phải."}, {"hanzi": "万", "pinyin": "wàn", "meaning": "vạn (10.000)", "lesson": "18", "type": "Số từ", "ex_cn": "一万块钱。", "ex_py": "Yí wàn kuài qián.", "ex_vn": "Mười nghìn đồng."}, {"hanzi": "嘴", "pinyin": "zuǐ", "meaning": "miệng", "lesson": "18", "type": "Danh từ", "ex_cn": "请张开嘴。", "ex_py": "Qǐng zhāngkāi zuǐ.", "ex_vn": "Vui lòng mở miệng ra."}, {"hanzi": "动物", "pinyin": "dòngwù", "meaning": "động vật", "lesson": "18", "type": "Danh từ", "ex_cn": "我喜欢小动物。", "ex_py": "Wǒ xǐhuan xiǎo dòngwù.", "ex_vn": "Tôi thích các loài động vật nhỏ."}, {"hanzi": "段", "pinyin": "duàn", "meaning": "đoạn", "lesson": "18", "type": "Lượng từ", "ex_cn": "请读这一段。", "ex_py": "Qǐng dú zhè yí duàn.", "ex_vn": "Vui lòng đọc đoạn này."}, {"hanzi": "有名", "pinyin": "yǒumíng", "meaning": "nổi tiếng", "lesson": "18", "type": "Tính từ", "ex_cn": "北京是一个有名的城市。", "ex_py": "Běijīng shì yí ge yǒumíng de chéngshì.", "ex_vn": "Bắc Kinh là một thành phố nổi tiếng."}, {"hanzi": "同意", "pinyin": "tóngyì", "meaning": "đồng ý", "lesson": "18", "type": "Động từ", "ex_cn": "我同意你的决定。", "ex_py": "Wǒ tóngyì nǐ de juédìng.", "ex_vn": "Tôi đồng ý với quyết định của bạn."}, {"hanzi": "相信", "pinyin": "xiāngxìn", "meaning": "tin tưởng", "lesson": "18", "type": "Động từ", "ex_cn": "我相信他。", "ex_py": "Wǒ xiāngxìn tā.", "ex_vn": "Tôi tin anh ấy."}, {"hanzi": "关于", "pinyin": "guānyú", "meaning": "về (vấn đề gì đó)", "lesson": "18", "type": "Giới từ", "ex_cn": "关于这件事，我不清楚。", "ex_py": "Guānyú zhè jiàn shì, wǒ bù qīngchu.", "ex_vn": "Về chuyện này, tôi không rõ."}, {"hanzi": "机会", "pinyin": "jīhuì", "meaning": "cơ hội", "lesson": "18", "type": "Danh từ", "ex_cn": "这是一个好机会。", "ex_py": "Zhè shì yí ge hǎo jīhuì.", "ex_vn": "Đây là một cơ hội tốt."}, {"hanzi": "国家", "pinyin": "guójiā", "meaning": "quốc gia", "lesson": "18", "type": "Danh từ", "ex_cn": "你是哪个国家的人？", "ex_py": "Nǐ shì nǎge guójiā de rén?", "ex_vn": "Bạn là người nước nào?"}, {"hanzi": "种", "pinyin": "zhǒng", "meaning": "loại", "lesson": "18", "type": "Lượng từ", "ex_cn": "我不喜欢这种颜色。", "ex_py": "Wǒ bù xǐhuan zhè zhǒng yánsè.", "ex_vn": "Tôi không thích loại màu này."}, {"hanzi": "特点", "pinyin": "tèdiǎn", "meaning": "đặc điểm", "lesson": "18", "type": "Danh từ", "ex_cn": "这个城市有什么特点？", "ex_py": "Zhège chéngshì yǒu shénme tèdiǎn?", "ex_vn": "Thành phố này có đặc điểm gì?"}, {"hanzi": "奇怪", "pinyin": "qíguài", "meaning": "kỳ lạ", "lesson": "18", "type": "Tính từ", "ex_cn": "这太奇怪了。", "ex_py": "Zhè tài qíguài le.", "ex_vn": "Chuyện này thật kỳ lạ."}, {"hanzi": "地", "pinyin": "de", "meaning": "trợ từ (đặt sau trạng từ)", "lesson": "18", "type": "Trợ từ", "ex_cn": "他高兴地笑了。", "ex_py": "Tā gāoxìng de xiào le.", "ex_vn": "Anh ấy cười một cách vui vẻ."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
