<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 3 Bài 1</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk3.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 1</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "打算", "pinyin": "dǎsuàn", "meaning": "dự định, kế hoạch", "lesson": "1", "ex_cn": "我明年的打算是买一套房子和一辆新车。", "ex_py": "Wǒ míngnián de dǎsuàn shì mǎi yí tào fángzi hé yí liàng xīn chē.", "ex_vn": "Dự định năm tới của tôi là mua một căn nhà và một chiếc xe mới.", "type": "Động từ"}, {"hanzi": "啊", "pinyin": "a", "meaning": "trợ từ cuối câu", "lesson": "1", "ex_cn": "好啊！", "ex_py": "Hǎo a!", "ex_vn": "Được thôi!", "type": "Trợ từ"}, {"hanzi": "跟", "pinyin": "gēn", "meaning": "với, cùng với", "lesson": "1", "ex_cn": "你能跟我一起去吗？", "ex_py": "Nǐ néng gēn wǒ yìqǐ qù ma?", "ex_vn": "Bạn có thể đi cùng tôi không?", "type": "Giới từ"}, {"hanzi": "一直", "pinyin": "yìzhí", "meaning": "luôn luôn, suốt", "lesson": "1", "ex_cn": "今天小明上课的时候一直不说什么，不知道有什么事儿。", "ex_py": "Jīntiān Xiǎomíng shàngkè de shíhou yìzhí bù shuō shénme, bù zhīdào yǒu shénme shìr.", "ex_vn": "Hôm nay lúc lên lớp Tiểu Minh cứ im lặng suốt, không biết có chuyện gì nữa.", "type": "Phó từ"}, {"hanzi": "游戏", "pinyin": "yóuxì", "meaning": "trò chơi, game", "lesson": "1", "ex_cn": "他一天到晚都在房间里玩电脑游戏。", "ex_py": "Tā yìtiāndàowǎn dōu zài fángjiān lǐ wán diànnǎo yóuxì.", "ex_vn": "Anh ta chơi game máy tính trong phòng suốt cả ngày từ sáng đến tối.", "type": "Danh từ"}, {"hanzi": "作业", "pinyin": "zuòyè", "meaning": "bài tập về nhà", "lesson": "1", "ex_cn": "作业写完了吗？", "ex_py": "Zuòyè xiě wán le ma?", "ex_vn": "Đã làm xong bài tập chưa?", "type": "Danh từ"}, {"hanzi": "着急", "pinyin": "zháojí", "meaning": "lo lắng, sốt ruột", "lesson": "1", "ex_cn": "他很着急，因为他找不到洗手间。", "ex_py": "Tā hěn zháojí, yīnwèi tā zhǎo bù dào xǐshǒujiān.", "ex_vn": "Anh ấy rất sốt ruột vì không tìm thấy nhà vệ sinh.", "type": "Tính từ"}, {"hanzi": "复习", "pinyin": "fùxí", "meaning": "ôn tập", "lesson": "1", "ex_cn": "我得复习昨天的课。", "ex_py": "Wǒ děi fùxí zuótiān de kè.", "ex_vn": "Tôi phải ôn tập bài học hôm qua.", "type": "Động từ"}, {"hanzi": "南方", "pinyin": "nánfāng", "meaning": "phía Nam", "lesson": "1", "ex_cn": "河内在越南北方，胡志明市在越南南方。", "ex_py": "Hénèi zài Yuènán běifāng, Húzhìmíng shì zài Yuènán nánfāng.", "ex_vn": "Hà Nội ở miền Bắc Việt Nam, thành phố Hồ Chí Minh ở miền Nam Việt Nam.", "type": "Danh từ"}, {"hanzi": "北方", "pinyin": "běifāng", "meaning": "phía Bắc", "lesson": "1", "ex_cn": "河内在越南北方，胡志明市在越南南方。", "ex_py": "Hénèi zài Yuènán běifāng, Húzhìmíng shì zài Yuènán nánfāng.", "ex_vn": "Hà Nội ở miền Bắc Việt Nam, thành phố Hồ Chí Minh ở miền Nam Việt Nam.", "type": "Danh từ"}, {"hanzi": "面包", "pinyin": "miànbāo", "meaning": "bánh mì", "lesson": "1", "ex_cn": "我要买两块面包。", "ex_py": "Wǒ yào mǎi liǎng kuài miànbāo.", "ex_vn": "Tôi muốn mua hai cái bánh mì.", "type": "Danh từ"}, {"hanzi": "带", "pinyin": "dài", "meaning": "mang theo", "lesson": "1", "ex_cn": "别忘了带地图。", "ex_py": "Bié wàngle dài dìtú.", "ex_vn": "Đừng quên mang theo bản đồ.", "type": "Động từ"}, {"hanzi": "地图", "pinyin": "dìtú", "meaning": "bản đồ", "lesson": "1", "ex_cn": "这张地图很清楚。", "ex_py": "Zhè zhāng dìtú hěn qīngchu.", "ex_vn": "Tấm bản đồ này rất rõ ràng.", "type": "Danh từ"}, {"hanzi": "搬", "pinyin": "bān", "meaning": "chuyển (nhà, đồ đạc)", "lesson": "1", "ex_cn": "帮我搬一下这张桌子。", "ex_py": "Bāng wǒ bān yíxià zhè zhāng zhuōzi.", "ex_vn": "Giúp tôi chuyển chiếc bàn này một chút.", "type": "Động từ"}, {"hanzi": "周末", "pinyin": "zhōumò", "meaning": "cuối tuần", "lesson": "1", "type": "Danh từ", "ex_cn": "这个周末我有事了，我们下个周末去吧，怎么样？", "ex_py": "Zhège zhōumò wǒ yǒu shì le, wǒmen xià ge zhōumò qù ba, zěnmeyàng?", "ex_vn": "Cuối tuần này tôi có việc rồi, cuối tuần sau chúng ta đi nhé, được không?"}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
