<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chắc Ngữ Pháp - HSK 5 Bài 18: 抽象艺术美不美?</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); min-height: 100vh; }
        .game-wrapper { max-width: 820px; margin: 0 auto; padding: 1.5rem; }

        .lesson-title-bar {
            background: linear-gradient(135deg, #2e7d32, #4caf50);
            color: white;
            border-radius: 20px;
            padding: 1.2rem 2rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 25px rgba(46,125,50,0.3);
        }
        .lesson-title-bar h1 { font-size: 1.6rem; margin: 0; }
        .lesson-title-bar .badge { background: rgba(255,255,255,0.25); border-radius: 12px; padding: 0.4rem 1rem; font-size: 0.85rem; font-weight: 700; }

        /* Progress */
        .progress-bar-wrap {
            background: white;
            border-radius: 16px;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .progress-track { flex: 1; height: 10px; background: #f0f0f0; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #2e7d32, #4caf50); border-radius: 10px; transition: width 0.5s ease; width: 0%; }
        .progress-label { font-weight: 800; color: #2e7d32; font-size: 1rem; min-width: 55px; text-align: right; }

        /* Quiz card */
        .quiz-card {
            background: white;
            border-radius: 24px;
            padding: 2rem 2.2rem;
            box-shadow: 0 6px 30px rgba(0,0,0,0.09);
            margin-bottom: 1.5rem;
            min-height: 380px;
            display: flex;
            flex-direction: column;
            animation: slideIn 0.35s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .q-number { font-size: 0.8rem; font-weight: 800; color: #2e7d32; letter-spacing: 1px; margin-bottom: 0.8rem; }
        .q-text { font-size: 1.25rem; font-weight: 700; color: #222; line-height: 1.6; margin-bottom: 1.5rem; }
        .q-context {
            background: #f0fdf4;
            border-radius: 12px;
            padding: 0.8rem 1.2rem;
            font-size: 1rem;
            color: #3f4f43;
            margin-bottom: 1.2rem;
            border-left: 3px solid #81c784;
            line-height: 1.7;
        }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; margin-top: auto; }
        .opt-btn {
            padding: 1rem 1.2rem;
            border: 2px solid #e8e8e8;
            border-radius: 14px;
            background: #fafafa;
            font-size: 1rem;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            line-height: 1.5;
        }
        .opt-btn:hover:not(:disabled) { border-color: #2e7d32; background: #e8f5e9; color: #1b5e20; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(46,125,50,0.15); }
        .opt-btn.correct { border-color: #2e7d32 !important; background: #e8f5e9 !important; color: #1b5e20 !important; }
        .opt-btn.wrong { border-color: #c62828 !important; background: #ffebee !important; color: #b71c1c !important; }
        .opt-btn.reveal { border-color: #2e7d32 !important; background: #e8f5e9 !important; color: #1b5e20 !important; }

        .feedback-box {
            margin-top: 1.2rem;
            padding: 1rem 1.3rem;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.6;
            display: none;
        }
        .feedback-box.correct { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .feedback-box.wrong { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }

        .next-btn {
            display: none;
            margin-top: 1rem;
            padding: 0.9rem 2rem;
            background: linear-gradient(135deg, #2e7d32, #4caf50);
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            align-self: flex-end;
        }
        .next-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(46,125,50,0.3); }

        /* Result screen */
        .result-screen {
            display: none;
            background: white;
            border-radius: 24px;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 6px 30px rgba(0,0,0,0.09);
            animation: slideIn 0.4s ease;
        }
        .result-emoji { font-size: 4rem; margin-bottom: 1rem; }
        .result-title { font-size: 2rem; font-weight: 800; color: #2e7d32; margin-bottom: 0.5rem; }
        .score-ring {
            width: 130px; height: 130px;
            border-radius: 50%;
            border: 10px solid #c8e6c9;
            display: flex align-items: center; justify-content: center;
            font-size: 2.2rem; font-weight: 800; color: #2e7d32;
            margin: 1.5rem auto;
            display: flex;
            align-items: center;
        }
        .result-msg { font-size: 1.1rem; color: #666; margin-bottom: 2rem; }
        .btn-replay {
            padding: 1rem 2.5rem;
            background: linear-gradient(135deg, #2e7d32, #4caf50);
            color: white; border: none; border-radius: 14px;
            font-weight: 800; font-size: 1.1rem; cursor: pointer;
            transition: 0.2s; margin: 0.5rem;
        }
        .btn-replay:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(46,125,50,0.3); }
        .btn-back-link {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: #e8f5e9;
            color: #2e7d32; border: 2px solid #a5d6a7;
            border-radius: 14px; font-weight: 800; font-size: 1rem;
            text-decoration: none; margin: 0.5rem;
            transition: 0.2s;
        }
        .btn-back-link:hover { background: #c8e6c9; }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn"><img src="mascot.png" alt="Home"></a>
    <div class="page-container">
        <a href="game-hsk5.html" class="back-btn">← Quay lại</a>

        <div class="game-wrapper">
            <div class="lesson-title-bar">
                <h1>✍️ Chắc Ngữ Pháp</h1>
                <div class="badge">HSK 5 · Bài 18 · 抽象艺术美不美?</div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-bar-wrap">
                <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
                <div class="progress-label" id="progressLabel">0 / 10</div>
            </div>

            <!-- Quiz Card -->
            <div class="quiz-card" id="quizCard">
                <!-- JS injected -->
            </div>

            <!-- Result Screen -->
            <div class="result-screen" id="resultScreen">
                <div class="result-emoji" id="resultEmoji">🏆</div>
                <div class="result-title">Kết Quả</div>
                <div class="score-ring" id="scoreRing">0%</div>
                <div class="result-msg" id="resultMsg"></div>
                <button class="btn-replay" onclick="startGame()">🔄 Làm Lại</button>
                <a href="game-hsk5.html" class="btn-back-link">← Danh sách bài</a>
            </div>
        </div>
    </div>

    <script>
    const questions = [
        {
            q: "Điền cấu trúc thích hợp vào chỗ trống: \"________我________，身体健康比挣多少钱都重要。\"",
            context: "Ý nghĩa: \"Đối với tôi mà nói, sức khỏe quan trọng hơn kiếm được bao nhiêu tiền.\"",
            options: [
                "A. 对 …… 来说",
                "B. 哪怕 …… 也",
                "C. 极其 …… 的",
                "D. 无论 …… 都"
            ],
            answer: 0,
            explain: 'Cấu trúc "对……来说" mang ý nghĩa "đối với ai đó mà nói", đứng đầu câu làm trạng ngữ chỉ phương diện của một nhận định chủ quan.'
        },
        {
            q: "Chọn vị trí thích hợp cho từ \"极其\" trong câu sau: \"他的 [A] 演讲 [B] 精彩，赢得了 [C] 阵阵掌声 [D]。\"",
            context: "Ý nghĩa: \"Bài phát biểu của anh ấy cực kỳ đặc sắc, đã giành được từng đợt pháo tay.\"",
            options: [
                "A. Vị trí [A]",
                "B. Vị trí [B]",
                "C. Vị trí [C]",
                "D. Vị trí [D]"
            ],
            answer: 1,
            explain: '"极其" là phó từ chỉ mức độ (cực kỳ, vô cùng), thường đứng trước tính từ song âm tiết hoặc động từ tâm lý để bổ nghĩa cho chúng (极其精彩 - cực kỳ đặc sắc).'
        },
        {
            q: "Điền liên từ thích hợp vào chỗ trống: \"________天气再冷，他________每天坚持晨跑。\"",
            context: "Ý nghĩa: \"Cho dù thời tiết có lạnh đến mấy, anh ấy vẫn kiên trì chạy bộ buổi sáng hàng ngày.\"",
            options: [
                "A. 对 …… 来说",
                "B. 哪怕 …… 也",
                "C. 极其 …… 的",
                "D. 无论 …… 也"
            ],
            answer: 1,
            explain: 'Liên từ "哪怕" có nghĩa là "cho dù/ngay cả khi", biểu thị sự giả định nhượng bộ, thường đi kèm với phó từ "也" hoặc "还" ở phân câu sau.'
        },
        {
            q: "Chọn từ thích hợp điền vào chỗ trống: \"听到老师的表扬，她心里感到________高兴。\"",
            context: "Ý nghĩa: \"Nghe thấy lời biểu dương của giáo viên, trong lòng cô ấy cảm thấy cực kỳ vui mừng.\"",
            options: [
                "A. 极其",
                "B. 极点",
                "C. 哪怕",
                "D. 可见"
            ],
            answer: 0,
            explain: '"极其" là phó từ chỉ mức độ cao đứng trước tính từ "高兴". "极点" là danh từ hoặc bổ ngữ đứng sau (ví dụ: 高兴到了极点), không thể đứng trước trực tiếp tính từ.'
        },
        {
            q: "Điền liên từ thích hợp vào chỗ trống: \"他连最基础的题都做错，________他并没有认真复习。\"",
            context: "Ý nghĩa: \"Đến câu hỏi cơ bản nhất anh ấy cũng làm sai, có thể thấy anh ấy đã không ôn tập nghiêm túc.\"",
            options: [
                "A. 极其",
                "B. 对此",
                "C. 可见",
                "D. 哪怕"
            ],
            answer: 2,
            explain: 'Liên từ "可见" nghĩa là "có thể thấy", dùng ở phân câu sau để đưa ra kết luận hoặc phán đoán dựa vào sự việc làm tiền đề ở phân câu trước.'
        },
        {
            q: "Phân biệt \"目前\" và \"现在\": Trong câu sau, từ nào là phù hợp nhất? \"________十点了，你怎么还在睡觉？\"",
            context: "Ý nghĩa: \"Đã 10 giờ rồi, sao cậu vẫn đang ngủ thế?\"",
            options: [
                "A. 目前",
                "B. 现在",
                "C. 哪怕",
                "D. 极其"
            ],
            answer: 1,
            explain: '"现在" có thể đi kèm với mốc thời gian cụ thể (như 10 giờ), còn "目前" (hiện nay/trước mắt) chỉ một khoảng thời gian khái quát, không dùng trước giờ giấc cụ thể.'
        },
        {
            q: "Phân biệt \"目前\" và \"现在\": Trong câu sau, từ nào là phù hợp nhất? \"根据________掌握的证据，嫌疑人已经离开本地。\"",
            context: "Ý nghĩa: \"Căn cứ vào chứng cứ nắm giữ hiện nay, nghi phạm đã rời khỏi địa phương.\"",
            options: [
                "A. 目前",
                "B. 现在",
                "C. 极其",
                "D. 可见"
            ],
            answer: 0,
            explain: '"Currently/At present" (目前) thường được dùng làm định ngữ đứng trước danh từ trong văn viết trang trọng (目前掌握的证据), mang sắc thái khách quan và trang trọng hơn "现在".'
        },
        {
            q: "Chọn câu dùng ĐÚNG ngữ pháp với từ \"极其\":",
            context: "Xét vị trí ngữ pháp và đặc điểm cấu tạo câu của phó từ \"极其\".",
            options: [
                "A. 这幅抽象画是极其的。",
                "B. 这个项目的进展极其顺利。",
                "C. 哪怕极其困难，他极其不放弃。",
                "D. 老师极其了我的建议。"
            ],
            answer: 1,
            explain: '"极其" là phó từ đứng trước tính từ song âm tiết hoặc động từ tâm lý (极其顺利 - cực kỳ thuận lợi). A sai vì "极其" không làm vị ngữ đứng trước "的"; C sai vì dùng "极其" trước động từ hành vi "放弃" là không hợp lệ; D sai vì "极其" không phải là động từ.'
        },
        {
            q: "Điền liên từ phù hợp vào chỗ trống: \"________这幅画的布局有些凌乱，他________能感受到作者的用心。\"",
            context: "Ý nghĩa: \"Cho dù bố cục bức tranh này hơi lộn xộn, anh ấy vẫn có thể cảm nhận được tâm huyết của tác giả.\"",
            options: [
                "A. 哪怕 …… 也",
                "B. 对 …… 来说",
                "C. 极其 …… 的",
                "D. 无论 …… 都"
            ],
            answer: 0,
            explain: 'Cấu trúc giả định nhượng bộ "哪怕……也" (Cho dù... vẫn) là phù hợp nhất để nối hai phân câu biểu thị sự giả định tương phản.'
        },
        {
            q: "Cấu trúc \"对……来说\" bị dùng SAI trong câu nào dưới đây?",
            context: "Khảo sát đối tượng tiếp nhận và giới hạn ý nghĩa của \"对……来说\".",
            options: [
                "A. 对我来说，古典音乐具有极其神秘的魅力。",
                "B. 对这幅画来说，它是出自一位业余画家之手。",
                "C. 对大学生来说，课外业余活动是极好的锻炼机会。",
                "D. 对学习汉语的人来说，汉字的书写是一个巨大的挑战。"
            ],
            answer: 1,
            explain: 'Cấu trúc "对……来说" dùng để nêu lên góc nhìn, nhận định chủ quan đối với một đối tượng (thường là con người hoặc nhóm người). Bản thân "bức tranh này" (phương án B) là vật thể thụ động, không có nhận định chủ quan, nên dùng cấu trúc này ở đây là sai ngữ pháp.'
        }
    ];

    let current = 0;
    let score = 0;
    let answered = false;

    function startGame() {
        current = 0;
        score = 0;
        answered = false;
        document.getElementById('resultScreen').style.display = 'none';
        document.getElementById('quizCard').style.display = 'flex';
        renderQuestion();
    }

    function renderQuestion() {
        answered = false;
        const q = questions[current];
        const card = document.getElementById('quizCard');
        const total = questions.length;

        // Update progress
        document.getElementById('progressFill').style.width = (current / total * 100) + '%';
        document.getElementById('progressLabel').innerText = current + ' / ' + total;

        card.innerHTML = `
            <div class="q-number">CÂU ${current + 1} / ${total}</div>
            <div class="q-text">${q.q}</div>
            <div class="q-context">
                <strong>Gợi ý ngữ cảnh:</strong><br>
                <span>${q.context}</span>
            </div>

            <div class="options-grid" id="optionsGrid">
                ${q.options.map((opt, i) => `
                    <button class="opt-btn" id="opt${i}" onclick="selectAnswer(${i})">${opt}</button>
                `).join('')}
            </div>
            <div class="feedback-box" id="feedbackBox"></div>
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
                ${current < total - 1 ? 'Câu tiếp theo →' : 'Xem kết quả 🏆'}
            </button>
        `;
    }

    function selectAnswer(idx) {
        if (answered) return;
        answered = true;

        const q = questions[current];
        const correct = q.answer;
        const fb = document.getElementById('feedbackBox');

        document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);

        document.getElementById('opt' + idx).classList.add(idx === correct ? 'correct' : 'wrong');
        if (idx !== correct) {
            document.getElementById('opt' + correct).classList.add('reveal');
        }

        if (idx === correct) {
            score++;
            fb.className = 'feedback-box correct';
            fb.innerHTML = '✅ <strong>Chính xác!</strong> ' + q.explain;
        } else {
            fb.className = 'feedback-box wrong';
            fb.innerHTML = '❌ <strong>Chưa đúng.</strong> ' + q.explain;
        }
        fb.style.display = 'block';

        const nextBtn = document.getElementById('nextBtn');
        nextBtn.style.display = 'block';
    }

    function nextQuestion() {
        current++;
        if (current < questions.length) {
            renderQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quizCard').style.display = 'none';
        document.getElementById('progressFill').style.width = '100%';
        document.getElementById('progressLabel').innerText = questions.length + ' / ' + questions.length;

        const pct = Math.round(score / questions.length * 100);
        let emoji = '💪', msg = '';
        if (pct === 100) { emoji = '🏆'; msg = 'Tuyệt hảo! Bạn đã nắm chắc toàn bộ ngữ pháp của bài học!'; }
        else if (pct >= 80) { emoji = '🌟'; msg = 'Rất tốt! Bạn sử dụng cấu trúc tương đối thành thạo rồi.'; }
        else if (pct >= 60) { emoji = '📖'; msg = 'Đạt yêu cầu! Hãy ôn luyện lại các câu chưa đúng nhé.'; }
        else { emoji = '🔁'; msg = 'Hãy đọc kỹ giải thích ngữ pháp và thử lại nhé!'; }

        document.getElementById('resultEmoji').innerText = emoji;
        document.getElementById('scoreRing').innerText = pct + '%';
        document.getElementById('resultMsg').innerText = `Bạn làm đúng ${score}/${questions.length} câu. ${msg}`;
        document.getElementById('resultScreen').style.display = 'block';
    }

    startGame();
    </script>
</body>
</html>
