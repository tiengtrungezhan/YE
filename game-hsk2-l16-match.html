<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 2 Bài 16</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>

 "shí", "meaning": "thời gian, khi, lúc", "type": "Danh từ", "ex_cn": "不在家的时候，他在公司。", "ex_py": "Bú zài jiā de shíhou, tā zài gōngsī.", "ex_vn": "Lúc không ở nhà, anh ấy ở công ty.", "lesson": "16"}, {"hanzi": "有时", "pinyin": "yǒushí", "meaning": "có lúc, thỉnh thoảng", "type": "Phó từ", "ex_cn": "他有时去超市。", "ex_py": "Tā yǒushí qù chāoshì.", "ex_vn": "Anh ấy thỉnh thoảng đi siêu thị.", "lesson": "16"}, {"hanzi": "周", "pinyin": "zhōu", "meaning": "tuần", "type": "Danh từ", "ex_cn": "下一周我要考试。", "ex_py": "Xià yì zhōu wǒ yào kǎoshì.", "ex_vn": "Tuần tới tôi phải thi.", "lesson": "16"}, {"hanzi": "花", "pinyin": "huā", "meaning": "hoa, tiêu (tiền/thời gian)", "type": "Danh từ/Động từ", "ex_cn": "桌子上有一些花。", "ex_py": "Zhuōzi shang yǒu yìxiē huā.", "ex_vn": "Trên bàn có mấy bông hoa.", "lesson": "16"}, {"hanzi": "间", "pinyin": "jiān", "meaning": "gian (phòng)", "type": "Lượng từ", "ex_cn": "这间房很漂亮。", "ex_py": "Zhè jiān fáng hěn piàoliang.", "ex_vn": "Căn phòng này rất đẹp.", "lesson": "16"}, {"hanzi": "红茶", "pinyin": "hóngchá", "meaning": "hồng trà", "type": "Danh từ", "ex_cn": "你喜欢喝红茶吗？", "ex_py": "Nǐ xǐhuan hē hóngchá ma?", "ex_vn": "Bạn có thích uống hồng trà không?", "lesson": "16"}, {"hanzi": "绿茶", "pinyin": "lǜchá", "meaning": "trà xanh", "type": "Danh từ", "ex_cn": "我不喜欢喝绿茶。", "ex_py": "Wǒ bù xǐhuan hē lǜchá.", "ex_vn": "Tôi không thích uống trà xanh.", "lesson": "16"}, {"hanzi": "绿色", "pinyin": "lǜsè", "meaning": "màu xanh lá cây", "type": "Danh từ", "ex_cn": "他穿着绿色的衣服。", "ex_py": "Tā chuānzhe lǜsè de yīfu.", "ex_vn": "Anh ấy mặc bộ quần áo màu xanh lá cây.", "lesson": "16"}, {"hanzi": "左", "pinyin": "zuǒ", "meaning": "bên trái", "type": "Danh từ", "ex_cn": "他在我左边。", "ex_py": "Tā zài wǒ zuǒbiān.", "ex_vn": "Anh ấy ở bên trái tôi.", "lesson": "16"}, {"hanzi": "点", "pinyin": "diǎn", "meaning": "điểm, chút, giờ", "type": "Danh từ/Lượng từ", "ex_cn": "现在三点。", "ex_py": "Xiànzài sān diǎn.", "ex_vn": "Bây giờ là 3 giờ.", "lesson": "16"}, {"hanzi": "名", "pinyin": "míng", "mean 通很方便。", "ex_py": "Zhèlǐ jiāotōng hěn fāngbiàn.", "ex_vn": "Giao thông ở đây rất thuận tiện.", "lesson": "16"}, {"hanzi": "水果", "pinyin": "shuǐguǒ", "meaning": "hoa quả, trái cây", "type": "Danh từ", "ex_cn": "买一些水果。", "ex_py": "Mǎi yìxiē shuǐguǒ.", "ex_vn": "Mua một ít hoa quả.", "lesson": "16"}, {"hanzi": "习惯", "pinyin": "xíguàn", "meaning": "thói quen, quen với", "type": "Danh từ/Động từ", "ex_cn": "他习惯早起。", "ex_py": "Tā xíguàn zǎoqǐ.", "ex_vn": "Anh ấy có thói quen dậy sớm.", "lesson": "16"}, {"hanzi": "以前", "pinyin": "yǐqián", "meaning": "trước đây, trước kia", "type": "Danh từ", "ex_cn": "我以前住在中国。", "ex_py": "Wǒ yǐqián zhù zài Zhōngguó.", "ex_vn": "Trước đây tôi sống ở Trung Quốc.", "lesson": "16"}, {"hanzi": "刚才", "pinyin": "gāngcái", "meaning": "vừa nãy, mới đây", "type": "Danh từ", "ex_cn": "刚才你去哪儿了？", "ex_py": "Gāngcái nǐ qù nǎr le?", "ex_vn": "Vừa nãy bạn đi đâu thế?", "lesson": "16"}, {"hanzi": "讲", "pinyin": "jiǎng", "meaning": "nói, kể, giảng giải", "type": "Động từ", "ex_cn": "他在讲故事。", "ex_py": "Tā zài jiǎng gùshì.", "ex_vn": "Anh ấy đang kể chuyện.", "lesson": "16"}, {"hanzi": "简单", "pinyin": "jiǎndān", "meaning": "đơn giản", "type": "Tính từ", "ex_cn": "这道题很简单。", "ex_py": "Zhè dào tí hěn jiǎndān.", "ex_vn": "Câu hỏi này rất đơn giản.", "lesson": "16"}, {"hanzi": "难", "pinyin": "nán", "meaning": "khó", "type": "Tính từ", "ex_cn": "学习汉语不难。", "ex_py": "Xuéxí Hànyǔ bù nán.", "ex_vn": "Học tiếng Trung không khó.", "lesson": "16"}, {"hanzi": "打算", "pinyin": "dǎsuàn", "meaning": "dự định, kế hoạch", "type": "Động từ/Danh từ", "ex_cn": "周末你有什么打算？", "ex_py": "Zhōumò nǐ yǒu shénme dǎsuàn?", "ex_vn": "Cuối tuần bạn có dự định gì?", "lesson": "16"}, {"hanzi": "会", "pinyin": "huì", "meaning": "biết, sẽ", "type": "Động từ", "ex_cn": "我会说中文。", "ex_py": "Wǒ huì shuō Zhōngwén.", "ex_vn": "Tôi biết nói tiếng Trung.", "lesson": "16"}, {"hanzi": "老", "pinyin": "lǎo", "meaning": "già, cũ, luôn luôn", "type": "Tính từ", "ex_cn": "张老师是我老朋友。", "ex_py": "Zhāng lǎoshī shì wǒ lǎo péngyou.", "ex_vn": "Thầy Trương là bạn cũ của tôi.", "lesson": "16"}, {"hanzi": "总是", "pinyin": "zǒngshì", "meaning": "luôn luôn", "type": "Phó từ", "ex_cn": "他总是很忙。", "ex_py": "Tā zǒngshì hěn máng.", "ex_vn": "Anh ấy luôn luôn rất bận.", "lesson": "16"}, {"hanzi": "还是", "pinyin": "háishì", "meaning": "hay là, vẫn còn", "type": "Phó từ", "ex_cn": "他是老师还是学生？", "ex_py": "Tā shì lǎoshī háishì xuésheng?", "ex_vn": "Anh ấy là giáo viên hay học sinh?", "lesson": "16"}, {"hanzi": "或者", "pinyin": "huòzhě", "meaning": "hoặc là", "type": "Liên từ", "ex_cn": "喝茶或者喝咖啡。", "ex_py": "Hē chá huòzhě hē kāfēi.", "ex_vn": "Uống trà hoặc là uống cà phê.", "lesson": "16"}, {"hanzi": "碗", "pinyin": "wǎn", "meaning": "bát, chén", "type": "Danh từ/Lượng từ", "ex_cn": "一碗米饭。", "ex_py": "Yì wǎn mǐfàn.", "ex_vn": "Một bát cơm.", "lesson": "16"}, {"hanzi": "样", "pinyin": "yàng", "meaning": "kiểu, mẫu, loại", "type": "Danh từ", "ex_cn": "那是他喜欢的样。", "ex_py": "Nà shì tā xǐhuan de yàng.", "ex_vn": "Đó là kiểu anh ấy thích.", "lesson": "16"}, {"hanzi": "楼", "pinyin": "lóu", "meaning": "lầu, tầng, tòa nhà", "type": "Danh từ", "ex_cn": "他在三楼。", "ex_py": "Tā zài sān lóu.", "ex_vn": "Anh ấy ở tầng 3.", "lesson": "16"}, {"hanzi": "把", "pinyin": "bǎ", "meaning": "lượng từ; giới từ (câu chữ ba)", "type": "Lượng từ/Giới từ", "ex_cn": "请把书打开。", "ex_py": "Qǐng bǎ shū dǎkāi.", "ex_vn": "Mời mở sách ra.", "lesson": "16"}, {"hanzi": "出来", "pinyin": "chūlái", "meaning": "ra đây, xuất hiện", "type": "Động từ", "ex_cn": "请你出来。", "ex_py": "Qǐng nǐ chūlái.", "ex_vn": "Mời bạn ra đây.", "lesson": "16"}, {"hanzi": "上来", "pinyin": "shànglái", "meaning": "lên đây", "type": "Động từ", "ex_cn": "快上来吧。", "ex_py": "Kuài shànglái ba.", "ex_vn": "Mau lên đây đi.", "lesson": "16"}, {"hanzi": "下来", "pinyin": "xiàlái", "meaning": "xuống đây, tiếp tục", "type": "Động từ", "ex_cn": "他从楼上下来了。", "ex_py": "Tā cóng lóushàng xiàlái le.", "ex_vn": "Anh ấy từ trên tầng đi xuống rồi.", "lesson": "16"}, {"hanzi": "进来", "pinyin": "jìnlái", "meaning": "vào đây", "type": "Động từ", "ex_cn": "请进来坐。", "ex_py": "Qǐng jìnlái zuò.", "ex_vn": "Mời vào trong ngồi.", "lesson": "16"}, {"hanzi": "里面", "pinyin": "lǐmiàn", "meaning": "bên trong", "type": "Danh từ", "ex_cn": "书在书包里面。", "ex_py": "Shū zài shūbāo lǐmiàn.", "ex_vn": "Sách ở trong cặp sách.", "lesson": "16"}, {"hanzi": "本子", "pinyin": "běnzi", "meaning": "vở, sổ tay", "type": "Danh từ", "ex_cn": "这是我的本子。", "ex_py": "Zhè shì wǒ de běnzi.", "ex_vn": "Đây là cuốn vở của tôi.", "lesson": "16"}, {"hanzi": "笔", "pinyin": "bǐ", "meaning": "bút", "type": "Danh từ", "ex_cn": "用笔写字。", "ex_py": "Yòng bǐ xiě zì.", "ex_vn": "Dùng bút viết chữ.", "lesson": "16"}, {"hanzi": "书包", "pinyin": "shūbāo", "meaning": "cặp sách", "type": "Danh từ", "ex_cn": "我的书包在那儿。", "ex_py": "Wǒ de shūbāo zài nàr.", "ex_vn": "Cặp sách của tôi ở đó.", "lesson": "16"}, {"hanzi": "路上", "pinyin": "lùshàng", "meaning": "trên đường", "type": "Danh từ", "ex_cn": "我在路上。", "ex_py": "Wǒ zài lùshàng.", "ex_vn": "Tôi đang ở trên đường.", "lesson": "16"}, {"hanzi": "门口", "pinyin": "ménkǒu", "meaning": "cổng, lối vào", "type": "Danh từ", "ex_cn": "我在学校门口等你。", "ex_py": "Wǒ zài xuéxiào ménkǒu děng nǐ.", "ex_vn": "Tôi đợi bạn ở cổng trường.", "lesson": "16"}, {"hanzi": "门票", "pinyin": "ménpiào", "meaning": "vé vào cửa", "type": "Danh từ", "ex_cn": "这张门票多少钱？", "ex_py": "Zhè zhāng ménpiào duōshǎo qián?", "ex_vn": "Chiếc vé này bao nhiêu tiền?", "lesson": "16"}, {"hanzi": "不好意思", "pinyin": "bùhǎoyìsi", "meaning": "ngại quá, xin lỗi", "type": "Cụm từ", "ex_cn": "不好意思，我迟到了。", "ex_py": "Bùhǎoyìsi, wǒ chídào le.", "ex_vn": "Ngại quá, tôi đến muộn rồi.", "lesson": "16"}, {"hanzi": "没意思", "pinyin": "méiyìsi", "meaning": "không thú vị, vô vị", "type": "Tính từ", "ex_cn": "这个电影没意思。", "ex_py": "Zhège diànyǐng méiyìsi.", "ex_vn": "Bộ phim này không thú vị.", "lesson": "16"}, {"hanzi": "有意思", "pinyin": "yǒuyìsi", "meaning": "thú vị, có ý nghĩa", "type": "Tính từ", "ex_cn": "你很有意思。", "ex_py": "Nǐ hěn yǒuyìsi.", "ex_vn": "Bạn rất thú vị.", "lesson": "16"}, {"hanzi": "但", "pinyin": "dàn", "meaning": "nhưng", "type": "Liên từ", "ex_cn": "虽然很累，但我很快乐。", "ex_py": "Suīrán hěn lèi, dàn wǒ hěn kuàilè.", "ex_vn": "Tuy mệt nhưng tôi rất vui.", "lesson": "16"}, {"hanzi": "过年", "pinyin": "guònián", "meaning": "ăn tết, đón năm mới", "type": "Động từ", "ex_cn": "过年回家看父母。", "ex_py": "Guònián huí jiā kàn fùmǔ.", "ex_vn": "Ăn tết về nhà thăm bố mẹ.", "lesson": "16"}, {"hanzi": "站", "pinyin": "zhàn", "meaning": "trạm, đứng", "type": "Danh từ/Động từ", "ex_cn": "车站在那儿。", "ex_py": "Chēzhàn zài nàr.", "ex_vn": "Trạm xe ở đằng kia.", "lesson": "16"}, {"hanzi": "车站", "pinyin": "chēzhàn", "meaning": "bến xe, nhà ga", "type": "Danh từ", "ex_cn": "我在车站等你。", "ex_py": "Wǒ zài chēzhàn děng nǐ.", "ex_vn": "Tôi đợi bạn ở bến xe.", "lesson": "16"}, {"hanzi": "过去", "pinyin": "guòqù", "meaning": "đi qua, quá khứ", "type": "Danh từ/Động từ", "ex_cn": "别再想过去的事。", "ex_py": "Bié zài xiǎng guòqù de shì.", "ex_vn": "Đừng nghĩ về những chuyện quá khứ nữa.", "lesson": "16"}, {"hanzi": "回来", "pinyin": "huílái", "meaning": "quay lại, trở về", "type": "Động từ", "ex_cn": "你什么时候回来？", "ex_py": "Nǐ shénme shíhou huílái?", "ex_vn": "Khi nào bạn về?", "lesson": "16"}, {"hanzi": "回去", "pinyin": "huíqù", "meaning": "đi về", "type": "Động từ", "ex_cn": "我们要回去了。", "ex_py": "Wǒmen yào huíqù le.", "ex_vn": "Chúng tôi phải về rồi.", "lesson": "16"}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
