<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 2 Bài 9</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk2.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 9</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "错", "pinyin": "cuò", "meaning": "sai", "lesson": "9", "type": "Tính từ", "ex_cn": "这个不错。", "ex_py": "Zhè ge búcuò.", "ex_vn": "Cái này không tệ."}, {"hanzi": "从", "pinyin": "cóng", "meaning": "từ", "lesson": "9", "type": "Giới từ", "ex_cn": "从家到学校。", "ex_py": "Cóng jiā dào xuéxiào.", "ex_vn": "Từ nhà đến trường."}, {"hanzi": "跳舞", "pinyin": "tiào wǔ", "meaning": "nhảy múa", "lesson": "9", "type": "Động từ", "ex_cn": "他喜欢跳舞。", "ex_py": "Tā xǐhuan tiàowǔ.", "ex_vn": "Anh ấy thích khiêu vũ."}, {"hanzi": "第一", "pinyin": "dì yī", "meaning": "thứ nhất", "lesson": "9", "type": "Danh từ", "ex_cn": "第一个。", "ex_py": "Dì yī ge.", "ex_vn": "Cái đầu tiên."}, {"hanzi": "希望", "pinyin": "xīwàng", "meaning": "hy vọng", "lesson": "9", "type": "Động từ", "ex_cn": "我希望去。", "ex_py": "Wǒ xīwàng qù.", "ex_vn": "Tôi hy vọng được đi."}, {"hanzi": "问题", "pinyin": "wèntí", "meaning": "vấn đề, câu hỏi", "lesson": "9", "type": "Danh từ", "ex_cn": "没有问题。", "ex_py": "Méiyǒu wèntí.", "ex_vn": "Không có vấn đề gì."}, {"hanzi": "欢迎", "pinyin": "huānyíng", "meaning": "hoan nghênh", "lesson": "9", "type": "Danh từ", "ex_cn": "欢迎你。", "ex_py": "Huānyíng nǐ.", "ex_vn": "Chào mừng bạn."}, {"hanzi": "上班", "pinyin": "shàng bān", "meaning": "đi làm", "lesson": "9", "type": "Động từ", "ex_cn": "我去上班。", "ex_py": "Wǒ qù shàngbān.", "ex_vn": "Tôi đi làm."}, {"hanzi": "懂", "pinyin": "dǒng", "meaning": "hiểu", "lesson": "9", "type": "Động từ", "ex_cn": "我不懂。", "ex_py": "Wǒ bù dǒng.", "ex_vn": "Tôi không hiểu."}, {"hanzi": "完", "pinyin": "wán", "meaning": "xong, hết", "lesson": "9", "type": "Động từ", "ex_cn": "我看完了。", "ex_py": "Wǒ kàn wán le.", "ex_vn": "Tôi xem xong rồi."}, {"hanzi": "题", "pinyin": "tí", "meaning": "câu hỏi, đề bài", "lesson": "9", "type": "Danh từ", "ex_cn": "他在做题。", "ex_py": "Tā zài zuò tí.", "ex_vn": "Anh ấy đang làm bài tập."}, {"hanzi": "词", "pinyin": "cí", "meaning": "từ, từ vựng", "lesson": "9", "type": "Bổ sung 3.0", "ex_cn": "这个词我不认识。", "ex_py": "Zhège cí wǒ bú rènshi.", "ex_vn": "Từ này tôi không biết."}, {"hanzi": "从小", "pinyin": "cóngxiǎo", "meaning": "từ nhỏ", "lesson": "9", "type": "Bổ sung 3.0", "ex_cn": "他从小就喜欢音乐。", "ex_py": "Tā cóngxiǎo jiù xǐhuan yīnyuè.", "ex_vn": "Anh ấy từ nhỏ đã thích âm nhạc."}, {"hanzi": "高中", "pinyin": "gāozhōng", "meaning": "trung học phổ thông", "lesson": "9", "type": "Bổ sung 3.0", "ex_cn": "他是高中生。", "ex_py": "Tā shì gāozhōngshēng.", "ex_vn": "Cậu ấy là học sinh cấp 3."}, {"hanzi": "开学", "pinyin": "kāixué", "meaning": "khai giảng", "lesson": "9", "type": "Bổ sung 3.0", "ex_cn": "明天就开学了。", "ex_py": "Míngtiān jiù kāixué le.", "ex_vn": "Ngày mai là khai giảng rồi."}, {"hanzi": "考", "pinyin": "kǎo", "meaning": "thi", "lesson": "9", "type": "Bổ sung 3.0", "ex_cn": "你考试考得怎么样？", "ex_py": "Nǐ kǎoshì kǎo de zěnmeyàng?", "ex_vn": "Bạn thi cử thế nào?"}, {"hanzi": "忘", "pinyin": "wàng", "meaning": "quên", "lesson": "9", "type": "Bổ sung 3.0", "ex_cn": "我忘了带钱包。", "ex_py": "Wǒ wàng le dài qiánbāo.", "ex_vn": "Tôi quên mang ví tiền rồi."}, {"hanzi": "网上", "pinyin": "wǎngshàng", "meaning": "trên mạng", "lesson": "9", "type": "Bổ sung 3.0", "ex_cn": "我在网上买东西。", "ex_py": "Wǒ zài wǎngshàng mǎi dōngxi.", "ex_vn": "Tôi mua đồ trên mạng."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
