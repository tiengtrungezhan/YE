<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trùm Từ Vựng - HSK 1 Bài 5</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-wrapper { max-width: 600px; margin: 0 auto; padding: 2rem; text-align: center; }
        .quiz-card { background: var(--white); border-radius: 30px; padding: 3rem 2rem; box-shadow: var(--shadow); margin-top: 2rem; min-height: 450px; display: flex; flex-direction: column; justify-content: center; position: relative; }
        .progress-container { width: 100%; height: 8px; background: #eee; border-radius: 4px; margin-bottom: 2rem; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary-color); width: 0%; transition: width 0.3s; }
        .question-text { font-size: 1.5rem; font-weight: 700; color: var(--text-color); margin-bottom: 1rem; }
        .sub-text { font-size: 1.1rem; color: #666; margin-bottom: 2rem; line-height: 1.6; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
        .option-btn { padding: 1.2rem; background: #f8fbfe; border: 2px solid #eef2f5; border-radius: 15px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .option-btn:hover:not(:disabled) { border-color: var(--primary-color); background: #f0f7f9; }
        .option-btn.correct { background: #d4edda !important; border-color: #28a745 !important; color: #155724 !important; }
        .option-btn.wrong { background: #f8d7da !important; border-color: #dc3545 !important; color: #721c24 !important; }
        .typing-input { width: 100%; padding: 1.2rem; border: 2px solid #ddd; border-radius: 15px; font-size: 1.4rem; text-align: center; margin-bottom: 1.5rem; transition: 0.3s; }
        .typing-input:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 10px rgba(255,107,107,0.1); }
        .submit-btn { padding: 1.2rem; background: var(--primary-color); color: white; border: none; border-radius: 15px; font-weight: 700; font-size: 1.1rem; cursor: pointer; width: 100%; transition: 0.3s; }
        .submit-btn:hover { background: var(--primary-dark); transform: translateY(-2px); }
        .phrase-box { display: flex; flex-wrap: wrap; gap: 0.8rem; justify-content: center; margin: 1.5rem 0; min-height: 80px; padding: 1rem; border: 2px dashed #ffe4e6; border-radius: 20px; background: #fffafb; }
        .phrase-item { padding: 0.8rem 1.2rem; background: white; border: 2px solid #ffccd5; border-radius: 12px; cursor: pointer; font-size: 1.2rem; font-weight: 600; color: #e91e63; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .phrase-item:hover { background: #fff0f3; transform: scale(1.05); }
        .blank-text { font-size: 1.8rem; letter-spacing: 2px; color: var(--text-color); margin-bottom: 2rem; font-weight: bold; }
        .blank-fill { color: var(--primary-color); border-bottom: 3px solid var(--primary-color); padding: 0 10px; min-width: 60px; display: inline-block; }
        .result-screen { display: none; }
        .score-circle { width: 150px; height: 150px; border-radius: 50%; border: 10px solid var(--primary-light); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 800; margin: 2rem auto; color: var(--primary-dark); }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">

        <a href="game-hsk1.html" class="back-btn">← Quay lại</a>

                    <div id="progress-text" style="font-weight: bold; color: var(--primary-dark); font-size: 1.1rem; min-width: 50px; text-align: right;"></div>

                <div class="quiz-card" id="quiz-card"></div>

            <div id="result-ui" class="result-screen">

                    <div class="score-circle" id="final-score">0%</div>
                    <p id="score-text"></p>

                    <a href="game-hsk1-l5-match.html" class="submit-btn" style="margin-top: 1rem; background: #e65100; text-decoration: none; display: block; line-height: 1.5; padding: 1rem 0; text-align: center;">Thử thách Ghép Đôi</a>

    </div>
    <script>
        const vocabulary = [{"hanzi": "八", "pinyin": "bā", "meaning": "số 8", "lesson": "5", "type": "Số từ"}, {"hanzi": "多", "pinyin": "duō", "meaning": "nhiều", "lesson": "5", "type": "Tính từ", "ex_cn": "他朋友很多。", "ex_py": "Tā péngyou hěn duō.", "ex_vn": "Bạn của anh ấy rất nhiều."}, {"hanzi": "大", "pinyin": "dà", "meaning": "lớn", "lesson": "5", "type": "Tính từ", "ex_cn": "中国很大。", "ex_py": "Zhōngguó hěn dà.", "ex_vn": "Trung Quốc rất lớn."}, {"hanzi": "个", "pinyin": "gè", "meaning": "cái", "lesson": "5", "type": "Lượng từ", "ex_cn": "三个学生。", "ex_py": "Sān ge xuésheng.", "ex_vn": "Ba học sinh."}, {"hanzi": "九", "pinyin": "jiǔ", "meaning": "số 9", "lesson": "5", "type": "Số từ"}, {"hanzi": "几", "pinyin": "jǐ", "meaning": "mấy", "lesson": "5", "type": "Danh từ", "ex_cn": "你几岁？", "ex_py": "Nǐ jǐ suì?", "ex_vn": "Cháu mấy tuổi rồi?"}, {"hanzi": "了", "pinyin": "le", "meaning": "được dùng để chỉ sự thay đổi", "lesson": "5", "type": "Trợ từ", "ex_cn": "他三岁了。", "ex_py": "Tā sān suì le.", "ex_vn": "Nó ba tuổi rồi."}, {"hanzi": "六", "pinyin": "liù", "meaning": "số 6", "lesson": "5", "type": "Số từ"}, {"hanzi": "女儿", "pinyin": "nǚ'ér", "meaning": "con gái", "lesson": "5", "type": "Danh từ", "ex_cn": "他有一个女儿。", "ex_py": "Tā yǒu yí ge nǚ\"ér.", "ex_vn": "Anh ấy có một người con gái."}, {"hanzi": "七", "pinyin": "qī", "meaning": "số 7", "lesson": "5", "type": "Số từ"}, {"hanzi": "十", "pinyin": "shí", "meaning": "số 10", "lesson": "5", "type": "Số từ"}, {"hanzi": "岁", "pinyin": "suì", "meaning": "tuổi", "lesson": "5", "type": "Danh từ", "ex_cn": "我二十岁。", "ex_py": "Wǒ èrshí suì.", "ex_vn": "Tôi hai mươi tuổi."}, {"hanzi": "四", "pinyin": "sì", "meaning": "số 4", "lesson": "5", "type": "Số từ"}, {"hanzi": "五", "pinyin": "wǔ", "meaning": "năm", "lesson": "5", "type": "Số từ"}, {"hanzi": "一", "pinyin": "yī", "meaning": "số 1", "lesson": "5", "type": "Số từ", "ex_cn": "我数一，二，三。", "ex_py": "Wǒ shǔ yī, èr, sān.", "ex_vn": "Tôi đếm một, hai, ba."}, {"hanzi": "有", "pinyin": "yǒu", "meaning": "có", "lesson": "5", "type": "Động từ", "ex_cn": "我有三个哥哥。", "ex_py": "Wǒ yǒu sān ge gēge.", "ex_vn": "Tôi có ba người anh trai."}, {"hanzi": "二", "pinyin": "èr", "meaning": "số 2", "lesson": "5", "type": "Số từ", "ex_cn": "我数一，二，三。", "ex_py": "Wǒ shǔ yī, èr, sān.", "ex_vn": "Tôi đếm một, hai, ba."}, {"hanzi": "爷爷", "pinyin": "yéye", "meaning": "ông nội", "lesson": "5", "type": "Danh từ", "ex_cn": "他是我爷爷。", "ex_py": "Tā shì wǒ yéye.", "ex_vn": "Ông ấy là ông nội tôi."}, {"hanzi": "奶奶", "pinyin": "nǎinai", "meaning": "bà nội", "lesson": "5", "type": "Danh từ", "ex_cn": "她是我奶奶。", "ex_py": "Tā shì wǒ nǎinai.", "ex_vn": "Bà ấy là bà nội tôi."}, {"hanzi": "外公", "pinyin": "wàigōng", "meaning": "ông ngoại", "lesson": "5", "type": "Danh từ", "ex_cn": "他是我外公。", "ex_py": "Tā shì wǒ wàigōng.", "ex_vn": "Ông ấy là ông ngoại tôi."}, {"hanzi": "外婆", "pinyin": "wàipó", "meaning": "bà ngoại", "lesson": "5", "type": "Danh từ", "ex_cn": "她是我外婆。", "ex_py": "Tā shì wǒ wàipó.", "ex_vn": "Bà ấy là bà ngoại tôi."}, {"hanzi": "爸爸", "pinyin": "bàba", "meaning": "bố, cha", "lesson": "5", "type": "Danh từ", "ex_cn": "他是我爸爸。", "ex_py": "Tā shì wǒ bàba.", "ex_vn": "Anh ấy là bố tôi."}, {"hanzi": "妈妈", "pinyin": "māma", "meaning": "mẹ", "lesson": "5", "type": "Danh từ", "ex_cn": "她是我妈妈。", "ex_py": "Tā shì wǒ māma.", "ex_vn": "Bà ấy là mẹ tôi."}, {"hanzi": "弟弟", "pinyin": "dìdi", "meaning": "em trai", "lesson": "5", "type": "Danh từ", "ex_cn": "他是我弟弟。", "ex_py": "Tā shì wǒ dìdi.", "ex_vn": "Anh ấy là em trai tôi."}, {"hanzi": "哥哥", "pinyin": "gēge", "meaning": "anh trai", "lesson": "5", "type": "Danh từ", "ex_cn": "他是我哥哥。", "ex_py": "Tā shì wǒ gēge.", "ex_vn": "Anh ấy là anh trai tôi."}, {"hanzi": "妹妹", "pinyin": "mèimei", "meaning": "em gái", "lesson": "5", "type": "Danh từ", "ex_cn": "她是我妹妹。", "ex_py": "Tā shì wǒ mèimei.", "ex_vn": "Cô ấy là em gái tôi."}, {"hanzi": "姐姐", "pinyin": "jiějie", "meaning": "chị gái", "lesson": "5", "type": "Danh từ", "ex_cn": "她是我姐姐。", "ex_py": "Tā shì wǒ jiějie.", "ex_vn": "Cô ấy là chị gái tôi."}, {"hanzi": "兄弟姐妹", "pinyin": "xiōngdì jiěmèi", "meaning": "anh chị em", "lesson": "5", "type": "Danh từ", "ex_cn": "我有兄弟姐妹。", "ex_py": "Wǒ yǒu xiōngdì jiěmèi.", "ex_vn": "Tôi có anh chị em."}, {"hanzi": "独生女", "pinyin": "dúshēngnǚ", "meaning": "con gái duy nhất", "lesson": "5", "type": "Danh từ", "ex_cn": "她是独生女。", "ex_py": "Tā shì dúshēngnǚ.", "ex_vn": "Cô ấy là con gái một."}, {"hanzi": "独生子", "pinyin": "dúshēngzǐ", "meaning": "con trai duy nhất", "lesson": "5", "type": "Danh từ", "ex_cn": "他是独生子。", "ex_py": "Tā shì dúshēngzǐ.", "ex_vn": "Anh ấy là con trai một."}, {"hanzi": "男朋友", "pinyin": "nán péngyou", "meaning": "bạn trai", "lesson": "5", "type": "Danh từ", "ex_cn": "他是我男朋友。", "ex_py": "Tā shì wǒ nán péngyou.", "ex_vn": "Anh ấy là bạn trai tôi."}, {"hanzi": "女朋友", "pinyin": "nǚ péngyou", "meaning": "bạn gái", "lesson": "5", "type": "Danh từ", "ex_cn": "她是我女朋友。", "ex_py": "Tā shì wǒ nǚ péngyou.", "ex_vn": "Cô ấy là bạn gái tôi."}, {"hanzi": "丈夫", "pinyin": "zhàngfu", "meaning": "chồng", "lesson": "5", "type": "Danh từ", "ex_cn": "他是我丈夫。", "ex_py": "Tā shì wǒ zhàngfu.", "ex_vn": "Anh ấy là chồng tôi."}, {"hanzi": "妻子", "pinyin": "qīzi", "meaning": "vợ", "lesson": "5", "type": "Danh từ", "ex_cn": "她是我妻子。", "ex_py": "Tā shì wǒ qīzi.", "ex_vn": "Cô ấy là vợ tôi."}, {"hanzi": "儿子", "pinyin": "érzi", "meaning": "con trai", "lesson": "5", "type": "Danh từ", "ex_cn": "他是我儿子。", "ex_py": "Tā shì wǒ érzi.", "ex_vn": "Nó là con trai tôi."}, {"hanzi": "两", "pinyin": "liǎng", "meaning": "hai (số lượng)", "lesson": "5", "type": "Số từ", "ex_cn": "两个哥哥。", "ex_py": "Liǎng ge gēge.", "ex_vn": "Hai người anh trai."}, {"hanzi": "年纪", "pinyin": "niánjì", "meaning": "tuổi tác", "lesson": "5", "type": "Danh từ", "ex_cn": "您多大年纪？", "ex_py": "Nín duōdà niánjì?", "ex_vn": "Ngài bao nhiêu tuổi rồi?"}, {"hanzi": "多大", "pinyin": "duō dà", "meaning": "bao nhiêu tuổi", "lesson": "5", "type": "Cụm từ", "ex_cn": "你多大？", "ex_py": "Nǐ duōdà?", "ex_vn": "Bạn bao nhiêu tuổi?"}, {"hanzi": "今年", "pinyin": "jīnnián", "meaning": "năm nay", "lesson": "5", "type": "Danh từ", "ex_cn": "他今年五岁。", "ex_py": "Tā jīnnián wǔ suì.", "ex_vn": "Năm nay nó 5 tuổi."}, {"hanzi": "去年", "pinyin": "qùnián", "meaning": "năm ngoái", "lesson": "5", "type": "Danh từ", "ex_cn": "去年他四岁。", "ex_py": "Qùnián tā sì suì.", "ex_vn": "Năm ngoái nó 4 tuổi."}, {"hanzi": "明年", "pinyin": "míngnián", "meaning": "năm sau", "lesson": "5", "type": "Danh từ", "ex_cn": "明年他七岁。", "ex_py": "Míngnián tā qī suì.", "ex_vn": "Sang năm nó 7 tuổi."}];
        let currentQuestion = 0, score = 0, questions = [], totalQuestions = 0;

        function initGame() { 
            totalQuestions = Math.min(20, vocabulary.length); 
            questions = generateQuestions(); 
            renderQuestion(); 
        }

        function splitIntoPhrases(sentence, targetWord) {
            // Simple logic to split sentence into meaningful chunks including the target word
            let phrases = [];
            if (sentence.includes(targetWord)) {
                let parts = sentence.split(targetWord);
                if (parts[0]) phrases.push(...splitLogical(parts[0]));
                phrases.push(targetWord);
                if (parts[1]) phrases.push(...splitLogical(parts[1]));
            } else {
                phrases = splitLogical(sentence);
            }
            return phrases.filter(p => p.length > 0 && !/[，。？！、]/.test(p));
        }

        function splitLogical(text) {
            // Split long text into 2-3 char chunks
            let res = [];
            for (let i = 0; i < text.length; i += 3) {
                res.push(text.substr(i, 3));
            }
            return res;
        }

        function generateQuestions() {
            let qs = [], shuffled = [...vocabulary].sort(() => Math.random() - 0.5);
            for (let i = 0; i < totalQuestions; i++) {
                const word = shuffled[i];
                let type;
                
                if (1 === 3) {
                    // For HSK3, use the 3 specific types requested
                    const types = [10, 11, 12]; // 10: Scramble, 11: Translation, 12: Blank
                    type = types[Math.floor(Math.random() * types.length)];
                } else {
                    type = Math.floor(Math.random() * 4); // Old types for HSK1, 2
                }

                let q = { type, word };
                
                if (type <= 2) q.options = generateOptions(word, type);
                if (type === 10) {
                    let sentence = word.ex_cn.replace(/[，。？！、\s]/g, '');
                    let target = word.hanzi;
                    q.phrases = splitIntoPhrases(word.ex_cn, target).sort(() => Math.random() - 0.5);
                    q.correctSentence = sentence;
                }
                if (type === 12) {
                    q.displaySentence = word.ex_cn.replace(word.hanzi, "______");
                    q.options = generateOptions(word, 0); // Hanzi options
                }
                
                qs.push(q);
            }
            return qs;
        }

        function generateOptions(correctWord, type) {
            let options = [correctWord];
            while (options.length < 4 && vocabulary.length >= 4) {
                const rand = vocabulary[Math.floor(Math.random() * vocabulary.length)];
                if (!options.includes(rand)) options.push(rand);
            }
            return options.sort(() => Math.random() - 0.5);
        }

        function renderQuestion() {
            const q = questions[currentQuestion], card = document.getElementById('quiz-card'), progress = document.getElementById('progress');
            progress.style.width = (currentQuestion / totalQuestions) * 100 + '%';
            document.getElementById('progress-text').innerText = (currentQuestion + 1) + '/' + totalQuestions;
            
            let html = '';
            if (q.type === 0) {
                html = `<div class="question-text">Nghe và chọn từ đúng:</div><button class="audio-btn" style="background: #fdf2f8; border: none; font-size: 3rem; cursor: pointer;" onclick="speak('${q.word.hanzi}')">🔊</button><div class="options-grid">${q.options.map(opt => `<button class="option-btn" onclick="checkAnswer('${opt.hanzi}', '${q.word.hanzi}', this)">${opt.hanzi}</button>`).join('')}</div>`;
                setTimeout(() => speak(q.word.hanzi), 500);
            } else if (q.type === 1) {
                html = `<div class="question-text">Từ "${q.word.hanzi}" có nghĩa là gì?</div><div class="options-grid">${q.options.map(opt => `<button class="option-btn" onclick="checkAnswer('${opt.meaning}', '${q.word.meaning}', this)">${opt.meaning}</button>`).join('')}</div>`;
            } else if (q.type === 2) {
                html = `<div class="question-text">Từ "${q.word.hanzi}" có phiên âm là gì?</div><div class="options-grid">${q.options.map(opt => `<button class="option-btn" onclick="checkAnswer('${opt.pinyin}', '${q.word.pinyin}', this)">${opt.pinyin}</button>`).join('')}</div>`;
            } else if (q.type === 3) {
                html = `<div class="question-text">"${q.word.meaning}" trong tiếng Trung là gì?</div><input type="text" class="typing-input" id="typing-ans" placeholder="Nhập Hán tự..."><button class="submit-btn" onclick="checkTyping('${q.word.hanzi}')">Kiểm tra</button>`;
            } 
            // New Types for HSK3
            else if (q.type === 10) {
                html = `<div class="question-text">Sắp xếp câu chính xác:</div><div class="sub-text">Nghĩa: ${q.word.ex_vn}</div><div id="drop-zone" class="phrase-box"></div><div id="drag-zone" class="phrase-box" style="border: none; background: transparent;">${q.phrases.map(p => `<div class="phrase-item" onclick="movePhrase(this, '${q.correctSentence}')">${p}</div>`).join('')}</div>`;
            } else if (q.type === 11) {
                html = `<div class="question-text">Dịch câu sau sang tiếng Trung:</div><div class="sub-text" style="font-size: 1.4rem; color: var(--primary-dark);">${q.word.ex_vn}</div><input type="text" class="typing-input" id="typing-ans" placeholder="Nhập câu tiếng Trung..."><button class="submit-btn" onclick="checkTyping('${q.word.ex_cn.replace(/[，。？！、\s]/g, '')}')">Gửi đáp án</button>`;
            } else if (q.type === 12) {
                html = `<div class="question-text">Điền từ vào ô trống:</div><div class="blank-text">${q.displaySentence.replace("______", "<span class="blank-fill" id="blank-target">?</span>")}</div><div class="sub-text">Nghĩa: ${q.word.ex_vn}</div><div class="options-grid">${q.options.map(opt => `<button class="option-btn" onclick="checkBlank('${opt.hanzi}', '${q.word.hanzi}', this)">${opt.hanzi}</button>`).join('')}</div>`;
            }

            card.innerHTML = html;
        }

        function speak(t) { const m = new SpeechSynthesisUtterance(); m.text = t; m.lang = 'zh-CN'; window.speechSynthesis.speak(m); }
        
        function checkAnswer(s, c, b) {
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach(x => x.disabled = true);
            if (s === c) { b.classList.add('correct'); score++; } 
            else { b.classList.add('wrong'); btns.forEach(x => { if(x.innerText === c) x.classList.add('correct'); }); }
            showNext();
        }

        function checkBlank(s, c, b) {
            const target = document.getElementById('blank-target');
            target.innerText = c;
            checkAnswer(s, c, b);
        }

        function checkTyping(correct) {
            const input = document.getElementById('typing-ans');
            const val = input.value.trim().replace(/[，。？！、\s]/g, '');
            if (val === correct) {
                input.style.borderColor = "#28a745";
                input.style.background = "#d4edda";
                score++;
            } else {
                input.style.borderColor = "#dc3545";
                input.style.background = "#f8d7da";
                const err = document.createElement('div');
                err.style = "color: #dc3545; margin-top: 10px; font-weight: bold;";
                err.innerText = "Đáp án đúng: " + correct;
                input.parentNode.appendChild(err);
            }
            document.querySelector('.submit-btn').disabled = true;
            showNext();
        }

        function movePhrase(el, correct) {
            const dropZone = document.getElementById('drop-zone');
            const dragZone = document.getElementById('drag-zone');
            if (el.parentNode === dragZone) dropZone.appendChild(el);
            else dragZone.appendChild(el);

            const current = Array.from(dropZone.children).map(x => x.innerText).join('');
            if (dragZone.children.length === 0) {
                if (current === correct) {
                    dropZone.style.background = "#d4edda";
                    score++;
                } else {
                    dropZone.style.background = "#f8d7da";
                    const err = document.createElement('div');
                    err.style = "color: #dc3545; margin-top: 10px; font-weight: bold;";
                    err.innerText = "Sai rồi! Câu đúng: " + correct;
                    document.getElementById('quiz-card').appendChild(err);
                }
                showNext();
            }
        }

        function showNext() {
            const btn = document.createElement('button');
            btn.className = "submit-btn";
            btn.style = "margin-top: 1.5rem; background: #4dabf7;";
            btn.innerText = "Tiếp theo ➔";
            btn.onclick = () => {
                currentQuestion++;
                if (currentQuestion < totalQuestions) renderQuestion();
                else showResults();
            };
            document.getElementById('quiz-card').appendChild(btn);
        }

        function showResults() {
            document.getElementById('game-ui').style.display = 'none';
            document.getElementById('result-ui').style.display = 'block';
            document.getElementById('final-score').innerText = Math.round((score/totalQuestions)*100)+'%';
            document.getElementById('score-text').innerText = `Bạn đã hoàn thành ${score}/${totalQuestions} câu hỏi.`;
        }

        initGame();
    </script>
</body>
</html>
