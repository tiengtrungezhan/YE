<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 1 3.0 Bài 13</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk1.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 13</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "可以", "pinyin": "kěyǐ", "meaning": "có thể, được", "lesson": "13", "type": "động từ năng nguyện", "ex_cn": "我可以坐在这里吗？", "ex_py": "Wǒ kěyǐ zuò zài zhèlǐ ma?", "ex_vn": "Tôi có thể ngồi ở đây không?"}, {"hanzi": "再", "pinyin": "zài", "meaning": "thêm, lại, nữa", "lesson": "13", "type": "phó từ", "ex_cn": "再要一个饺子吧。", "ex_py": "Zài yào yí gè jiǎozi ba.", "ex_vn": "Lấy thêm một đĩa sủi cảo nữa đi."}, {"hanzi": "问题", "pinyin": "wèntí", "meaning": "vấn đề, câu hỏi", "lesson": "13", "type": "danh từ", "ex_cn": "你有什么问题吗？", "ex_py": "Nǐ yǒu shénme wèntí ma?", "ex_vn": "Bạn có vấn đề gì không?"}, {"hanzi": "卖", "pinyin": "mài", "meaning": "bán", "lesson": "13", "type": "động từ", "ex_cn": "我想卖这个。", "ex_py": "Wǒ xiǎng mài zhè ge.", "ex_vn": "Tôi muốn bán cái này."}, {"hanzi": "打电话", "pinyin": "dǎ diànhuà", "meaning": "gọi điện thoại", "lesson": "13", "type": "động từ", "ex_cn": "你给老师打电话吧。", "ex_py": "Nǐ gěi lǎoshī dǎ diànhuà ba.", "ex_vn": "Bạn gọi điện thoại cho giáo viên đi."}, {"hanzi": "一下", "pinyin": "yíxià", "meaning": "một chút, một lát", "lesson": "13", "type": "lượng từ", "ex_cn": "我想问你一下。", "ex_py": "Wǒ xiǎng wèn nǐ yíxià.", "ex_vn": "Tôi muốn hỏi bạn một chút."}, {"hanzi": "服务员", "pinyin": "fúwùyuán", "meaning": "nhân viên phục vụ, bồi bàn", "lesson": "13", "type": "danh từ", "ex_cn": "我是这里的服务员。", "ex_py": "Wǒ shì zhèlǐ de fúwùyuán.", "ex_vn": "Tôi là nhân viên phục vụ ở đây."}, {"hanzi": "女士", "pinyin": "nǚshì", "meaning": "quý cô, quý bà, tiểu thư", "lesson": "13", "type": "danh từ", "ex_cn": "王女士，请坐。", "ex_py": "Wáng nǚshì, qǐng zuò.", "ex_vn": "Vương tiểu thư, mời ngồi."}, {"hanzi": "坐", "pinyin": "zuò", "meaning": "ngồi", "lesson": "13", "type": "động từ", "ex_cn": "你坐在这儿吧。", "ex_py": "Nǐ zuò zài zhèr ba.", "ex_vn": "Bạn ngồi ở đây đi."}, {"hanzi": "请", "pinyin": "qǐng", "meaning": "xin, mời, làm ơn", "lesson": "13", "type": "động từ", "ex_cn": "请给我一杯热茶。", "ex_py": "Qǐng gěi wǒ yì bēi rè chá.", "ex_vn": "Làm ơn cho tôi một cốc trà nóng."}, {"hanzi": "给", "pinyin": "gěi", "meaning": "cho, đưa cho", "lesson": "13", "type": "động từ", "ex_cn": "给我一杯水吧。", "ex_py": "Gěi wǒ yì bēi shuǐ ba.", "ex_vn": "Cho tôi một cốc nước nhé."}, {"hanzi": "杯", "pinyin": "bēi", "meaning": "cốc, ly (lượng từ)", "lesson": "13", "type": "lượng từ", "ex_cn": "我要一杯奶茶。", "ex_py": "Wǒ yào yì bēi nǎichá.", "ex_vn": "Tôi muốn một cốc trà sữa."}, {"hanzi": "要", "pinyin": "yào", "meaning": "muốn, lấy, cần", "lesson": "13", "type": "động từ", "ex_cn": "我要两个包子。", "ex_py": "Wǒ yào liǎng gè bāozi.", "ex_vn": "Tôi lấy hai cái bánh bao."}, {"hanzi": "早饭", "pinyin": "zǎofàn", "meaning": "bữa sáng, cơm sáng", "lesson": "13", "type": "danh từ", "ex_cn": "我还没吃早饭。", "ex_py": "Wǒ hái méi chī zǎofàn.", "ex_vn": "Tôi vẫn chưa ăn sáng."}, {"hanzi": "面包", "pinyin": "miànbāo", "meaning": "bánh mì", "lesson": "13", "type": "danh từ", "ex_cn": "我想吃面包。", "ex_py": "Wǒ xiǎng chī miànbāo.", "ex_vn": "Tôi muốn ăn bánh mì."}, {"hanzi": "鸡蛋", "pinyin": "jīdàn", "meaning": "trứng gà", "lesson": "13", "type": "danh từ", "ex_cn": "我要两个鸡蛋。", "ex_py": "Wǒ yào liǎng gè jīdàn.", "ex_vn": "Tôi lấy hai quả trứng gà."}, {"hanzi": "先生", "pinyin": "xiānsheng", "meaning": "ông, ngài, tiên sinh", "lesson": "13", "type": "danh từ", "ex_cn": "先生，请问你要喝什么？", "ex_py": "Xiānsheng, qǐngwèn nǐ yào hē shénme?", "ex_vn": "Thưa tiên sinh, xin hỏi anh muốn uống gì?"}, {"hanzi": "一半", "pinyin": "yíbàn", "meaning": "một nửa, nửa", "lesson": "13", "type": "số lượng từ", "ex_cn": "一半饺子多少钱？", "ex_py": "Yíbàn jiǎozi duōshao qián?", "ex_vn": "Nửa phần sủi cảo giá bao nhiêu tiền?"}, {"hanzi": "茶", "pinyin": "chá", "meaning": "trà, chè", "lesson": "13", "type": "danh từ", "ex_cn": "我要一杯茶。", "ex_py": "Wǒ yào yì bēi chá.", "ex_vn": "Tôi muốn một cốc trà."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
