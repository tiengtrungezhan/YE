<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 3 Bài 17</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk3.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 17</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "请假", "pinyin": "qǐng jià", "meaning": "xin nghỉ", "lesson": "17", "type": "Động từ", "ex_cn": "他今天请假了。", "ex_py": "Tā jīntiān qǐng jià le.", "ex_vn": "Hôm nay anh ấy xin nghỉ rồi."}, {"hanzi": "一共", "pinyin": "yígòng", "meaning": "tổng cộng", "lesson": "17", "type": "Phó từ", "ex_cn": "这里一共有一百人。", "ex_py": "Zhèlǐ yígòng yǒu yìbǎi rén.", "ex_vn": "Ở đây tổng cộng có 100 người."}, {"hanzi": "邻居", "pinyin": "línjū", "meaning": "hàng xóm", "lesson": "17", "type": "Danh từ", "ex_cn": "他是我的邻居。", "ex_py": "Tā shì wǒ de línjū.", "ex_vn": "Anh ấy là hàng xóm của tôi."}, {"hanzi": "后来", "pinyin": "hòulái", "meaning": "sau đó, về sau", "lesson": "17", "type": "Danh từ", "ex_cn": "后来 he qù Běijīng le.", "ex_py": "Hòulái tā qù Běijīng le.", "ex_vn": "Sau đó anh ấy đi Bắc Kinh rồi."}, {"hanzi": "爱好", "pinyin": "àihào", "meaning": "sở thích", "lesson": "17", "type": "Danh từ/Động từ", "ex_cn": "我的爱好是听音乐。", "ex_py": "Wǒ de àihào shì tīng yīnyuè.", "ex_vn": "Sở thích của tôi là nghe nhạc."}, {"hanzi": "办法", "pinyin": "bànfǎ", "meaning": "biện pháp, cách thức", "lesson": "17", "type": "Danh từ", "ex_cn": "你有办法吗？", "ex_py": "Nǐ yǒu bànfǎ ma?", "ex_vn": "Bạn có cách nào không?"}, {"hanzi": "饱", "pinyin": "bǎo", "meaning": "no", "lesson": "17", "type": "Tính từ", "ex_cn": "我吃饱了。", "ex_py": "Wǒ chī bǎo le.", "ex_vn": "Tôi ăn no rồi."}, {"hanzi": "为了", "pinyin": "wèile", "meaning": "để, vì", "lesson": "17", "type": "Giới từ", "ex_cn": "为了学习汉语，他去了中国。", "ex_py": "Wèile xuéxí Hànyǔ, tā qù le Zhōngguó.", "ex_vn": "Để học tiếng Trung, anh ấy đã đi Trung Quốc."}, {"hanzi": "决定", "pinyin": "juédìng", "meaning": "quyết định", "lesson": "17", "type": "Động từ/Danh từ", "ex_cn": "我决定明天去。", "ex_py": "Wǒ juédìng míngtiān qù.", "ex_vn": "Tôi quyết định ngày mai đi."}, {"hanzi": "选择", "pinyin": "xuǎnzé", "meaning": "lựa chọn", "lesson": "17", "type": "Động từ/Danh từ", "ex_cn": "请做出你的选择。", "ex_py": "Qǐng zuòchū nǐ de xuǎnzé.", "ex_vn": "Vui lòng đưa ra lựa chọn của bạn."}, {"hanzi": "冬", "pinyin": "dōng", "meaning": "mùa đông", "lesson": "17", "type": "Danh từ", "ex_cn": "冬天的天气很冷。", "ex_py": "Dōngtiān de tiānqì hěn lěng.", "ex_vn": "Thời tiết mùa đông rất lạnh."}, {"hanzi": "必须", "pinyin": "bìxū", "meaning": "phải", "lesson": "17", "type": "Phó từ", "ex_cn": "你必须去。", "ex_py": "Nǐ bìxū qù.", "ex_vn": "Bạn phải đi."}, {"hanzi": "根据", "pinyin": "gēnjù", "meaning": "căn cứ vào", "lesson": "17", "type": "Giới từ/Danh từ", "ex_cn": "根据天气，我不去了。", "ex_py": "Gēnjù tiānqì, wǒ bú qù le.", "ex_vn": "Căn cứ vào thời tiết, tôi không đi nữa."}, {"hanzi": "情况", "pinyin": "qíngkuàng", "meaning": "tình hình", "lesson": "17", "type": "Danh từ", "ex_cn": "请告诉他这里的情况。", "ex_py": "Qǐng gàosu tā zhèlǐ de qíngkuàng.", "ex_vn": "Vui lòng cho anh ấy biết tình hình ở đây."}, {"hanzi": "渴", "pinyin": "kě", "meaning": "khát", "lesson": "17", "type": "Tính từ", "ex_cn": "我渴了，想喝水。", "ex_py": "Wǒ kě le, xiǎng hē shuǐ.", "ex_vn": "Tôi khát rồi, muốn uống nước."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
