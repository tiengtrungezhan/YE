<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 3 Bài 15</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk3.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 15</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "花", "pinyin": "huā", "meaning": "tiêu (tiền), tốn (thời gian)", "lesson": "15", "type": "Động từ", "ex_cn": "花了很多钱。", "ex_py": "Huā le hěn duō qián.", "ex_vn": "Đã tiêu rất nhiều tiền."}, {"hanzi": "留学", "pinyin": "liúxué", "meaning": "du học", "lesson": "15", "type": "Động từ", "ex_cn": "他想去中国留学。", "ex_py": "Tā xiǎng qù Zhōngguó liúxué.", "ex_vn": "Anh ấy muốn đi du học Trung Quốc."}, {"hanzi": "水平", "pinyin": "shuǐpíng", "meaning": "trình độ", "lesson": "15", "type": "Danh từ", "ex_cn": "他的汉语水平很高。", "ex_py": "Tā de Hànyǔ shuǐpíng hěn gāo.", "ex_vn": "Trình độ tiếng Trung của anh ấy rất cao."}, {"hanzi": "提高", "pinyin": "tígāo", "meaning": "nâng cao", "lesson": "15", "type": "Động từ", "ex_cn": "我们要提高学习水平。", "ex_py": "Wǒmen yào tígāo xuéxí shuǐpíng.", "ex_vn": "Chúng ta phải nâng cao trình độ học tập."}, {"hanzi": "练习", "pinyin": "liànxí", "meaning": "luyện tập, bài tập", "lesson": "15", "type": "Động từ/Danh từ", "ex_cn": "这些练习不难。", "ex_py": "Zhèxiē liànxí bù nán.", "ex_vn": "Những bài tập này không khó."}, {"hanzi": "完成", "pinyin": "wánchéng", "meaning": "hoàn thành", "lesson": "15", "type": "Động từ", "ex_cn": "你完成作业了吗？", "ex_py": "Nǐ wánchéng zuòyè le ma?", "ex_vn": "Bạn hoàn thành bài tập chưa?"}, {"hanzi": "句子", "pinyin": "jùzi", "meaning": "câu", "lesson": "15", "type": "Danh từ", "ex_cn": "请读这个句子。", "ex_py": "Qǐng dú zhège jùzi.", "ex_vn": "Vui lòng đọc câu này."}, {"hanzi": "其他", "pinyin": "qítā", "meaning": "khác", "lesson": "15", "type": "Đại từ", "ex_cn": "其他人在哪儿？", "ex_py": "Qítā rén zài nǎr?", "ex_vn": "Những người khác ở đâu?"}, {"hanzi": "发", "pinyin": "fā", "meaning": "gửi, phát", "lesson": "15", "type": "Động từ", "ex_cn": "我给你发短信。", "ex_py": "Wǒ gěi nǐ fā duǎnxìn.", "ex_vn": "Tôi gửi tin nhắn cho bạn."}, {"hanzi": "要求", "pinyin": "yāoqiú", "meaning": "yêu cầu", "lesson": "15", "type": "Động từ/Danh từ", "ex_cn": "老师对我们的要求很高。", "ex_py": "Lǎoshī duì wǒmen de yāoqiú hěn gāo.", "ex_vn": "Thầy giáo yêu cầu rất cao đối với chúng tôi."}, {"hanzi": "注意", "pinyin": "zhùyì", "meaning": "chú ý", "lesson": "15", "type": "Động từ", "ex_cn": "请注意听老师说。", "ex_py": "Qǐng zhùyì tīng lǎoshī shuō.", "ex_vn": "Vui lòng chú ý nghe thầy giáo nói."}, {"hanzi": "上网", "pinyin": "shàngwǎng", "meaning": "lên mạng", "lesson": "15", "type": "Động từ", "ex_cn": "他每天都上网。", "ex_py": "Tā měitiān dōu shàngwǎng.", "ex_vn": "Anh ấy lên mạng mỗi ngày."}, {"hanzi": "除了", "pinyin": "chúle", "meaning": "ngoài ra, trừ phi", "lesson": "15", "type": "Giới từ", "ex_cn": "除了他，大家都来了。", "ex_py": "Chúle tā, dàjiā dōu lái le.", "ex_vn": "Ngoài anh ấy ra, mọi người đều đã đến."}, {"hanzi": "新闻", "pinyin": "xīnwén", "meaning": "tin tức", "lesson": "15", "type": "Danh từ", "ex_cn": "我看新闻了。", "ex_py": "Wǒ kàn xīnwén le.", "ex_vn": "Tôi đã xem tin tức rồi."}, {"hanzi": "极", "pinyin": "jí", "meaning": "cực kỳ", "lesson": "15", "type": "Phó từ", "ex_cn": "好极了！", "ex_py": "Hǎo jí le!", "ex_vn": "Tốt cực kỳ!"}, {"hanzi": "节日", "pinyin": "jiérì", "meaning": "ngày lễ", "lesson": "15", "type": "Danh từ", "ex_cn": "春节是中国人的节日。", "ex_py": "Chūnjié shì Zhōngguó rén de jiérì.", "ex_vn": "Tết Nguyên Đán là ngày lễ của người Trung Quốc."}, {"hanzi": "举行", "pinyin": "jǔxíng", "meaning": "tổ chức", "lesson": "15", "type": "Động từ", "ex_cn": "会议在北京举行。", "ex_py": "Huìyì zài Běijīng jǔxíng.", "ex_vn": "Hội nghị được tổ chức ở Bắc Kinh."}, {"hanzi": "世界", "pinyin": "shìjiè", "meaning": "thế giới", "lesson": "15", "type": "Danh từ", "ex_cn": "世界很大。", "ex_py": "Shìjiè hěn dà.", "ex_vn": "Thế giới rất lớn."}, {"hanzi": "街道", "pinyin": "jiēdào", "meaning": "đường phố", "lesson": "15", "type": "Danh từ", "ex_cn": "这条街道很漂亮。", "ex_py": "Zhè tiáo jiēdào hěn piàoliang.", "ex_vn": "Con phố này rất đẹp."}, {"hanzi": "各", "pinyin": "gè", "meaning": "các, mỗi", "lesson": "15", "type": "Đại từ", "ex_cn": "各人有各人的习惯。", "ex_py": "Gè rén yǒu gè rén de xíguàn.", "ex_vn": "Mỗi người có thói quen của mỗi người."}, {"hanzi": "文化", "pinyin": "wénhuà", "meaning": "văn hóa", "lesson": "15", "type": "Danh từ", "ex_cn": "我喜欢中国文化。", "ex_py": "Wǒ xǐhuan Zhōngguó wénhuà.", "ex_vn": "Tôi thích văn hóa Trung Quốc."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
