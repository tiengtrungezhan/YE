<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 1 3.0 Bài 15</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk1.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 15</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "北京", "pinyin": "Běijīng", "meaning": "Bắc Kinh (thủ đô Trung Quốc)", "type": "Danh từ riêng", "ex_cn": "我住在北京。", "ex_py": "Wǒ zhù zài Běijīng.", "ex_vn": "Tôi sống ở Bắc Kinh.", "lesson": "15"}, {"hanzi": "大兴机场", "pinyin": "Dàxīng Jīchǎng", "meaning": "Sân bay Đại Hưng", "type": "Danh từ riêng", "ex_cn": "大兴机场真漂亮。", "ex_py": "Dàxīng Jīchǎng zhēn piàoliang.", "ex_vn": "Sân bay Đại Hưng thật đẹp.", "lesson": "15"}, {"hanzi": "西安", "pinyin": "Xī'ān", "meaning": "Tây An (thành phố ở Trung Quốc)", "type": "Danh từ riêng", "ex_cn": "西安是一座美丽的城市。", "ex_py": "Xī'ān shì yī zuò měilì de chéngshì.", "ex_vn": "Tây An là một thành phố đẹp.", "lesson": "15"}, {"hanzi": "飞机", "pinyin": "fēijī", "meaning": "máy bay", "lesson": "15", "type": "Danh từ", "ex_cn": "他坐飞机去。", "ex_py": "Tā zuò fēijī qù.", "ex_vn": "Anh ấy đi bằng máy bay."}, {"hanzi": "接", "pinyin": "jiē", "meaning": "đón, nhận", "lesson": "15", "type": "Động từ", "ex_cn": "我去机场接朋友。", "ex_py": "Wǒ qù jīchǎng jiē péngyou.", "ex_vn": "Tôi đi sân bay đón bạn."}, {"hanzi": "机场", "pinyin": "jīchǎng", "meaning": "sân bay", "lesson": "15", "type": "Danh từ", "ex_cn": "我去机场。", "ex_py": "Wǒ qù jīchǎng.", "ex_vn": "Tôi đi sân bay."}, {"hanzi": "明年", "pinyin": "míngnián", "meaning": "năm sau", "lesson": "15", "type": "Danh từ", "ex_cn": "明年他七岁。", "ex_py": "Míngnián tā qī suì.", "ex_vn": "Sang năm nó 7 tuổi."}, {"hanzi": "年", "pinyin": "nián", "meaning": "năm", "lesson": "15", "type": "Danh từ", "ex_cn": "二零二零年。", "ex_py": "Èr líng èr líng nián.", "ex_vn": "Năm 2020."}, {"hanzi": "去年", "pinyin": "qùnián", "meaning": "năm ngoái", "lesson": "15", "type": "Danh từ", "ex_cn": "去年他四岁。", "ex_py": "Qùnián tā sì suì.", "ex_vn": "Năm ngoái nó 4 tuổi."}, {"hanzi": "时间", "pinyin": "shíjiān", "meaning": "thời gian", "lesson": "15", "type": "Danh từ", "ex_cn": "我没有时间。", "ex_py": "Wǒ méiyǒu shíjiān.", "ex_vn": "Tôi không có thời gian."}, {"hanzi": "小时", "pinyin": "xiǎoshí", "meaning": "tiếng đồng hồ", "lesson": "15", "type": "Danh từ", "ex_cn": "一个小时。", "ex_py": "Yí ge xiǎoshí.", "ex_vn": "Một tiếng đồng hồ."}, {"hanzi": "住", "pinyin": "zhù", "meaning": "ở, cư trú", "lesson": "15", "type": "Động từ", "ex_cn": "你在哪儿住？", "ex_py": "Nǐ zài nǎr zhù?", "ex_vn": "Bạn sống ở đâu?"}, {"hanzi": "早", "pinyin": "zǎo", "meaning": "sớm, chào buổi sáng", "type": "Tính từ", "ex_cn": "你来得真早！", "ex_py": "Nǐ láide zhēn zǎo!", "ex_vn": "Bạn đến thật sớm!", "lesson": "15"}, {"hanzi": "爱", "pinyin": "ài", "meaning": "yêu, thích", "lesson": "15", "type": "Danh từ", "ex_cn": "我爱我的家人和朋友。", "ex_py": "Wǒ ài wǒ de jiārén hé péngyou.", "ex_vn": "Tôi yêu gia đình và bạn bè của tôi."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
