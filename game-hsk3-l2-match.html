<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 3 Bài 2</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk3.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 2</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "腿", "pinyin": "tuǐ", "meaning": "chân", "lesson": "2", "type": "Danh từ", "ex_cn": "我的腿疼。", "ex_py": "Wǒ de tuǐ téng.", "ex_vn": "Chân của tôi bị đau."}, {"hanzi": "疼", "pinyin": "téng", "meaning": "đau", "lesson": "2", "type": "Tính từ", "ex_cn": "你的腿疼吗？", "ex_py": "Nǐ de tuǐ téng ma?", "ex_vn": "Chân bạn có đau không?"}, {"hanzi": "脚", "pinyin": "jiǎo", "meaning": "bàn chân", "lesson": "2", "type": "Danh từ", "ex_cn": "他没穿鞋，脚很冷。", "ex_py": "Tā méi chuān xié, jiǎo hěn lěng.", "ex_vn": "Anh ấy không đi giày, bàn chân rất lạnh."}, {"hanzi": "树", "pinyin": "shù", "meaning": "cây", "lesson": "2", "type": "Danh từ", "ex_cn": "这儿有很多树。", "ex_py": "Zhèr yǒu hěn duō shù.", "ex_vn": "Ở đây có rất nhiều cây."}, {"hanzi": "容易", "pinyin": "róngyì", "meaning": "dễ dàng", "lesson": "2", "type": "Tính từ", "ex_cn": "这个题很容易。", "ex_py": "Zhège tí hěn róngyì.", "ex_vn": "Câu hỏi này rất dễ."}, {"hanzi": "难", "pinyin": "nán", "meaning": "khó", "lesson": "2", "type": "Tính từ", "ex_cn": "汉语不难。", "ex_py": "Hànyǔ bù nán.", "ex_vn": "Tiếng Trung không khó."}, {"hanzi": "太太", "pinyin": "tàitai", "meaning": "bà, phu nhân", "lesson": "2", "type": "Danh từ", "ex_cn": "王太太去商店了。", "ex_py": "Wáng tàitai qù shāngdiàn le.", "ex_vn": "Bà Vương đi cửa hàng rồi."}, {"hanzi": "秘书", "pinyin": "mìshū", "meaning": "thư ký", "lesson": "2", "type": "Danh từ", "ex_cn": "他是我的秘书。", "ex_py": "Tā shì wǒ de mìshū.", "ex_vn": "Anh ấy là thư ký của tôi."}, {"hanzi": "经理", "pinyin": "jīnglǐ", "meaning": "giám đốc", "lesson": "2", "type": "Danh từ", "ex_cn": "经理在办公室。", "ex_py": "Jīnglǐ zài bàngōngshì.", "ex_vn": "Giám đốc ở trong văn phòng."}, {"hanzi": "办公室", "pinyin": "bàngōngshì", "meaning": "văn phòng", "lesson": "2", "type": "Danh từ", "ex_cn": "我去办公室找他。", "ex_py": "Wǒ qù bàngōngshì zhǎo tā.", "ex_vn": "Tôi đến văn phòng tìm anh ấy."}, {"hanzi": "辆", "pinyin": "liàng", "meaning": "chiếc (lượng từ cho xe)", "lesson": "2", "type": "Lượng từ", "ex_cn": "这辆自行车是我的。", "ex_py": "Zhè liàng zìxíngchē shì wǒ de.", "ex_vn": "Chiếc xe đạp này là của tôi."}, {"hanzi": "楼", "pinyin": "lóu", "meaning": "tòa nhà, lầu", "lesson": "2", "type": "Danh từ", "ex_cn": "他在楼上学习。", "ex_py": "Tā zài lóu shàng xuéxí.", "ex_vn": "Anh ấy đang học trên lầu."}, {"hanzi": "拿", "pinyin": "ná", "meaning": "cầm, lấy", "lesson": "2", "type": "Động từ", "ex_cn": "请拿一下你的书。", "ex_py": "Qǐng ná yíxià nǐ de shū.", "ex_vn": "Hãy cầm lấy cuốn sách của bạn."}, {"hanzi": "把", "pinyin": "bǎ", "meaning": "cái (lượng từ cho vật có cán)", "lesson": "2", "type": "Lượng từ", "ex_cn": "我有一把伞。", "ex_py": "Wǒ yǒu yì bǎ sǎn.", "ex_vn": "Tôi có một chiếc ô."}, {"hanzi": "伞", "pinyin": "sǎn", "meaning": "ô, dù", "lesson": "2", "type": "Danh từ", "ex_cn": "别忘了带伞。", "ex_py": "Bié wàngle dài sǎn.", "ex_vn": "Đừng quên mang theo ô."}, {"hanzi": "胖", "pinyin": "pàng", "meaning": "béo", "lesson": "2", "type": "Tính từ", "ex_cn": "他最近胖了。", "ex_py": "Tā zuìjìn pàng le.", "ex_vn": "Anh ấy gần đây béo lên rồi."}, {"hanzi": "其实", "pinyin": "qíshí", "meaning": "thực ra", "lesson": "2", "type": "Phó từ", "ex_cn": "其实我不喜欢吃鱼。", "ex_py": "Qíshí wǒ bù xǐhuan chī yú.", "ex_vn": "Thực ra tôi không thích ăn cá."}, {"hanzi": "瘦", "pinyin": "shòu", "meaning": "gầy", "lesson": "2", "type": "Tính từ", "ex_cn": "她比以前瘦了。", "ex_py": "Tā bǐ yǐqián shòu le.", "ex_vn": "Cô ấy gầy hơn trước rồi."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
