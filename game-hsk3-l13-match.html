<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 3 Bài 13</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk3.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 13</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "终于", "pinyin": "zhōngyú", "meaning": "cuối cùng", "lesson": "13", "type": "Phó từ", "ex_cn": "他终于来了。", "ex_py": "Tā zhōngyú lái le.", "ex_vn": "Anh ấy cuối cùng cũng đến rồi."}, {"hanzi": "爷爷", "pinyin": "yéye", "meaning": "ông nội", "lesson": "13", "type": "Danh từ", "ex_cn": "我爷爷在看报纸。", "ex_py": "Wǒ yéye zài kàn bàozhǐ.", "ex_vn": "Ông nội tôi đang đọc báo."}, {"hanzi": "礼物", "pinyin": "lǐwù", "meaning": "quà tặng", "lesson": "13", "type": "Danh từ", "ex_cn": "这是送给你的礼物。", "ex_py": "Zhè shì sòng gěi nǐ de lǐwù.", "ex_vn": "Đây là món quà tặng bạn."}, {"hanzi": "奶奶", "pinyin": "nǎinai", "meaning": "bà nội", "lesson": "13", "type": "Danh từ", "ex_cn": "我奶奶在做饭。", "ex_py": "Wǒ nǎinai zài zuò fàn.", "ex_vn": "Bà nội tôi đang nấu cơm."}, {"hanzi": "遇到", "pinyin": "yùdào", "meaning": "gặp phải", "lesson": "13", "type": "Động từ", "ex_cn": "我在路上遇到了一个朋友。", "ex_py": "Wǒ zài lùshang yùdào le yí ge péngyou.", "ex_vn": "Tôi gặp một người bạn trên đường."}, {"hanzi": "一边", "pinyin": "yìbiān", "meaning": "vừa... (vừa làm gì vừa làm gì)", "lesson": "13", "type": "Phó từ", "ex_cn": "他一边吃饭一边看电视。", "ex_py": "Tā yìbiān chīfàn yìbiān kàn diànshì.", "ex_vn": "Anh ấy vừa ăn cơm vừa xem tivi."}, {"hanzi": "过去", "pinyin": "guòqù", "meaning": "quá khứ, trước đây", "lesson": "13", "type": "Danh từ/Động từ", "ex_cn": "过去我不喜欢吃肉。", "ex_py": "Guòqù wǒ bù xǐhuan chī ròu.", "ex_vn": "Trước đây tôi không thích ăn thịt."}, {"hanzi": "一般", "pinyin": "yìbān", "meaning": "bình thường, thông thường", "lesson": "13", "type": "Tính từ/Phó từ", "ex_cn": "他一般六点起床。", "ex_py": "Tā yìbān liù diǎn qǐchuáng.", "ex_vn": "Anh ấy thường thức dậy lúc 6 giờ."}, {"hanzi": "愿意", "pinyin": "yuànyì", "meaning": "tự nguyện, bằng lòng", "lesson": "13", "type": "Động từ năng nguyện", "ex_cn": "我愿意帮你。", "ex_py": "Wǒ yuànyì bāng nǐ.", "ex_vn": "Tôi sẵn lòng giúp bạn."}, {"hanzi": "起来", "pinyin": "qǐlái", "meaning": "dậy, đứng lên", "lesson": "13", "type": "Động từ", "ex_cn": "请坐起来。", "ex_py": "Qǐng zuò qǐlái.", "ex_vn": "Vui lòng ngồi dậy."}, {"hanzi": "应该", "pinyin": "yīnggāi", "meaning": "nên", "lesson": "13", "type": "Động từ năng nguyện", "ex_cn": "你应该努力学习。", "ex_py": "Nǐ yīnggāi nǔlì xuéxí.", "ex_vn": "Bạn nên cố gắng học tập."}, {"hanzi": "生活", "pinyin": "shēnghuó", "meaning": "cuộc sống", "lesson": "13", "type": "Danh từ/Động từ", "ex_cn": "这里的生活很方便。", "ex_py": "Zhèlǐ de shēnghuó hěn fāngbiàn.", "ex_vn": "Cuộc sống ở đây rất thuận tiện."}, {"hanzi": "校长", "pinyin": "xiàozhǎng", "meaning": "hiệu trưởng", "lesson": "13", "type": "Danh từ", "ex_cn": "校长在开会。", "ex_py": "Xiàozhǎng zài kāihuì.", "ex_vn": "Hiệu trưởng đang họp."}, {"hanzi": "坏", "pinyin": "huài", "meaning": "hỏng, xấu", "lesson": "13", "type": "Tính từ", "ex_cn": "我的手机坏了。", "ex_py": "Wǒ de shǒujī huài le.", "ex_vn": "Điện thoại của tôi hỏng rồi."}, {"hanzi": "经常", "pinyin": "jīngcháng", "meaning": "thường xuyên", "lesson": "13", "type": "Phó từ", "ex_cn": "他经常去锻炼。", "ex_py": "Tā jīngcháng qù duànliàn.", "ex_vn": "Anh ấy thường xuyên đi tập thể dục."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
