<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 2 3.0 Bài 4</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk2.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 4</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "过", "pinyin": "guò", "meaning": "qua, từng", "lesson": "4", "type": "Động từ / Trợ từ", "ex_cn": "我们来过这家商场吗？", "ex_py": "Wǒmen lái guò zhè jiā shāngchǎng ma?", "ex_vn": "Chúng ta từng đến trung tâm thương mại này chưa?"}, {"hanzi": "商场", "pinyin": "shāngchǎng", "meaning": "trung tâm thương mại", "lesson": "4", "type": "Danh từ", "ex_cn": "我和朋友一起去商场买衣服。", "ex_py": "Wǒ hé péngyou yìqǐ qù shāngchǎng mǎi yīfu.", "ex_vn": "Tôi cùng bạn đi trung tâm thương mại mua quần áo."}, {"hanzi": "进去", "pinyin": "jìnqù", "meaning": "đi vào", "lesson": "4", "type": "Động từ", "ex_cn": "老师在教室里，我们进去吧。", "ex_py": "Lǎoshī zài jiàoshì lǐ, wǒmen jìnqù ba.", "ex_vn": "Thầy giáo đang ở trong phòng học, chúng ta đi vào đi."}, {"hanzi": "条", "pinyin": "tiáo", "meaning": "chiếc, cái (lượng từ chỉ quần, sông...)", "lesson": "4", "type": "Lượng từ", "ex_cn": "我想买条裤子。", "ex_py": "Wǒ xiǎng mǎi tiáo kùzi.", "ex_vn": "Tôi muốn mua một chiếc quần."}, {"hanzi": "裤子", "pinyin": "kùzi", "meaning": "quần", "lesson": "4", "type": "Danh từ", "ex_cn": "这条黑色的裤子很漂亮。", "ex_py": "Zhè tiáo hēisè de kùzi hěn piàoliang.", "ex_vn": "Chiếc quần màu đen này rất đẹp."}, {"hanzi": "白色", "pinyin": "báisè", "meaning": "màu trắng", "lesson": "4", "type": "Danh từ", "ex_cn": "我喜欢白色的衣服。", "ex_py": "Wǒ xǐhuan báisè de yīfu.", "ex_vn": "Tôi thích quần áo màu trắng."}, {"hanzi": "因为", "pinyin": "yīnwèi", "meaning": "bởi vì", "lesson": "4", "type": "Liên từ", "ex_cn": "因为今天太累了，所以我想早点儿回家。", "ex_py": "Yīnwèi jīntiān tài lèi le, suǒyǐ wǒ xiǎng zǎodiǎnr huí jiā.", "ex_vn": "Bởi vì hôm nay quá mệt, cho nên tôi muốn về nhà sớm một chút."}, {"hanzi": "试", "pinyin": "shì", "meaning": "thử", "lesson": "4", "type": "Động từ", "ex_cn": "你试试那条红色的吧。", "ex_py": "Nǐ shìshi nà tiáo hóngsè de ba.", "ex_vn": "Bạn thử chiếc màu đỏ kia đi."}, {"hanzi": "红色", "pinyin": "hóngsè", "meaning": "màu đỏ", "lesson": "4", "type": "Danh từ", "ex_cn": "桌子上有两个红色的苹果。", "ex_py": "Zhuōzi shang yǒu liǎng gè hóngsè de píngguǒ.", "ex_vn": "Trên bàn có hai quả táo màu đỏ."}, {"hanzi": "所以", "pinyin": "suǒyǐ", "meaning": "cho nên", "lesson": "4", "type": "Liên từ", "ex_cn": "因为今天太冷了，所以我们打车去吧。", "ex_py": "Yīnwèi jīntiān tài lěng le, suǒyǐ wǒmen dǎchē qù ba.", "ex_vn": "Bởi vì hôm nay quá lạnh, cho nên chúng mình đi taxi đi."}, {"hanzi": "书包", "pinyin": "shūbāo", "meaning": "cặp sách, ba lô", "lesson": "4", "type": "Danh từ", "ex_cn": "我想买个新书包。", "ex_py": "Wǒ xiǎng mǎi gè xīn shūbāo.", "ex_vn": "Tôi muốn mua một chiếc cặp sách mới."}, {"hanzi": "过去", "pinyin": "guòqù", "meaning": "đi qua", "lesson": "4", "type": "Động từ", "ex_cn": "朋友在那边，我们过去吧。", "ex_py": "Péngyou zài nàbiān, wǒmen guòqù ba.", "ex_vn": "Bạn bè ở đằng kia, chúng ta qua đó đi."}, {"hanzi": "绿色", "pinyin": "lǜsè", "meaning": "màu xanh lá", "lesson": "4", "type": "Danh từ", "ex_cn": "我喜欢绿色的书包。", "ex_py": "Wǒ xǐhuan lǜsè de shūbāo.", "ex_vn": "Tôi thích chiếc cặp sách màu xanh lá."}, {"hanzi": "黑色", "pinyin": "hēisè", "meaning": "màu đen", "lesson": "4", "type": "Danh từ", "ex_cn": "红色的、绿色的、黑色的，你想买哪个？", "ex_py": "Hóngsè de, lǜsè de, hēisè de, nǐ xiǎng mǎi nǎ gè?", "ex_vn": "Màu đỏ, màu xanh lá, màu đen, bạn muốn mua cái nào?"}, {"hanzi": "更", "pinyin": "gèng", "meaning": "càng, hơn", "lesson": "4", "type": "Phó từ", "ex_cn": "我也觉得绿色的更好看。", "ex_py": "Wǒ yě juéde lǜsè de gèng hǎokàn.", "ex_vn": "Tôi cũng cảm thấy màu xanh lá đẹp hơn."}, {"hanzi": "颜色", "pinyin": "yánsè", "meaning": "màu sắc", "lesson": "4", "type": "Danh từ", "ex_cn": "你喜欢什么颜色的衣服？", "ex_py": "Nǐ xǐhuan shénme yánsè de yīfu?", "ex_vn": "Bạn thích quần áo màu gì?"}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
