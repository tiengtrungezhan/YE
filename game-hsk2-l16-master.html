    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-wrapper { max-width: 600px; margin: 0 auto; padding: 2rem; text-align: center; }
        .quiz-card { background: var(--white); border-radius: 30px; padding: 3rem 2rem; box-shadow: var(--shadow); margin-top: 2rem; min-height: 450px; display: flex; flex-direction: column; justify-content: center; position: relative; }
        .progress-container { width: 100%; height: 8px; background: #eee; border-radius: 4px; margin-bottom: 2rem; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary-color); width: 0%; transition: width 0.3s; }
        .question-text { font-size: 1.5rem; font-weight: 700; color: var(--text-color); margin-bottom: 1rem; }
        .sub-text { font-size: 1.1rem; color: #666; margin-bottom: 2rem; line-height: 1.6; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
        .option-btn { padding: 1.2rem; background: #f8fbfe; border: 2px solid #eef2f5; border-radius: 15px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .option-btn:hover:not(:disabled) { border-color: var(--primary-color); background: #f0f7f9; }
        .option-btn.correct { background: #d4edda !important; border-color: #28a745 !important; color: #155724 !important; }
        .option-btn.wrong { background: #f8d7da !important; border-color: #dc3545 !important; color: #721c24 !important; }
        .typing-input { width: 100%; padding: 1.2rem; border: 2px solid #ddd; border-radius: 15px; font-size: 1.4rem; text-align: center; margin-bottom: 1.5rem; transition: 0.3s; }
        .typing-input:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 10px rgba(255,107,107,0.1); }
        .submit-btn { padding: 1.2rem; background: var(--primary-color); color: white; border: none; border-radius: 15px; font-weight: 700; font-size: 1.1rem; cursor: pointer; width: 100%; transition: 0.3s; }
        .submit-btn:hover { background: var(--primary-dark); transform: translateY(-2px); }
        .phrase-box { display: flex; flex-wrap: wrap; gap: 0.8rem; justify-content: center; margin: 1.5rem 0; min-height: 80px; padding: 1rem; border: 2px dashed #ffe4e6; border-radius: 20px; background: #fffafb; }
        .phrase-item { padding: 0.8rem 1.2rem; background: white; border: 2px solid #ffccd5; border-radius: 12px; cursor: pointer; font-size: 1.2rem; font-weight: 600; color: #e91e63; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .phrase-item:hover { background: #fff0f3; transform: scale(1.05); }
        .blank-text { font-size: 1.8rem; letter-spacing: 2px; color: var(--text-color); margin-bottom: 2rem; font-weight: bold; }
        .blank-fill { color: var(--primary-color); border-bottom: 3px solid var(--primary-color); padding: 0 10px; min-width: 60px; display: inline-block; }
        .result-screen { display: none; }
        .score-circle { width: 150px; height: 150px; border-radius: 50%; border: 10px solid var(--primary-light); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 800; margin: 2rem auto; color: var(--primary-dark); }
    </style>

    <script>
        const vocabulary = [{"hanzi": "外国", "pinyin": "wàiguó", "meaning": "nước ngoài", "type": "Danh từ", "ex_cn": "他去外国学习了。", "ex_py": "Tā qù wàiguó xuéxí le.", "ex_vn": "Anh ấy đi nước ngoài du học rồi.", "lesson": "16"}, {"hanzi": "出国", "pinyin": "chūguó", "meaning": "đi nước ngoài", "type": "Động từ", "ex_cn": "我想出国旅遊。", "ex_py": "Wǒ xiǎng chūguó lǚyóu.", "ex_vn": "Tôi muốn đi du lịch nước ngoài.", "lesson": "16"}, {"hanzi": "机票", "pinyin": "jīpiào", "meaning": "vé máy bay", "type": "Danh từ", "ex_cn": "机票 bao nhiêu tiền？", "ex_py": "Jīpiào duōshǎo qián?", "ex_vn": "Vé máy bay bao nhiêu tiền?", "lesson": "16"}, {"hanzi": "酒店", "pinyin": "jiǔdiàn", "meaning": "khách sạn", "type": "Danh từ", "ex_cn": "我们在酒店住。", "ex_py": "Wǒmen zài jiǔdiàn zhù.", "ex_vn": "Chúng tôi ở khách sạn.", "lesson": "16"}, {"hanzi": "球", "pinyin": "qiú", "meaning": "bóng, quả cầu", "type": "Danh từ", "ex_cn": "这是一个红色的球。", "ex_py": "Zhè shì yí ge hóngsè de qiú.", "ex_vn": "Đây là một quả bóng màu đỏ.", "lesson": "16"}, {"hanzi": "踢", "pinyin": "tī", "meaning": "đá (bằng chân)", "type": "Động từ", "ex_cn": "他 thích đá bóng。", "ex_py": "Tā xǐhuan tīqiú.", "ex_vn": "Anh ấy thích đá bóng.", "lesson": "16"}, {"hanzi": "足球", "pinyin": "zúqiú", "meaning": "bóng đá", "type": "Danh từ", "ex_cn": "下午我们去踢足球。", "ex_py": "Xiàwǔ wǒmen qù tī zúqiú.", "ex_vn": "Chiều nay chúng tôi đi đá bóng.", "lesson": "16"}, {"hanzi": "床", "pinyin": "chuáng", "meaning": "giường", "type": "Danh từ", "ex_cn": "这张床很大。", "ex_py": "Zhè zhāng chuáng hěn dà.", "ex_vn": "Chiếc giường này rất lớn.", "lesson": "16"}, {"hanzi": "药店", "pinyin": "yàodiàn", "meaning": "tiệm thuốc", "type": "Danh từ", "ex_cn": "药店就在那边。", "ex_py": "Yàodiàn jiù zài nàbiān.", "ex_vn": "Tiệm thuốc ở ngay đằng kia.", "lesson": "16"}, {"hanzi": "动", "pinyin": "dòng", "meaning": "động, cử động", "type": "Động từ", "ex_cn": "别动，在那儿等我。", "ex_py": "Bié dòng, zài nàr děng wǒ.", "ex_vn": "Đừng cử động, ở đó đợi tôi.", "lesson": "16"}, {"hanzi": "时", "pinyin": "shí", "meaning": "thời gian, khi, lúc", "type": "Danh từ", "ex_cn": "不在家的时候，他在公司。", "ex_py": "Bú zài jiā de shíhou, tā zài gōngsī.", "ex_vn": "Lúc không ở nhà, anh ấy ở công ty.", "lesson": "16"}, {"hanzi": "有时", "pinyin": "yǒushí", "meaning": "có lúc, thỉnh thoảng", "type": "Phó từ", "ex_cn": "他有时去超市。", "ex_py": "Tā yǒushí qù chāoshì.", "ex_vn": "Anh ấy thỉnh thoảng đi siêu thị.", "lesson": "16"}, {"hanzi": "周", "pinyin": "zhōu", "meaning": "tuần", "type": "Danh từ", "ex_cn": "下一周我要考试。", "ex_py": "Xià yì zhōu wǒ yào kǎoshì.", "ex_vn": "Tuần tới tôi phải thi.", "lesson": "16"}, {"hanzi": "花", "pinyin": "huā", "meaning": "hoa, tiêu (tiền/thời gian)", "type": "Danh từ/Động từ", "ex_cn": "桌子上有一些花。", "ex_py": "Zhuōzi shang yǒu yìxiē huā.", "ex_vn": "Trên bàn có mấy bông hoa.", "lesson": "16"}, {"hanzi": "间", "pinyin": "jiān", "meaning": "gian (phòng)", "type": "Lượng từ", "ex_cn": "这间房很漂亮。", "ex_py": "Zhè jiān fáng hěn piàoliang.", "ex_vn": "Căn phòng này rất đẹp.", "lesson": "16"}, {"hanzi": "红茶", "pinyin": "hóngchá", "meaning": "hồng trà", "type": "Danh từ", "ex_cn": "你喜欢喝红茶吗？", "ex_py": "Nǐ xǐhuan hē hóngchá ma?", "ex_vn": "Bạn có thích uống hồng trà không?", "lesson": "16"}, {"hanzi": "绿茶", "pinyin": "lǜchá", "meaning": "trà xanh", "type": "Danh từ", "ex_cn": "我不喜欢喝绿茶。", "ex_py": "Wǒ bù xǐhuan hē lǜchá.", "ex_vn": "Tôi không thích uống trà xanh.", "lesson": "16"}, {"hanzi": "绿色", "pinyin": "lǜsè", "meaning": "màu xanh lá cây", "type": "Danh từ", "ex_cn": "他穿着绿色的衣服。", "ex_py": "Tā chuānzhe lǜsè de yīfu.", "ex_vn": "Anh ấy mặc bộ quần áo màu xanh lá cây.", "lesson": "16"}, {"hanzi": "左", "pinyin": "zuǒ", "meaning": "bên trái", "type": "Danh từ", "ex_cn": "他在我左边。", "ex_py": "Tā zài wǒ zuǒbiān.", "ex_vn": "Anh ấy ở bên trái tôi.", "lesson": "16"}, {"hanzi": "点", "pinyin": "diǎn", "meaning": "điểm, chút, giờ", "type": "Danh từ/Lượng từ", "ex_cn": "现在三点。", "ex_py": "Xiànzài sān diǎn.", "ex_vn": "Bây giờ là 3 giờ.", "lesson": "16"}, {"hanzi": "名", "pinyin": "míng", "meaning": "tên, danh tiếng", "type": "Lượng từ", "ex_cn": "这名学生学习很好。", "ex_py": "Zhè míng xuésheng xuéxí hěn hǎo.", "ex_vn": "Học sinh này học rất giỏi.", "lesson": "16"}, {"hanzi": "头", "pinyin": "tóu", "meaning": "đầu", "type": "Danh từ", "ex_cn": "你的头怎么了？", "ex_py": "Nǐ de tóu zěnme le?", "ex_vn": "Đầu bạn bị làm sao thế?", "lesson": "16"}, {"hanzi": "那么", "pinyin": "nàme", "meaning": "như vậy, thế thì", "type": "Phó từ", "ex_cn": "既然你忙，那么以后再说。", "ex_py": "Jìrán nǐ máng, nàme yǐhòu zài shuō.", "ex_vn": "Đã vậy bạn bận, thế thì sau này hãy nói.", "lesson": "16"}, {"hanzi": "那样", "pinyin": "nàyàng", "meaning": "như vậy, kiểu như vậy", "type": "Phó từ", "ex_cn": "别那样说话。", "ex_py": "Bié nàyàng shuōhuà.", "ex_vn": "Đừng nói chuyện kiểu như vậy.", "lesson": "16"}, {"hanzi": "饭馆", "pinyin": "fànguǎn", "meaning": "nhà hàng, quán ăn", "type": "Danh từ", "ex_cn": "这家饭馆很有名。", "ex_py": "Zhè jiā fànguǎn hěn yǒumíng.", "ex_vn": "Quán ăn này rất nổi tiếng.", "lesson": "16"}, {"hanzi": "肉", "pinyin": "ròu", "meaning": "thịt", "type": "Danh từ", "ex_cn": "我不喜欢吃肉。", "ex_py": "Wǒ bù xǐhuan chī ròu.", "ex_vn": "Tôi không thích ăn thịt.", "lesson": "16"}, {"hanzi": "篮球", "pinyin": "lánqiú", "meaning": "bóng rổ", "type": "Danh từ", "ex_cn": "他喜欢打篮球。", "ex_py": "Tā xǐhuan dǎ lánqiú.", "ex_vn": "Anh ấy thích chơi bóng rổ.", "lesson": "16"}, {"hanzi": "游", "pinyin": "yóu", "meaning": "bơi, du ngoạn", "type": "Động từ", "ex_cn": "他在水里游。", "ex_py": "Tā zài shuǐ lǐ yóu.", "ex_vn": "Nó đang bơi trong nước.", "lesson": "16"}, {"hanzi": "同", "pinyin": "tóng", "meaning": "cùng, giống nhau", "type": "Tính từ", "ex_cn": "我们是同学。", "ex_py": "Wǒmen shì tóngxué.", "ex_vn": "Chúng tôi là bạn cùng lớp.", "lesson": "16"}, {"hanzi": "为", "pinyin": "wèi", "meaning": "vì, để, cho", "type": "Giới từ", "ex_cn": "这是为你买的。", "ex_py": "Zhè shì wèi nǐ mǎi de.", "ex_vn": "Cái này là mua cho bạn.", "lesson": "16"}, {"hanzi": "方便", "pinyin": "fāngbiàn", "meaning": "thuận tiện, tiện lợi", "type": "Tính từ", "ex_cn": "这里交通很方便。", "ex_py": "Zhèlǐ jiāotōng hěn fāngbiàn.", "ex_vn": "Giao thông ở đây rất thuận tiện.", "lesson": "16"}, {"hanzi": "水果", "pinyin": "shuǐguǒ", "meaning": "hoa quả, trái cây", "type": "Danh từ", "ex_cn": "买一些水果。", "ex_py": "Mǎi yìxiē shuǐguǒ.", "ex_vn": "Mua một ít hoa quả.", "lesson": "16"}, {"hanzi": "习惯", "pinyin": "xíguàn", "meaning": "thói quen, quen với", "type": "Danh từ/Động từ", "ex_cn": "他习惯早起。", "ex_py": "Tā xíguàn zǎoqǐ.", "ex_vn": "Anh ấy có thói quen dậy sớm.", "lesson": "16"}, {"hanzi": "以前", "pinyin": "yǐqián", "meaning": "trước đây, trước kia", "type": "Danh từ", "ex_cn": "我以前住在中国。", "ex_py": "Wǒ yǐqián zhù zài Zhōngguó.", "ex_vn": "Trước đây tôi sống ở Trung Quốc.", "lesson": "16"}, {"hanzi": "刚才", "pinyin": "gāngcái", "meaning": "vừa nãy, mới đây", "type": "Danh từ", "ex_cn": "刚才你去哪儿了？", "ex_py": "Gāngcái nǐ qù nǎr le?", "ex_vn": "Vừa nãy bạn đi đâu thế?", "lesson": "16"}, {"hanzi": "讲", "pinyin": "jiǎng", "meaning": "nói, kể, giảng giải", "type": "Động từ", "ex_cn": "他在讲故事。", "ex_py": "Tā zài jiǎng gùshì.", "ex_vn": "Anh ấy đang kể chuyện.", "lesson": "16"}, {"hanzi": "简单", "pinyin": "jiǎndān", "meaning": "đơn giản", "type": "Tính từ", "ex_cn": "这道题很简单。", "ex_py": "Zhè dào tí hěn jiǎndān.", "ex_vn": "Câu hỏi này rất đơn giản.", "lesson": "16"}, {"hanzi": "难", "pinyin": "nán", "meaning": "khó", "type": "Tính từ", "ex_cn": "学习汉语不难。", "ex_py": "Xuéxí Hànyǔ bù nán.", "ex_vn": "Học tiếng Trung không khó.", "lesson": "16"}, {"hanzi": "打算", "pinyin": "dǎsuàn", "meaning": "dự định, kế hoạch", "type": "Động từ/Danh từ", "ex_cn": "周末你有什么打算？", "ex_py": "Zhōumò nǐ yǒu shénme dǎsuàn?", "ex_vn": "Cuối tuần bạn có dự định gì?", "lesson": "16"}, {"hanzi": "会", "pinyin": "huì", "meaning": "biết, sẽ", "type": "Động từ", "ex_cn": "我会说中文。", "ex_py": "Wǒ huì shuō Zhōngwén.", "ex_vn": "Tôi biết nói tiếng Trung.", "lesson": "16"}, {"hanzi": "老", "pinyin": "lǎo", "meaning": "già, cũ, luôn luôn", "type": "Tính từ", "ex_cn": "张老师是我老朋友。", "ex_py": "Zhāng lǎoshī shì wǒ lǎo péngyou.", "ex_vn": "Thầy Trương là bạn cũ của tôi.", "lesson": "16"}, {"hanzi": "总是", "pinyin": "zǒngshì", "meaning": "luôn luôn", "type": "Phó từ", "ex_cn": "他总是很忙。", "ex_py": "Tā zǒngshì hěn máng.", "ex_vn": "Anh ấy luôn luôn rất bận.", "lesson": "16"}, {"hanzi": "还是", "pinyin": "háishì", "meaning": "hay là, vẫn còn", "type": "Phó từ", "ex_cn": "他是老师还是学生？", "ex_py": "Tā shì lǎoshī háishì xuésheng?", "ex_vn": "Anh ấy là giáo viên hay học sinh?", "lesson": "16"}, {"hanzi": "或者", "pinyin": "huòzhě", "meaning": "hoặc là", "type": "Liên từ", "ex_cn": "喝茶或者喝咖啡。", "ex_py": "Hē chá huòzhě hē kāfēi.", "ex_vn": "Uống trà hoặc là uống cà phê.", "lesson": "16"}, {"hanzi": "碗", "pinyin": "wǎn", "meaning": "bát, chén", "type": "Danh từ/Lượng từ", "ex_cn": "一碗米饭。", "ex_py": "Yì wǎn mǐfàn.", "ex_vn": "Một bát cơm.", "lesson": "16"}, {"hanzi": "样", "pinyin": "yàng", "meaning": "kiểu, mẫu, loại", "type": "Danh từ", "ex_cn": "那是他喜欢的样。", "ex_py": "Nà shì tā xǐhuan de yàng.", "ex_vn": "Đó là kiểu anh ấy thích.", "lesson": "16"}, {"hanzi": "楼", "pinyin": "lóu", "meaning": "lầu, tầng, tòa nhà", "type": "Danh từ", "ex_cn": "他在三楼。", "ex_py": "Tā zài sān lóu.", "ex_vn": "Anh ấy ở tầng 3.", "lesson": "16"}, {"hanzi": "把", "pinyin": "bǎ", "meaning": "lượng từ; giới từ (câu chữ ba)", "type": "Lượng từ/Giới từ", "ex_cn": "请把书打开。", "ex_py": "Qǐng bǎ shū dǎkāi.", "ex_vn": "Mời mở sách ra.", "lesson": "16"}, {"hanzi": "出来", "pinyin": "chūlái", "meaning": "ra đây, xuất hiện", "type": "Động từ", "ex_cn": "请你出来。", "ex_py": "Qǐng nǐ chūlái.", "ex_vn": "Mời bạn ra đây.", "lesson": "16"}, {"hanzi": "上来", "pinyin": "shànglái", "meaning": "lên đây", "type": "Động từ", "ex_cn": "快上来吧。", "ex_py": "Kuài shànglái ba.", "ex_vn": "Mau lên đây đi.", "lesson": "16"}, {"hanzi": "下来", "pinyin": "xiàlái", "meaning": "xuống đây, tiếp tục", "type": "Động từ", "ex_cn": "他从楼上下来了。", "ex_py": "Tā cóng lóushàng xiàlái le.", "ex_vn": "Anh ấy từ trên tầng đi xuống rồi.", "lesson": "16"}, {"hanzi": "进来", "pinyin": "jìnlái", "meaning": "vào đây", "type": "Động từ", "ex_cn": "请进来坐。", "ex_py": "Qǐng jìnlái zuò.", "ex_vn": "Mời vào trong ngồi.", "lesson": "16"}, {"hanzi": "里面", "pinyin": "lǐmiàn", "meaning": "bên trong", "type": "Danh từ", "ex_cn": "书在书包里面。", "ex_py": "Shū zài shūbāo lǐmiàn.", "ex_vn": "Sách ở trong cặp sách.", "lesson": "16"}, {"hanzi": "本子", "pinyin": "běnzi", "meaning": "vở, sổ tay", "type": "Danh từ", "ex_cn": "这是我的本子。", "ex_py": "Zhè shì wǒ de běnzi.", "ex_vn": "Đây là cuốn vở của tôi.", "lesson": "16"}, {"hanzi": "笔", "pinyin": "bǐ", "meaning": "bút", "type": "Danh từ", "ex_cn": "用笔写字。", "ex_py": "Yòng bǐ xiě zì.", "ex_vn": "Dùng bút viết chữ.", "lesson": "16"}, {"hanzi": "书包", "pinyin": "shūbāo", "meaning": "cặp sách", "type": "Danh từ", "ex_cn": "我的书包在那儿。", "ex_py": "Wǒ de shūbāo zài nàr.", "ex_vn": "Cặp sách của tôi ở đó.", "lesson": "16"}, {"hanzi": "路上", "pinyin": "lùshàng", "meaning": "trên đường", "type": "Danh từ", "ex_cn": "我在路上。", "ex_py": "Wǒ zài lùshàng.", "ex_vn": "Tôi đang ở trên đường.", "lesson": "16"}, {"hanzi": "门口", "pinyin": "ménkǒu", "meaning": "cổng, lối vào", "type": "Danh từ", "ex_cn": "我在学校门口等你。", "ex_py": "Wǒ zài xuéxiào ménkǒu děng nǐ.", "ex_vn": "Tôi đợi bạn ở cổng trường.", "lesson": "16"}, {"hanzi": "门票", "pinyin": "ménpiào", "meaning": "vé vào cửa", "type": "Danh từ", "ex_cn": "这张门票多少钱？", "ex_py": "Zhè zhāng ménpiào duōshǎo qián?", "ex_vn": "Chiếc vé này bao nhiêu tiền?", "lesson": "16"}, {"hanzi": "不好意思", "pinyin": "bùhǎoyìsi", "meaning": "ngại quá, xin lỗi", "type": "Cụm từ", "ex_cn": "不好意思，我迟到了。", "ex_py": "Bùhǎoyìsi, wǒ chídào le.", "ex_vn": "Ngại quá, tôi đến muộn rồi.", "lesson": "16"}, {"hanzi": "没意思", "pinyin": "méiyìsi", "meaning": "không thú vị, vô vị", "type": "Tính từ", "ex_cn": "这个电影没意思。", "ex_py": "Zhège diànyǐng méiyìsi.", "ex_vn": "Bộ phim này không thú vị.", "lesson": "16"}, {"hanzi": "有意思", "pinyin": "yǒuyìsi", "meaning": "thú vị, có ý nghĩa", "type": "Tính từ", "ex_cn": "你很有意思。", "ex_py": "Nǐ hěn yǒuyìsi.", "ex_vn": "Bạn rất thú vị.", "lesson": "16"}, {"hanzi": "但", "pinyin": "dàn", "meaning": "nhưng", "type": "Liên từ", "ex_cn": "虽然很累，但我很快乐。", "ex_py": "Suīrán hěn lèi, dàn wǒ hěn kuàilè.", "ex_vn": "Tuy mệt nhưng tôi rất vui.", "lesson": "16"}, {"hanzi": "过年", "pinyin": "guònián", "meaning": "ăn tết, đón năm mới", "type": "Động từ", "ex_cn": "过年回家看父母。", "ex_py": "Guònián huí jiā kàn fùmǔ.", "ex_vn": "Ăn tết về nhà thăm bố mẹ.", "lesson": "16"}, {"hanzi": "站", "pinyin": "zhàn", "meaning": "trạm, đứng", "type": "Danh từ/Động từ", "ex_cn": "车站在那儿。", "ex_py": "Chēzhàn zài nàr.", "ex_vn": "Trạm xe ở đằng kia.", "lesson": "16"}, {"hanzi": "车站", "pinyin": "chēzhàn", "meaning": "bến xe, nhà ga", "type": "Danh từ", "ex_cn": "我在车站等你。", "ex_py": "Wǒ zài chēzhàn děng nǐ.", "ex_vn": "Tôi đợi bạn ở bến xe.", "lesson": "16"}, {"hanzi": "过去", "pinyin": "guòqù", "meaning": "đi qua, quá khứ", "type": "Danh từ/Động từ", "ex_cn": "别再想过去的事。", "ex_py": "Bié zài xiǎng guòqù de shì.", "ex_vn": "Đừng nghĩ về những chuyện quá khứ nữa.", "lesson": "16"}, {"hanzi": "回来", "pinyin": "huílái", "meaning": "quay lại, trở về", "type": "Động từ", "ex_cn": "你什么时候回来？", "ex_py": "Nǐ shénme shíhou huílái?", "ex_vn": "Khi nào bạn về?", "lesson": "16"}, {"hanzi": "回去", "pinyin": "huíqù", "meaning": "đi về", "type": "Động từ", "ex_cn": "我们要回去了。", "ex_py": "Wǒmen yào huíqù le.", "ex_vn": "Chúng tôi phải về rồi.", "lesson": "16"}];
        let currentQuestion = 0, score = 0, questions = [], totalQuestions = 0;

        function initGame() { 
            totalQuestions = Math.min(20, vocabulary.length); 
            questions = generateQuestions(); 
            renderQuestion(); 
        }

        function splitIntoPhrases(sentence, targetWord) {
            // Simple logic to split sentence into meaningful chunks including the target word
            let phrases = [];
            if (sentence.includes(targetWord)) {
                let parts = sentence.split(targetWord);
                if (parts[0]) phrases.push(...splitLogical(parts[0]));
                phrases.push(targetWord);
                if (parts[1]) phrases.push(...splitLogical(parts[1]));
            } else {
                phrases = splitLogical(sentence);
            }
            return phrases.filter(p => p.length > 0 && !/[，。？！、]/.test(p));
        }

        function splitLogical(text) {
            // Split long text into 2-3 char chunks
            let res = [];
            for (let i = 0; i < text.length; i += 3) {
                res.push(text.substr(i, 3));
            }
            return res;
        }

        function generateQuestions() {
            let qs = [], shuffled = [...vocabulary].sort(() => Math.random() - 0.5);
            for (let i = 0; i < totalQuestions; i++) {
                const word = shuffled[i];
                let type;
                
                if (2 === 3) {
                    // For HSK3, use the 3 specific types requested
                    const types = [10, 11, 12]; // 10: Scramble, 11: Translation, 12: Blank
                    type = types[Math.floor(Math.random() * types.length)];
                } else {
                    type = Math.floor(Math.random() * 4); // Old types for HSK1, 2
                }

                let q = { type, word };
                
                if (type <= 2) q.options = generateOptions(word, type);
                if (type === 10) {
                    let sentence = word.ex_cn.replace(/[，。？！、\s]/g, '');
                    let target = word.hanzi;
                    q.phrases = splitIntoPhrases(word.ex_cn, target).sort(() => Math.random() - 0.5);
                    q.correctSentence = sentence;
                }
                if (type === 12) {
                    q.displaySentence = word.ex_cn.replace(word.hanzi, "______");
                    q.options = generateOptions(word, 0); // Hanzi options
                }
                
                qs.push(q);
            }
            return qs;
        }

        function generateOptions(correctWord, type) {
            let options = [correctWord];
            while (options.length < 4 && vocabulary.length >= 4) {
                const rand = vocabulary[Math.floor(Math.random() * vocabulary.length)];
                if (!options.includes(rand)) options.push(rand);
            }
            return options.sort(() => Math.random() - 0.5);
        }

        function renderQuestion() {
            const q = questions[currentQuestion], card = document.getElementById('quiz-card'), progress = document.getElementById('progress');
            progress.style.width = (currentQuestion / totalQuestions) * 100 + '%';
            document.getElementById('progress-text').innerText = (currentQuestion + 1) + '/' + totalQuestions;
            
            let html = '';
            if (q.type === 0) {
                html = `<div class="question-text">Nghe và chọn từ đúng:</div><button class="audio-btn" style="background: #fdf2f8; border: none; font-size: 3rem; cursor: pointer;" onclick="speak('${q.word.hanzi}')">🔊</button><div class="options-grid">${q.options.map(opt => `<button class="option-btn" onclick="checkAnswer('${opt.hanzi}', '${q.word.hanzi}', this)">${opt.hanzi}</button>`).join('')}</div>`;
                setTimeout(() => speak(q.word.hanzi), 500);
            } else if (q.type === 1) {
                html = `<div class="question-text">Từ "${q.word.hanzi}" có nghĩa là gì?</div><div class="options-grid">${q.options.map(opt => `<button class="option-btn" onclick="checkAnswer('${opt.meaning}', '${q.word.meaning}', this)">${opt.meaning}</button>`).join('')}</div>`;
            } else if (q.type === 2) {
                html = `<div class="question-text">Từ "${q.word.hanzi}" có phiên âm là gì?</div><div class="options-grid">${q.options.map(opt => `<button class="option-btn" onclick="checkAnswer('${opt.pinyin}', '${q.word.pinyin}', this)">${opt.pinyin}</button>`).join('')}</div>`;
            } else if (q.type === 3) {
                html = `<div class="question-text">"${q.word.meaning}" trong tiếng Trung là gì?</div><input type="text" class="typing-input" id="typing-ans" placeholder="Nhập Hán tự..."><button class="submit-btn" onclick="checkTyping('${q.word.hanzi}')">Kiểm tra</button>`;
            } 
            // New Types for HSK3
            else if (q.type === 10) {
                html = `<div class="question-text">Sắp xếp câu chính xác:</div><div class="sub-text">Nghĩa: ${q.word.ex_vn}</div><div id="drop-zone" class="phrase-box"></div><div id="drag-zone" class="phrase-box" style="border: none; background: transparent;">${q.phrases.map(p => `<div class="phrase-item" onclick="movePhrase(this, '${q.correctSentence}')">${p}</div>`).join('')}</div>`;
            } else if (q.type === 11) {
                html = `<div class="question-text">Dịch câu sau sang tiếng Trung:</div><div class="sub-text" style="font-size: 1.4rem; color: var(--primary-dark);">${q.word.ex_vn}</div><input type="text" class="typing-input" id="typing-ans" placeholder="Nhập câu tiếng Trung..."><button class="submit-btn" onclick="checkTyping('${q.word.ex_cn.replace(/[，。？！、\s]/g, '')}')">Gửi đáp án</button>`;
            } else if (q.type === 12) {
                html = `<div class="question-text">Điền từ vào ô trống:</div><div class="blank-text">${q.displaySentence.replace("______", "<span class="blank-fill" id="blank-target">?</span>")}</div><div class="sub-text">Nghĩa: ${q.word.ex_vn}</div><div class="options-grid">${q.options.map(opt => `<button class="option-btn" onclick="checkBlank('${opt.hanzi}', '${q.word.hanzi}', this)">${opt.hanzi}</button>`).join('')}</div>`;
            }

            card.innerHTML = html;
        }

        function speak(t) { const m = new SpeechSynthesisUtterance(); m.text = t; m.lang = 'zh-CN'; window.speechSynthesis.speak(m); }
        
        function checkAnswer(s, c, b) {
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach(x => x.disabled = true);
            if (s === c) { b.classList.add('correct'); score++; } 
            else { b.classList.add('wrong'); btns.forEach(x => { if(x.innerText === c) x.classList.add('correct'); }); }
            showNext();
        }

        function checkBlank(s, c, b) {
            const target = document.getElementById('blank-target');
            target.innerText = c;
            checkAnswer(s, c, b);
        }

        function checkTyping(correct) {
            const input = document.getElementById('typing-ans');
            const val = input.value.trim().replace(/[，。？！、\s]/g, '');
            if (val === correct) {
                input.style.borderColor = "#28a745";
                input.style.background = "#d4edda";
                score++;
            } else {
                input.style.borderColor = "#dc3545";
                input.style.background = "#f8d7da";
                const err = document.createElement('div');
                err.style = "color: #dc3545; margin-top: 10px; font-weight: bold;";
                err.innerText = "Đáp án đúng: " + correct;
                input.parentNode.appendChild(err);
            }
            document.querySelector('.submit-btn').disabled = true;
            showNext();
        }

        function movePhrase(el, correct) {
            const dropZone = document.getElementById('drop-zone');
            const dragZone = document.getElementById('drag-zone');
            if (el.parentNode === dragZone) dropZone.appendChild(el);
            else dragZone.appendChild(el);

            const current = Array.from(dropZone.children).map(x => x.innerText).join('');
            if (dragZone.children.length === 0) {
                if (current === correct) {
                    dropZone.style.background = "#d4edda";
                    score++;
                } else {
                    dropZone.style.background = "#f8d7da";
                    const err = document.createElement('div');
                    err.style = "color: #dc3545; margin-top: 10px; font-weight: bold;";
                    err.innerText = "Sai rồi! Câu đúng: " + correct;
                    document.getElementById('quiz-card').appendChild(err);
                }
                showNext();
            }
        }

        function showNext() {
            const btn = document.createElement('button');
            btn.className = "submit-btn";
            btn.style = "margin-top: 1.5rem; background: #4dabf7;";
            btn.innerText = "Tiếp theo ➔";
            btn.onclick = () => {
                currentQuestion++;
                if (currentQuestion < totalQuestions) renderQuestion();
                else showResults();
            };
            document.getElementById('quiz-card').appendChild(btn);
        }

        function showResults() {
            document.getElementById('game-ui').style.display = 'none';
            document.getElementById('result-ui').style.display = 'block';
            document.getElementById('final-score').innerText = Math.round((score/totalQuestions)*100)+'%';
            document.getElementById('score-text').innerText = `Bạn đã hoàn thành ${score}/${totalQuestions} câu hỏi.`;
        }

        initGame();
    </script>
</body>
</html>
