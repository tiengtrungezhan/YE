<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 2 3.0 Bài 3</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk2.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 3</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "回来", "pinyin": "huílái", "meaning": "trở về, về", "lesson": "3", "type": "Động từ", "ex_cn": "爸爸下午五点回来。", "ex_py": "Bàba xiàwǔ wǔ diǎn huílái.", "ex_vn": "Bố 5 giờ chiều quay về."}, {"hanzi": "这么", "pinyin": "zhème", "meaning": "như thế này, thế này", "lesson": "3", "type": "Đại từ", "ex_cn": "今天回来这么晚啊！", "ex_py": "Jīntiān huílái zhème wǎn a!", "ex_vn": "Hôm nay về muộn thế này à!"}, {"hanzi": "完", "pinyin": "wán", "meaning": "xong, hết", "lesson": "3", "type": "Động từ", "ex_cn": "工作太多了，下班的时候没做完。", "ex_py": "Gōngzuò tài duō le, xiàbān de shíhou méi zuò wán.", "ex_vn": "Công việc nhiều quá, lúc tan làm chưa làm xong."}, {"hanzi": "一起", "pinyin": "yìqǐ", "meaning": "cùng nhau", "lesson": "3", "type": "Phó từ", "ex_cn": "我和朋友一起去商店。", "ex_py": "Wǒ hé péngyou yìqǐ qù shāngdiàn.", "ex_vn": "Tôi cùng bạn đi đến cửa hàng."}, {"hanzi": "出去", "pinyin": "chūqù", "meaning": "đi ra ngoài", "lesson": "3", "type": "Động từ", "ex_cn": "今天天气不好，别出去了。", "ex_py": "Jīntiān tiānqì bù hǎo, bié chūqù le.", "ex_vn": "Hôm nay thời tiết không tốt, đừng đi ra ngoài nữa."}, {"hanzi": "洗", "pinyin": "xǐ", "meaning": "rửa, giặt", "lesson": "3", "type": "Động từ", "ex_cn": "我去洗洗手。", "ex_py": "Wǒ qù xǐxǐ shǒu.", "ex_vn": "Tôi đi rửa tay một chút."}, {"hanzi": "自己", "pinyin": "zìjǐ", "meaning": "bản thân, tự mình", "lesson": "3", "type": "Đại từ", "ex_cn": "这是我自己做的中国菜。", "ex_py": "Zhè shì wǒ zìjǐ zuò de Zhōngguócài.", "ex_vn": "Đây là món ăn Trung Quốc do tự tay tôi làm."}, {"hanzi": "拿", "pinyin": "ná", "meaning": "cầm, lấy", "lesson": "3", "type": "Động từ", "ex_cn": "请拿桌子上的水喝。", "ex_py": "Qǐng ná zhuōzi shang de shuǐ hē.", "ex_vn": "Xin hãy lấy nước trên bàn uống."}, {"hanzi": "手", "pinyin": "shǒu", "meaning": "tay", "lesson": "3", "type": "Danh từ", "ex_cn": "吃苹果前要洗手。", "ex_py": "Chī píngguǒ qián yào xǐ shǒu.", "ex_vn": "Trước khi ăn táo cần rửa tay."}, {"hanzi": "为什么", "pinyin": "wèishénme", "meaning": "tại sao", "lesson": "3", "type": "Đại từ", "ex_cn": "你今天为什么没去学校？", "ex_py": "Nǐ jīntiān wèishénme méi qù xuéxiào?", "ex_vn": "Hôm nay tại sao bạn không đi học?"}, {"hanzi": "不错", "pinyin": "búcuò", "meaning": "không tồi, khá tốt", "lesson": "3", "type": "Tính từ", "ex_cn": "这家饭店的菜很不错。", "ex_py": "Zhè jiā fàndiàn de cài hěn búcuò.", "ex_vn": "Món ăn của nhà hàng này rất khá."}, {"hanzi": "送", "pinyin": "sòng", "meaning": "tặng, tiễn", "lesson": "3", "type": "Động từ", "ex_cn": "我送你一个大苹果。", "ex_py": "Wǒ sòng nǐ yí gè dà píngguǒ.", "ex_vn": "Tôi tặng bạn một quả táo lớn."}, {"hanzi": "回去", "pinyin": "huíqù", "meaning": "đi về", "lesson": "3", "type": "Động từ", "ex_cn": "太晚了，我想回去了。", "ex_py": "Tài wǎn le, wǒ xiǎng huíqù le.", "ex_vn": "Muộn quá rồi, tôi muốn đi về rồi."}, {"hanzi": "每", "pinyin": "měi", "meaning": "mỗi", "lesson": "3", "type": "Đại từ", "ex_cn": "我每天早上喝一杯牛奶。", "ex_py": "Wǒ měitiān zǎoshang hē yì bēi niúnǎi.", "ex_vn": "Tôi mỗi sáng uống một ly sữa tươi."}, {"hanzi": "累", "pinyin": "lèi", "meaning": "mệt", "lesson": "3", "type": "Tính từ", "ex_cn": "我觉得他这个月每天都很累。", "ex_py": "Wǒ juéde tā zhè ge yuè měitiān dōu hěn lèi.", "ex_vn": "Tôi cảm thấy tháng này ngày nào anh ấy cũng rất mệt."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
