<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 2 3.0 Bài 11</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk2.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 11</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "唱歌", "pinyin": "chàng gē", "meaning": "hát", "lesson": "11", "type": "Động từ", "ex_cn": "他喜欢唱歌。", "ex_py": "Tā xǐhuan chànggē.", "ex_vn": "Anh ấy thích hát."}, {"hanzi": "男", "pinyin": "nán", "meaning": "nam, đàn ông", "lesson": "11", "type": "Danh từ", "ex_cn": "那是男老师。", "ex_py": "Nà shì nán lǎoshī.", "ex_vn": "Đó là thầy giáo (nam)."}, {"hanzi": "女", "pinyin": "nǚ", "meaning": "nữ, phụ nữ", "lesson": "11", "type": "Danh từ", "ex_cn": "那是女老师。", "ex_py": "Nà shì nǚ lǎoshī.", "ex_vn": "Đó là cô giáo (nữ)."}, {"hanzi": "孩子", "pinyin": "háizi", "meaning": "trẻ con, con cái", "lesson": "11", "type": "Danh từ", "ex_cn": "他是我的孩子。", "ex_py": "Tā shì wǒ de háizi.", "ex_vn": "Nó là con của tôi."}, {"hanzi": "右边", "pinyin": "yòubiān", "meaning": "bên phải", "lesson": "11", "type": "Danh từ", "ex_cn": "在右边。", "ex_py": "Zài yòubiān.", "ex_vn": "Ở bên phải."}, {"hanzi": "比", "pinyin": "bǐ", "meaning": "so với", "lesson": "11", "type": "Giới từ", "ex_cn": "我比他大。", "ex_py": "Wǒ bǐ tā dà.", "ex_vn": "Tôi lớn tuổi hơn anh ấy."}, {"hanzi": "便宜", "pinyin": "piányi", "meaning": "rẻ", "lesson": "11", "type": "Tính từ", "ex_cn": "很便宜。", "ex_py": "Hěn piányi.", "ex_vn": "Rất rẻ."}, {"hanzi": "说话", "pinyin": "shuō huà", "meaning": "nói chuyện", "lesson": "11", "type": "Động từ", "ex_cn": "别说话。", "ex_py": "Bié shuōhuà.", "ex_vn": "Đừng nói chuyện."}, {"hanzi": "可能", "pinyin": "kěnéng", "meaning": "có khả năng, có lẽ", "lesson": "11", "type": "Danh từ", "ex_cn": "他可能不去。", "ex_py": "Tā kěnéng bù qù.", "ex_vn": "Anh ấy có thể không đi."}, {"hanzi": "姓", "pinyin": "xìng", "meaning": "họ", "lesson": "11", "type": "Danh từ", "ex_cn": "你姓什么？", "ex_py": "Nǐ xìng shénme?", "ex_vn": "Bạn họ gì?"}, {"hanzi": "男孩儿", "pinyin": "nánháir", "meaning": "con trai", "lesson": "11", "type": "Bổ sung 3.0", "ex_cn": "那个男孩儿是谁？", "ex_py": "Nàge nánháir shì shéi?", "ex_vn": "Cậu bé kia là ai thế?"}, {"hanzi": "女孩儿", "pinyin": "nǚháir", "meaning": "con gái", "lesson": "11", "type": "Bổ sung 3.0", "ex_cn": "她是一个漂亮的女孩儿。", "ex_py": "Tā shì yí ge piàoliang de nǚháir.", "ex_vn": "Cô ấy là một cô gái xinh đẹp."}, {"hanzi": "小孩儿", "pinyin": "xiǎoháir", "meaning": "trẻ con", "lesson": "11", "type": "Bổ sung 3.0", "ex_cn": "小孩儿都爱玩。", "ex_py": "Xiǎoháir dōu ài wán.", "ex_vn": "Trẻ con đều ham chơi."}, {"hanzi": "小时候", "pinyin": "xiǎoshíhou", "meaning": "hồi nhỏ", "lesson": "11", "type": "Bổ sung 3.0", "ex_cn": "我小时候住在大叻。", "ex_py": "Wǒ xiǎoshíhou zhù zài Dàlè.", "ex_vn": "Hồi nhỏ tôi sống ở Đà Lạt."}, {"hanzi": "右", "pinyin": "yòu", "meaning": "bên phải", "lesson": "11", "type": "Bổ sung 3.0", "ex_cn": "他在我右边。", "ex_py": "Tā zài wǒ yòubiān.", "ex_vn": "Anh ấy ở bên phải tôi."}, {"hanzi": "姓名", "pinyin": "xìngmíng", "meaning": "họ tên", "lesson": "11", "type": "Bổ sung 3.0", "ex_cn": "请写下你的姓名。", "ex_py": "Qǐng xiěxià nǐ de xìngmíng.", "ex_vn": "Vui lòng viết họ tên của bạn xuống."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
