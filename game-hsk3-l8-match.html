<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 3 Bài 8</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk3.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 8</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "满意", "pinyin": "mǎnyì", "meaning": "hài lòng", "lesson": "8", "type": "Động từ", "ex_cn": "经理对他很满意。", "ex_py": "Jīnglǐ duì tā hěn mǎnyì.", "ex_vn": "Giám đốc rất hài lòng với anh ấy."}, {"hanzi": "电梯", "pinyin": "diàntī", "meaning": "thang máy", "lesson": "8", "type": "Danh từ", "ex_cn": "坐电梯上楼。", "ex_py": "Zuò diàntī shàng lóu.", "ex_vn": "Đi thang máy lên lầu."}, {"hanzi": "层", "pinyin": "céng", "meaning": "tầng", "lesson": "8", "type": "Lượng từ", "ex_cn": "我住在五层。", "ex_py": "Wǒ zhù zài wǔ céng.", "ex_vn": "Tôi sống ở tầng 5."}, {"hanzi": "害怕", "pinyin": "hàipà", "meaning": "sợ hãi", "lesson": "8", "type": "Động từ", "ex_cn": "我不害怕。", "ex_py": "Wǒ bù hàipà.", "ex_vn": "Tôi không sợ."}, {"hanzi": "熊猫", "pinyin": "xióngmāo", "meaning": "gấu trúc", "lesson": "8", "type": "Danh từ", "ex_cn": "熊猫很可爱。", "ex_py": "Xióngmāo hěn kě\"ài.", "ex_vn": "Gấu trúc rất đáng yêu."}, {"hanzi": "见面", "pinyin": "jiànmiàn", "meaning": "gặp mặt", "lesson": "8", "type": "Động từ", "ex_cn": "我们明天见面。", "ex_py": "Wǒmen míngtiān jiànmiàn.", "ex_vn": "Ngày mai chúng ta gặp nhau."}, {"hanzi": "安静", "pinyin": "ānjìng", "meaning": "yên tĩnh", "lesson": "8", "type": "Tính từ", "ex_cn": "这里很安静。", "ex_py": "Zhèlǐ hěn ānjìng.", "ex_vn": "Ở đây rất yên tĩnh."}, {"hanzi": "可乐", "pinyin": "kělè", "meaning": "coca-cola", "lesson": "8", "type": "Danh từ", "ex_cn": "你想喝可乐吗？", "ex_py": "Nǐ xiǎng hē kělè ma?", "ex_vn": "Bạn muốn uống coca không?"}, {"hanzi": "一会儿", "pinyin": "yíhuìr", "meaning": "một lúc, chốc lát", "lesson": "8", "type": "Danh từ", "ex_cn": "等一会儿。", "ex_py": "Děng yíhuìr.", "ex_vn": "Đợi một lát."}, {"hanzi": "马上", "pinyin": "mǎshàng", "meaning": "ngay lập tức", "lesson": "8", "type": "Phó từ", "ex_cn": "我马上就到。", "ex_py": "Wǒ mǎshàng jiù dào.", "ex_vn": "Tôi sẽ đến ngay đây."}, {"hanzi": "洗手间", "pinyin": "xǐshǒujiān", "meaning": "nhà vệ sinh", "lesson": "8", "type": "Danh từ", "ex_cn": "请问，洗手间在哪儿？", "ex_py": "Qǐngwèn, xǐshǒujiān zài nǎr?", "ex_vn": "Xin hỏi, nhà vệ sinh ở đâu?"}, {"hanzi": "老", "pinyin": "lǎo", "meaning": "già, cũ", "lesson": "8", "type": "Tính từ", "ex_cn": "这个地方很老。", "ex_py": "Zhège dìfang hěn lǎo.", "ex_vn": "Nơi này rất cũ."}, {"hanzi": "几乎", "pinyin": "jīhū", "meaning": "hầu như", "lesson": "8", "type": "Phó từ", "ex_cn": "我几乎忘了。", "ex_py": "Wǒ jīhū wàng le.", "ex_vn": "Tôi hầu như đã quên rồi."}, {"hanzi": "变化", "pinyin": "biànhuà", "meaning": "thay đổi", "lesson": "8", "type": "Động từ/Danh từ", "ex_cn": "这里的变化很大。", "ex_py": "Zhèlǐ de biànhuà hěn dà.", "ex_vn": "Thay đổi ở nơi này rất lớn."}, {"hanzi": "健康", "pinyin": "jiànkāng", "meaning": "khỏe mạnh", "lesson": "8", "type": "Tính từ/Danh từ", "ex_cn": "祝你身体健康。", "ex_py": "Zhù nǐ shēntǐ jiànkāng.", "ex_vn": "Chúc bạn sức khỏe dồi dào."}, {"hanzi": "重要", "pinyin": "zhòngyào", "meaning": "quan trọng", "lesson": "8", "type": "Tính từ", "ex_cn": "学习很重要。", "ex_py": "Xuéxí hěn zhòngyào.", "ex_vn": "Học tập rất quan trọng."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
