<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK 5 - EZHAN</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .lesson-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .lesson-card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid #eee;
            position: relative;
            overflow: hidden;
        }
        .lesson-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
            box-shadow: 0 10px 25px rgba(165, 207, 218, 0.4);
        }
        .lesson-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
        .lesson-title {
            font-size: 0.9rem;
            color: #666;
            font-weight: 600;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            background: white;
            padding: 2.5rem;
            border-radius: 30px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            transform: scale(0.8);
            transition: 0.3s;
        }
        .modal-overlay.active .modal-content {
            transform: scale(1);
        }
        .game-select-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 2rem;
        }
        .game-select-btn {
            padding: 1.2rem;
            border-radius: 15px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .btn-flip { background: #e3f2fd; color: #1976d2; border: 1px solid #bbdefb; }
        .btn-master { background: #f3e5f5; color: #7b1fa2; border: 1px solid #e1bee7; }
        .btn-grammar { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .btn-deep { background: #fff3e0; color: #ef6c00; border: 1px solid #ffe0b2; }
        
        .game-select-btn:hover { transform: scale(1.05); filter: brightness(0.95); }
    </style>
</head>
<body>
    <div class="page-container">
        <header style="display: block; text-align: left; padding: 0; margin-bottom: 2rem;">
            <a href="game.html" class="back-btn">← Quay lại</a>
            <h1 style="color: var(--primary-dark); margin-top: 1rem; font-size: 2.5rem;">Cao cấp HSK 5</h1>
            <p style="opacity: 0.8;">Lựa chọn bài học để bắt đầu luyện tập.</p>
        </header>

        <div class="lesson-grid" id="lessonGrid">
            <!-- 36 Lessons generated by JS -->
        </div>
    </div>

    <!-- Modal Chọn Game -->
    <div class="modal-overlay" id="lessonModal">
        <div class="modal-content">
            <h2 id="modalTitle" style="color: var(--primary-dark);">Bài học</h2>
            <p style="margin-top: 0.5rem; color: #666; margin-bottom: 1.5rem;">Chọn chế độ luyện tập</p>
            
            <div class="game-select-buttons" style="grid-template-columns: 1fr 1fr; gap: 1rem;">
                <a href="#" id="flipLink" class="game-select-btn btn-flip">LẬT THẺ BÀI</a>
                <a href="#" id="masterLink" class="game-select-btn btn-master">TRÙM TỪ VỰNG</a>
                <a href="#" id="grammarLink" class="game-select-btn btn-grammar">CHẮC NGỮ PHÁP</a>
                <a href="#" id="deepLink" class="game-select-btn btn-deep">HIỂU SÂU</a>
            </div>
            
            <button onclick="closeModal()" style="margin-top: 2rem; background: none; border: none; color: #999; cursor: pointer; font-weight: 600; font-size: 1rem;">Đóng</button>
        </div>
    </div>

    <script>
        const lessonGrid = document.getElementById('lessonGrid');
        const modal = document.getElementById('lessonModal');
        const modalTitle = document.getElementById('modalTitle');
        const flipLink = document.getElementById('flipLink');
        const masterLink = document.getElementById('masterLink');
        const grammarLink = document.getElementById('grammarLink');
        const deepLink = document.getElementById('deepLink');

        // Lesson titles mapping
        const lessonTitles = {
            14: "北京的四合院",
            15: "纸上谈兵"
        };

        // Generate 36 lessons
        for (let i = 1; i <= 36; i++) {
            const card = document.createElement('div');
            card.className = 'lesson-card';
            const title = lessonTitles[i] || `Bài học ${i}`;
            card.innerHTML = `
                <div class="lesson-number">${i}</div>
                <div class="lesson-title">${title}</div>
            `;
            card.onclick = () => openGameSelect(i);
            lessonGrid.appendChild(card);
        }

        function openGameSelect(lessonId) {
            modalTitle.innerText = `HSK 5 - Bài ${lessonId}`;
            
            // Dynamic links
            flipLink.href = `game-hsk5-l${lessonId}-flip.html`;
            masterLink.href = `game-hsk5-l${lessonId}-master.html`;
            grammarLink.href = `game-hsk5-l${lessonId}-grammar.html`;
            deepLink.href = `game-hsk5-l${lessonId}-deep.html`;
            
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        // Close modal when clicking outside
        window.onclick = (event) => {
            if (event.target == modal) closeModal();
        }
    </script>
</body>
</html>
