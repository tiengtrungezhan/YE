<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiểu Sâu - HSK 5 Bài 15: 纸上谈兵</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: linear-gradient(135deg, #fff8f0 0%, #fff3e0 100%); min-height: 100vh; }
        .game-wrapper { max-width: 820px; margin: 0 auto; padding: 1.5rem; }

        .lesson-title-bar {
            background: linear-gradient(135deg, #ef6c00, #ff8f00);
            color: white;
            border-radius: 20px;
            padding: 1.2rem 2rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 25px rgba(239,108,0,0.35);
        }
        .lesson-title-bar h1 { font-size: 1.6rem; margin: 0; }
        .lesson-title-bar .badge { background: rgba(255,255,255,0.25); border-radius: 12px; padding: 0.4rem 1rem; font-size: 0.85rem; font-weight: 700; }

        /* Reading passage */
        .passage-box {
            background: white;
            border-radius: 20px;
            padding: 1.8rem 2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.07);
            border-left: 5px solid #ef6c00;
            position: relative;
        }
        .passage-label {
            font-size: 0.75rem;
            font-weight: 800;
            color: #ef6c00;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .passage-text {
            font-size: 1.05rem;
            line-height: 2;
            color: #333;
            font-family: "Noto Sans SC", "Source Han Sans", sans-serif;
        }
        .passage-text p { margin-bottom: 0.8rem; }
        .passage-text p:last-child { margin-bottom: 0; }
        .highlight { background: #fff3e0; color: #e65100; padding: 1px 4px; border-radius: 4px; font-weight: 700; }

        /* Progress */
        .progress-bar-wrap {
            background: white;
            border-radius: 16px;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .progress-track { flex: 1; height: 10px; background: #f0f0f0; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #ef6c00, #ff8f00); border-radius: 10px; transition: width 0.5s ease; width: 0%; }
        .progress-label { font-weight: 800; color: #ef6c00; font-size: 1rem; min-width: 55px; text-align: right; }

        /* Quiz card */
        .quiz-card {
            background: white;
            border-radius: 24px;
            padding: 2rem 2.2rem;
            box-shadow: 0 6px 30px rgba(0,0,0,0.09);
            margin-bottom: 1.5rem;
            min-height: 380px;
            display: flex;
            flex-direction: column;
            animation: slideIn 0.35s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .q-number { font-size: 0.8rem; font-weight: 800; color: #ef6c00; letter-spacing: 1px; margin-bottom: 0.8rem; }
        .q-text { font-size: 1.25rem; font-weight: 700; color: #222; line-height: 1.6; margin-bottom: 1.5rem; }
        .q-context {
            background: #fff8f0;
            border-radius: 12px;
            padding: 0.8rem 1.2rem;
            font-size: 1rem;
            color: #555;
            margin-bottom: 1.2rem;
            border-left: 3px solid #ffb74d;
            line-height: 1.7;
        }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; margin-top: auto; }
        .opt-btn {
            padding: 1rem 1.2rem;
            border: 2px solid #e8e8e8;
            border-radius: 14px;
            background: #fafafa;
            font-size: 1rem;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            line-height: 1.5;
        }
        .opt-btn:hover:not(:disabled) { border-color: #ef6c00; background: #fff3e0; color: #e65100; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(239,108,0,0.15); }
        .opt-btn.correct { border-color: #2e7d32 !important; background: #e8f5e9 !important; color: #1b5e20 !important; }
        .opt-btn.wrong { border-color: #c62828 !important; background: #ffebee !important; color: #b71c1c !important; }
        .opt-btn.reveal { border-color: #2e7d32 !important; background: #e8f5e9 !important; color: #1b5e20 !important; }

        .feedback-box {
            margin-top: 1.2rem;
            padding: 1rem 1.3rem;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.6;
            display: none;
        }
        .feedback-box.correct { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .feedback-box.wrong { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }

        .next-btn {
            display: none;
            margin-top: 1rem;
            padding: 0.9rem 2rem;
            background: linear-gradient(135deg, #ef6c00, #ff8f00);
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            align-self: flex-end;
        }
        .next-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(239,108,0,0.4); }

        /* Result screen */
        .result-screen {
            display: none;
            background: white;
            border-radius: 24px;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 6px 30px rgba(0,0,0,0.09);
            animation: slideIn 0.4s ease;
        }
        .result-emoji { font-size: 4rem; margin-bottom: 1rem; }
        .result-title { font-size: 2rem; font-weight: 800; color: #ef6c00; margin-bottom: 0.5rem; }
        .score-ring {
            width: 130px; height: 130px;
            border-radius: 50%;
            border: 10px solid #ffe0b2;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.2rem; font-weight: 800; color: #ef6c00;
            margin: 1.5rem auto;
        }
        .result-msg { font-size: 1.1rem; color: #666; margin-bottom: 2rem; }
        .btn-replay {
            padding: 1rem 2.5rem;
            background: linear-gradient(135deg, #ef6c00, #ff8f00);
            color: white; border: none; border-radius: 14px;
            font-weight: 800; font-size: 1.1rem; cursor: pointer;
            transition: 0.2s; margin: 0.5rem;
        }
        .btn-replay:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(239,108,0,0.4); }
        .btn-back-link {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: #fff3e0;
            color: #ef6c00; border: 2px solid #ffcc80;
            border-radius: 14px; font-weight: 800; font-size: 1rem;
            text-decoration: none; margin: 0.5rem;
            transition: 0.2s;
        }
        .btn-back-link:hover { background: #ffe0b2; }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn"><img src="mascot.png" alt="Home"></a>
    <div class="page-container">
        <a href="game-hsk5.html" class="back-btn">← Quay lại</a>

        <div class="game-wrapper">
            <div class="lesson-title-bar">
                <h1>📖 Hiểu Sâu</h1>
                <div class="badge">HSK 5 · Bài 15 · 纸上谈兵</div>
            </div>



            <!-- Progress Bar -->
            <div class="progress-bar-wrap">
                <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
                <div class="progress-label" id="progressLabel">0 / 10</div>
            </div>

            <!-- Quiz Card -->
            <div class="quiz-card" id="quizCard">
                <!-- JS injected -->
            </div>

            <!-- Result Screen -->
            <div class="result-screen" id="resultScreen">
                <div class="result-emoji" id="resultEmoji">🏆</div>
                <div class="result-title">Kết Quả</div>
                <div class="score-ring" id="scoreRing">0%</div>
                <div class="result-msg" id="resultMsg"></div>
                <button class="btn-replay" onclick="startGame()">🔄 Làm Lại</button>
                <a href="game-hsk5.html" class="btn-back-link">← Danh sách bài</a>
            </div>
        </div>
    </div>

    <script>
    const questions = [
        {
            q: "赵括从小读了很多兵书，他与别人谈论军事时，结果怎样？",
            context: "跟别人谈论起军事来，没有人说得过他，就是父亲赵奢也难不住他。",
            options: [
                "A. 没有人能胜过他，连父亲也难不住他",
                "B. 父亲总是能指出他的错误",
                "C. 别人都不愿意和他谈论军事",
                "D. 他的理论被大家认为是错的"
            ],
            answer: 0,
            explain: '原文说「没有人说得过他，就是父亲赵奢也难不住他」，说明赵括在理论上无人能胜。'
        },
        {
            q: "赵奢对儿子赵括的真实评价是什么？",
            context: "儿子的毛病是只会讲大道理，缺乏实际锻炼，不能当大将。如果让他当了大将，迟早会害了赵国。",
            options: [
                "A. 赵括聪明，将来必成大将",
                "B. 赵括只会讲理论，缺乏实战经验，不能当大将",
                "C. 赵括勇敢，但需要再多读几年兵书",
                "D. 赵括比自己更有军事才能"
            ],
            answer: 1,
            explain: '赵奢私下对妻子说赵括「只会讲大道理，缺乏实际锻炼，不能当大将」，这是他对儿子的真实评价。'
        },
        {
            q: "廉颇面对秦军时采取的策略是什么？",
            context: "廉颇根据敌强我弱的形势，命令士兵们坚守阵地，绝对不可主动出战。",
            options: [
                "A. 主动出击，先发制人",
                "B. 撤退到城内，等待援军",
                "C. 坚守阵地，绝对不主动出战",
                "D. 与秦军谈判，寻求和平"
            ],
            answer: 2,
            explain: '廉颇根据「敌强我弱的形势」，采取防守策略——坚守阵地，绝对不主动出战。这个策略非常有效。'
        },
        {
            q: '秦军多次挑战廉颇，甚至骂他是「胆小鬼」，廉颇的反应是什么？',
            context: "秦军多次挑战，骂他是胆小鬼，他还是不出兵。这个办法果然非常有效，成功地把秦军拦在了国门之外。",
            options: [
                "A. 廉颇生气，立刻出兵反击",
                "B. 廉颇不为所动，继续坚守不出兵",
                "C. 廉颇请求赵王换帅",
                "D. 廉颇派小队出击，示威一番"
            ],
            answer: 1,
            explain: '廉颇面对挑衅和嘲骂，仍然坚持不出兵的策略，这让秦军无法快速取胜，粮食也快耗尽了。'
        },
        {
            q: "秦国为什么要在赵国散布谣言？",
            context: "秦人深知廉颇善于用兵，如果想在短期内打败赵国，必须想办法叫赵国把廉颇调回去。",
            options: [
                "A. 为了让赵括相信自己很厉害",
                "B. 为了让赵王知道真实的军事情况",
                "C. 因为他们害怕赵括，不敢进攻",
                "D. 为了让赵国把廉颇调走，换上赵括"
            ],
            answer: 3,
            explain: '秦人知道廉颇善于用兵，打不过他，所以散布「秦军最怕赵括」的谣言，目的是让赵国把廉颇换掉。'
        },
        {
            q: "赵括的母亲为什么反对赵王任命儿子为大将？",
            context: "赵括的母亲再三阻止赵王任命儿子为大将，说他还没有独立带兵作战的资格。",
            options: [
                "A. 因为她希望儿子留在家中照顾她",
                "B. 因为她认为儿子没有独立带兵作战的资格",
                "C. 因为她认为廉颇的策略是正确的",
                "D. 因为她相信秦军确实很害怕赵括"
            ],
            answer: 1,
            explain: '赵括的母亲「再三阻止」，说赵括「还没有独立带兵作战的资格」——她比赵王更清醒地认识到儿子的不足。'
        },
        {
            q: "赵括接替廉颇后，做了哪些改变？",
            context: "一直盲目自信、轻视秦军的他完全改变了廉颇的作战方案，死搬兵书上的理论，主动进攻秦军。",
            options: [
                "A. 他继承廉颇的防守策略，更加谨慎",
                "B. 他完全改变廉颇方案，死搬兵书理论，主动进攻",
                "C. 他退兵到城内，加强防守工事",
                "D. 他派使者与秦军谈判求和"
            ],
            answer: 1,
            explain: '赵括「盲目自信、轻视秦军」，完全改变了廉颇的作战方案，死搬兵书上的理论，主动进攻，结果导致惨败。'
        },
        {
            q: "赵括带兵出战的最终结果是什么？",
            context: "结果数十万赵军全部被杀，丢掉了宝贵的生命。",
            options: [
                "A. 赵军成功击退了秦军",
                "B. 赵军和秦军打成平局",
                "C. 数十万赵军全部被杀，损失惨重",
                "D. 赵括被俘，但赵军大部分撤退成功"
            ],
            answer: 2,
            explain: '结果极为惨烈：「数十万赵军全部被杀，丢掉了宝贵的生命」——这是赵括纸上谈兵、盲目自信的代价。'
        },
        {
            q: '「纸上谈兵」这个成语现在常用来形容什么样的人或行为？',
            context: "现在常用这个成语讽刺那些只会空谈理论的人，提醒大家做事一定要灵活，要注意理论联系实际。",
            options: [
                "A. 形容在战场上英勇作战的将军",
                "B. 形容读书多但不懂得变通的学者",
                "C. 讽刺只会空谈理论、不联系实际的人",
                "D. 形容在纸上写出了出色战略的谋士"
            ],
            answer: 2,
            explain: '成语「纸上谈兵」现在专门用来讽刺那些只会空谈理论的人，提醒做事要理论联系实际。'
        },
        {
            q: "从这个故事中，我们可以得到什么最重要的启示？",
            context: "提醒大家做事一定要灵活，要注意理论联系实际。",
            options: [
                "A. 多读书就能成为优秀的将领",
                "B. 做事要灵活，理论必须结合实际经验",
                "C. 应该相信谣言，因为谣言有时是真的",
                "D. 年轻人比老将更有创新精神"
            ],
            answer: 1,
            explain: '故事的核心启示是：理论知识必须与实际相结合，做事要灵活变通，不能死搬理论——这正是「纸上谈兵」要告诫我们的道理。'
        }
    ];

    let current = 0;
    let score = 0;
    let answered = false;

    function startGame() {
        current = 0;
        score = 0;
        answered = false;
        document.getElementById('resultScreen').style.display = 'none';
        document.getElementById('quizCard').style.display = 'flex';
        renderQuestion();
    }

    function renderQuestion() {
        answered = false;
        const q = questions[current];
        const card = document.getElementById('quizCard');
        const total = questions.length;

        // Update progress
        document.getElementById('progressFill').style.width = (current / total * 100) + '%';
        document.getElementById('progressLabel').innerText = current + ' / ' + total;

        card.innerHTML = `
            <div class="q-number">CÂU ${current + 1} / ${total}</div>
            <div class="q-text">${q.q}</div>

            <div class="options-grid" id="optionsGrid">
                ${q.options.map((opt, i) => `
                    <button class="opt-btn" id="opt${i}" onclick="selectAnswer(${i})">${opt}</button>
                `).join('')}
            </div>
            <div class="feedback-box" id="feedbackBox"></div>
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
                ${current < total - 1 ? 'Câu tiếp theo →' : 'Xem kết quả 🏆'}
            </button>
        `;
    }

    function selectAnswer(idx) {
        if (answered) return;
        answered = true;

        const q = questions[current];
        const correct = q.answer;
        const fb = document.getElementById('feedbackBox');

        document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);

        document.getElementById('opt' + idx).classList.add(idx === correct ? 'correct' : 'wrong');
        if (idx !== correct) {
            document.getElementById('opt' + correct).classList.add('reveal');
        }

        if (idx === correct) {
            score++;
            fb.className = 'feedback-box correct';
            fb.innerHTML = '✅ <strong>Chính xác!</strong> ' + q.explain;
        } else {
            fb.className = 'feedback-box wrong';
            fb.innerHTML = '❌ <strong>Chưa đúng.</strong> ' + q.explain;
        }
        fb.style.display = 'block';

        const nextBtn = document.getElementById('nextBtn');
        nextBtn.style.display = 'block';
    }

    function nextQuestion() {
        current++;
        if (current < questions.length) {
            renderQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quizCard').style.display = 'none';
        document.getElementById('progressFill').style.width = '100%';
        document.getElementById('progressLabel').innerText = questions.length + ' / ' + questions.length;

        const pct = Math.round(score / questions.length * 100);
        let emoji = '💪', msg = '';
        if (pct === 100) { emoji = '🏆'; msg = 'Xuất sắc! Bạn đã hiểu sâu toàn bộ bài khóa!'; }
        else if (pct >= 80) { emoji = '🌟'; msg = 'Rất tốt! Bạn hiểu bài khóa khá sâu rồi.'; }
        else if (pct >= 60) { emoji = '📖'; msg = 'Khá ổn! Hãy đọc lại bài khóa một lần nữa nhé.'; }
        else { emoji = '🔁'; msg = 'Hãy đọc kỹ bài khóa và thử lại nhé!'; }

        document.getElementById('resultEmoji').innerText = emoji;
        document.getElementById('scoreRing').innerText = pct + '%';
        document.getElementById('resultMsg').innerText = `Bạn trả lời đúng ${score}/${questions.length} câu. ${msg}`;
        document.getElementById('resultScreen').style.display = 'block';
    }

    startGame();
    </script>
</body>
</html>
