<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 1 3.0 Bài 12</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk1.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 12</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "病", "pinyin": "bìng", "meaning": "bệnh, ốm", "lesson": "12", "type": "Bổ sung 3.0", "ex_cn": "他病了，不能来上课。", "ex_py": "Tā bìng le, bù néng lái shàngkè.", "ex_vn": "Anh ấy bị ốm, không thể đến lớp."}, {"hanzi": "公司", "pinyin": "gōngsī", "meaning": "công ty", "lesson": "12", "type": "Danh từ", "ex_cn": "我在公司。", "ex_py": "Wǒ zài gōngsī.", "ex_vn": "Tôi ở công ty."}, {"hanzi": "觉得", "pinyin": "juéde", "meaning": "cảm thấy, cho rằng", "lesson": "12", "ex_cn": "你觉得这本书怎么样？", "ex_py": "Nǐ juéde zhè běn shū zěnmeyàng?", "ex_vn": "Bạn thấy cuốn sách này thế nào?", "type": "Động từ"}, {"hanzi": "看病", "pinyin": "kànbìng", "meaning": "khám bệnh", "lesson": "12", "type": "Bổ sung 3.0", "ex_cn": "他去医院看病了。", "ex_py": "Tā qù yīyuàn kànbìng le.", "ex_vn": "Anh ấy đi bệnh viện khám bệnh rồi."}, {"hanzi": "老师", "pinyin": "lǎoshī", "meaning": "thầy/cô giáo", "lesson": "12", "ex_cn": "老师好！", "ex_py": "Lǎoshī hǎo!", "ex_vn": "Chào thầy/cô!", "type": "Danh từ"}, {"hanzi": "热", "pinyin": "rè", "meaning": "nóng", "lesson": "12", "type": "Tính từ", "ex_cn": "今天天气很热，我们去游泳吧。", "ex_py": "Jīntiān tiānqì hěn rè, wǒmen qù yóuyǒng ba.", "ex_vn": "Hôm nay trời rất nóng, chúng ta đi bơi đi."}, {"hanzi": "人", "pinyin": "rén", "meaning": "người", "lesson": "12", "type": "Danh từ", "ex_cn": "他是中国人。", "ex_py": "Tā shì Zhōngguó rén.", "ex_vn": "Anh ấy là người Trung Quốc."}, {"hanzi": "什么", "pinyin": "shénme", "meaning": "cái gì", "lesson": "12", "type": "Đại từ", "ex_cn": "你叫什么名字？", "ex_py": "Nǐ jiào shénme míngzi?", "ex_vn": "Bạn tên là gì?"}, {"hanzi": "生病", "pinyin": "shēng bìng", "meaning": "sinh bệnh, ốm", "lesson": "12", "type": "Động từ", "ex_cn": "他生病了。", "ex_py": "Tā shēngbìng le.", "ex_vn": "Anh ấy bị bệnh rồi."}, {"hanzi": "下雨", "pinyin": "xià yǔ", "meaning": "có mưa, đổ mưa", "lesson": "12", "type": "Danh từ", "ex_cn": "今天下雨了，我没有带伞，全身都湿了。", "ex_py": "Jīntiān xià yǔ le, wǒ méiyǒu dài sǎn, quánshēn dōu shī le.", "ex_vn": "Hôm nay trời mưa, tôi không mang ô nên ướt hết cả người."}, {"hanzi": "雪", "pinyin": "xuě", "meaning": "tuyết", "lesson": "12", "type": "Danh từ", "ex_cn": "下雪了。", "ex_py": "Xià xuě le.", "ex_vn": "Tuyết rơi rồi."}, {"hanzi": "药", "pinyin": "yào", "meaning": "thuốc", "lesson": "12", "type": "Danh từ", "ex_cn": "他在吃药。", "ex_py": "Tā zài chī yào.", "ex_vn": "Anh ấy đang uống thuốc."}, {"hanzi": "一点儿", "pinyin": "yìdiǎnr", "meaning": "một ít, một chút", "lesson": "12", "type": "Tính từ", "ex_cn": "请喝一点儿水。", "ex_py": "Qǐng hē yìdiǎnr shuǐ.", "ex_vn": "Xin hãy uống một chút nước."}, {"hanzi": "有点儿", "pinyin": "yǒudiǎnr", "meaning": "hơi, một chút", "type": "Phó từ", "ex_cn": "我今天有点儿忙。", "ex_py": "Wǒ jīntiān yǒudiǎnr máng.", "ex_vn": "Hôm nay tôi hơi bận.", "lesson": "12"}, {"hanzi": "雨", "pinyin": "yǔ", "meaning": "mưa", "lesson": "12", "type": "Bổ sung 3.0", "ex_cn": "外边正在下雨，你带伞了吗？", "ex_py": "Wàibian zhèngzài xià yǔ, nǐ dài sǎn le ma?", "ex_vn": "Bên ngoài đang mưa, bạn mang ô chưa?"}, {"hanzi": "这里", "pinyin": "zhèlǐ", "meaning": "ở đây, chỗ này", "lesson": "12", "type": "Bổ sung 3.0", "ex_cn": "这里的风景很好，我很喜欢。", "ex_py": "Zhèlǐ de fēngjǐng hěn hǎo, wǒ hěn xǐhuan.", "ex_vn": "Phong cảnh ở đây rất đẹp, tôi rất thích."}, {"hanzi": "再", "pinyin": "zài", "meaning": "lại, tiếp tục", "lesson": "12", "type": "Danh từ", "ex_cn": "再见。", "ex_py": "Zàijiàn.", "ex_vn": "Tạm biệt."}, {"hanzi": "再见", "pinyin": "zàijiàn", "meaning": "tạm biệt", "lesson": "12", "ex_cn": "老师再见！", "ex_py": "Lǎoshī zàijiàn!", "ex_vn": "Tạm biệt thầy/cô!", "type": "Danh từ"}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
