<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 1 3.0 Bài 12</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk1.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 12</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "天", "pinyin": "tiān", "meaning": "trời, ngày", "lesson": "12", "type": "danh từ", "ex_cn": "今天天很冷。", "ex_py": "Jīntiān tiān hěn lěng.", "ex_vn": "Hôm nay trời rất lạnh."}, {"hanzi": "天气", "pinyin": "tiānqì", "meaning": "thời tiết", "lesson": "12", "type": "danh từ", "ex_cn": "今天天气很热。", "ex_py": "Jīntiān tiānqì hěn rè.", "ex_vn": "Thời tiết hôm nay rất nóng."}, {"hanzi": "了", "pinyin": "le", "meaning": "rồi (trợ từ ngữ khí)", "lesson": "12", "type": "trợ từ", "ex_cn": "天冷了。", "ex_py": "Tiān lěng le.", "ex_vn": "Trời lạnh rồi."}, {"hanzi": "冷", "pinyin": "lěng", "meaning": "lạnh", "lesson": "12", "type": "tính từ", "ex_cn": "我觉得很冷。", "ex_py": "Wǒ juéde hěn lěng.", "ex_vn": "Tôi cảm thấy rất lạnh."}, {"hanzi": "热", "pinyin": "rè", "meaning": "nóng", "lesson": "12", "type": "tính từ", "ex_cn": "今天不太热。", "ex_py": "Jīntiān bú tài rè.", "ex_vn": "Hôm nay không nóng lắm."}, {"hanzi": "觉得", "pinyin": "juéde", "meaning": "cảm thấy, thấy rằng", "lesson": "12", "type": "động từ", "ex_cn": "你觉得怎么样？", "ex_py": "Nǐ juéde zěnmeyàng?", "ex_vn": "Bạn thấy thế nào?"}, {"hanzi": "下", "pinyin": "xià", "meaning": "rơi, đổ (mưa, tuyết), xuống", "lesson": "12", "type": "động từ", "ex_cn": "下雨了。", "ex_py": "Xià yǔ le.", "ex_vn": "Trời mưa rồi."}, {"hanzi": "下雨", "pinyin": "xià yǔ", "meaning": "mưa, trời mưa", "lesson": "12", "type": "động từ", "ex_cn": "明天会下雨。", "ex_py": "Míngtiān huì xià yǔ.", "ex_vn": "Ngày mai trời sẽ mưa."}, {"hanzi": "下雪", "pinyin": "xià xuě", "meaning": "tuyết rơi", "lesson": "12", "type": "động từ", "ex_cn": "今天下雪吗？", "ex_py": "Jīntiān xià xuě ma?", "ex_vn": "Hôm nay có tuyết rơi không?"}, {"hanzi": "来", "pinyin": "lái", "meaning": "đến, lại, tới", "lesson": "12", "type": "động từ", "ex_cn": "你来看一下这个。", "ex_py": "Nǐ lái kàn yíxià zhè ge.", "ex_vn": "Bạn lại xem cái này một chút đi."}, {"hanzi": "有点儿", "pinyin": "yǒudiǎnr", "meaning": "hơi, một chút", "lesson": "12", "type": "phó từ", "ex_cn": "这个有点儿大。", "ex_py": "Zhè ge yǒudiǎnr dà.", "ex_vn": "Cái này hơi to một chút."}, {"hanzi": "生病", "pinyin": "shēngbìng", "meaning": "bị ốm, bị bệnh", "lesson": "12", "type": "động từ", "ex_cn": "她生病了。", "ex_py": "Tā shēngbìng le.", "ex_vn": "Cô ấy bị ốm rồi."}, {"hanzi": "药", "pinyin": "yào", "meaning": "thuốc", "lesson": "12", "type": "danh từ", "ex_cn": "我要吃药。", "ex_py": "Wǒ yào chī yào.", "ex_vn": "Tôi phải uống thuốc."}, {"hanzi": "回", "pinyin": "huí", "meaning": "về, quay về", "lesson": "12", "type": "động từ", "ex_cn": "爸爸回家了吗？", "ex_py": "Bàba huí jiā le ma?", "ex_vn": "Bố đã về nhà chưa?"}, {"hanzi": "喝", "pinyin": "hē", "meaning": "uống", "lesson": "12", "type": "động từ", "ex_cn": "你想喝茶吗？", "ex_py": "Nǐ xiǎng hē chá ma?", "ex_vn": "Bạn có muốn uống trà không?"}, {"hanzi": "公司", "pinyin": "gōngsī", "meaning": "công ty", "lesson": "12", "type": "danh từ", "ex_cn": "他来公司了吗？", "ex_py": "Tā lái gōngsī le ma?", "ex_vn": "Anh ấy đã đến công ty chưa?"}, {"hanzi": "看病", "pinyin": "kànbìng", "meaning": "khám bệnh, đi khám", "lesson": "12", "type": "động từ", "ex_cn": "他去医院看病了。", "ex_py": "Tā qù yīyuàn kànbìng le.", "ex_vn": "Anh ấy đi bệnh viện khám bệnh rồi."}, {"hanzi": "一点儿", "pinyin": "yìdiǎnr", "meaning": "một chút, một ít", "lesson": "12", "type": "lượng từ", "ex_cn": "你想喝一点儿水吗？", "ex_py": "Nǐ xiǎng hē yìdiǎnr shuǐ ma?", "ex_vn": "Bạn có muốn uống một chút nước không?"}, {"hanzi": "再", "pinyin": "zài", "meaning": "lại, nữa, sau đó mới", "lesson": "12", "type": "phó từ", "ex_cn": "回家后再喝点儿热水吧。", "ex_py": "Huí jiā hòu zài hē diǎnr rè shuǐ ba.", "ex_vn": "Về nhà rồi uống thêm chút nước ấm nhé."}, {"hanzi": "先", "pinyin": "xiān", "meaning": "trước, trước tiên", "lesson": "12", "type": "phó từ", "ex_cn": "你先吃饭，再去学校吧。", "ex_py": "Nǐ xiān chī fàn, zài qù xuéxiào ba.", "ex_vn": "Bạn ăn cơm trước đi, rồi hãy đến trường nhé."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
