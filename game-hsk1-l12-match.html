<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 1 3.0 Bài 12</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk1.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 12</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "来", "pinyin": "lái", "meaning": "đến, tới", "lesson": "12", "type": "Động từ", "ex_cn": "我来。", "ex_py": "Wǒ lái.", "ex_vn": "Tôi đến đây."}, {"hanzi": "冷", "pinyin": "lěng", "meaning": "lạnh", "lesson": "12", "type": "Tính từ", "ex_cn": "今天很冷。", "ex_py": "Jīntiān hěn lěng.", "ex_vn": "Hôm nay rất lạnh."}, {"hanzi": "那", "pinyin": "nà", "meaning": "kia, đó", "lesson": "12", "type": "Đại từ", "ex_cn": "那是谁？", "ex_py": "Nà shì shéi?", "ex_vn": "Đó là ai?"}, {"hanzi": "那儿", "pinyin": "nàr", "meaning": "đằng kia, ở đó", "lesson": "12", "type": "Đại từ", "ex_cn": "在那儿。", "ex_py": "Zài nàr.", "ex_vn": "Ở đằng kia."}, {"hanzi": "热", "pinyin": "rè", "meaning": "nóng", "lesson": "12", "type": "Tính từ", "ex_cn": "今天很热。", "ex_py": "Jīntiān hěn rè.", "ex_vn": "Hôm nay rất nóng."}, {"hanzi": "水果", "pinyin": "shuïguǒ", "meaning": "trái cây", "lesson": "12", "type": "Danh từ", "ex_cn": "我喜欢吃水果。", "ex_py": "Wǒ xǐhuan chī shuǐguǒ.", "ex_vn": "Tôi thích ăn hoa quả."}, {"hanzi": "水", "pinyin": "shuǐ", "meaning": "nước", "lesson": "12", "type": "Danh từ", "ex_cn": "他在喝水。", "ex_py": "Tā zài hē shuǐ.", "ex_vn": "Anh ấy đang uống nước."}, {"hanzi": "上", "pinyin": "shàng", "meaning": "trên", "lesson": "12", "type": "Danh từ", "ex_cn": "桌子上。", "ex_py": "Zhuōzi shàng.", "ex_vn": "Trên bàn."}, {"hanzi": "天气", "pinyin": "tiānqì", "meaning": "thời tiết", "lesson": "12", "type": "Danh từ", "ex_cn": "今天天气很好。", "ex_py": "Jīntiān tiānqì hěn hǎo.", "ex_vn": "Thời tiết hôm nay rất tốt."}, {"hanzi": "太", "pinyin": "tài", "meaning": "quá, lắm", "lesson": "12", "type": "Phó từ", "ex_cn": "太好了！", "ex_py": "Tài hǎo le!", "ex_vn": "Tốt quá rồi!"}, {"hanzi": "下雨", "pinyin": "xià yǔ", "meaning": "có mưa, đổ mưa", "lesson": "12", "type": "Danh từ", "ex_cn": "今天下雨。", "ex_py": "Jīntiān xià yǔ.", "ex_vn": "Hôm nay trời mưa."}, {"hanzi": "些", "pinyin": "xiē", "meaning": "một ít, một vài", "lesson": "12", "type": "Số từ", "ex_cn": "这些是我的。", "ex_py": "Zhèxiē shì wǒ de.", "ex_vn": "Những cái này là của tôi."}, {"hanzi": "小姐", "pinyin": "xiǎojiě", "meaning": "cô", "lesson": "12", "type": "Danh từ", "ex_cn": "她是小姐。", "ex_py": "Tā shì xiǎojiě.", "ex_vn": "Cô ấy là tiểu thư (cô ấy)."}, {"hanzi": "桌子", "pinyin": "zhuōzi", "meaning": "cái bàn", "lesson": "12", "type": "Danh từ", "ex_cn": "这是桌子。", "ex_py": "Zhè shì zhuōzi.", "ex_vn": "Đây là cái bàn."}, {"hanzi": "这儿", "pinyin": "zhèr", "meaning": "ở đây, chỗ này", "lesson": "12", "type": "Đại từ", "ex_cn": "在这儿。", "ex_py": "Zài zhèr.", "ex_vn": "Ở đây."}, {"hanzi": "怎么样", "pinyin": "zěnmeyàng", "meaning": "thế nào", "lesson": "12", "type": "Đại từ", "ex_cn": "今天天气怎么样？", "ex_py": "Jīntiān tiānqì zěnmeyàng?", "ex_vn": "Thời tiết hôm nay thế nào?"}, {"hanzi": "爱", "pinyin": "ài", "meaning": "yêu, thích", "lesson": "12", "type": "Danh từ", "ex_cn": "我爱妈妈。", "ex_py": "Wǒ ài māma.", "ex_vn": "Con yêu mẹ."}, {"hanzi": "好看", "pinyin": "hǎokàn", "meaning": "đẹp (nhìn)", "lesson": "12", "type": "Bổ sung 3.0", "ex_cn": "那本书 rất hay。", "ex_py": "Nà běn shū hěn hǎokàn.", "ex_vn": "Cuốn sách đó rất hay."}, {"hanzi": "好听", "pinyin": "hǎotīng", "meaning": "hay (nghe)", "lesson": "12", "type": "Bổ sung 3.0", "ex_cn": "这首歌 rất hay。", "ex_py": "Zhè shǒu gē hěn hǎotīng.", "ex_vn": "Bài hát này rất hay."}, {"hanzi": "好玩儿", "pinyin": "hǎowánr", "meaning": "vui, hay (chơi)", "lesson": "12", "type": "Bổ sung 3.0", "ex_cn": "这里 rất vui。", "ex_py": "Zhèlǐ hěn hǎowánr.", "ex_vn": "Chỗ này rất vui."}, {"hanzi": "雨", "pinyin": "yǔ", "meaning": "mưa", "lesson": "12", "type": "Bổ sung 3.0", "ex_cn": "外边 đang mưa。", "ex_py": "Wàibian zài xià yǔ.", "ex_vn": "Bên ngoài đang mưa."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
