<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 1 3.0 Bài 5</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk1.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 5</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "今天", "pinyin": "jīntiān", "meaning": "hôm nay", "lesson": "5", "type": "danh từ", "ex_cn": "今天星期天。", "ex_py": "Jīntiān xīngqītiān.", "ex_vn": "Hôm nay là Chủ nhật."}, {"hanzi": "号", "pinyin": "hào", "meaning": "ngày", "lesson": "5", "type": "danh từ", "ex_cn": "今天几号？", "ex_py": "Jīntiān jǐ hào?", "ex_vn": "Hôm nay ngày mấy?"}, {"hanzi": "日", "pinyin": "rì", "meaning": "ngày", "lesson": "5", "type": "danh từ", "ex_cn": "今天几日？", "ex_py": "Jīntiān jǐ rì?", "ex_vn": "Hôm nay ngày mấy?"}, {"hanzi": "月", "pinyin": "yuè", "meaning": "tháng", "lesson": "5", "type": "danh từ", "ex_cn": "今天2月10日。", "ex_py": "Jīntiān èr yuè shí rì.", "ex_vn": "Hôm nay là ngày 10 tháng 2."}, {"hanzi": "星期", "pinyin": "xīngqī", "meaning": "tuần, thứ", "lesson": "5", "type": "danh từ", "ex_cn": "今天星期几？", "ex_py": "Jīntiān xīngqī jǐ?", "ex_vn": "Hôm nay là thứ mấy?"}, {"hanzi": "休息", "pinyin": "xiūxi", "meaning": "nghỉ ngơi", "lesson": "5", "type": "động từ", "ex_cn": "今天我在家休息。", "ex_py": "Jīntiān wǒ zài jiā xiūxi.", "ex_vn": "Hôm nay tôi ở nhà nghỉ ngơi."}, {"hanzi": "会", "pinyin": "huì", "meaning": "biết, sẽ", "lesson": "5", "type": "động từ", "ex_cn": "你会做饭吗？", "ex_py": "Nǐ huì zuò fàn ma?", "ex_vn": "Bạn biết nấu ăn không?"}, {"hanzi": "做", "pinyin": "zuò", "meaning": "làm, nấu", "lesson": "5", "type": "động từ", "ex_cn": "你在做什么？", "ex_py": "Nǐ zài zuò shénme?", "ex_vn": "Bạn đang làm gì thế?"}, {"hanzi": "饭", "pinyin": "fàn", "meaning": "cơm", "lesson": "5", "type": "danh từ", "ex_cn": "我今天不吃饭。", "ex_py": "Wǒ jīntiān bù chī fàn.", "ex_vn": "Hôm nay tôi không ăn cơm."}, {"hanzi": "做饭", "pinyin": "zuòfàn", "meaning": "nấu cơm", "lesson": "5", "type": "động từ", "ex_cn": "妈妈在做饭。", "ex_py": "Māma zài zuò fàn.", "ex_vn": "Mẹ đang nấu ăn."}, {"hanzi": "饺子", "pinyin": "jiǎozi", "meaning": "bánh sủi cảo", "lesson": "5", "type": "danh từ", "ex_cn": "我不会做饺子。", "ex_py": "Wǒ bú huì zuò jiǎozi.", "ex_vn": "Tôi không biết làm há cảo."}, {"hanzi": "菜", "pinyin": "cài", "meaning": "món ăn / rau", "lesson": "5", "type": "danh từ", "ex_cn": "我会做一些中国菜。", "ex_py": "Wǒ huì zuò yìxiē Zhōngguó cài.", "ex_vn": "Tôi biết nấu một số món Trung Quốc."}, {"hanzi": "一些", "pinyin": "yìxiē", "meaning": "một vài", "lesson": "5", "type": "Lượng từ", "ex_cn": "我有一些中国朋友。", "ex_py": "Wǒ yǒu yìxiē Zhōngguó péngyou.", "ex_vn": "Tôi có một vài người bạn Trung Quốc."}, {"hanzi": "上班", "pinyin": "shàngbān", "meaning": "đi làm", "lesson": "5", "type": "động từ", "ex_cn": "你今天上班吗？", "ex_py": "Nǐ jīntiān shàngbān ma?", "ex_vn": "Hôm nay bạn có đi làm không?"}, {"hanzi": "下班", "pinyin": "xiàbān", "meaning": "tan làm", "lesson": "5", "type": "động từ", "ex_cn": "你下班了吗？", "ex_py": "Nǐ xiàbān le ma?", "ex_vn": "Bạn tan làm chưa?"}, {"hanzi": "电脑", "pinyin": "diànnǎo", "meaning": "máy tính", "lesson": "5", "type": "danh từ", "ex_cn": "这是我的新电脑。", "ex_py": "Zhè shì wǒ de xīn diànnǎo.", "ex_vn": "Đây là máy tính mới của tôi."}, {"hanzi": "手机", "pinyin": "shǒujī", "meaning": "điện thoại", "lesson": "5", "type": "danh từ", "ex_cn": "这是我的新手机。", "ex_py": "Zhè shì wǒ de xīn shǒujī.", "ex_vn": "Đây là điện thoại mới của tôi."}, {"hanzi": "新", "pinyin": "xīn", "meaning": "mới", "lesson": "5", "type": "tính từ", "ex_cn": "我的新手机好看吗？", "ex_py": "Wǒ de xīn shǒujī hǎokàn ma?", "ex_vn": "Điện thoại mới của tôi có đẹp không?"}, {"hanzi": "看", "pinyin": "kàn", "meaning": "xem / nhìn / đọc", "lesson": "5", "type": "động từ", "ex_cn": "我在看书。", "ex_py": "Wǒ zài kàn shū.", "ex_vn": "Tôi đang đọc sách."}, {"hanzi": "好看", "pinyin": "hǎokàn", "meaning": "đẹp", "lesson": "5", "type": "tính từ", "ex_cn": "她很好看。", "ex_py": "Tā hěn hǎokàn.", "ex_vn": "Cô ấy rất xinh đẹp."}, {"hanzi": "喜欢", "pinyin": "xǐhuan", "meaning": "thích", "lesson": "5", "type": "động từ", "ex_cn": "我喜欢看书。", "ex_py": "Wǒ xǐhuan kàn shū.", "ex_vn": "Tôi thích đọc sách."}, {"hanzi": "真", "pinyin": "zhēn", "meaning": "thật sự", "lesson": "5", "type": "phó từ", "ex_cn": "这个菜真好吃。", "ex_py": "Zhège cài zhēn hǎochī.", "ex_vn": "Món này thật sự rất ngon."}, {"hanzi": "面条", "pinyin": "miàntiáo", "meaning": "mì sợi", "lesson": "5", "type": "danh từ", "ex_cn": "我喜欢吃面条。", "ex_py": "Wǒ xǐhuan chī miàntiáo.", "ex_vn": "Tôi thích ăn mì sợi."}, {"hanzi": "昨天", "pinyin": "zuótiān", "meaning": "hôm qua", "lesson": "5", "type": "danh từ", "ex_cn": "昨天星期几？", "ex_py": "Zuótiān xīngqī jǐ?", "ex_vn": "Hôm qua là thứ mấy?"}, {"hanzi": "明天", "pinyin": "míngtiān", "meaning": "ngày mai", "lesson": "5", "type": "danh từ", "ex_cn": "明天你上班吗？", "ex_py": "Míngtiān nǐ shàngbān ma?", "ex_vn": "Ngày mai bạn có đi làm không?"}, {"hanzi": "去年", "pinyin": "qùnián", "meaning": "năm ngoái", "lesson": "5", "type": "danh từ", "ex_cn": "去年我去中国。", "ex_py": "Qùnián wǒ qù Zhōngguó.", "ex_vn": "Năm ngoái tôi đi Trung Quốc."}, {"hanzi": "明年", "pinyin": "míngnián", "meaning": "năm sau", "lesson": "5", "type": "danh từ", "ex_cn": "明年我会去中国。", "ex_py": "Míngnián wǒ huì qù Zhōngguó.", "ex_vn": "Năm sau tôi sẽ đi Trung Quốc."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
