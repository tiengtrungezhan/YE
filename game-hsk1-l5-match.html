<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 1 3.0 Bài 5</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk1.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 5</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "八", "pinyin": "bā", "meaning": "số 8", "lesson": "5", "type": "Số từ"}, {"hanzi": "多", "pinyin": "duō", "meaning": "nhiều", "lesson": "5", "type": "Tính từ", "ex_cn": "他朋友很多。", "ex_py": "Tā péngyou hěn duō.", "ex_vn": "Bạn của anh ấy rất nhiều."}, {"hanzi": "大", "pinyin": "dà", "meaning": "lớn", "lesson": "5", "type": "Tính từ", "ex_cn": "中国很大。", "ex_py": "Zhōngguó hěn dà.", "ex_vn": "Trung Quốc rất lớn."}, {"hanzi": "个", "pinyin": "gè", "meaning": "cái", "lesson": "5", "type": "Lượng từ", "ex_cn": "三个学生。", "ex_py": "Sān ge xuésheng.", "ex_vn": "Ba học sinh."}, {"hanzi": "九", "pinyin": "jiǔ", "meaning": "số 9", "lesson": "5", "type": "Số từ"}, {"hanzi": "几", "pinyin": "jǐ", "meaning": "mấy", "lesson": "5", "type": "Danh từ", "ex_cn": "你几岁？", "ex_py": "Nǐ jǐ suì?", "ex_vn": "Cháu mấy tuổi rồi?"}, {"hanzi": "了", "pinyin": "le", "meaning": "được dùng để chỉ sự thay đổi", "lesson": "5", "type": "Trợ từ", "ex_cn": "他三岁了。", "ex_py": "Tā sān suì le.", "ex_vn": "Nó ba tuổi rồi."}, {"hanzi": "六", "pinyin": "liù", "meaning": "số 6", "lesson": "5", "type": "Số từ"}, {"hanzi": "女儿", "pinyin": "nǚ'ér", "meaning": "con gái", "lesson": "5", "type": "Danh từ", "ex_cn": "他有一个女儿。", "ex_py": "Tā yǒu yí ge nǚ\"ér.", "ex_vn": "Anh ấy có một người con gái."}, {"hanzi": "七", "pinyin": "qī", "meaning": "số 7", "lesson": "5", "type": "Số từ"}, {"hanzi": "十", "pinyin": "shí", "meaning": "số 10", "lesson": "5", "type": "Số từ"}, {"hanzi": "岁", "pinyin": "suì", "meaning": "tuổi", "lesson": "5", "type": "Danh từ", "ex_cn": "我二十岁。", "ex_py": "Wǒ èrshí suì.", "ex_vn": "Tôi hai mươi tuổi."}, {"hanzi": "四", "pinyin": "sì", "meaning": "số 4", "lesson": "5", "type": "Số từ"}, {"hanzi": "五", "pinyin": "wǔ", "meaning": "năm", "lesson": "5", "type": "Số từ"}, {"hanzi": "一", "pinyin": "yī", "meaning": "số 1", "lesson": "5", "type": "Số từ", "ex_cn": "我数一，二，三。", "ex_py": "Wǒ shǔ yī, èr, sān.", "ex_vn": "Tôi đếm một, hai, ba."}, {"hanzi": "有", "pinyin": "yǒu", "meaning": "có", "lesson": "5", "type": "Động từ", "ex_cn": "我有三个哥哥。", "ex_py": "Wǒ yǒu sān ge gēge.", "ex_vn": "Tôi có ba người anh trai."}, {"hanzi": "二", "pinyin": "èr", "meaning": "số 2", "lesson": "5", "type": "Số từ", "ex_cn": "我数一，二，三。", "ex_py": "Wǒ shǔ yī, èr, sān.", "ex_vn": "Tôi đếm một, hai, ba."}, {"hanzi": "爷爷", "pinyin": "yéye", "meaning": "ông nội", "lesson": "5", "type": "Danh từ", "ex_cn": "他是我爷爷。", "ex_py": "Tā shì wǒ yéye.", "ex_vn": "Ông ấy là ông nội tôi."}, {"hanzi": "奶奶", "pinyin": "nǎinai", "meaning": "bà nội", "lesson": "5", "type": "Danh từ", "ex_cn": "她是我奶奶。", "ex_py": "Tā shì wǒ nǎinai.", "ex_vn": "Bà ấy là bà nội tôi."}, {"hanzi": "外公", "pinyin": "wàigōng", "meaning": "ông ngoại", "lesson": "5", "type": "Danh từ", "ex_cn": "他是我外公。", "ex_py": "Tā shì wǒ wàigōng.", "ex_vn": "Ông ấy là ông ngoại tôi."}, {"hanzi": "外婆", "pinyin": "wàipó", "meaning": "bà ngoại", "lesson": "5", "type": "Danh từ", "ex_cn": "她是我外婆。", "ex_py": "Tā shì wǒ wàipó.", "ex_vn": "Bà ấy là bà ngoại tôi."}, {"hanzi": "爸爸", "pinyin": "bàba", "meaning": "bố, cha", "lesson": "5", "type": "Danh từ", "ex_cn": "他是我爸爸。", "ex_py": "Tā shì wǒ bàba.", "ex_vn": "Anh ấy là bố tôi."}, {"hanzi": "妈妈", "pinyin": "māma", "meaning": "mẹ", "lesson": "5", "type": "Danh từ", "ex_cn": "她是我妈妈。", "ex_py": "Tā shì wǒ māma.", "ex_vn": "Bà ấy là mẹ tôi."}, {"hanzi": "弟弟", "pinyin": "dìdi", "meaning": "em trai", "lesson": "5", "type": "Danh từ", "ex_cn": "他是我弟弟。", "ex_py": "Tā shì wǒ dìdi.", "ex_vn": "Anh ấy là em trai tôi."}, {"hanzi": "哥哥", "pinyin": "gēge", "meaning": "anh trai", "lesson": "5", "type": "Danh từ", "ex_cn": "他是我哥哥。", "ex_py": "Tā shì wǒ gēge.", "ex_vn": "Anh ấy là anh trai tôi."}, {"hanzi": "妹妹", "pinyin": "mèimei", "meaning": "em gái", "lesson": "5", "type": "Danh từ", "ex_cn": "她是我妹妹。", "ex_py": "Tā shì wǒ mèimei.", "ex_vn": "Cô ấy là em gái tôi."}, {"hanzi": "姐姐", "pinyin": "jiějie", "meaning": "chị gái", "lesson": "5", "type": "Danh từ", "ex_cn": "她是我姐姐。", "ex_py": "Tā shì wǒ jiějie.", "ex_vn": "Cô ấy là chị gái tôi."}, {"hanzi": "兄弟姐妹", "pinyin": "xiōngdì jiěmèi", "meaning": "anh chị em", "lesson": "5", "type": "Danh từ", "ex_cn": "我有兄弟姐妹。", "ex_py": "Wǒ yǒu xiōngdì jiěmèi.", "ex_vn": "Tôi có anh chị em."}, {"hanzi": "独生女", "pinyin": "dúshēngnǚ", "meaning": "con gái duy nhất", "lesson": "5", "type": "Danh từ", "ex_cn": "她是独生女。", "ex_py": "Tā shì dúshēngnǚ.", "ex_vn": "Cô ấy là con gái một."}, {"hanzi": "独生子", "pinyin": "dúshēngzǐ", "meaning": "con trai duy nhất", "lesson": "5", "type": "Danh từ", "ex_cn": "他是独生子。", "ex_py": "Tā shì dúshēngzǐ.", "ex_vn": "Anh ấy là con trai một."}, {"hanzi": "男朋友", "pinyin": "nán péngyou", "meaning": "bạn trai", "lesson": "5", "type": "Danh từ", "ex_cn": "他是我男朋友。", "ex_py": "Tā shì wǒ nán péngyou.", "ex_vn": "Anh ấy là bạn trai tôi."}, {"hanzi": "女朋友", "pinyin": "nǚ péngyou", "meaning": "bạn gái", "lesson": "5", "type": "Danh từ", "ex_cn": "她是我女朋友。", "ex_py": "Tā shì wǒ nǚ péngyou.", "ex_vn": "Cô ấy là bạn gái tôi."}, {"hanzi": "丈夫", "pinyin": "zhàngfu", "meaning": "chồng", "lesson": "5", "type": "Danh từ", "ex_cn": "他是我丈夫。", "ex_py": "Tā shì wǒ zhàngfu.", "ex_vn": "Anh ấy là chồng tôi."}, {"hanzi": "妻子", "pinyin": "qīzi", "meaning": "vợ", "lesson": "5", "type": "Danh từ", "ex_cn": "她是我妻子。", "ex_py": "Tā shì wǒ qīzi.", "ex_vn": "Cô ấy là vợ tôi."}, {"hanzi": "儿子", "pinyin": "érzi", "meaning": "con trai", "lesson": "5", "type": "Danh từ", "ex_cn": "他是我儿子。", "ex_py": "Tā shì wǒ érzi.", "ex_vn": "Nó là con trai tôi."}, {"hanzi": "两", "pinyin": "liǎng", "meaning": "hai (số lượng)", "lesson": "5", "type": "Số từ", "ex_cn": "两个哥哥。", "ex_py": "Liǎng ge gēge.", "ex_vn": "Hai người anh trai."}, {"hanzi": "年纪", "pinyin": "niánjì", "meaning": "tuổi tác", "lesson": "5", "type": "Danh từ", "ex_cn": "您多大年纪？", "ex_py": "Nín duōdà niánjì?", "ex_vn": "Ngài bao nhiêu tuổi rồi?"}, {"hanzi": "多大", "pinyin": "duō dà", "meaning": "bao nhiêu tuổi", "lesson": "5", "type": "Cụm từ", "ex_cn": "你多大？", "ex_py": "Nǐ duōdà?", "ex_vn": "Bạn bao nhiêu tuổi?"}, {"hanzi": "今年", "pinyin": "jīnnián", "meaning": "năm nay", "lesson": "5", "type": "Danh từ", "ex_cn": "他今年五岁。", "ex_py": "Tā jīnnián wǔ suì.", "ex_vn": "Năm nay nó 5 tuổi."}, {"hanzi": "去年", "pinyin": "qùnián", "meaning": "năm ngoái", "lesson": "5", "type": "Danh từ", "ex_cn": "去年他四岁。", "ex_py": "Qùnián tā sì suì.", "ex_vn": "Năm ngoái nó 4 tuổi."}, {"hanzi": "明年", "pinyin": "míngnián", "meaning": "năm sau", "lesson": "5", "type": "Danh từ", "ex_cn": "明年他七岁。", "ex_py": "Míngnián tā qī suì.", "ex_vn": "Sang năm nó 7 tuổi."}, {"hanzi": "一半", "pinyin": "yíbàn", "meaning": "một nửa", "lesson": "5", "type": "Bổ sung 3.0", "ex_cn": "我吃了一半。", "ex_py": "Wǒ chī le yíbàn.", "ex_vn": "Tôi đã ăn một nửa."}, {"hanzi": "一些", "pinyin": "yìxiē", "meaning": "một số, một vài", "lesson": "5", "type": "Bổ sung 3.0", "ex_cn": "买一些水果。", "ex_py": "Mǎi yìxiē shuǐguǒ.", "ex_vn": "Mua một ít hoa quả."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
