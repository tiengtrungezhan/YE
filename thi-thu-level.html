<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chọn Cấp Thi Thử - EZHAN</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .level-tag {
            font-size: 0.8rem;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 700;
            margin-top: 4px;
        }
        .level-tag.active {
            background: #e8f4f8;
            color: var(--primary-dark);
        }
        .level-tag.coming {
            background: #fdf1de;
            color: #e8901a;
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn" title="Trang chủ EZHAN">
        <img src="mascot.png" alt="Home">
    </a>

    <div class="page-container">
        <a href="index.html" class="back-btn">← Quay lại trang chủ</a>
        
        <div class="content-box">
            <h1 style="margin-bottom: 0.5rem; color: var(--primary-dark);">📝 Chọn Cấp Thi Thử</h1>
            <p style="color: var(--text-color); opacity: 0.7; margin-bottom: 2rem;">Chọn cấp độ HSK bạn muốn làm đề thi mô phỏng chuẩn 3.0</p>
            
            <div class="hsk-grid">
                <a href="thi-thu-hsk1.html" class="hsk-card">
                    <div class="hsk-badge">1</div>
                    <span>HSK 1 (3.0)</span>
                    <span class="level-tag active">Đã có đề thi</span>
                </a>

                <a href="#" class="hsk-card disabled">
                    <div class="hsk-badge">2</div>
                    <span>HSK 2 (3.0)</span>
                    <span class="level-tag coming">Sắp ra mắt</span>
                </a>

                <a href="#" class="hsk-card disabled">
                    <div class="hsk-badge">3</div>
                    <span>HSK 3</span>
                    <span class="level-tag coming">Sắp ra mắt</span>
                </a>

                <a href="#" class="hsk-card disabled">
                    <div class="hsk-badge">4</div>
                    <span>HSK 4</span>
                    <span class="level-tag coming">Sắp ra mắt</span>
                </a>

                <a href="#" class="hsk-card disabled">
                    <div class="hsk-badge">5</div>
                    <span>HSK 5</span>
                    <span class="level-tag coming">Sắp ra mắt</span>
                </a>

                <a href="#" class="hsk-card disabled">
                    <div class="hsk-badge">6</div>
                    <span>HSK 6</span>
                    <span class="level-tag coming">Sắp ra mắt</span>
                </a>

                <a href="#" class="hsk-card disabled">
                    <div class="hsk-badge" style="font-size: 0.9rem;">7-9</div>
                    <span>HSK 7-9</span>
                    <span class="level-tag coming">Sắp ra mắt</span>
                </a>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
