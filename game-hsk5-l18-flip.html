    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #f0f9ff; }

        }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .mascot-bubble {
            background: white; padding: 10px 15px; border-radius: 20px; box-shadow: var(--shadow);

            color: var(--primary-dark); font-weight: 700; z-index: 10;
        }
        .game-container { max-width: 1100px; margin: 0 auto; padding: 2rem; }
        .single-card-container { display: flex; justify-content: center; align-items: center; margin-top: 2rem; position: relative; }
        .flip-card { background-color: transparent; width: 100%; max-width: 500px; height: 500px; perspective: 1000px; cursor: pointer; }
        .flip-card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back { 
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden; 
            display: flex; flex-direction: column; border-radius: 30px; padding: 1.2rem; 
            border: 2px solid var(--primary-light); background: white;
            box-shadow: 0 10px 30px rgba(165, 207, 218, 0.2);
        }
        .flip-card-front { justify-content: center; align-items: center; }
        .flip-card-front .hanzi { font-family: "KaiTi", "楷体", "STKaiti", serif; font-size: 8rem; font-weight: 800; color: var(--primary-dark); transition: transform 0.3s; }
        .flip-card:hover .hanzi { transform: scale(1.1); }
        .flip-card-back { transform: rotateY(180deg); text-align: left; background: #fff; border-color: var(--primary-color); }
        .flip-card.mastered .flip-card-front, .flip-card.mastered .flip-card-back { border-color: #ffd700; background: #fffdf0; }
        .master-badge { position: absolute; top: 15px; right: 15px; font-size: 1.5rem; display: none; z-index: 5; }
        .flip-card.mastered .master-badge { display: block; animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
        .back-header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid #eee; padding-bottom: 0.5rem; }
        .back-hanzi { font-family: "KaiTi", "楷体", "STKaiti", serif; font-size: 3rem; font-weight: 800; color: var(--primary-dark); }
        .back-pinyin { font-size: 1.8rem; color: #e67e22; font-weight: 700; }
        .btn-speak { background: var(--primary-light); border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; transition: 0.3s; }
        .btn-speak:hover { background: var(--primary-color); transform: scale(1.1); }
        .back-meaning { font-size: 1.6rem; font-weight: 700; color: #444; }
        .back-example { font-size: 1.2rem; background: #f9f9f9; padding: 1rem; border-radius: 12px; margin-top: 1rem; line-height: 1.5; }
        .back-example strong { font-size: 1.2rem; color: var(--primary-dark); }
        .master-btn { margin-top: auto; width: 100%; padding: 0.6rem; border-radius: 12px; border: 2px solid var(--primary-color); background: white; color: var(--primary-dark); font-weight: 800; cursor: pointer; transition: 0.3s; font-size: 0.85rem; }
        .master-btn.active { background: var(--primary-color); color: white; }
        .progress-container { background: white; padding: 1.5rem; border-radius: 20px; box-shadow: var(--shadow); margin: 2rem 0; }
        .progress-text { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-weight: 700; color: #555; }
        .progress-bar { width: 100%; height: 12px; background: #eee; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary-color), var(--primary-dark)); width: 0%; transition: width 0.5s ease-out; }
        .controls { display: flex; justify-content: center; gap: 1rem; margin-top: 1rem; }
        .btn-control { padding: 0.5rem 1rem; border-radius: 10px; border: 1px solid var(--primary-color); background: white; color: var(--primary-dark); font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 0.9rem; }
        .celebration-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; animation: fadeIn 0.5s; }
        .trophy { font-size: 5rem; animation: trophyPop 1s infinite alternate; }
        @keyframes trophyPop { from { transform: scale(1); } to { transform: scale(1.2) rotate(5deg); } }
    </style>

ân thưởng lãm."}, {"hanzi": "洒", "pinyin": "sǎ", "meaning": "vẩy, phun, rắc", "lesson": "18", "type": "Động từ", "ex_cn": "他不小心把咖啡洒在刚买的新衣服上。", "ex_py": "Tā bù xiǎoxīn bǎ kāfēi sǎ zài gāng mǎi de xīn yīfu shàng.", "ex_vn": "Anh ấy vô ý làm đổ cà phê lên bộ quần áo mới mua."}, {"hanzi": "极其", "pinyin": "jíqí", "meaning": "cực kỳ, vô cùng", "lesson": "18", "type": "Phó từ", "ex_cn": "这名画家的生平经历极其神秘。", "ex_py": "Zhè míng huàjiā de shēngpíng jīnglì jíqí shénmì.", "ex_vn": "Trải nghiệm cuộc đời của họa sĩ này cực kỳ bí ẩn."}, {"hanzi": "神秘", "pinyin": "shénmì", "meaning": "bí ẩn, thần bí", "lesson": "18", "type": "Tính từ", "ex_cn": "大自然中隐藏着许多神秘的现象。", "ex_py": "Dàzìrán zhōng yǐncáng zhe xǔduō shénmì de xiànhuàng.", "ex_vn": "Trong tự nhiên ẩn chứa rất nhiều hiện tượng bí ẩn."}, {"hanzi": "丑陋", "pinyin": "chǒulòu", "meaning": "xấu xí, xấu xa", "lesson": "18", "type": "Tính từ", "ex_cn": "外表虽然丑陋，但 his inner being is very kind.", "ex_py": "Wàibiǎo suīrán chǒulòu, dàn tā de nèixīn què fēicháng shànliáng.", "ex_vn": "Diện mạo bên ngoài tuy xấu xí, nhưng nội tâm của anh ấy lại rất lương thiện."}, {"hanzi": "自由", "pinyin": "zìyóu", "meaning": "tự do", "lesson": "18", "type": "Tính từ", "ex_cn": "艺术创作应该拥有充分的表达自由。", "ex_py": "Yìshù chuàngzuò yīnggāi yōngyǒu chōngfèn de biǎodá zìyóu.", "ex_vn": "Sáng tạo nghệ thuật nên sở hữu sự tự do biểu đạt đầy đủ."}, {"hanzi": "设计", "pinyin": "shèjì", "meaning": "thiết kế", "lesson": "18", "type": "Động từ", "ex_cn": "这位设计师设计了这座非常现代化的博物馆。", "ex_py": "Zhè wèi shèjìshī shèjì le zhè zuò fēicháng xiàndàihuà de bówùguǎn.", "ex_vn": "Nhà thiết kế này đã thiết kế ngôi bảo tàng vô cùng hiện đại này."}, {"hanzi": "组", "pinyin": "zǔ", "meaning": "nhóm, tổ, lượng từ cho nhóm", "lesson": "18", "type": "Danh từ", "ex_cn": "实验人员把志愿者分成了两组进行对比测试。", "ex_py": "Shíyàn rényuán bǎ zhìyuànzhě fēnchéng le liǎng zǔ jìnxíng duìbǐ cèshì.", "ex_vn": "Nhân viên thí nghiệm chia các tình nguyện viên thành hai nhóm để tiến hành thử nghiệm so sánh."}, {"hanzi": "幅", "pinyin": "fú", "meaning": "bức, tấm (dùng cho tranh vẽ, vải)", "lesson": "18", "type": "Lượng từ", "ex_cn": "墙上挂着一幅由著名大师创作的油画。", "ex_py": "Qiáng shàng guà zhe yī fú yóu zhùmíng dàshī chuàngzuò de yóuhuà.", "ex_vn": "Trên tường treo một bức tranh sơn dầu do một vị đại sư nổi tiếng sáng tác."}, {"hanzi": "出自", "pinyin": "chūzì", "meaning": "đến từ, xuất phát từ", "lesson": "18", "type": "Động từ", "ex_cn": "这两幅画其实出自同一位业余爱好者之手。", "ex_py": "Zhè liǎng fú huà qíshí chūzì tóng yī wèi yèyú àihàozhě zhī shǒu.", "ex_vn": "Hai bức tranh này thực chất đến từ bàn tay của cùng một người nghiệp dư."}, {"hanzi": "业余", "pinyin": "yèyú", "meaning": "nghiệp dư, rảnh rỗi", "lesson": "18", "type": "Tính từ", "ex_cn": "他在业余时间喜欢画一些水彩画。", "ex_py": "Tā zài yèyú shíjiān xǐhuan huà yīxiē shuǐcǎihuà.", "ex_vn": "Anh ấy thích vẽ tranh màu nước vào thời gian rảnh rỗi."}, {"hanzi": "婴儿", "pinyin": "yīng'ér", "meaning": "trẻ sơ sinh, em bé", "lesson": "18", "type": "Danh từ", "ex_cn": "那个婴儿正躺在摇篮里甜甜地熟睡。", "ex_py": "Nàge yīng'ér zhèng tǎng zài yáolán lǐ tiántián de shúshuì.", "ex_vn": "Đứa bé sơ sinh đó đang nằm trong nôi và ngủ một giấc thật ngon lành."}, {"hanzi": "猩猩", "pinyin": "xīngxing", "meaning": "tinh tinh", "lesson": "18", "type": "Danh từ", "ex_cn": "科学家们研究了猩猩的画画行为和习惯。", "ex_py": "Kēxuéjiāmen yánjiū le xīngxing de huàhuà xíngwéi hé xíguàn.", "ex_vn": "Các nhà khoa học đã nghiên cứu hành vi vẽ tranh và thói quen của loài tinh tinh."}, {"hanzi": "涂鸦", "pinyin": "túyā", "meaning": "nét vẽ nguệch ngoạc, vẽ bậy, graffiti", "lesson": "18", "type": "Danh từ", "ex_cn": "墙壁上布满了各种色彩鲜艳의 涂鸦.", "ex_py": "Qiángbì shàng bùmǎn le gèzhǒng sècǎi xiānyàn de yìshù túyā.", "ex_vn": "Bức tường được phủ đầy các hình vẽ nghệ thuật nguệch ngoạc đầy màu sắc sặc sỡ."}, {"hanzi": "签", "pinyin": "qiān", "meaning": "ký tên, thẻ, nhãn", "lesson": "18", "type": "Động từ", "ex_cn": "请在这份艺术品购买合同的右下角签上您的名字。", "ex_py": "Qǐng zài zhè fèn yìshùpǐn gòumǎi hétong de yòuxiàjiǎo qiān shàng nín de míngzi.", "ex_vn": "Xin vui lòng ký tên của bạn vào góc dưới bên phải của hợp đồng mua tác phẩm nghệ thuật này."}, {"hanzi": "其余", "pinyin": "qíyú", "meaning": "còn lại, phần còn lại", "lesson": "18", "type": "Đại từ", "ex_cn": "除了这幅画，其余的作品全部被售出了。", "ex_py": "Chúle zhè fú huà, qíyú de zuòpǐn quánbù bèi shòuchū le.", "ex_vn": "Ngoại trừ bức tranh này, các tác phẩm còn lại toàn bộ đều đã được bán đi."}, {"hanzi": "身份", "pinyin": "shēnfèn", "meaning": "thân phận, danh tính, địa vị", "lesson": "18", "type": "Danh từ", "ex_cn": "在这项测试中，画作创作者的真实身份被隐藏了。", "ex_py": "Zài zhè xiàng cèshì zhōng, huàzuò chuàngzuòzhě de zhēnshí shēnfèn bèi yǐncáng le.", "ex_vn": "Trong bài kiểm tra này, danh tính thực sự của người sáng tác tranh đã được ẩn đi."}, {"hanzi": "确认", "pinyin": "quèrèn", "meaning": "xác nhận, xác định", "lesson": "18", "type": "Động từ", "ex_cn": "我们需要进一步确认这幅画作是不是真品。", "ex_py": "Wǒmen xūyào jìnyībù quèrèn zhè fú huàzuò shì bú shì zhēnpǐn.", "ex_vn": "Chúng tôi cần xác nhận thêm một bước liệu bức tranh này có phải là hàng thật hay không."}, {"hanzi": "随手", "pinyin": "suíshǒu", "meaning": "tiện tay", "lesson": "18", "type": "Phó từ", "ex_cn": "艺术家拿起画笔，随手在画布上画了几条线。", "ex_py": "Yìshùjiā ná qǐ huàbǐ, suíshǒu zài huàbù shàng huà le jǐ tiáo xiàn.", "ex_vn": "Nghệ sĩ cầm cây cọ lên, tiện tay vẽ vài đường nét trên vải."}, {"hanzi": "分辨", "pinyin": "fēnbiàn", "meaning": "phân biệt", "lesson": "18", "type": "Động từ", "ex_cn": "普通人很难分辨大师杰作与儿童涂鸦的区别。", "ex_py": "Pǔtōngrén hěn nán fēnbiàn dàshī jiézuò yǔ értóng túyā de qūbié.", "ex_vn": "Người bình thường rất khó phân biệt sự khác nhau giữa kiệt tác của đại sư và tranh nguệch ngoạc của trẻ em."}, {"hanzi": "挥", "pinyin": "huī", "meaning": "vẫy, gạt, múa (cọ vẽ)", "lesson": "18", "type": "Động từ", "ex_cn": "他在画布前挥动着画笔，尽情抒发自己的情感。", "ex_py": "Tā zài huàbù qián huīdòng zhe huàbǐ, jìnqíng shūfā zìjǐ de qínggǎn.", "ex_vn": "Anh ấy múa cọ vẽ trước bức vải, thỏa sức bày tỏ cảm xúc của mình."}, {"hanzi": "可见", "pinyin": "kějiàn", "meaning": "có thể thấy, rõ ràng là", "lesson": "18", "type": "Liên từ", "ex_cn": "大多数人都选择了原作，可见人类的艺术感知力极强。", "ex_py": "Dàduōshù rén dōu xuǎnzé le yuánzuò, kějiàn rénlèi de yìshù gǎnzhīlì jí qiáng.", "ex_vn": "Đại đa số mọi người đều chọn tác phẩm gốc, có thể thấy khả năng cảm nhận nghệ thuật của con người cực kỳ mạnh mẽ."}, {"hanzi": "哪怕", "pinyin": "nǎpà", "meaning": "cho dù, ngay cả khi", "lesson": "18", "type": "Liên từ", "ex_cn": "哪怕签名被换了，人们依然能认出优秀的作品。", "ex_py": "Nǎpà qiānmíng bèi huàn le, rénmen yīrán néng rèn chū yōuxiù de zuòpǐn.", "ex_vn": "Cho dù chữ ký bị thay đổi, mọi người vẫn có thể nhận ra những tác phẩm xuất sắc."}, {"hanzi": "元素", "pinyin": "yuánsù", "meaning": "yếu tố, nguyên tố", "lesson": "18", "type": "Danh từ", "ex_cn": "色彩和线条是抽象画中最基础的构成元素。", "ex_py": "Sècǎi hé xiàntiáo shì chōuxiànghuà zhōng zuì jīchǔ de gòuchéng yuánsù.", "ex_vn": "Màu sắc và đường nét là những yếu tố cấu thành cơ bản nhất trong tranh trừu tượng."}, {"hanzi": "调整", "pinyin": "tiáozhěng", "meaning": "điều chỉnh", "lesson": "18", "type": "Động từ", "ex_cn": "在改变原图布局前，他多次调整了元素的位置。", "ex_py": "Zài gǎibiàn yuántú bùjú qián, tā duōcì tiáozhěng le yuánsù de wèizhì.", "ex_vn": "Trước khi thay đổi bố cục bức tranh gốc, anh ấy đã điều chỉnh vị trí của các yếu tố nhiều lần."}, {"hanzi": "位置", "pinyin": "wèizhì", "meaning": "vị trí", "lesson": "18", "type": "Danh từ", "ex_cn": "这幅画里物体的位置安排得恰到好处。", "ex_py": "Zhè fú huà lǐ wùtǐ de wèizhì ānpái de qiàdàohǎochù.", "ex_vn": "Vị trí của các vật thể trong bức tranh này được sắp đặt cực kỳ hoàn hảo."}, {"hanzi": "含意", "pinyin": "hányì", "meaning": "hàm ý, ý nghĩa", "lesson": "18", "type": "Danh từ", "ex_cn": "这句诗的含意极其深刻，值得反复品味。", "ex_py": "Zhè jù shī de hányì jíqí shēnkè, zhídé fǎnfù pǐnwèi.", "ex_vn": "Hàm ý của câu thơ này cực kỳ sâu sắc, xứng đáng được thưởng thức nhiều lần."}, {"hanzi": "区域", "pinyin": "qūyù", "meaning": "khu vực, vùng", "lesson": "18", "type": "Danh từ", "ex_cn": "实验显示，当我们看画时，脑部特定区域非常活跃。", "ex_py": "Shíyàn xiǎnshì, dāng wǒmen kàn huà shí, nǎobù tèdìng qūyù fēicháng huóyuè.", "ex_vn": "Thí nghiệm cho thấy, khi chúng ta xem tranh, khu vực đặc định của bộ não hoạt động cực kỳ tích cực."}, {"hanzi": "活跃", "pinyin": "huóyuè", "meaning": "năng nổ, sôi nổi, làm cho sôi nổi", "lesson": "18", "type": "Tính từ", "ex_cn": "台下的观众们提问非常活跃，让讲座很成功。", "ex_py": "Tái xià de guānzhòngmen tíwèn fēicháng huóyuè, ràng jiǎngzuò hěn chénggōng.", "ex_vn": "Khán giả bên dưới sân khấu đặt câu hỏi rất sôi nổi, giúp buổi tọa đàm diễn ra rất thành công."}, {"hanzi": "布局", "pinyin": "bùjú", "meaning": "bố cục, sắp xếp", "lesson": "18", "type": "Danh từ", "ex_cn": "这幅画的画面布局极其讲究，很有艺术感。", "ex_py": "Zhè fú huà de huàmiàn bùjú jíqí jiǎngjiu, hěn yǒu yìshùgǎn.", "ex_vn": "Bố cục hình ảnh của bức tranh này vô cùng tinh tế, mang lại cảm giác đầy nghệ thuật."}, {"hanzi": "事实", "pinyin": "shìshí", "meaning": "sự thật", "lesson": "18", "type": "Danh từ", "ex_cn": "事实证明，抽象艺术同样包含着作者的心血。", "ex_py": "Shìshí zhèngmíng, chōuxiàng yìshù tóngyàng bāohán zhe zuòzhě de xīnxuè.", "ex_vn": "Sự thật chứng minh, nghệ thuật trừu tượng cũng bao hàm tâm huyết của tác giả."}, {"hanzi": "目前", "pinyin": "mùqián", "meaning": "hiện nay, trước mắt", "lesson": "18", "type": "Danh từ", "ex_cn": "目前，该艺术馆正在举办现代艺术展。", "ex_py": "Mùqián, gāi yìshùguǎn zhèngzài jǔbàn xiàndài yìshù zhǎn.", "ex_vn": "Hiện nay, bảo tàng nghệ thuật này đang tổ chức triển lãm nghệ thuật hiện đại."}, {"hanzi": "证据", "pinyin": "zhèngjù", "meaning": "chứng cứ, bằng chứng", "lesson": "18", "type": "Danh từ", "ex_cn": "实验提供了证据，证明人脑能感知画家的用意。", "ex_py": "Shíyàn tígōng le zhèngjù, zhèngmíng rénnǎo néng gǎnzhī huàjiā de yòngyì.", "ex_vn": "Thí nghiệm đã cung cấp bằng chứng chứng minh não người có thể cảm nhận ý đồ của họa sĩ."}, {"hanzi": "话题", "pinyin": "huàtí", "meaning": "chủ đề nói chuyện, đề tài", "lesson": "18", "type": "Danh từ", "ex_cn": "抽象艺术到底美不美，依然是一个备受争议的话题。", "ex_py": "Chōuxiàng yìshù dàodǐ měi bù měi, yīrán shì yí gè bèi shòu zhēngyì de huàtí.", "ex_vn": "Nghệ thuật trừu tượng rốt cuộc có đẹp hay không, vẫn luôn là một đề tài tranh luận sôi nổi."}];
        const grid = document.getElementById('cardGrid');
        const progressFill = document.getElementById('progress');
        const progressPercent = document.getElementById('progressPercent');
        const masteredCountEl = document.getElementById('masteredCount');
        const totalCountEl = document.getElementById('totalCount');
        const mascotSpeech = document.getElementById('mascotSpeech');
        const celebration = document.getElementById('celebration');

        let masteredSet = new Set();
        let currentCardIndex = 0;
        const cardCounterEl = document.getElementById('cardCounter');
        totalCountEl.innerText = vocabData.length;

        function renderCards() {
            grid.innerHTML = '';
            if(vocabData.length === 0) return;
            const index = currentCardIndex;
            const word = vocabData[index];
            const card = document.createElement('div');
            card.className = 'flip-card' + (masteredSet.has(index) ? ' mastered' : '');
            card.innerHTML = `
                <div class="flip-card-inner">
                    <div class="flip-card-front">
                        <div class="master-badge">⭐</div>
                        <div class="hanzi">${word.hanzi}</div>
                    </div>
                    <div class="flip-card-back">
                        <div class="back-header">
                            <span class="back-hanzi">${word.hanzi}</span>
                            <span class="back-pinyin">${word.pinyin}</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 0.5rem;">
                            <button class="btn-speak" onclick="event.stopPropagation(); speak('${word.hanzi}')">🔊</button>
                            <div class="back-meaning">${word.meaning}</div>
                        </div>
                        <div style="font-size: 1.1rem; color: #555; margin-bottom: 1rem; padding-left: 5px;">
                            <strong>Từ loại:</strong> ${word.type || 'Đang cập nhật'}
                        </div>
                        <div class="back-example">
                            <strong>Ví dụ:</strong>
                            <div style="font-family: 'KaiTi', '楷体', 'STKaiti', serif; margin-top:5px; font-size: 1.5rem;">${word.ex_cn || word.hanzi}</div>
                            <div style="color: #e67e22; font-style: italic; font-size: 1.2rem;">${word.ex_py || word.pinyin}</div>
                            <div style="color: #666; font-size: 1.1rem; border-top: 1px dashed #ccc; margin-top:5px; padding-top:5px;">${word.ex_vn || word.meaning}</div>
                        </div>
                        <button class="master-btn ${masteredSet.has(index) ? 'active' : ''}" onclick="event.stopPropagation(); toggleMaster(${index}, this)">
                            ${masteredSet.has(index) ? 'Bỏ thuộc' : 'Đã thuộc'}
                        </button>
                    </div>
                </div>`;
            card.addEventListener('click', () => card.classList.toggle('flipped'));
            grid.appendChild(card);
            cardCounterEl.innerText = (currentCardIndex + 1) + " / " + vocabData.length;
        }

        window.prevCard = function() {
            if(currentCardIndex > 0) { currentCardIndex--; renderCards(); }
        };

        window.nextCard = function() {
            if(currentCardIndex < vocabData.length - 1) { currentCardIndex++; renderCards(); }
        };

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
        }

        function updateProgress() {
            const count = masteredSet.size;
            const percent = Math.round((count / vocabData.length) * 100);
            progressFill.style.width = percent + '%';
            progressPercent.innerText = percent + '%';
            masteredCountEl.innerText = count;
            if (percent === 100) { mascotSpeech.innerText = "Tuyệt vời! Bạn đã thuộc hết rồi! 🏆"; celebration.style.display = 'flex'; }
            else if (percent >= 50) mascotSpeech.innerText = "Sắp xong rồi, bạn học nhanh quá! 🚀";
            else if (percent > 0) mascotSpeech.innerText = "Giỏi lắm! Cố gắng lên nhé! 💪";
        }

        window.toggleMaster = function(index, btn) {
            if (masteredSet.has(index)) { masteredSet.delete(index); } else { masteredSet.add(index); }
            renderCards();
            updateProgress();
        };

        window.shuffleCards = function() {
            vocabData.sort(() => Math.random() - 0.5);
            masteredSet.clear();
            currentCardIndex = 0;
            renderCards();
            updateProgress();
        };

        window.resetProgress = function() {
            masteredSet.clear();
            currentCardIndex = 0;
            renderCards();
            updateProgress();
        };

        renderCards();
    </script>
</body>
</html>
