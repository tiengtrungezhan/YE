<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Tìm Cặp Đôi - HSK 3 Bài 16</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #fdf2f8; }
        .game-container { max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; }
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem; 
            margin-top: 2rem; 
        }
        .memory-card {
            aspect-ratio: 1/1;
            background-color: var(--white);
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-weight: bold;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary-light);
            transition: transform 0.2s, background-color 0.2s, opacity 0.6s, border-color 0.2s;
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
        }
        .memory-card:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }
        .memory-card.hanzi {
            font-size: 2rem;
            color: var(--primary-dark);
        }
        .memory-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .stats {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-around;
        }
        .result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-content {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
            .memory-card { font-size: 0.9rem; }
            .memory-card.hanzi { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-logo-btn">
        <img src="mascot.png" alt="Home">
    </a>
    <div class="page-container">
        <a href="game-hsk3.html" class="back-btn">← Quay lại</a>
        <div class="game-container">
            <h1 style="color: var(--primary-dark); margin-bottom: 1rem;">Truy Tìm Cặp Đôi: Bài 16</h1>
            <div class="stats">
                <div>Lượt: <span id="moves">0</span></div>
                <div>Thời gian: <span id="timer">0</span>s</div>
                <div>Cặp: <span id="matches">0/8</span></div>
            </div>
            <div class="memory-grid" id="gameGrid"></div>
        </div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script>
        const allVocabulary = [{"hanzi": "城市", "pinyin": "chéngshì", "meaning": "thành phố", "lesson": "16", "type": "Danh từ", "ex_cn": "我喜欢这个城市。", "ex_py": "Wǒ xǐhuan zhège chéngshì.", "ex_vn": "Tôi thích thành phố này."}, {"hanzi": "如果", "pinyin": "rúguǒ", "meaning": "nếu", "lesson": "16", "type": "Liên từ", "ex_cn": "如果你有时间，就来我家吧。", "ex_py": "Rúguǒ nǐ yǒu shíjiān, jiù lái wǒ jiā ba.", "ex_vn": "Nếu bạn có thời gian thì đến nhà tôi nhé."}, {"hanzi": "认为", "pinyin": "rènwéi", "meaning": "cho rằng", "lesson": "16", "type": "Động từ", "ex_cn": "我认为学习汉语不难。", "ex_py": "Wǒ rènwéi xuéxí Hànyǔ bù nán.", "ex_vn": "Tôi cho rằng học tiếng Trung không khó."}, {"hanzi": "皮鞋", "pinyin": "píxié", "meaning": "giày da", "lesson": "16", "type": "Danh từ", "ex_cn": "他穿了一双新皮鞋。", "ex_py": "Tā chuān le yì shuāng xīn píxié.", "ex_vn": "Anh ấy đi một đôi giày da mới."}, {"hanzi": "帽子", "pinyin": "màozi", "meaning": "mũ, nón", "lesson": "16", "type": "Danh từ", "ex_cn": "这是谁的帽子？", "ex_py": "Zhè shì shéi de màozi?", "ex_vn": "Đây là mũ của ai?"}, {"hanzi": "长", "pinyin": "zhǎng", "meaning": "lớn lên, trưởng thành", "lesson": "16", "type": "Động từ", "ex_cn": "他长得很快。", "ex_py": "Tā zhǎng de hěn kuài.", "ex_vn": "Nó lớn nhanh quá."}, {"hanzi": "可爱", "pinyin": "kě\"ài", "meaning": "đáng yêu", "lesson": "16", "type": "Tính từ", "ex_cn": "那个孩子很可爱。", "ex_py": "Nàge háizi hěn kě\"ài.", "ex_vn": "Đứa trẻ đó rất đáng yêu."}, {"hanzi": "米", "pinyin": "mǐ", "meaning": "mét", "lesson": "16", "type": "Lượng từ", "ex_cn": "这个桌子一米长。", "ex_py": "Zhège zhuōzi yì mǐ cháng.", "ex_vn": "Chiếc bàn này dài một mét."}, {"hanzi": "公斤", "pinyin": "gōngjīn", "meaning": "cân (kg)", "lesson": "16", "type": "Lượng từ", "ex_cn": "我要买两公斤苹果。", "ex_py": "Wǒ yào mǎi liǎng gōngjīn píngguǒ.", "ex_vn": "Tôi muốn mua hai cân táo."}, {"hanzi": "鼻子", "pinyin": "bízi", "meaning": "mũi", "lesson": "16", "type": "Danh từ", "ex_cn": "他的鼻子很高。", "ex_py": "Tā de bízi hěn gāo.", "ex_vn": "Mũi của anh ấy rất cao."}, {"hanzi": "头发", "pinyin": "tóufa", "meaning": "tóc", "lesson": "16", "type": "Danh từ", "ex_cn": "她的头发很长。", "ex_py": "Tā de tóufa hěn cháng.", "ex_vn": "Tóc của cô ấy rất dài."}, {"hanzi": "检查", "pinyin": "jiǎnchá", "meaning": "kiểm tra", "lesson": "16", "type": "Động từ", "ex_cn": "医生在检查我的身体。", "ex_py": "Yīshēng zài jiǎnchá wǒ de shēntǐ.", "ex_vn": "Bác sĩ đang kiểm tra sức khỏe cho tôi."}, {"hanzi": "刷牙", "pinyin": "shuā yá", "meaning": "đánh răng", "lesson": "16", "type": "Động từ", "ex_cn": "他每天早上都刷牙。", "ex_py": "Tā měitiān zǎoshang dōu shuā yá.", "ex_vn": "Anh ấy đánh răng mỗi sáng."}, {"hanzi": "关系", "pinyin": "guānxì", "meaning": "mối quan hệ", "lesson": "16", "type": "Danh từ", "ex_cn": "我们之间的关系很好。", "ex_py": "Wǒmen zhījiān de guānxì hěn hǎo.", "ex_vn": "Quan hệ giữa chúng tôi rất tốt."}, {"hanzi": "别人", "pinyin": "biérén", "meaning": "người khác", "lesson": "16", "type": "Đại từ", "ex_cn": "别总是看别人。", "ex_py": "Bié zǒngshì kàn biérén.", "ex_vn": "Đừng lúc nào cũng nhìn người khác."}, {"hanzi": "词语", "pinyin": "cíyǔ", "meaning": "từ ngữ", "lesson": "16", "type": "Danh từ", "ex_cn": "请读这个词语。", "ex_py": "Qǐng dú zhège cíyǔ.", "ex_vn": "Vui lòng đọc từ này."}];
        let remainingWords = [...allVocabulary];
        let currentRoundWords = [];
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canSelect = true;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame(isNewGame = true) {
            if (isNewGame) {
                remainingWords = [...allVocabulary].sort(() => Math.random() - 0.5);
                moves = 0;
                timer = 0;
                gameStarted = false;
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = '0';
                document.getElementById('moves').innerText = '0';
            }

            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            cardsData = [];
            
            // Take up to 8 words for this round
            currentRoundWords = remainingWords.splice(0, 8);

            currentRoundWords.forEach((item, index) => {
                cardsData.push({ id: index, content: item.hanzi, type: 'hanzi' });
                cardsData.push({ id: index, content: item.meaning, type: 'meaning' });
            });

            cardsData.sort(() => Math.random() - 0.5);

            cardsData.forEach((data) => {
                const card = document.createElement('div');
                card.className = `memory-card ${data.type}`;
                card.innerText = data.content;
                card.dataset.id = data.id;
                
                card.addEventListener('click', () => selectCard(card));
                gameGrid.appendChild(card);
            });

            matchedPairs = 0;
            selectedCards = [];
            canSelect = true;
            updateStats();
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function selectCard(card) {
            if (!canSelect || card.classList.contains('selected') || card.classList.contains('matched')) return;

            startTimer();
            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                checkMatch();
            }
        }

        function checkMatch() {
            canSelect = false;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    selectedCards = [];
                    canSelect = true;
                    
                    if (matchedPairs === currentRoundWords.length) {
                        if (remainingWords.length > 0) {
                            showNextRoundPrompt();
                        } else {
                            clearInterval(timerInterval);
                            showFinalResult();
                        }
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    selectedCards = [];
                    canSelect = true;
                }, 600);
            }
        }

        function updateStats() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = `${matchedPairs}/${currentRoundWords.length}`;
            document.getElementById('timer').innerText = timer;
        }

        function showNextRoundPrompt() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Xong hiệp này!</h2>
                <p style="font-size: 1.1rem;">Còn ${remainingWords.length} từ vựng nữa.</p>
                <button class="btn-restart" onclick="nextRound()">Tiếp tục hiệp kế</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function showFinalResult() {
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 1rem;">Hoàn thành!</h2>
                <p style="font-size: 1.2rem;">Bạn đã học hết từ vựng của bài này.</p>
                <div style="margin: 1.5rem 0; font-weight: bold; font-size: 1.1rem;">
                    Tổng thời gian: ${timer} giây<br>
                    Tổng số lượt: ${moves}
                </div>
                <button class="btn-restart" onclick="resetGame()">Chơi Lại Từ Đầu</button>
            `;
            document.getElementById('resultOverlay').style.display = 'flex';
        }

        function nextRound() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(false);
        }

        function resetGame() {
            document.getElementById('resultOverlay').style.display = 'none';
            initGame(true);
        }

        initGame();
    </script>
</body>
</html>
