    <style>
        body { background: var(--bg-gradient); color: var(--text-color); font-family: 'Inter', sans-serif; }

        .page-container {
            max-width: 1600px !important;
        }
        .page-wrap {
            max-width: 100%;
            margin: 0 auto;
            padding: 1.5rem 0;
        }

        /* ── HEADER ── */
        .doc-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .doc-header h1 {
            font-size: 2rem; font-weight: 800;
            background: linear-gradient(135deg, var(--primary-dark), #5B8D9C);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 0.4rem;
        }
        .doc-header p { color: var(--text-color); opacity: 0.8; font-size: 0.95rem; }


        /* ── PINYIN TABLE ── */
        .section-title {
            font-size: 1.2rem; font-weight: 800; color: var(--text-color);
            margin: 1.5rem 0 0.8rem;
            display: flex; align-items: center; gap: 0.5rem;
        }
        .section-title::before {
            content: ''; display: block; width: 4px; height: 20px;
            background: var(--primary-dark);
            border-radius: 4px;
        }

        .pinyin-grid {
            display: flex; flex-wrap: wrap; gap: 0.6rem;
            margin-bottom: 1rem;
        }

        .py-card {
            background: white;
            border-radius: 14px;
            padding: 0.5rem 0.4rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 2px solid transparent;
            transition: all 0.2s;
            min-width: 70px;
            text-align: center;
        }
        .py-card:hover { border-color: var(--primary-color); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(165, 207, 218, 0.3); }
        .py-card .py-label {
            font-size: 0.78rem; font-weight: 700; color: var(--text-color);
            opacity: 0.5;
            text-transform: uppercase; letter-spacing: 0.5px;
            margin-bottom: 0.35rem;
        }
        .py-tones {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 4px;
        }
        .tone-btn {
            background: #f5fafd; border: 1.5px solid var(--primary-light);
            border-radius: 8px; padding: 0.3rem 0.2rem;
            font-size: 0.95rem; font-weight: 700; color: var(--text-color);
            cursor: pointer; transition: all 0.15s;
            line-height: 1.2;
        }
        .tone-btn:hover { background: var(--primary-dark); color: white; border-color: var(--primary-dark); transform: scale(1.05); }
        .tone-btn.playing { background: var(--primary-color); color: white; border-color: var(--primary-color); animation: pulse 0.5s ease; }
        .tone-btn:disabled { opacity: 0.3; cursor: default; background: #f5f5f5; border-color: #eee; color: #aaa; }

        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }

        /* Speaker icon single-tone */
        .tone-btn-single {
            background: #f5fafd; border: 1.5px solid var(--primary-light);
            border-radius: 8px; padding: 0.3rem 0.6rem;
            font-size: 0.9rem; font-weight: 700; color: var(--text-color);
            cursor: pointer; transition: all 0.15s;
        }
        .tone-btn-single:hover { background: var(--primary-dark); color: white; border-color: var(--primary-dark); }

        /* ── LEGEND ── */
        .legend {
            background: white; border-radius: 14px;
            padding: 1rem 1.2rem; margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: center;
        }
        .legend-item { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--text-color); opacity: 0.9; }
        .legend-dot { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.9rem; }

        /* Table for consonants + vowels combo */
        .combo-table-wrap { overflow-x: auto; margin-bottom: 2rem; }
        .combo-table {
            border-collapse: separate; border-spacing: 4px;
            min-width: 900px;
        }
        .combo-table th {
            background: linear-gradient(135deg, var(--primary-dark), #5B8D9C);
            color: white; font-size: 0.8rem; font-weight: 700;
            padding: 0.5rem 0.3rem; border-radius: 8px;
            text-align: center; white-space: nowrap;
        }
        .combo-table td {
            background: white; border-radius: 8px;
            text-align: center; padding: 0;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            position: relative;
        }
        .combo-table td.row-head {
            background: linear-gradient(135deg, var(--primary-light), var(--primary-color));
            color: var(--text-color); font-weight: 800; font-size: 0.9rem;
            padding: 0.4rem 0.6rem;
        }
        .combo-table td.empty { background: #f8f8f8; box-shadow: none; }
        
        .syllable-cell {
            cursor: pointer;
            padding: 0.8rem 0.5rem;
            font-weight: 700;
            color: var(--text-color);
            transition: all 0.2s;
            border-radius: 6px;
            display: block;
            width: 100%;
            height: 100%;
            user-select: none;
        }
        .syllable-cell:hover {
            background: var(--primary-light);
            color: var(--text-color);
        }

        .balloon {
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            border-radius: 12px;
            padding: 6px;
            box-shadow: var(--shadow);
            border: 1px solid var(--primary-light);
            z-index: 100;
            white-space: nowrap;
            display: flex;
            gap: 4px;
            animation: fadeInBalloon 0.15s ease-out;
        }

        .balloon.hidden {
            display: none;
        }

        .balloon::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px;
            border-style: solid;
            border-color: white transparent transparent transparent;
        }
        .balloon::before {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 7px;
            border-style: solid;
            border-color: var(--primary-light) transparent transparent transparent;
            z-index: -1;
        }

        .balloon-tone-btn {
            background: #f5fafd;
            border: 1.5px solid var(--primary-light);
            border-radius: 8px;
            padding: 0.4rem 0.6rem;
            font-size: 1rem;
            font-weight: 800;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.15s;
        }
        .balloon-tone-btn:hover {
            background: var(--primary-dark);
            color: white;
            border-color: var(--primary-dark);
            transform: scale(1.08);
        }
        .balloon-tone-btn.playing {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        @keyframes fadeInBalloon {
            from { opacity: 0; transform: translate(-50%, 8px); }
            to { opacity: 1; transform: translate(-50%, 0); }

            }

                margin-top: 1rem;
            }

    // ── AUDIO ────────────────────────────────────────────────────────────────
    let currentAudio = null;
    function playAudio(path, toneNum, btn) {
        if (!path) return;
        if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
        document.querySelectorAll('.tone-btn.playing, .combo-btn.playing, .balloon-tone-btn.playing').forEach(b => b.classList.remove('playing'));
        
        // Map old row paths to correct folder paths on chinese.com.vn
        let mappedPath = path;
        const mapping = {
            'row2/': 'BPMF/', 'row3/': 'BPMF/', 'row4/': 'BPMF/', 'row5/': 'BPMF/',
            'row6/': 'DTNL/', 'row7/': 'DTNL/', 'row8/': 'DTNL/', 'row9/': 'DTNL/',
            'row10/': 'GKH/', 'row11/': 'GKH/', 'row12/': 'GKH/',
            'row13/': 'JQX/', 'row14/': 'JQX/', 'row15/': 'JQX/',
            'row16/': 'ZHCHSH/', 'row17/': 'ZHCHSH/', 'row18/': 'ZHCHSH/', 'row19/': 'ZHCHSH/',
            'row20/': 'ZCS/', 'row21/': 'ZCS/', 'row22/': 'ZCS/'
        };
        for (const [key, val] of Object.entries(mapping)) {
            if (path.startsWith(key)) {
                mappedPath = path.replace(key, val);
                break;
            }
        }

        const url = BASE + mappedPath + toneNum + '.mp3';
        currentAudio = new Audio(url);
        if (btn) { btn.classList.add('playing'); currentAudio.onended = () => btn.classList.remove('playing'); }
        currentAudio.play().catch(() => {});
    }

    // ── RENDER HELPERS ───────────────────────────────────────────────────────
    function getTonedSyllable(syllable, tone) {
        if (tone < 1 || tone > 4) return syllable;
        const toneMap = {
            'a': ['ā', 'á', 'ǎ', 'à'],
            'o': ['ō', 'ó', 'ǒ', 'ò'],
            'e': ['ē', 'é', 'ě', 'è'],
            'i': ['ī', 'í', 'ǐ', 'ì'],
            'u': ['ū', 'ú', 'ǔ', 'ù'],
            'ü': ['ǖ', 'ǘ', 'ǚ', 'ǜ'],
            'v': ['ǖ', 'ǘ', 'ǚ', 'ǜ']
        };
        
        let targetVowel = '';
        if (syllable.includes('a')) targetVowel = 'a';
        else if (syllable.includes('e')) targetVowel = 'e';
        else if (syllable.includes('ou')) targetVowel = 'o';
        else if (syllable.includes('ui')) targetVowel = 'i';
        else if (syllable.includes('iu')) targetVowel = 'u';
        else if (syllable.includes('o')) targetVowel = 'o';
        else if (syllable.includes('i')) targetVowel = 'i';
        else if (syllable.includes('u')) targetVowel = 'u';
        else if (syllable.includes('ü')) targetVowel = 'ü';
        else if (syllable.includes('v')) targetVowel = 'v';

        if (targetVowel) {
            const tonedChar = toneMap[targetVowel][tone - 1];
            return syllable.replace(targetVowel, tonedChar);
        }
        return syllable;
    }

    function toggleBalloon(event, element) {
        event.stopPropagation();
        const parent = element.parentElement;
        const balloon = parent.querySelector('.balloon');
        const isHidden = balloon.classList.contains('hidden');
        
        closeAllBalloons();
        
        if (isHidden) {
            balloon.classList.remove('hidden');
        }
    }

    function closeAllBalloons() {
        document.querySelectorAll('.balloon').forEach(b => {
            b.classList.add('hidden');
        });
    }

    // Close balloons when clicking anywhere else
    document.addEventListener('click', () => {
        closeAllBalloons();
    });

        tableRows.forEach(row => {
            const tr = document.createElement('tr');
            row.forEach((cell, ci) => {
                const td = document.createElement('td');
                if (ci === 0) {
                    td.className = 'row-head';
                    td.textContent = cell;
                } else if (!cell) {
                    td.className = 'empty';
                } else {
                    const path = cell;
                    const label = tableHeaders[ci];
                    const rowLabel = row[0];
                    const syllable = rowLabel === '—' ? label : rowLabel + label;
                    const cleanSyllable = syllable.replace(/\*+/g, '');
                    
                    td.innerHTML = `
                        <div class="syllable-cell" onclick="toggleBalloon(event, this)">
                            ${cleanSyllable}
                        </div>
                        <div class="balloon hidden">
                            ${[1,2,3,4].map(t => {
                                const toned = getTonedSyllable(cleanSyllable, t);
                                return `<button class="balloon-tone-btn" onclick="playAudio('${path}', ${t}, this); event.stopPropagation();" title="${toned}">${toned}</button>`;
                            }).join('')}
                        </div>
                    `;
                }
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
        table.appendChild(tbody);
    }

    // ── INIT ─────────────────────────────────────────────────────────────────
    renderTable();
    </script>
</body>
</html>
